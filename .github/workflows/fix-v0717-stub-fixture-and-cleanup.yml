name: Fix Runner v0.7.17 stub fixture and cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: fix-runner-v0717-stub-fixture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ github.head_ref == 'agent/v0717-eye-test-feet-gait-batch25' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0717-eye-test-feet-gait-batch25
          fetch-depth: 0

      - name: Cache exact support-stub and cleanup finding
        run: python tools/fix_v0717_stub_fixture_and_cleanup.py cache

      - name: Commit finding before correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git diff --cached --check
          git commit -m 'Cache Runner v0.7.17 stub fixture and branch cleanup finding'
          git push origin HEAD:agent/v0717-eye-test-feet-gait-batch25

      - name: Correct support-stub fixture and publisher cleanup
        run: python tools/fix_v0717_stub_fixture_and_cleanup.py implement

      - name: Commit source and release workflow correction
        shell: bash
        run: |
          set -euo pipefail
          rm tools/fix_v0717_stub_fixture_and_cleanup.py
          git add -A
          git diff --cached --check
          git commit -m 'Correct Runner v0.7.17 stub fixture and branch cleanup'
          git push origin HEAD:agent/v0717-eye-test-feet-gait-batch25
