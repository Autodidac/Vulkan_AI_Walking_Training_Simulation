name: Apply Runner v0.7.17 support-stub fixture

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-runner-v0717-stub-fixture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/v0717-eye-test-feet-gait-batch25' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0717-eye-test-feet-gait-batch25
          fetch-depth: 0

      - name: Correct obsolete articulated-foot fixture
        run: python tools/fix_v0717_stub_fixture_and_cleanup.py

      - name: Commit fixture correction
        shell: bash
        run: |
          set -euo pipefail
          rm tools/fix_v0717_stub_fixture_and_cleanup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/core_tests.cpp tools/fix_v0717_stub_fixture_and_cleanup.py
          git diff --cached --check
          git commit -m 'Correct Runner v0.7.17 support-stub fixture'
          git push origin HEAD:agent/v0717-eye-test-feet-gait-batch25
