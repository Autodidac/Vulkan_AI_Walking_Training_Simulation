name: Cache Runner v0.7.21 readable telemetry

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cache:
    if: github.head_ref == 'agent/v0721-readable-telemetry'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0721-readable-telemetry
          fetch-depth: 0
      - name: Cache missions before product edits
        run: |
          set -euo pipefail
          python3 tools/cache_v0721_readable_telemetry.py
          grep -F 'WALK-HUMAN-STATUS-263' missioncache.md
          grep -F 'WALK-RELEASE-275' missioncache.md
          grep -F 'Runner v0.7.22 equipment, carry, and target curriculum' missioncache.md
          git diff --check
          rm tools/cache_v0721_readable_telemetry.py
      - name: Commit authoritative mission cache
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md tools/cache_v0721_readable_telemetry.py
          git commit -m 'Cache Runner v0.7.21 readable telemetry missions'
          git push origin HEAD:agent/v0721-readable-telemetry
