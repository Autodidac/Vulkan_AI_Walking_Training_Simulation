name: Probe EpochRunner v0.7.1 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-v071-run.yml]

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record exact release workflow state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_json=$(gh run list --workflow finish-v071-windows.yml --limit 1 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,workflowName)
          run_id=$(jq -r '.[0].databaseId // empty' <<<"$run_json")
          test -n "$run_id"
          gh run view "$run_id" --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,jobs \
            > validation/v0.7.1-live.json
          {
            echo '# EpochRunner v0.7.1 live release probe'
            echo
            jq -r '
              "- Run ID: `\(.databaseId)`\n- Status: `\(.status)`\n- Conclusion: `\(.conclusion // "pending")`\n- Created: `\(.createdAt)`\n- Updated: `\(.updatedAt)`\n- URL: \(.url)\n- Head SHA: `\(.headSha)`",
              (.jobs[] | "- Job `\(.name)`: `\(.status)` / `\(.conclusion // "pending")`"),
              (.jobs[].steps[]? | select(.status != "completed" or .conclusion != "success") | "  - Step `\(.name)`: `\(.status)` / `\(.conclusion // "pending")`")
            ' validation/v0.7.1-live.json
          } > validation/v0.7.1-live.md
          if jq -e '.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out"' validation/v0.7.1-live.json >/dev/null; then
            gh run view "$run_id" --log-failed > validation/v0.7.1-live-failure.log 2>&1 || true
          else
            rm -f validation/v0.7.1-live-failure.log
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/probe-v071-run.yml
          git add validation/v0.7.1-live.json validation/v0.7.1-live.md
          git add -f validation/v0.7.1-live-failure.log 2>/dev/null || true
          git commit -m 'Record exact v0.7.1 release workflow state'
          git push origin HEAD:main
