name: Fix Runner v0.7.17 PPM byte preservation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: fix-runner-v0717-ppm-bytes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ github.head_ref == 'agent/v0717-eye-test-feet-gait-batch25' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0717-eye-test-feet-gait-batch25
          fetch-depth: 0

      - name: Cache Windows byte-preservation finding
        run: python tools/fix_v0717_ppm_line_endings.py cache

      - name: Commit finding before correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git diff --cached --check
          git commit -m 'Cache Runner v0.7.17 Windows PPM byte finding'
          git push origin HEAD:agent/v0717-eye-test-feet-gait-batch25

      - name: Pin optional PPM files as byte-preserved assets
        run: python tools/fix_v0717_ppm_line_endings.py implement

      - name: Commit cross-platform byte contract
        shell: bash
        run: |
          set -euo pipefail
          rm tools/fix_v0717_ppm_line_endings.py
          git add .gitattributes tools/fix_v0717_ppm_line_endings.py
          git diff --cached --check
          git commit -m 'Preserve Runner v0.7.17 optional PPM bytes across platforms'
          git push origin HEAD:agent/v0717-eye-test-feet-gait-batch25
