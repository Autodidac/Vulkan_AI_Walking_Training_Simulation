name: Publish Vulkan runtime fix v0.1.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.1.2.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.1.2.yml"

permissions:
  contents: write

concurrency:
  group: epochrunner-v0.1.2-release
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  build-test-package-release:
    runs-on: windows-2025

    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-windows-x64-vulkan-d015e31-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure MSVC manifest build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build Release
        run: cmake --build --preset windows-release

      - name: Run core tests
        run: ctest --preset windows-release

      - name: Package runtime
        shell: pwsh
        run: |
          $package = Join-Path $PWD "package/EpochRunner-windows-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          cmake --install build/windows-release --config Release --prefix $package

          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $package -Force

          Copy-Item README.md, LICENSE -Destination $package -Force
          Compress-Archive -Path "$package/*" -DestinationPath "EpochRunner-windows-x64.zip" -Force

      - name: Validate packaged SDL3 Vulkan support
        shell: pwsh
        run: |
          Push-Location package/EpochRunner-windows-x64
          & .\EpochRunner.exe --diagnose-vulkan
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged Vulkan diagnostic failed with exit code $LASTEXITCODE"
          }
          Pop-Location

      - name: Publish v0.1.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $sourceSha = git rev-parse HEAD
          if (gh release view v0.1.2 2>$null) {
            gh release upload v0.1.2 EpochRunner-windows-x64.zip --clobber
          }
          else {
            gh release create v0.1.2 EpochRunner-windows-x64.zip `
              --target $sourceSha `
              --title "EpochRunner v0.1.2" `
              --notes "Fixes the Windows SDL_CreateWindow Vulkan-support failure by building SDL3 with the vcpkg vulkan feature. Also validates the packaged SDL3/Vulkan runtime and uses package-relative shaders and assets."
          }

      - name: Remove temporary workflow and non-main branches
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v0.1.2.yml
          git commit -m "Remove one-time v0.1.2 release workflow"
          git push origin HEAD:main

          $branches = gh api "repos/$env:GITHUB_REPOSITORY/branches?per_page=100" | ConvertFrom-Json
          foreach ($branch in $branches) {
            if ($branch.name -ne "main") {
              $encoded = [Uri]::EscapeDataString($branch.name)
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$encoded"
            }
          }
