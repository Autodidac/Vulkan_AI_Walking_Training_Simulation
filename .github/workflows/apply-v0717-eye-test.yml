name: Apply Runner v0.7.17 eye-test corrections

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-runner-v0717-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/v0717-eye-test-feet-gait-batch25' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0717-eye-test-feet-gait-batch25
          fetch-depth: 0
      - name: Materialize source, tests, documentation, and generated workflow
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/anchor = '''    add_test(NAME runner_view_camera COMMAND RunnerViewCameraTests)/anchor = '''add_test(NAME Runner.ViewCamera COMMAND RunnerViewCameraTests)/" tools/apply_v0717_eye_test.py
          python tools/apply_v0717_eye_test.py
          sed -i 's/target_link_libraries(RunnerV0717EyeTestTests PRIVATE RunnerCore)/target_link_libraries(RunnerV0717EyeTestTests PRIVATE Runner::Core)/' CMakeLists.txt
          sed -i '/target_link_libraries(RunnerV0717EyeTestTests PRIVATE Runner::Core)/a\    target_compile_features(RunnerV0717EyeTestTests PRIVATE cxx_std_23)' CMakeLists.txt
          cp .github/workflows/runner-v0717-release.yml tools/runner-v0717-release.generated.yml
          rm .github/workflows/runner-v0717-release.yml
          git checkout -- .github/workflows/runner-v0716-release.yml .github/workflows/apply-v0717-eye-test.yml
      - name: Commit product source without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_v0717_eye_test.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement Runner v0.7.17 eye-test corrections and 25-mission batch'
          git push origin HEAD:agent/v0717-eye-test-feet-gait-batch25