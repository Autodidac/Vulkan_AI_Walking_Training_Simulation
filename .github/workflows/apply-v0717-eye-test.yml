name: Apply Runner v0.7.17 eye-test corrections

on:
  push:
    branches:
      - agent/v0717-eye-test-feet-gait-batch25

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0717-eye-test-feet-gait-batch25
          fetch-depth: 0
      - name: Apply source, tests, documentation, and release updates
        run: python tools/apply_v0717_eye_test.py
      - name: Commit materialized v0.7.17 batch
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_v0717_eye_test.py
          rm .github/workflows/apply-v0717-eye-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement Runner v0.7.17 eye-test corrections and 25-mission batch'
          git push origin HEAD:agent/v0717-eye-test-feet-gait-batch25
