name: Merge Runner v0.7.25 after strict finalizer

on:
  workflow_run:
    workflows: ["Finalize Runner v0.7.25 PR v2"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify canonical finalized branch
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh pr view 80 --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" != OPEN ]; then
            echo "PR #80 already $state"
            exit 0
          fi
          rm -rf source
          gh repo clone "$GITHUB_REPOSITORY" source -- \
            --branch agent/v0725-art-leg-hotfix --single-branch
          cd source
          grep -F 'project(Runner VERSION 0.7.25 LANGUAGES CXX)' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'2501u" src/ppo.hpp
          grep -F 'COMPACT SEGMENTED BODY ARMOR' src/app.cpp
          grep -F 'shared_pelvis_passes' src/simulation.cpp
          grep -F 'TRAINING SAMPLES READY' src/app.cpp
          grep -F "case '%'" src/ui_font.hpp
          test -f .github/workflows/runner-v0725-release.yml
          test ! -e tools/apply_v0725_art_leg_hotfix.py
          test ! -e tools/apply_v0725_font_sync.py
          test ! -e tools/finalize_v0725.py
          test ! -e tools/finalize_v0725_audit.py
          test ! -e tools/finalize_v0725_strict_geometry.py
      - name: Merge finalized PR
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh pr view 80 --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" = OPEN ]; then
            head=$(gh pr view 80 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/80/merge" \
              -f merge_method=squash \
              -f sha="$head" \
              -f commit_title='Runner v0.7.25 art, stance, font, and readable progress' \
              -f commit_message='Validated canonical v0.7.25 source. Windows SDL3/Vulkan, installed package, extracted archive, publication, re-download, and cleanup remain release-blocking.'
          fi
