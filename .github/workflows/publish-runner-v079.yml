name: Publish Runner v0.7.9

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: publish-runner-v079
  cancel-in-progress: false

jobs:
  windows-package:
    if: github.repository == 'Autodidac/Vulkan_AI_Walking_Training_Simulation'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
      TAG: v0.7.9
      RELEASE_TITLE: Runner v0.7.9
      WORK_BRANCH: agent/v079-live-acceptance-matrix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm exact clean v0.7.9 source
        shell: pwsh
        run: |
          if (-not (Select-String -Path CMakeLists.txt -SimpleMatch 'project(Runner VERSION 0.7.9 LANGUAGES CXX)')) {
            throw 'Runner v0.7.9 source was not materialized'
          }
          foreach ($path in @(
            'tools/apply_v079_acceptance.py',
            '.github/workflows/validate-runner-v079.yml',
            '.github/workflows/finalize-runner-v079.yml',
            '.github/workflows/materialize-runner-v079.yml')) {
            if (Test-Path $path) { throw "Temporary release tool remains: $path" }
          }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Windows source tree is dirty' }

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: runner-v079-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            runner-v078-${{ runner.os }}-
            runner-v077-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build full Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Run complete Windows tests
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1200
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

      - name: Verify build-tree diagnostics and acceptance
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.9') { throw "Unexpected version: $version" }
            & $exe --diagnose-vulkan
            if ($LASTEXITCODE -ne 0) { throw 'Vulkan diagnostic failed' }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Build-tree acceptance diagnostic failed' }
          }
          finally { Pop-Location }

      - name: Record package validation and remove publisher
        shell: pwsh
        run: |
          @'
          import re
          from pathlib import Path

          path = Path("missioncache.md")
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r"^\*\*Release state:\*\*.*$",
              "**Release state:** PACKAGE VERIFIED — Runner v0.7.9 passed Linux, Windows, build-tree acceptance, and all deterministic suites; publication audit pending.",
              text,
              count=1,
              flags=re.MULTILINE,
          )
          for mission in range(99, 104):
              pattern = rf"(### WALK-[^\n]*-{mission:03d}[^\n]*\n)\*\*Status:\*\*[^\n]*"
              text, count = re.subn(pattern, rf"\1**Status:** PACKAGE VERIFIED", text, count=1)
              if count != 1:
                  raise SystemExit(f"missing v0.7.9 mission {mission}")
          path.write_text(text, encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Mission ledger package update failed' }

          git rm .github/workflows/publish-runner-v079.yml
          Remove-Item VALIDATION_v0.7.9_FAILURE.txt -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git add -u
          git commit -m 'Record Runner v0.7.9 package validation and clean publisher'
          git push origin HEAD:main

          Add-Content missioncache.md "`n- Windows package source validation commit: ``$(git rev-parse HEAD)```"
          git add missioncache.md
          git commit -m 'Freeze Runner v0.7.9 tagged package source'
          git push origin HEAD:main
          "RELEASE_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install release candidate
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.9-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, missioncache.md, RELEASE_NOTES_v0.7.9.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe','run.bat','missioncache.md','RELEASE_NOTES_v0.7.9.md',
            'shaders/flat.vert.spv','shaders/flat.frag.spv','assets/chicken.ppm')) {
            if (-not (Test-Path "$stage/$required")) { throw "Missing package file: $required" }
          }

      - name: Verify installed executable and launcher
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.9-windows-x64"
          $outside = "$env:RUNNER_TEMP/runner-v079-installed-unrelated"
          New-Item -ItemType Directory -Force $outside | Out-Null
          Push-Location $outside
          try {
            $version = (& "$stage/Runner.exe" --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.9') { throw "Installed version mismatch: $version" }
            & "$stage/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed package diagnostic failed' }
            & "$stage/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Installed acceptance diagnostic failed' }
            $batchVersion = (& cmd.exe /d /c "call `"$stage\run.bat`" --version" | Out-String).Trim()
            if ($batchVersion -ne 'Runner 0.7.9') { throw "run.bat version mismatch: $batchVersion" }
          }
          finally { Pop-Location }

      - name: Create and independently audit archive
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.9-windows-x64"
          $archive = "$env:GITHUB_WORKSPACE/Runner-v0.7.9-windows-x64.zip"
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Set-Content "$archive.sha256"
          Get-ChildItem $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $relative"
          } | Set-Content 'Runner-v0.7.9-windows-x64.manifest.sha256'

          $audit = "$env:RUNNER_TEMP/runner-v079-extracted"
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          $expected = Get-Content 'Runner-v0.7.9-windows-x64.manifest.sha256'
          $actual = Get-ChildItem $audit -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($audit.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $relative"
          }
          if (Compare-Object $expected $actual) { throw 'Archive manifest audit failed' }

          Push-Location $env:RUNNER_TEMP
          try {
            & "$audit/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package diagnostic failed' }
            & "$audit/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Extracted acceptance diagnostic failed' }
          }
          finally { Pop-Location }

      - id: package
        uses: actions/upload-artifact@v4
        with:
          name: Runner-v0.7.9-windows-x64
          path: |
            Runner-v0.7.9-windows-x64.zip
            Runner-v0.7.9-windows-x64.zip.sha256
            Runner-v0.7.9-windows-x64.manifest.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish and re-audit GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release delete $env:TAG --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
          }
          gh release create $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --title $env:RELEASE_TITLE `
            --target $env:RELEASE_SHA `
            --notes-file RELEASE_NOTES_v0.7.9.md `
            Runner-v0.7.9-windows-x64.zip `
            Runner-v0.7.9-windows-x64.zip.sha256 `
            Runner-v0.7.9-windows-x64.manifest.sha256
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }

          $download = "$env:RUNNER_TEMP/runner-v079-release-audit"
          Remove-Item $download -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $download | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          foreach ($file in @(
            'Runner-v0.7.9-windows-x64.zip',
            'Runner-v0.7.9-windows-x64.zip.sha256',
            'Runner-v0.7.9-windows-x64.manifest.sha256')) {
            $localHash = (Get-FileHash $file -Algorithm SHA256).Hash
            $remoteHash = (Get-FileHash "$download/$file" -Algorithm SHA256).Hash
            if ($localHash -ne $remoteHash) { throw "Published asset mismatch: $file" }
          }
          $expectedZip = (Get-Content "$download/Runner-v0.7.9-windows-x64.zip.sha256").Split()[0]
          $actualZip = (Get-FileHash "$download/Runner-v0.7.9-windows-x64.zip" -Algorithm SHA256).Hash
          if ($expectedZip -ne $actualZip) { throw 'Published ZIP checksum mismatch' }

          $releaseExtract = "$env:RUNNER_TEMP/runner-v079-release-extracted"
          Remove-Item $releaseExtract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "$download/Runner-v0.7.9-windows-x64.zip" -DestinationPath $releaseExtract -Force
          $expected = Get-Content "$download/Runner-v0.7.9-windows-x64.manifest.sha256"
          $actual = Get-ChildItem $releaseExtract -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($releaseExtract.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $relative"
          }
          if (Compare-Object $expected $actual) { throw 'Published manifest audit failed' }
          & "$releaseExtract/Runner.exe" --diagnose-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Released acceptance diagnostic failed' }

          $tagSha = (git ls-remote origin "refs/tags/$env:TAG").Split()[0]
          if ($tagSha -ne $env:RELEASE_SHA) { throw "Tag target mismatch: $tagSha" }

      - name: Clean merged branch and verify repository state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --silent -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$env:WORK_BRANCH" 2>$null
          $openPrs = gh pr list --repo $env:GITHUB_REPOSITORY --state open --limit 100 --json number --jq length
          if ($openPrs -ne '0') { throw "Open pull requests remain: $openPrs" }
          $branches = gh api --paginate "repos/$env:GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | Sort-Object
          if (($branches -join ',') -ne 'main') { throw "Unexpected branches remain: $branches" }

      - name: Record final release evidence
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.package.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.package.outputs.artifact-digest }}
        run: |
          git pull --rebase origin main
          @'
          import os
          import re
          from pathlib import Path

          path = Path("missioncache.md")
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r"^\*\*Release state:\*\*.*$",
              "**Release state:** PUBLISHED — Runner v0.7.9 acceptance matrix, package, release assets, checksum, manifest, released executable, branch cleanup, and PR audit verified.",
              text,
              count=1,
              flags=re.MULTILINE,
          )
          for mission in range(99, 104):
              pattern = rf"(### WALK-[^\n]*-{mission:03d}[^\n]*\n)\*\*Status:\*\*[^\n]*"
              text, count = re.subn(pattern, rf"\1**Status:** PUBLISHED — RELEASE VERIFIED", text, count=1)
              if count != 1:
                  raise SystemExit(f"missing v0.7.9 mission {mission}")

          evidence = f"""

          ## v0.7.9 immutable release evidence

          - Exact tagged package source: `{os.environ['RELEASE_SHA']}`
          - Validation and publication workflow run: `{os.environ['GITHUB_RUN_ID']}`
          - Artifact ID: `{os.environ['ARTIFACT_ID']}`
          - Artifact digest: `{os.environ['ARTIFACT_DIGEST']}`
          - Release tag and title: `v0.7.9` / `Runner v0.7.9`
          - Published assets: Windows ZIP, ZIP SHA-256, and per-file manifest
          - Linux GCC 14 warnings-as-errors build and all five deterministic suites: passed
          - Live acceptance matrix: 10/10 passed
          - Full Windows Vulkan build and all tests: passed
          - Build-tree, installed, independently extracted, and re-downloaded release acceptance diagnostics: passed
          - Published assets were byte-compared; ZIP checksum and extracted per-file manifest: passed
          - Merged work branch removed; open pull requests: `0`; remaining branches: `main`
          - Contradictory released-package evidence reopens only the exact affected mission
          """
          marker = "## v0.7.9 immutable release evidence"
          if marker in text:
              text = text[:text.index(marker)].rstrip() + "\n"
          text = text.rstrip() + "\n" + "\n".join(line.strip() for line in evidence.strip().splitlines()) + "\n"
          path.write_text(text, encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Final mission ledger update failed' }

          Remove-Item VALIDATION_v0.7.9_FAILURE.txt -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git add -u
          git commit -m 'Publish Runner v0.7.9 and record release evidence'
          git push origin HEAD:main

      - name: Record Windows or publication failure
        if: failure()
        shell: pwsh
        run: |
          git fetch origin main
          git reset --hard origin/main
          @"
          Runner v0.7.9 Windows/package validation failed
          run_id=${{ github.run_id }}
          job=windows-package
          "@ | Set-Content VALIDATION_v0.7.9_FAILURE.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VALIDATION_v0.7.9_FAILURE.txt
          git commit -m 'Record Runner v0.7.9 Windows validation failure'
          git push origin HEAD:main
