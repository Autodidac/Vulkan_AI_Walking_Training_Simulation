name: Fix Runner v0.7.24 scoped rigidity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: github.head_ref == 'agent/v0724-structural-metrics-icon'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0724-structural-metrics-icon
          fetch-depth: 0
      - name: Apply scoped rigidity repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/fix_v0724_scoped_rigidity.py
          python3 tools/fix_v0724_scoped_rigidity.py
          git diff --check
          grep -F 'bone.stiffness < 0.999f' src/simulation.cpp
          grep -F 'structural_error > 0.040f' src/simulation.cpp
          grep -F 'bone.stiffness = clamp(bone.stiffness, 0.05f, 1.0f);' src/simulation.cpp
      - name: Build selected regressions
        env:
          CC: gcc-14
          CXX: g++-14
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
          cmake -S . -B build/v0724-rigidity -G Ninja \
            -DRUNNER_BUILD_APP=OFF \
            -DRUNNER_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/v0724-rigidity --parallel
          ctest --test-dir build/v0724-rigidity --output-on-failure -V \
            -R 'Runner\.(V0717EyeTest|V0718RuntimeRecovery|V0721ReadableTelemetry|V0724StructuralMetricsIcon|Core|LiveAcceptance)' \
            --timeout 1800
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/fix_v0724_scoped_rigidity.py
          rm -rf tools/__pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Scope v0.7.24 rigidity to load-bearing structure'
          git push origin HEAD:agent/v0724-structural-metrics-icon
      - name: Report repair status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" \
            --body "Scoped rigidity repair and selected regressions: ${{ job.status }}"
