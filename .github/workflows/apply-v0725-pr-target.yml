name: Apply Runner v0.7.25 PR migration

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event.pull_request.number == 80
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - id: gate
        shell: bash
        run: |
          if [ -f tools/apply_v0725_art_leg_hotfix.py ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply cached source repair
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_v0725_art_leg_hotfix.py
          python3 tools/apply_v0725_art_leg_hotfix.py
          rm -f tools/apply_v0725_art_leg_hotfix.py
          rm -rf tools/__pycache__
          git diff --check
          grep -F 'project(Runner VERSION 0.7.25 LANGUAGES CXX)' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'2501u" src/ppo.hpp
          grep -F 'COMPACT SEGMENTED BODY ARMOR' src/app.cpp
          grep -F 'minimum_stance_ratio' src/simulation.cpp
          grep -F 'solve_chain_ik' src/simulation.cpp
          ! grep -Fq 'draw_pixel_art(canvas, optional_torso_art' src/app.cpp
      - name: Install Linux toolchain
        if: steps.gate.outputs.apply == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
      - name: Configure, build, and test
        if: steps.gate.outputs.apply == 'true'
        env:
          CC: gcc-14
          CXX: g++-14
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/v0725-migration -G Ninja \
            -DRUNNER_BUILD_APP=OFF \
            -DRUNNER_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/v0725-migration --parallel
          ctest --test-dir build/v0725-migration --output-on-failure -V --timeout 1800
      - name: Commit validated source to PR branch
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Runner v0.7.25 compact armor and stance-leg integrity'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 80 --repo "$GITHUB_REPOSITORY" \
            --body "v0.7.25 source migration and Linux gate: ${{ job.status }}"
