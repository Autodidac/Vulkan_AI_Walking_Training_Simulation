name: Windows tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  build-test-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025

    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure full MSVC release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build full Vulkan application
        run: cmake --build --preset windows-release

      - name: Run deterministic, concurrency, throughput, course, and recovery tests
        run: ctest --preset windows-release --output-on-failure -V

      - name: Verify packaged executable identity
        shell: pwsh
        run: build/windows-release/Release/EpochRunner.exe --version

      - name: Verify SDL3 and Vulkan runtime path
        shell: pwsh
        run: build/windows-release/Release/EpochRunner.exe --diagnose-vulkan

      - name: Package exact tagged build
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $package = Join-Path $PWD "package/EpochRunner-$tag-windows-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          cmake --install build/windows-release --config Release --prefix $package
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $package -Force
          Copy-Item README.md, LICENSE, MISSIONS.md -Destination $package -Force
          $archive = "EpochRunner-$tag-windows-x64.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Set-Content "$archive.sha256"

      - name: Publish release and record immutable evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archive = "EpochRunner-$tag-windows-x64.zip"
          $sourceSha = (git rev-parse HEAD).Trim()
          $checksum = (Get-Content "$archive.sha256").Trim()
          gh release create $tag $archive "$archive.sha256" `
            --target $sourceSha `
            --title "EpochRunner $tag" `
            --generate-notes

          git fetch origin main
          git switch main
          New-Item -ItemType Directory -Force validation | Out-Null
          @"
          # EpochRunner $tag release evidence

          - Source commit: `$sourceSha`
          - Windows runner: `windows-2025`
          - Generator: `Visual Studio 18 2026`
          - Full Vulkan application build: passed
          - Deterministic/core tests: passed
          - Concurrency/throughput tests: passed
          - Procedural course/recovery tests: passed
          - SDL3/Vulkan diagnostic: passed
          - Package: `$archive`
          - SHA-256: `$checksum`
          "@ | Set-Content -Encoding UTF8 "validation/$tag.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "validation/$tag.md"
          git commit -m "Record $tag release evidence"
          git push origin main
