name: Apply Runner v0.7.24 structural metrics icon

on:
  push:
    branches: [agent/v0724-structural-metrics-icon]
    paths:
      - tools/apply_v0724_structural_metrics_icon.py
      - tools/run_v0724_migration.py
      - .github/workflows/apply-v0724-structural-metrics-icon.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0724-structural-metrics-icon
          fetch-depth: 0

      - name: Repair and apply cached v0.7.24 migration
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/ui/runner_icon_source.png

          if grep -Fq 'project(Runner VERSION 0.7.24 LANGUAGES CXX)' CMakeLists.txt; then
            echo 'Migration already applied; validating source.'
          else
            test -f tools/apply_v0724_structural_metrics_icon.py
            test -f tools/run_v0724_migration.py
            python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/apply_v0724_structural_metrics_icon.py')
          text = path.read_text(encoding='utf-8')
          marker = 'write("tools/generate_runner_icon.py", \' '
          marker = marker[:-1]
          start = text.rfind(marker)
          if start < 0:
              raise RuntimeError('icon-generator write marker not found')
          payload_start = start + len(marker)
          closing = text.rfind("')")
          if closing < payload_start or text[closing + 2:].strip():
              raise RuntimeError('unexpected migration-script ending')
          payload = text[payload_start:closing]
          if "'''" in payload:
              raise RuntimeError('embedded generator unexpectedly contains triple single quotes')
          repaired = text[:start] + 'write("tools/generate_runner_icon.py", \'\'\'' \
              + payload + "''')" + text[closing + 2:]
          path.write_text(repaired, encoding='utf-8', newline='\n')
          PY
            python3 -m py_compile tools/apply_v0724_structural_metrics_icon.py
            python3 -m py_compile tools/run_v0724_migration.py
            python3 tools/run_v0724_migration.py
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '# Runner v0.7.24 fixed skeleton, truthful telemetry, and screenshot icon':
                  '# Runner v0.7.24 structural integrity, truthful telemetry, and screenshot icon',
              '### WALK-BONE-LENGTH-297': '### WALK-RIGID-BONES-297',
              '### WALK-LOAD-BEARING-298': '### WALK-FINAL-PROJECTION-298',
              '### WALK-AUTO-STIFFNESS-299': '### WALK-NO-STIFFNESS-CHEAT-299',
              '### WALK-DEBUG-TRUTH-300': '### WALK-STAGE-COUNTERS-300',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new, 1)
              elif count == 0 and text.count(new) == 1:
                  continue
              else:
                  raise RuntimeError(f'unexpected mission-cache marker count for {old!r}: {count}')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git diff --check
          grep -F 'project(Runner VERSION 0.7.24 LANGUAGES CXX)' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'2401u" src/ppo.hpp
          grep -F 'project_rigid_structure' src/simulation.cpp
          grep -F 'completed_episode_passes_stage' src/ppo_trainer.cpp
          grep -F 'PASSED STAGE CHECKS' src/app.cpp
          grep -F 'runner_icon_source.png' tools/generate_runner_icon.py
          grep -F 'WALK-RIGID-BONES-297' missioncache.md
          grep -F 'WALK-FINAL-PROJECTION-298' missioncache.md
          grep -F 'WALK-NO-STIFFNESS-CHEAT-299' missioncache.md
          grep -F 'WALK-STAGE-COUNTERS-300' missioncache.md
          test -f tests/v0724_structural_metrics_icon_tests.cpp
          test -f docs/RUNNER_V0724_STRUCTURAL_METRICS_ICON.md

      - name: Build focused Linux regression
        env:
          CC: gcc-14
          CXX: g++-14
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
          cmake -S . -B build/v0724-apply -G Ninja \
            -DRUNNER_BUILD_APP=OFF \
            -DRUNNER_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/v0724-apply \
            --target RunnerV0724StructuralMetricsIconTests --parallel
          ./build/v0724-apply/RunnerV0724StructuralMetricsIconTests

      - name: Commit repaired source and retire migration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_v0724_structural_metrics_icon.py
          rm -f tools/run_v0724_migration.py
          rm -f tools/cache_v0724_structural_metrics_icon.py
          rm -f tools/.probe-do-not-merge tools/.probe-local-file
          rm -f .github/workflows/apply-v0724-structural-metrics-icon.yml
          rm -f .github/workflows/apply-v0724-pr.yml
          rm -f .github/workflows/cache-v0724-structural-metrics-icon.yml
          rm -f .github/workflows/rescue-v0724-migration.yml
          rm -f .github/workflows/watch-v0724-apply.yml
          rm -f .github/workflows/watch-v0724-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Implement Runner v0.7.24 structural integrity and truthful telemetry'
            git push origin HEAD:agent/v0724-structural-metrics-icon
          fi
