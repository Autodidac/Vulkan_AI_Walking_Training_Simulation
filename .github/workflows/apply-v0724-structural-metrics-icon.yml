name: Apply Runner v0.7.24 structural metrics icon

on:
  push:
    branches: [agent/v0724-structural-metrics-icon]
    paths:
      - tools/apply_v0724_structural_metrics_icon.py
      - .github/workflows/apply-v0724-structural-metrics-icon.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0724-structural-metrics-icon
          fetch-depth: 0
      - name: Apply cached v0.7.24 repair
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/ui/runner_icon_source.png
          python3 tools/apply_v0724_structural_metrics_icon.py
          rm -f tools/apply_v0724_structural_metrics_icon.py
          rm -rf tools/__pycache__
          git diff --check
          grep -F 'project(Runner VERSION 0.7.24 LANGUAGES CXX)' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'2401u" src/ppo.hpp
          grep -F 'project_rigid_structure' src/simulation.cpp
          grep -F 'PASSED STAGE CHECKS' src/app.cpp
          grep -F 'runner_icon_source.png' tools/generate_runner_icon.py
          test -f tests/v0724_structural_metrics_icon_tests.cpp
          test -f docs/RUNNER_V0724_STRUCTURAL_METRICS_ICON.md
      - name: Build focused Linux regression
        env:
          CC: gcc-14
          CXX: g++-14
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
          cmake -S . -B build/v0724-apply -G Ninja \
            -DRUNNER_BUILD_APP=OFF \
            -DRUNNER_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/v0724-apply \
            --target RunnerV0724StructuralMetricsIconTests --parallel
          ./build/v0724-apply/RunnerV0724StructuralMetricsIconTests
      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Runner v0.7.24 structural integrity and truthful telemetry'
          git push origin HEAD:agent/v0724-structural-metrics-icon
