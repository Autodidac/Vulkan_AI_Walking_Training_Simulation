name: Fix Runner v0.7.17 Linux regressions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: fix-runner-v0717-linux-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ github.head_ref == 'agent/v0717-eye-test-feet-gait-batch25' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0717-eye-test-feet-gait-batch25
          fetch-depth: 0

      - name: Cache exact validation findings
        run: python tools/fix_v0717_linux_regressions.py cache

      - name: Commit finding before correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git diff --cached --check
          git commit -m 'Cache Runner v0.7.17 Linux validation regressions'
          git push origin HEAD:agent/v0717-eye-test-feet-gait-batch25

      - name: Correct physical stubs, press behavior, tests, and benchmark
        run: python tools/fix_v0717_linux_regressions.py implement

      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          rm tools/fix_v0717_linux_regressions.py
          git add -A
          git diff --cached --check
          git commit -m 'Correct Runner v0.7.17 support stubs and crouch recovery'
          git push origin HEAD:agent/v0717-eye-test-feet-gait-batch25
