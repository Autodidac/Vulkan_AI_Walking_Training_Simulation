name: Runner v0.7.20 validation and release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  RELEASE_VERSION: 0.7.20
  RELEASE_TAG: v0.7.20
  PACKAGE_NAME: Runner-v0.7.20-windows-x64

jobs:
  linux-validation:
    if: github.event.head_commit.message != 'Record Runner v0.7.20 release evidence [skip ci]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install deterministic build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
      - name: Audit release source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'project(Runner VERSION 0.7.20 LANGUAGES CXX)' CMakeLists.txt
          grep -F 'WALK-DPI-253' missioncache.md
          grep -F 'WALK-RELEASE-262' missioncache.md
          grep -F "training_semantics_version = 0x0007'2001u" src/ppo.hpp
          grep -F 'preview_sync::decide' src/autonomy_runtime.cpp
          grep -F 'SDL_SetWindowIcon' src/main.cpp
          grep -F 'push_clip' src/renderer.hpp
          test -f tools/generate_runner_icon.py
          test -f tests/v0720_ui_tests.cpp
          test -f docs/RUNNER_V0720_UI_PREVIEW_ICON.md
          test ! -e tools/generate_v0719_sources.py
          test ! -e tools/apply_v0720_release.py
          test ! -e .github/workflows/apply-v0720-release.yml
      - name: Configure Linux deterministic suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/linux-release -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build and test Linux
        run: |
          cmake --build build/linux-release --parallel
          ctest --test-dir build/linux-release --output-on-failure -V --timeout 1800

  windows-package:
    needs: linux-validation
    runs-on: windows-2025
    timeout-minutes: 210
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.linux-validation.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg
      - uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0720-release-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: runner-v0720-release-${{ runner.os }}-
      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure and build Windows SDL3 Vulkan application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Run complete Windows test matrix
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
      - name: Verify build-tree diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.20') { throw "Version mismatch: $version" }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Acceptance diagnostic failed' }
            & $exe --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Camera diagnostic failed' }
            & $exe --diagnose-ui
            if ($LASTEXITCODE -ne 0) { throw 'UI diagnostic failed' }
          }
          finally { Pop-Location }
      - name: Install complete package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md, AGENTS.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe','run.bat','README.md','LICENSE','CHANGELOG.md','missioncache.md','AGENTS.md',
            'assets/chicken.ppm','assets/ui/runner_icon.png','assets/ui/runner_icon_512.png',
            'assets/ui/runner_icon.bmp','assets/ui/runner.ico',
            'shaders/flat.vert.spv','shaders/flat.frag.spv',
            'docs/SANDHYBRID_INTEGRATION_BRIDGE.md','docs/SandHybrid-missioncache.md',
            'docs/RUNNER_V0718_RUNTIME_RECOVERY.md','docs/RUNNER_V0719_GENERAL_LOCOMOTION.md',
            'docs/RUNNER_V0720_UI_PREVIEW_ICON.md')) {
            if (-not (Test-Path (Join-Path $stage $required))) { throw "Missing package file: $required" }
          }
          $ico = [System.IO.File]::ReadAllBytes((Join-Path $stage 'assets/ui/runner.ico'))
          if ($ico.Length -lt 1500 -or $ico[0] -ne 0 -or $ico[2] -ne 1 -or $ico[4] -lt 9) {
            throw 'Packaged multi-resolution icon is invalid'
          }
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed package and optional-art fallback
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          try {
            & "$env:STAGE/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed package diagnostic failed' }
            & "$env:STAGE/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Installed acceptance failed' }
            & "$env:STAGE/Runner.exe" --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Installed camera diagnostic failed' }
            & "$env:STAGE/Runner.exe" --diagnose-ui
            if ($LASTEXITCODE -ne 0) { throw 'Installed UI diagnostic failed' }
            $launched = (& cmd.exe /d /c "call `"$env:STAGE\run.bat`" --version" | Out-String).Trim()
            if ($launched -ne 'Runner 0.7.20') { throw "run.bat mismatch: $launched" }
            $optional = Join-Path $env:STAGE 'assets/optional'
            if (Test-Path $optional) {
              $backup = Join-Path $env:RUNNER_TEMP 'runner-v0720-optional-backup'
              Remove-Item $backup -Recurse -Force -ErrorAction SilentlyContinue
              Move-Item $optional $backup
              & "$env:STAGE/Runner.exe" --diagnose-package
              if ($LASTEXITCODE -ne 0) { throw 'Optional-art fallback failed' }
              Move-Item $backup $optional
            }
          }
          finally { Pop-Location }
      - name: Create archive checksum and manifest
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"
          $checksum = "$archive.sha256"
          $manifest = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.manifest.sha256"
          Remove-Item $archive,$checksum,$manifest -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$env:STAGE/*" -DestinationPath $archive -Force
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash  $env:PACKAGE_NAME.zip" | Set-Content $checksum -Encoding ascii
          Get-ChildItem $env:STAGE -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($env:STAGE.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $relative"
          } | Set-Content $manifest -Encoding ascii
      - name: Independently extract and audit archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"
          $audit = Join-Path $env:RUNNER_TEMP 'runner-v0720-extracted'
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          Push-Location $env:RUNNER_TEMP
          try {
            & "$audit/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package diagnostic failed' }
            & "$audit/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Extracted acceptance failed' }
            & "$audit/Runner.exe" --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Extracted camera diagnostic failed' }
            & "$audit/Runner.exe" --diagnose-ui
            if ($LASTEXITCODE -ne 0) { throw 'Extracted UI diagnostic failed' }
          }
          finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            ${{ env.PACKAGE_NAME }}.zip.sha256
            ${{ env.PACKAGE_NAME }}.manifest.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: [linux-validation, windows-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATION_SOURCE: ${{ needs.linux-validation.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: release-assets
      - name: Record exact release evidence and retire release lane
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          mission = Path('missioncache.md')
          text = mission.read_text(encoding='utf-8')
          heading = '# Runner v0.7.20 viewport, preview continuity, and application identity\n'
          section_start = text.index(heading)
          carried = text.index('# Carried open work\n', section_start)
          section = text[section_start:carried]
          section = section.replace(
              '**Release state:** CACHED BEFORE IMPLEMENTATION — RELEASE BLOCKING.',
              '**Release state:** PUBLISHED — LINUX/WINDOWS/PACKAGE/RE-DOWNLOAD/CLEANUP VERIFIED.', 1)
          for number in range(253, 263):
              section = re.sub(rf'(### WALK-[^\n]+-{number}[^\n]*\n)\*\*Status:\*\* [^\n]+',
                  rf'\1**Status:** VERIFIED — MAIN RELEASE GATE PASSED', section, count=1)
          section = re.sub(r'(### WALK-RELEASE-262[^\n]*\n)\*\*Status:\*\* [^\n]+',
              r'\1**Status:** PUBLISHED — TAG/ASSETS/RE-DOWNLOAD/CLEANUP VERIFIED', section, count=1)
          text = text[:section_start] + section + text[carried:]
          evidence = f"\n- v0.7.20 validation source: `{os.environ['VALIDATION_SOURCE']}`.\n- Main release workflow run: `{os.environ['GITHUB_RUN_ID']}`.\n"
          if '## Runner v0.7.20\n' not in text:
              text = text.replace('## Runner v0.7.19\n',
                  '## Runner v0.7.20\n\n**Status:** PUBLISHED.\n' + evidence + '\n## Runner v0.7.19\n', 1)
          mission.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/runner-v0720-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md .github/workflows/runner-v0720-release.yml
          git commit -m 'Record Runner v0.7.20 release evidence [skip ci]'
          git push origin HEAD:main
      - name: Create tag and GitHub release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout origin/main
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
          git tag -a "$RELEASE_TAG" -m "Runner $RELEASE_VERSION"
          git push origin "$RELEASE_TAG"
          cat > release-notes.md <<'NOTES'
          Runner v0.7.20 is the UI, preview-continuity, and application-identity release.

          - Fixes Windows high-DPI scaling by using logical SDL coordinates while Vulkan maps to the drawable surface.
          - Adds deterministic clipping so terrain, markers, hazards, rigs, and PIP content cannot render behind the GUI.
          - Rebuilds the live telemetry cards, PIP placement, bottom status, panel spacing, and text sizing for readable alignment.
          - Stops immutable training publications from restarting the large preview near the starting line.
          - Keeps complete live episodes running when a better retained champion is published.
          - Removes the configure-time source patcher and builds the canonical C++23 source directly.
          - Adds a high-contrast Runner robot/speed icon as PNG, SDL BMP, and embedded multi-resolution Windows ICO.
          - Adds UI-size, DPI, clipping, preview-reset, and icon-format regression tests.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Runner v0.7.20" --notes-file release-notes.md
      - name: Re-download and byte-verify published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-download
          gh release download "$RELEASE_TAG" --dir release-download
          for source in release-assets/*; do
            file=$(basename "$source")
            test -f "release-download/$file"
            cmp --silent "$source" "release-download/$file"
          done
          (cd release-download && sha256sum -c "$PACKAGE_NAME.zip.sha256")
      - name: Close PR and clean release branch
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --head agent/v0720-ui-preview-icon --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/agent%2Fv0720-ui-preview-icon" 2>/dev/null || true
