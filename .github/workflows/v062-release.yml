name: Release EpochRunner v0.6.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/integrate_v062.py
      - tools/integrate_v062_ui.py
      - tools/integrate_v062_ui_escape.py
      - tools/integrate_v062_course.py
      - tools/integrate_v062_gait.py
      - tools/integrate_v062_runtime.py
      - tools/finalize_v062.py
      - .github/workflows/v062-release.yml

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  release:
    runs-on: windows-2025

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source integrations
        shell: pwsh
        run: |
          $scripts = @(
            "tools/integrate_v062.py",
            "tools/integrate_v062_ui.py",
            "tools/integrate_v062_ui_escape.py",
            "tools/integrate_v062_course.py",
            "tools/integrate_v062_gait.py",
            "tools/integrate_v062_runtime.py"
          )
          foreach ($script in $scripts) {
            python $script
            if ($LASTEXITCODE -ne 0) { throw "Integration failed: $script" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Integrated source contains whitespace errors" }
          Copy-Item tools/finalize_v062.py "$env:RUNNER_TEMP/finalize_v062.py" -Force

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-v062-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-v061-${{ runner.os }}-
            epochrunner-v060-publish-v3-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release --output-on-failure -V

      - name: Diagnose executable
        shell: pwsh
        run: |
          $version = (& build/windows-release/Release/EpochRunner.exe --version | Out-String).Trim()
          if ($version -ne "EpochRunner 0.6.2") { throw "Unexpected version: $version" }
          build/windows-release/Release/EpochRunner.exe --diagnose-vulkan
          if ($LASTEXITCODE -ne 0) { throw "Vulkan diagnostic failed" }

      - name: Build package
        id: package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/EpochRunner-v0.6.2-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          Copy-Item README.md, LICENSE, MISSIONS.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          $archive = "EpochRunner-v0.6.2-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
          $checksum | Set-Content "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Commit exact tested source
        id: source
        shell: pwsh
        run: |
          python tools/finalize_v062.py source
          if ($LASTEXITCODE -ne 0) { throw "Mission finalization failed" }
          Remove-Item tools/integrate_v062.py
          Remove-Item tools/integrate_v062_ui.py
          Remove-Item tools/integrate_v062_ui_escape.py
          Remove-Item tools/integrate_v062_course.py
          Remove-Item tools/integrate_v062_gait.py
          Remove-Item tools/integrate_v062_runtime.py
          Remove-Item tools/finalize_v062.py
          Remove-Item .github/workflows/v062-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CMakeLists.txt vcpkg.json README.md MISSIONS.md
          git add -- src/simulation.cpp src/simulation.hpp src/app.cpp
          git add -- src/ppo_network.cpp src/autonomy_runtime.cpp
          git add -- tests/core_tests.cpp tests/concurrency_benchmark.cpp
          git add -u -- .github/workflows/v050-core-diagnostic.yml
          git add -u -- .github/workflows/v062-release.yml
          git add -u -- tools/integrate_v062.py tools/integrate_v062_ui.py
          git add -u -- tools/integrate_v062_ui_escape.py
          git add -u -- tools/integrate_v062_course.py tools/integrate_v062_gait.py
          git add -u -- tools/integrate_v062_runtime.py tools/finalize_v062.py
          git commit -m "Release EpochRunner v0.6.2 biped gait course and UI hotfix"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit tested source" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Failed to push tested source" }
          $sourceSha = (git rev-parse HEAD).Trim()
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpochRunner-v0.6.2-windows-x64
          path: |
            EpochRunner-v0.6.2-windows-x64.zip
            EpochRunner-v0.6.2-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release view v0.6.2 *> $null
          if ($LASTEXITCODE -eq 0) { throw "v0.6.2 already exists; refusing replacement" }
          gh release create v0.6.2 $env:ARCHIVE "$env:ARCHIVE.sha256" `
            --target $env:SOURCE_SHA `
            --title "EpochRunner v0.6.2" `
            --notes "Biped locomotion, gait, course, and readability hotfix. Passive heel/toe geometry supplies semantic support and foot traction. Head, tail, and body contacts slide instead of pinning the actor. Sliding without real alternating steps receives no progress credit, sustained wheel motion is invalid, and knee-before-foot obstacle traversal is penalized. Rocks, hurdles, overhead bars, moving hazards, and thrown projectiles are anchored to shared mile markers after a safe runway. Typography and telemetry no longer overlap."
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }

      - name: Record release evidence
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch main" }
          git switch -C main origin/main
          if ($LASTEXITCODE -ne 0) { throw "Failed to switch to main" }
          python "$env:RUNNER_TEMP/finalize_v062.py" evidence `
            --source-sha $env:SOURCE_SHA --archive $env:ARCHIVE --checksum $env:CHECKSUM
          if ($LASTEXITCODE -ne 0) { throw "Evidence generation failed" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/v0.6.2.md
          git commit -m "Record verified EpochRunner v0.6.2 release"
          if ($LASTEXITCODE -ne 0) { throw "Evidence commit failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Evidence push failed" }
          git push origin --delete fix/v062-biped-traction 2>$null
