name: Final Runner v0.7.25 repository sweep

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-v0725-final-sweep.yml]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: runner-v0725-final-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Verify release and remove all temporary automation
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.7.25 --repo "$GITHUB_REPOSITORY" >/dev/null
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/apply-v0725-pr-target.yml
          rm -f .github/workflows/finalize-v0725-pr-target.yml
          rm -f .github/workflows/finalize-v0725-pr-target-v2.yml
          rm -f .github/workflows/finalize-v0725-authoritative.yml
          rm -f .github/workflows/merge-v0725-after-finalizer.yml
          rm -f .github/workflows/merge-v0725-after-finalizer-v2.yml
          rm -f .github/workflows/cleanup-v0725-after-release.yml
          rm -f .github/workflows/cleanup-v0725-authoritative-after-release.yml
          rm -f .github/workflows/watch-v0725-completion.yml
          rm -f .github/workflows/cleanup-v0725-final-sweep.yml
          rm -f .github/workflows/runner-v0725-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Complete Runner v0.7.25 repository cleanup [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                break
              fi
              test "$attempt" -lt 5
              git rebase --abort 2>/dev/null || true
              sleep 4
            done
          fi
          gh pr close 80 --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent%2Fv0725-art-leg-hotfix" \
            2>/dev/null || true
