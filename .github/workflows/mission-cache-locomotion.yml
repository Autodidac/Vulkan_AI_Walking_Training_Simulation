name: Validate mission-cache locomotion work

on:
  push:
    branches:
      - feature/mission-cache-completion
    paths:
      - tools/integrate_mission_completion.py
      - .github/workflows/mission-cache-locomotion.yml

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  validate-integrate:
    runs-on: windows-2025

    steps:
      - name: Checkout mission branch
        uses: actions/checkout@v4
        with:
          ref: feature/mission-cache-completion
          fetch-depth: 0

      - name: Apply locomotion mission integration
        shell: pwsh
        run: |
          python tools/integrate_mission_completion.py
          if ($LASTEXITCODE -ne 0) { throw "Mission integration failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Integrated source contains whitespace errors" }

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-mission-locomotion-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-v063-${{ runner.os }}-
            epochrunner-v062-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure full Windows validation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build full SDL3 Vulkan application
        run: cmake --build --preset windows-release

      - name: Run deterministic and concurrency tests
        run: ctest --preset windows-release --output-on-failure -V

      - name: Verify executable and Vulkan path
        shell: pwsh
        run: |
          build/windows-release/Release/EpochRunner.exe --diagnose-vulkan
          if ($LASTEXITCODE -ne 0) { throw "Vulkan diagnostic failed" }

      - name: Integrate exact tested source without releasing
        shell: pwsh
        run: |
          Remove-Item tools/integrate_mission_completion.py
          Remove-Item .github/workflows/mission-cache-locomotion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md MISSIONS.md src/app.cpp src/simulation.cpp src/simulation.hpp tests/core_tests.cpp
          git add -u tools/integrate_mission_completion.py .github/workflows/mission-cache-locomotion.yml
          git commit -m "Add obstacle-capable multi-leg sand-sim enemies"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit tested mission source" }
          git push origin HEAD:feature/mission-cache-completion
          if ($LASTEXITCODE -ne 0) { throw "Failed to push tested mission source" }

      - name: Record branch validation evidence
        shell: pwsh
        run: |
          git fetch origin feature/mission-cache-completion
          git switch -C feature/mission-cache-completion origin/feature/mission-cache-completion
          New-Item -ItemType Directory -Force validation | Out-Null
          $sourceSha = (git rev-parse HEAD).Trim()
          @"
          # Mission-cache locomotion validation

          - Exact tested source commit: `$sourceSha`
          - Full SDL3/Vulkan/EpochGui Windows build: passed
          - Core and concurrency tests: passed
          - Biped/humanoid obstacle-capable motor-range tests: passed
          - Quadruped anti-quiver and obstacle-lift tests: passed
          - Four-legged crawler structural tests: passed
          - Six-legged hexapod structural tests: passed
          - Semantic multi-foot support clustering tests: passed
          - Vulkan diagnostic: passed
          - Release publication: intentionally blocked until remaining mission ledger items are complete
          "@ | Set-Content -Encoding UTF8 validation/mission-cache-locomotion.md
          git add validation/mission-cache-locomotion.md
          git commit -m "Record mission-cache locomotion validation"
          git push origin HEAD:feature/mission-cache-completion
