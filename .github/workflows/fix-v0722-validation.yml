name: Fix Runner v0.7.22 validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/v0722-black-frame-hotfix'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0722-black-frame-hotfix
          fetch-depth: 0
      - name: Remove stale unused frame rectangle
        run: |
          set -euo pipefail
          python3 tools/fix_v0722_validation.py
          rm -f tools/fix_v0722_validation.py
          rm -rf tools/__pycache__
          git diff --check
          ! grep -F 'const Rect content' src/app.cpp
      - name: Commit validation repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix v0.7.22 Linux visible-frame build'
          git push origin HEAD:agent/v0722-black-frame-hotfix
