name: Runner pull-request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-gcc14:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deterministic build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
      - name: Source audit
        run: |
          set -euo pipefail
          git diff --check
          grep -F "project(Runner VERSION 0.7.21 LANGUAGES CXX)" CMakeLists.txt
          grep -F "WALK-HUMAN-STATUS-263" missioncache.md
          grep -F "WALK-AUTO-TUNING-275" missioncache.md
          grep -F "WALK-SIDE-GAIT-276" missioncache.md
          grep -F "WALK-RIG-LAB-279" missioncache.md
          grep -F "WALK-RELEASE-283" missioncache.md
          grep -F "training_semantics_version = 0x0007'2101u" src/ppo.hpp
          grep -F "automatic_rig_tuning_candidate" src/autonomy_curriculum.cpp
          grep -F "completes_side_view_crossing" src/simulation.cpp
          grep -F "preview_sync::decide" src/autonomy_runtime.cpp
          grep -F "SDL_SetWindowIcon" src/main.cpp
          grep -F "push_clip" src/renderer.hpp
          grep -F "WHAT THE TRAINER IS TELLING YOU" src/app.cpp
          grep -F "ADVANCED DIAGNOSTICS" src/app.cpp
          grep -F "RigPanelPage::presets" src/app.cpp
          grep -F "rig_lab_layout_valid" src/ui_layout.hpp
          grep -F "TOTAL UPDATES =" src/training_explainer.hpp
          test -f tools/generate_runner_icon.py
          test -f tests/v0720_ui_tests.cpp
          test -f tests/v0721_readable_telemetry_tests.cpp
          test -f tests/v0721_rig_gait_tests.cpp
          test -f docs/RUNNER_V0720_UI_PREVIEW_ICON.md
          test -f docs/RUNNER_V0721_READABLE_TELEMETRY.md
          test ! -e tools/generate_v0719_sources.py
          test ! -e tools/apply_v0720_release.py
          test ! -e tools/apply_v0721_readable_telemetry.py
          test ! -e tools/cache_v0721_rig_repair.py
          test ! -e tools/apply_v0721_rig_gait_repair.py
          test ! -e tools/run_v0721_rig_gait_repair.py
          test ! -e .github/workflows/apply-v0720-release.yml
          test ! -e .github/workflows/apply-v0721-readable-telemetry.yml
          test ! -e .github/workflows/cache-v0721-rig-repair.yml
          test ! -e .github/workflows/apply-v0721-rig-gait-repair.yml
          test ! -e .github/workflows/fix-v0721-windows-shadow.yml
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/pr-linux -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/pr-linux --parallel
      - name: Test
        run: ctest --test-dir build/pr-linux --output-on-failure -V --timeout 1800

  windows-sdl3-vulkan:
    runs-on: windows-2025
    timeout-minutes: 210
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg
      - uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0721-pr-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            runner-v0721-pr-${{ runner.os }}-
            runner-v0720-pr-${{ runner.os }}-
      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure and build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Test
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
      - name: Runtime diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          $version = (& $exe --version | Out-String).Trim()
          if ($version -ne 'Runner 0.7.21') { throw "Version mismatch: $version" }
          & $exe --diagnose-ui
          if ($LASTEXITCODE -ne 0) { throw 'UI diagnostic failed' }
          & $exe --diagnose-camera
          if ($LASTEXITCODE -ne 0) { throw 'Camera diagnostic failed' }
          & $exe --diagnose-package
          if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
          & $exe --diagnose-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance diagnostic failed' }
