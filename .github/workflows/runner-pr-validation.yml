name: Runner pull-request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-gcc14:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deterministic build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
      - name: Source audit
        run: |
          set -euo pipefail
          git diff --check
          grep -F "project(Runner VERSION 0.7.22 LANGUAGES CXX)" CMakeLists.txt
          grep -F "WALK-HUMAN-STATUS-263" missioncache.md
          grep -F "WALK-RELEASE-283" missioncache.md
          grep -F "WALK-BLACK-FRAME-284" missioncache.md
          grep -F "WALK-FRAME-DIAGNOSTIC-287" missioncache.md
          grep -F "WALK-RELEASE-289" missioncache.md
          grep -F "training_semantics_version = 0x0007'2101u" src/ppo.hpp
          grep -F "ui_render::transparent_fill" src/app.cpp
          ! grep -F "Color{}" src/app.cpp
          grep -F "RunnerV0722VisibleFrameTests" CMakeLists.txt
          grep -F "visibly_populated" src/ui_frame_probe.hpp
          grep -F "transparent_fill" src/ui_render_contract.hpp
          test -f tests/v0722_visible_frame_tests.cpp
          test -f docs/RUNNER_V0722_BLACK_FRAME_HOTFIX.md
          test ! -e tools/cache_v0722_black_frame.py
          test ! -e tools/apply_v0722_black_frame_hotfix.py
          test ! -e tools/v0722.cache-trigger
          test ! -e tools/v0722.cache-trigger2
          test ! -e tools/v0722.cache-trigger3
          test ! -e .github/workflows/cache-v0722-black-frame.yml
          test ! -e .github/workflows/apply-v0722-black-frame.yml
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/pr-linux -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/pr-linux --parallel
      - name: Test
        run: ctest --test-dir build/pr-linux --output-on-failure -V --timeout 1800

  windows-sdl3-vulkan:
    runs-on: windows-2025
    timeout-minutes: 210
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg
      - uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0722-pr-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            runner-v0722-pr-${{ runner.os }}-
            runner-v0721-pr-${{ runner.os }}-
            runner-v0720-pr-${{ runner.os }}-
      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure and build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Test
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
      - name: Runtime diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          $version = (& $exe --version | Out-String).Trim()
          if ($version -ne 'Runner 0.7.22') { throw "Version mismatch: $version" }
          & $exe --diagnose-ui
          if ($LASTEXITCODE -ne 0) { throw 'UI diagnostic failed' }
          & $exe --diagnose-camera
          if ($LASTEXITCODE -ne 0) { throw 'Camera diagnostic failed' }
          & $exe --diagnose-package
          if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
          & $exe --diagnose-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance diagnostic failed' }
