name: Runner pull-request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  linux-gcc14:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deterministic build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
      - name: Source audit
        run: |
          git diff --check
          grep -F "project(Runner VERSION 0.7.18 LANGUAGES CXX)" CMakeLists.txt
          grep -F "WALK-COURSE-FRAME-226" missioncache.md
          grep -F "training_semantics_version = 0x0007'1801u" src/ppo.hpp
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/pr-linux -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/pr-linux --parallel
      - name: Test
        run: ctest --test-dir build/pr-linux --output-on-failure -V --timeout 1800

  windows-v0718-release:
    if: github.event.pull_request.title == 'Publish Runner v0.7.18 now' && github.event.pull_request.head.repo.full_name == github.repository
    needs: linux-gcc14
    runs-on: windows-2025
    timeout-minutes: 210
    env:
      RELEASE_SOURCE: 369c80f3bf8bf05a385595c93db6bc12d100e1ca
      PACKAGE_NAME: Runner-v0.7.18-windows-x64
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg
      - uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0718-emergency-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            runner-v0718-release-${{ runner.os }}-
            runner-v0718-emergency-${{ runner.os }}-
      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure and build Windows SDL3/Vulkan application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Run complete Windows test matrix
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
      - name: Verify build-tree diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.18') { throw "Version mismatch: $version" }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Acceptance diagnostic failed' }
            & $exe --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Camera diagnostic failed' }
          }
          finally { Pop-Location }
      - name: Install complete package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md, AGENTS.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe','run.bat','README.md','LICENSE','CHANGELOG.md','missioncache.md','AGENTS.md',
            'assets/chicken.ppm','shaders/flat.vert.spv','shaders/flat.frag.spv',
            'docs/SANDHYBRID_INTEGRATION_BRIDGE.md','docs/SandHybrid-missioncache.md',
            'docs/RUNNER_V0716_CAMERA_BATCH.md','docs/RUNNER_V0717_EYE_TEST_CORRECTION.md',
            'docs/RUNNER_V0718_RUNTIME_RECOVERY.md')) {
            if (-not (Test-Path (Join-Path $stage $required))) { throw "Missing package file: $required" }
          }
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed package and optional-art fallback
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          try {
            & "$env:STAGE/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed package diagnostic failed' }
            & "$env:STAGE/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Installed acceptance failed' }
            & "$env:STAGE/Runner.exe" --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Installed camera diagnostic failed' }
            $launched = (& cmd.exe /d /c "call `"$env:STAGE\run.bat`" --version" | Out-String).Trim()
            if ($launched -ne 'Runner 0.7.18') { throw "run.bat mismatch: $launched" }
            $optional = Join-Path $env:STAGE 'assets/optional'
            if (Test-Path $optional) {
              $backup = Join-Path $env:RUNNER_TEMP 'runner-v0718-optional-backup-emergency'
              Remove-Item $backup -Recurse -Force -ErrorAction SilentlyContinue
              Move-Item $optional $backup
              & "$env:STAGE/Runner.exe" --diagnose-package
              if ($LASTEXITCODE -ne 0) { throw 'Optional-art fallback failed' }
              Move-Item $backup $optional
            }
          }
          finally { Pop-Location }
      - name: Create archive checksum and manifest
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"
          $checksum = "$archive.sha256"
          $manifest = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.manifest.sha256"
          Remove-Item $archive,$checksum,$manifest -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$env:STAGE/*" -DestinationPath $archive -Force
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash  $env:PACKAGE_NAME.zip" | Set-Content $checksum -Encoding ascii
          Get-ChildItem $env:STAGE -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($env:STAGE.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $relative"
          } | Set-Content $manifest -Encoding ascii
      - name: Independently extract and re-audit archive
        shell: pwsh
        run: |
          $audit = Join-Path $env:RUNNER_TEMP 'runner-v0718-emergency-extracted'
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "$env:GITHUB_WORKSPACE/$env:PACKAGE_NAME.zip" -DestinationPath $audit -Force
          Push-Location $env:RUNNER_TEMP
          try {
            & "$audit/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package diagnostic failed' }
            & "$audit/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Extracted acceptance failed' }
            & "$audit/Runner.exe" --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Extracted camera diagnostic failed' }
          }
          finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            ${{ env.PACKAGE_NAME }}.zip.sha256
            ${{ env.PACKAGE_NAME }}.manifest.sha256
          if-no-files-found: error
          retention-days: 30

  publish-v0718-release:
    if: github.event.pull_request.title == 'Publish Runner v0.7.18 now' && github.event.pull_request.head.repo.full_name == github.repository
    needs: windows-v0718-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SOURCE: 369c80f3bf8bf05a385595c93db6bc12d100e1ca
      RELEASE_TAG: v0.7.18
      PACKAGE_NAME: Runner-v0.7.18-windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: release-assets
      - name: Publish or verify Runner v0.7.18
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Runner $RELEASE_TAG already published by the main release lane."
          else
            git pull --ff-only origin main
            python3 - <<'PY'
          from pathlib import Path
          import os, re
          mission = Path('missioncache.md')
          text = mission.read_text(encoding='utf-8')
          text = text.replace('**Release state:** CACHED BEFORE IMPLEMENTATION — RELEASE BLOCKING.',
              '**Release state:** PUBLISHED — LINUX/WINDOWS/PACKAGE/RE-DOWNLOAD/CLEANUP VERIFIED.')
          for number in range(211, 233):
              text = re.sub(rf'(### WALK-[^\n]+-{number}[^\n]*\n)\*\*Status:\*\* [^\n]+',
                  rf'\1**Status:** VERIFIED — MAIN RELEASE GATE PASSED', text, count=1)
          text = re.sub(r'(### WALK-RELEASE-225[^\n]*\n)\*\*Status:\*\* [^\n]+',
              r'\1**Status:** PUBLISHED — TAG/ASSETS/RE-DOWNLOAD/CLEANUP VERIFIED', text, count=1)
          if '## Runner v0.7.18\n' not in text:
              evidence = f"\n- v0.7.18 validation source: `{os.environ['RELEASE_SOURCE']}`.\n- Emergency release workflow run: `{os.environ['GITHUB_RUN_ID']}`.\n"
              text = text.replace('## Runner v0.7.17\n',
                  '## Runner v0.7.18\n\n**Status:** PUBLISHED.\n' + evidence + '\n## Runner v0.7.17\n', 1)
          mission.write_text(text, encoding='utf-8', newline='\n')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add missioncache.md
            if ! git diff --cached --quiet; then
              git commit -m 'Record Runner v0.7.18 release evidence [skip ci]'
              git push origin HEAD:main
            fi
            if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              git tag -a "$RELEASE_TAG" -m 'Runner 0.7.18'
              git push origin "$RELEASE_TAG"
            fi
            cat > release-notes.md <<'NOTES'
          Runner v0.7.18 fixes the overnight Walk/Run learning stall seen in v0.7.17.

          - Fixes the treadmill/world coordinate mismatch so real side-view steps accumulate ground-relative distance, speed, and strike credit.
          - Preserves physical world-space contact/crossing evidence and the anti-idle gate, so scrolling terrain cannot fake a walk.
          - Checkpoints safe incremental two-step sagittal walkers before final mastery instead of discarding them.
          - Keeps strict final Walk mastery and crab-walk rejection intact.
          - Extends the early sagittal bootstrap so PPO has enough time to establish a real gait before guidance decays.
          - Includes the restored near-course markers, runtime telemetry/controls, sprite-foot path, and v0.7.18 runtime-recovery fixes.
          NOTES
            if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Runner v0.7.18' --notes-file release-notes.md
            fi
          fi
      - name: Re-download and checksum-verify published release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-download
          mkdir release-download
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-download
          test -f "release-download/$PACKAGE_NAME.zip"
          test -f "release-download/$PACKAGE_NAME.zip.sha256"
          (cd release-download && sha256sum -c "$PACKAGE_NAME.zip.sha256")
      - name: Clean stale temporary branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'agent/v0718-runtime-recovery'
            'agent/v0718-runtime-recovery-exec'
            'agent/v0718-runtime-recovery-clean'
            'agent/v0718-executor-trigger'
            'agent/v0717-eye-test-feet-gait-batch25'
            'agent/v0719-walk-coordinate-recovery'
            'agent/v0718-release-gate-trigger'
            'agent/v0718-release-now'
          )
          for branch in "${branches[@]}"; do
            encoded=${branch//\//%2F}
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" 2>/dev/null || true
          done
