name: Runner pull-request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-gcc14:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deterministic build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
      - name: Repository sanity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f CMakeLists.txt
          test -f missioncache.md
          test -f tools/repository_audit.cmake
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/pr-linux -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/pr-linux --parallel
      - name: Test
        run: ctest --test-dir build/pr-linux --output-on-failure -V --timeout 1800
