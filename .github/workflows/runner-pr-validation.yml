name: Runner pull-request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-gcc14:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deterministic build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
      - name: Source audit
        run: |
          set -euo pipefail
          git diff --check
          grep -F "project(Runner VERSION 0.7.19 LANGUAGES CXX)" CMakeLists.txt
          grep -F "WALK-BALANCE-RESERVE-233" missioncache.md
          grep -F "WALK-RELEASE-252" missioncache.md
          grep -F "training_semantics_version = 0x0007'1901u" src/ppo.hpp
          grep -F "course_stage_ == sim::CourseStage::balance" src/ppo_trainer.cpp
          grep -F "preview_policy_" src/ppo_trainer.cpp
          test -f src/locomotion_strategy.hpp
          test -f tests/v0719_general_locomotion_tests.cpp
          test -f docs/RUNNER_V0719_GENERAL_LOCOMOTION.md
          test -f tools/generate_v0719_sources.py
          test ! -e tools/apply_v0719_general_locomotion.py
          test ! -e tools/run_v0719_executor.py
          test ! -e tools/v0719.prtrigger
          test ! -e tools/__pycache__
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/pr-linux -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/pr-linux --parallel
      - name: Test
        run: ctest --test-dir build/pr-linux --output-on-failure -V --timeout 1800
