        run: ctest --test-dir build/pr-linux --output-on-failure -V --timeout 1800
''', encoding='utf-8', newline='\n')
          PY
          git diff --check
          grep -F "WALK-COURSE-FRAME-226" .github/workflows/runner-v0717-release.yml
          grep -F "range(211, 233)" .github/workflows/runner-v0717-release.yml
          grep -F "agent/v0719-walk-coordinate-recovery" .github/workflows/runner-v0717-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-v0718-release-gate-correction.yml
          git add .github/workflows/runner-v0717-release.yml .github/workflows/runner-pr-validation.yml
          git commit -m 'Finalize v0.7.18 treadmill-coordinate release evidence gate'
          git push origin HEAD:main
      - name: Close and delete trigger PR
        shell: bash
        run: |
          gh pr close "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" || true
          encoded="${{ github.event.pull_request.head.ref }}"
          encoded=${encoded//\//%2F}
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" || true
