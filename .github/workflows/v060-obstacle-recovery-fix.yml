name: Validate obstacle observation and recovery trigger

on:
  push:
    branches:
      - fix/v060-obstacle-recovery-observation
    paths:
      - "tools/patch_obstacle_recovery_observation.py"
      - ".github/workflows/v060-obstacle-recovery-fix.yml"

permissions:
  contents: write

jobs:
  validate-integrate:
    runs-on: windows-2025

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v060-obstacle-recovery-observation
          fetch-depth: 0

      - name: Apply corrections
        run: python tools/patch_obstacle_recovery_observation.py

      - name: Configure MSVC core validation
        run: >-
          cmake -S . -B build/v060-obstacle-recovery-fix
          -G "Visual Studio 18 2026" -A x64
          -DEPOCHRUNNER_BUILD_APP=OFF
          -DEPOCHRUNNER_BUILD_TESTS=ON

      - name: Build corrected core
        run: cmake --build build/v060-obstacle-recovery-fix --config Release

      - name: Run corrected test suite
        run: ctest --test-dir build/v060-obstacle-recovery-fix -C Release --output-on-failure -V

      - name: Integrate validated branch source
        shell: pwsh
        run: |
          Remove-Item tools/patch_obstacle_recovery_observation.py
          Remove-Item .github/workflows/v060-obstacle-recovery-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expose every obstacle size and prevent recovery reward farming"
          git push origin HEAD:fix/v060-obstacle-recovery-observation
