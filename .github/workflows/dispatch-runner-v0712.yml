name: Dispatch Runner v0.7.12 publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: dispatch-runner-v0712
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.head_ref == 'release/v0712-publisher-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove carrier before publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dispatch-runner-v0712.yml
          git commit -m 'Remove Runner v0.7.12 dispatch carrier'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=publish_runner_v0712
