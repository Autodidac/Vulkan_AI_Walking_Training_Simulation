name: Materialize mission source

on:
  push:
    branches:
      - work/mission-cache-completion
    paths:
      - .github/workflows/materialize-mission-source.yml

permissions:
  contents: write

# Materializes the currently tested integration scripts into normal source files.
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/mission-cache-completion
          fetch-depth: 0
      - name: Apply current ordered-skill integrations
        run: python tools/materialize_mission_source.py
      - name: Commit materialized source
        run: |
          rm tools/integrate_skill_core.py
          rm tools/integrate_skill_training.py
          rm tools/integrate_training_stability.py
          rm tools/integrate_training_stability_fixups.py
          rm tools/materialize_mission_source.py
          rm .github/workflows/v066-skill-curriculum.yml
          rm .github/workflows/materialize-mission-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize ordered skill curriculum source'
          git push origin HEAD:work/mission-cache-completion
