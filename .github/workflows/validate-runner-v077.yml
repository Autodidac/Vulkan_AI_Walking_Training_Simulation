name: Validate Runner v0.7.7

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: runner-v077-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Materialize v0.7.7 source
        shell: bash
        run: |
          python3 tools/apply_v077_core.py
          python3 tools/apply_v077_tests_mission.py

      - name: Verify source and mission hygiene
        shell: bash
        run: |
          git diff --check
          test ! -f tools/apply_v077_core.py
          test ! -f tools/apply_v077_tests_mission.py
          python3 - <<'PY'
          from pathlib import Path
          cmake = Path('CMakeLists.txt').read_text(encoding='utf-8')
          mission = Path('missioncache.md').read_text(encoding='utf-8')
          ppo = Path('src/ppo.hpp').read_text(encoding='utf-8')
          simulation = Path('src/simulation.cpp').read_text(encoding='utf-8')
          required = [
              'WALK-RIGSTANCE-084', 'WALK-CROUCH-085',
              'WALK-EXPLORE-086', 'WALK-FEET-087', 'WALK-RELEASE-088'
          ]
          missing = [item for item in required if item not in mission]
          if missing:
              raise SystemExit(f'missing v0.7.7 missions: {missing}')
          if 'project(Runner VERSION 0.7.7 LANGUAGES CXX)' not in cmake:
              raise SystemExit('version was not materialized')
          if 'motor_discovery_probe' not in ppo:
              raise SystemExit('motor discovery was not materialized')
          if 'primary_support_span_ratio' not in simulation:
              raise SystemExit('support-span correction was not materialized')
          PY

      - name: Configure deterministic C++23 suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/linux-v077 -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build and test deterministic suite
        run: |
          cmake --build build/linux-v077 --parallel
          ctest --test-dir build/linux-v077 --output-on-failure -V --timeout 1200

      - name: Commit tested materialized source
        shell: bash
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "Source is already materialized and committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix rig-specific learning and semantic supports"
          git push origin HEAD:${{ github.head_ref }}

  windows-package:
    needs: linux-source
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Confirm exact clean tested source
        shell: pwsh
        run: |
          foreach ($script in @(
            'tools/apply_v077_core.py',
            'tools/apply_v077_tests_mission.py')) {
            if (Test-Path $script) { throw "One-shot tool remains: $script" }
          }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) { throw "Windows source tree is dirty" }

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: runner-v077-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            runner-v076-${{ runner.os }}-
            runner-v075-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build full Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw "Windows configure failed" }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }

      - name: Run full Windows tests
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1200
          if ($LASTEXITCODE -ne 0) { throw "Windows tests failed" }

      - name: Verify build-tree runtime
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.7') { throw "Unexpected version: $version" }
            & $exe --diagnose-vulkan
            if ($LASTEXITCODE -ne 0) { throw "Vulkan diagnostic failed" }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw "Package diagnostic failed" }
          }
          finally { Pop-Location }

      - name: Install release candidate
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.7-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw "Install failed" }
          Copy-Item README.md, LICENSE, missioncache.md, RELEASE_NOTES_v0.7.7.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe','run.bat','missioncache.md','RELEASE_NOTES_v0.7.7.md',
            'shaders/flat.vert.spv','shaders/flat.frag.spv','assets/chicken.ppm')) {
            if (-not (Test-Path "$stage/$required")) { throw "Missing package file: $required" }
          }

      - name: Verify installed executable and launcher
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.7-windows-x64"
          $outside = "$env:RUNNER_TEMP/runner-v077-unrelated"
          New-Item -ItemType Directory -Force $outside | Out-Null
          Push-Location $outside
          try {
            $version = (& "$stage/Runner.exe" --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.7') { throw "Installed version mismatch: $version" }
            & "$stage/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw "Installed package diagnostic failed" }
            $batchVersion = (& cmd.exe /d /c "call `"$stage\run.bat`" --version" | Out-String).Trim()
            if ($batchVersion -ne 'Runner 0.7.7') { throw "run.bat version mismatch: $batchVersion" }
          }
          finally { Pop-Location }

      - name: Create and independently audit archive
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.7-windows-x64"
          $archive = "$env:GITHUB_WORKSPACE/Runner-v0.7.7-windows-x64.zip"
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Set-Content "$archive.sha256"
          Get-ChildItem $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $relative"
          } | Set-Content 'Runner-v0.7.7-windows-x64.manifest.sha256'
          $audit = "$env:RUNNER_TEMP/runner-v077-audit"
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          $expected = Get-Content 'Runner-v0.7.7-windows-x64.manifest.sha256'
          $actual = Get-ChildItem $audit -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($audit.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $relative"
          }
          if (Compare-Object $expected $actual) { throw "Archive manifest audit failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: Runner-v0.7.7-windows-x64
          path: |
            Runner-v0.7.7-windows-x64.zip
            Runner-v0.7.7-windows-x64.zip.sha256
            Runner-v0.7.7-windows-x64.manifest.sha256
          if-no-files-found: error
          retention-days: 14
