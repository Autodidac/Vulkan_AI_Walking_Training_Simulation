name: Finalize Runner v0.7.24

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  PR_NUMBER: 78

jobs:
  prepare:
    if: github.head_ref == 'agent/v0724-structural-metrics-icon'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      ready: ${{ steps.state.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0724-structural-metrics-icon
          fetch-depth: 0
      - id: state
        name: Apply migration or mark ready
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/ui/runner_icon_source.png
          if grep -Fq 'project(Runner VERSION 0.7.24 LANGUAGES CXX)' CMakeLists.txt; then
            test -f tests/v0724_structural_metrics_icon_tests.cpp
            test ! -e tools/apply_v0724_structural_metrics_icon.py
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/run_v0724_migration.py
          rm -f tools/apply_v0724_structural_metrics_icon.py
          rm -f tools/run_v0724_migration.py
          rm -rf tools/__pycache__
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Runner v0.7.24 structural integrity and truthful telemetry'
          git push origin HEAD:agent/v0724-structural-metrics-icon
          echo 'ready=false' >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0724-structural-metrics-icon
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'project(Runner VERSION 0.7.24 LANGUAGES CXX)' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'2401u" src/ppo.hpp
          grep -F 'project_rigid_structure' src/simulation.cpp
          grep -F 'completed_episode_passes_stage' src/ppo_trainer.cpp
          grep -F 'PASSED STAGE CHECKS' src/app.cpp
          grep -F 'runner_icon_source.png' tools/generate_runner_icon.py
          test -s assets/ui/runner_icon_source.png
          test -f tests/v0724_structural_metrics_icon_tests.cpp
          test -f .github/workflows/runner-v0724-release.yml
      - name: Build and test
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build/final-linux -G Ninja \
            -DRUNNER_BUILD_APP=OFF \
            -DRUNNER_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/final-linux --parallel
          ctest --test-dir build/final-linux --output-on-failure -V --timeout 1800

  windows:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0724-structural-metrics-icon
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg
      - uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0724-final-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            runner-v0724-final-${{ runner.os }}-
            runner-v0724-pr-${{ runner.os }}-
            runner-v0723-release-${{ runner.os }}-
      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Test and diagnose
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          $version = (& $exe --version | Out-String).Trim()
          if ($version -ne 'Runner 0.7.24') { throw "Version mismatch: $version" }
          & $exe --diagnose-ui
          if ($LASTEXITCODE -ne 0) { throw 'UI diagnostic failed' }
          & $exe --diagnose-camera
          if ($LASTEXITCODE -ne 0) { throw 'Camera diagnostic failed' }
          & $exe --diagnose-package
          if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
          & $exe --diagnose-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance diagnostic failed' }

  merge:
    needs: [prepare, linux, windows]
    if: needs.prepare.outputs.ready == 'true' && needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Squash merge validated source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --squash --admin \
            --subject 'Runner v0.7.24 structural integrity and truthful telemetry' \
            --body 'Exact screenshot icon, rigid skeleton projection, stage-qualified counters, mastery-aware progress, cleaner presentation, state isolation, and complete Linux/Windows validation.'
