name: Dispatch Runner v0.7.13 publisher

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write
  pull-requests: read

jobs:
  dispatch:
    if: github.head_ref == 'release/v0713-publisher-trigger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove carrier before publication
        run: |
          set -euo pipefail
          git rm .github/workflows/dispatch-runner-v0713.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove Runner v0.7.13 dispatch carrier'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            --data '{"event_type":"publish_runner_v0713"}'
