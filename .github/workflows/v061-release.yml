name: Build and release EpochRunner v0.6.1

on:
  push:
    branches:
      - main
    paths:
      - "tools/integrate_v061.py"
      - ".github/workflows/v061-release.yml"

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  integrate-build-test-release:
    runs-on: windows-2025

    steps:
      - name: Checkout merged correction
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.6.1 integration
        run: python tools/integrate_v061.py

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-v061-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-v060-final-${{ runner.os }}-
            epochrunner-v060-release-${{ runner.os }}-
            epochrunner-v060-vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure full Visual Studio 2026 release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build complete SDL3 Vulkan application
        run: cmake --build --preset windows-release

      - name: Run deterministic, obstacle, recovery, rig, and concurrency tests
        run: ctest --preset windows-release --output-on-failure -V

      - name: Verify executable version
        shell: pwsh
        run: |
          $version = (& build/windows-release/Release/EpochRunner.exe --version | Out-String).Trim()
          if ($version -ne "EpochRunner 0.6.1") {
            throw "Unexpected executable version: $version"
          }

      - name: Verify SDL3 and Vulkan path
        run: build/windows-release/Release/EpochRunner.exe --diagnose-vulkan

      - name: Stage install
        run: cmake --install build/windows-release --config Release --prefix package/EpochRunner-v0.6.1-windows-x64

      - name: Finalize verified source and mission ledger
        id: source
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("MISSIONS.md")
          text = path.read_text(encoding="utf-8")
          start = text.index("## WALK-OBS-001")
          end = text.index("## Current warning", start)
          section = text[start:end].replace("**Status:** ACTIVE", "**Status:** VERIFIED", 1)
          text = text[:start] + section + text[end:]
          warning = (
              "## Current warning\n\n"
              "EpochRunner v0.6.1 passed the full Windows/Vulkan build, complete obstacle observation tests, "
              "recovery reward-integrity tests, concurrency benchmark, runtime diagnostics, and package gate. "
              "Remaining ACTIVE/OPEN missions carry forward unchanged.\n"
          )
          text = text[:text.index("## Current warning")] + warning
          path.write_text(text, encoding="utf-8")
          '@ | python -

          Remove-Item tools/integrate_v061.py
          Remove-Item .github/workflows/v061-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release EpochRunner v0.6.1 obstacle observation hardening"
          git pull --rebase origin main
          git push origin HEAD:main
          $sourceSha = (git rev-parse HEAD).Trim()
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Package exact tested build
        id: package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, MISSIONS.md -Destination package/EpochRunner-v0.6.1-windows-x64 -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination package/EpochRunner-v0.6.1-windows-x64 -Force
          $archive = "EpochRunner-v0.6.1-windows-x64.zip"
          Compress-Archive -Path "package/EpochRunner-v0.6.1-windows-x64/*" -DestinationPath $archive -Force
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
          $checksum | Set-Content "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Publish v0.6.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release view v0.6.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "v0.6.1 already exists; refusing to replace it"
          }
          gh release create v0.6.1 $env:ARCHIVE "$env:ARCHIVE.sha256" `
            --target $env:SOURCE_SHA `
            --title "EpochRunner v0.6.1" `
            --notes "Obstacle/recovery hardening: rocks, projectiles, and moving hazards now expose their actual radius to the policy; hurdle and overhead-bar extents remain explicit; harmless upright contact can no longer farm recovery bonuses; destabilizing impacts and recoverable near-falls retain bounded recovery behavior."

      - name: Record immutable release evidence and clean branch
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          git fetch origin main
          git switch -C main origin/main
          New-Item -ItemType Directory -Force validation | Out-Null
          @"
          # EpochRunner v0.6.1 release evidence

          - Source commit: `$env:SOURCE_SHA`
          - Windows runner: `windows-2025`
          - Generator: `Visual Studio 18 2026`
          - Full SDL3/Vulkan/EpochGui application build: passed
          - Radial and rectangular obstacle observation tests: passed
          - Recovery reward-integrity and near-fall grace tests: passed
          - Hip-edit, concurrency, optimizer, and speed-mode tests: passed
          - Executable version check: passed
          - SDL3/Vulkan diagnostic: passed
          - Package: `$env:ARCHIVE`
          - SHA-256: `$env:CHECKSUM`
          "@ | Set-Content -Encoding UTF8 validation/v0.6.1.md
          git add validation/v0.6.1.md
          git commit -m "Record v0.6.1 release evidence"
          git push origin HEAD:main
          git push origin --delete fix/v060-obstacle-recovery-observation
