name: Build and release EpochRunner v0.6.1

on:
  push:
    branches:
      - main
    paths:
      - "tools/integrate_v061.py"
      - ".github/workflows/v061-release.yml"

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  integrate-build-test-release:
    runs-on: windows-2025

    steps:
      - name: Checkout merged correction
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.6.1 source integration
        shell: pwsh
        run: |
          python tools/integrate_v061.py
          if ($LASTEXITCODE -ne 0) { throw "v0.6.1 integration failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "v0.6.1 patch contains whitespace errors" }

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-v061-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-v060-publish-v3-${{ runner.os }}-
            epochrunner-v060-publish-v2-${{ runner.os }}-
            epochrunner-v060-final-${{ runner.os }}-
          save-always: true

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure full Visual Studio 2026 release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build complete SDL3 Vulkan application
        run: cmake --build --preset windows-release

      - name: Run obstacle, recovery, rig, and concurrency tests
        run: ctest --preset windows-release --output-on-failure -V

      - name: Verify executable identity and Vulkan path
        shell: pwsh
        run: |
          $version = (& build/windows-release/Release/EpochRunner.exe --version | Out-String).Trim()
          if ($version -ne "EpochRunner 0.6.1") { throw "Unexpected version: $version" }
          build/windows-release/Release/EpochRunner.exe --diagnose-vulkan
          if ($LASTEXITCODE -ne 0) { throw "Vulkan diagnostic failed" }

      - name: Stage package
        run: cmake --install build/windows-release --config Release --prefix package/EpochRunner-v0.6.1-windows-x64

      - name: Commit exact tested source
        id: source
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("MISSIONS.md")
          text = path.read_text(encoding="utf-8")
          start = text.index("## WALK-OBS-001")
          end = text.index("## Current warning", start)
          section = text[start:end].replace("**Status:** ACTIVE", "**Status:** VERIFIED", 1)
          text = text[:start] + section + text[end:]
          warning = (
              "## Current warning\n\n"
              "EpochRunner v0.6.1 passed the full Windows/Vulkan build, complete obstacle observation tests, "
              "recovery reward-integrity tests, concurrency benchmark, runtime diagnostics, and package gate. "
              "Remaining ACTIVE/OPEN missions carry forward unchanged.\n"
          )
          text = text[:text.index("## Current warning")] + warning
          path.write_text(text, encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Mission finalization failed" }

          Remove-Item tools/integrate_v061.py
          Remove-Item .github/workflows/v061-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt vcpkg.json README.md MISSIONS.md `
            src/simulation.cpp src/simulation.hpp `
            tests/core_tests.cpp tests/concurrency_benchmark.cpp
          git rm --cached --ignore-unmatch tools/integrate_v061.py .github/workflows/v061-release.yml 2>$null
          git add -u tools/integrate_v061.py .github/workflows/v061-release.yml
          git commit -m "Release EpochRunner v0.6.1 obstacle observation hardening"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit tested v0.6.1 source" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Failed to push tested v0.6.1 source" }
          $sourceSha = (git rev-parse HEAD).Trim()
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Build archive and checksum
        id: package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, MISSIONS.md -Destination package/EpochRunner-v0.6.1-windows-x64 -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination package/EpochRunner-v0.6.1-windows-x64 -Force
          $archive = "EpochRunner-v0.6.1-windows-x64.zip"
          Compress-Archive -Path "package/EpochRunner-v0.6.1-windows-x64/*" -DestinationPath $archive -Force
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
          $checksum | Set-Content "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Preserve package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpochRunner-v0.6.1-windows-x64
          path: |
            EpochRunner-v0.6.1-windows-x64.zip
            EpochRunner-v0.6.1-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.6.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release view v0.6.1 *> $null
          if ($LASTEXITCODE -eq 0) { throw "v0.6.1 already exists; refusing to replace it" }
          gh release create v0.6.1 $env:ARCHIVE "$env:ARCHIVE.sha256" `
            --target $env:SOURCE_SHA `
            --title "EpochRunner v0.6.1" `
            --notes "Obstacle/recovery hardening: rocks, projectiles, and moving hazards expose their actual radius to the policy; hurdle and overhead-bar extents remain explicit; harmless upright contact can no longer farm recovery bonuses; destabilizing impacts and recoverable near-falls retain bounded recovery behavior."
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish v0.6.1" }

      - name: Record immutable evidence and remove correction branch
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch main" }
          git switch -C main origin/main
          if ($LASTEXITCODE -ne 0) { throw "Failed to reset to remote main" }
          New-Item -ItemType Directory -Force validation | Out-Null
          @'
          from pathlib import Path
          import os

          lines = [
              "# EpochRunner v0.6.1 release evidence",
              "",
              f"- Exact tested source commit: `{os.environ['SOURCE_SHA']}`",
              "- Windows runner: `windows-2025`",
              "- Generator: `Visual Studio 18 2026`",
              "- Full SDL3/Vulkan/EpochGui application build: passed",
              "- Radial and rectangular obstacle observation tests: passed",
              "- Recovery reward-integrity and near-fall grace tests: passed",
              "- Hip-edit, concurrency, optimizer, and speed-mode tests: passed",
              "- Executable version check: passed",
              "- SDL3/Vulkan diagnostic: passed",
              f"- Package: `{os.environ['ARCHIVE']}`",
              f"- Package SHA-256: `{os.environ['CHECKSUM']}`",
              "",
          ]
          Path("validation/v0.6.1.md").write_text("\n".join(lines), encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Failed to generate v0.6.1 evidence" }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/v0.6.1.md
          git commit -m "Record verified EpochRunner v0.6.1 release"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit v0.6.1 evidence" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Failed to push v0.6.1 evidence" }
          git push origin --delete fix/v060-obstacle-recovery-observation
