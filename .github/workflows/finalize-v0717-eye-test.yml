name: Finalize Runner v0.7.17 eye-test source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: finalize-runner-v0717-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ github.head_ref == 'agent/v0717-eye-test-feet-gait-batch25' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0717-eye-test-feet-gait-batch25
          fetch-depth: 0

      - name: Materialize supplied optional art
        run: python tools/materialize_v0717_optional_art.py

      - name: Finalize source, tests, documentation, and audit contracts
        run: python tools/finalize_v0717_eye_test.py

      - name: Commit generated art and finalized source
        shell: bash
        run: |
          set -euo pipefail
          rm tools/materialize_v0717_optional_art.py
          rm tools/finalize_v0717_eye_test.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize Runner v0.7.17 supplied art and release source'
          git push origin HEAD:agent/v0717-eye-test-feet-gait-batch25
