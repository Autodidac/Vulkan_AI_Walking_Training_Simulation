name: Audit Runner v0.7.7 Cleanup

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-runner-v077.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.7.7
      EXPECTED_SHA: 121b4c2865457b1be88b57775acff1590596da8c
    steps:
      - name: Verify release and published assets
        shell: bash
        run: |
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,url,assets)"
          test "$(jq -r '.tagName' <<<"$release_json")" = "$TAG"
          for file in \
            Runner-v0.7.7-windows-x64.zip \
            Runner-v0.7.7-windows-x64.zip.sha256 \
            Runner-v0.7.7-windows-x64.manifest.sha256
          do
            jq -e --arg file "$file" '.assets[] | select(.name == $file)' \
              <<<"$release_json" >/dev/null
          done
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$tag_sha" = "$EXPECTED_SHA"

      - name: Re-download and checksum release package
        shell: bash
        run: |
          rm -rf release-audit
          mkdir release-audit
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-audit
          expected="$(tr -d '\r\n ' \
            < release-audit/Runner-v0.7.7-windows-x64.zip.sha256 | tr 'A-F' 'a-f')"
          actual="$(sha256sum release-audit/Runner-v0.7.7-windows-x64.zip | awk '{print $1}')"
          test "$expected" = "$actual"
          test -s release-audit/Runner-v0.7.7-windows-x64.manifest.sha256

      - name: Delete merged work branch
        shell: bash
        run: |
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/runner-v077-rig-learning"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/agent/runner-v077-rig-learning" \
              >/dev/null 2>&1; then
            echo "Merged branch still exists"
            exit 1
          fi
