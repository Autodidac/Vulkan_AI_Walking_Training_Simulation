name: Runner v0.7.25 validation and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  RELEASE_VERSION: 0.7.25
  RELEASE_TAG: v0.7.25
  PACKAGE_NAME: Runner-v0.7.25-windows-x64

jobs:
  linux-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install deterministic build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
      - name: Audit v0.7.25 source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'project(Runner VERSION 0.7.25 LANGUAGES CXX)' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'2501u" src/ppo.hpp
          grep -F 'COMPACT SEGMENTED BODY ARMOR' src/app.cpp
          grep -F 'chain_convergence_passes = 16' src/simulation.cpp
          grep -F 'structural_error > 0.020f' src/simulation.cpp
          grep -F 'font::make_bitmap_font_metrics' src/app.cpp
          grep -F 'TRAINING SAMPLES READY' src/app.cpp
          grep -F "case '%'" src/ui_font.hpp
          grep -F '130f33fe31d73564a35a622f3bb5ddcc2b5105d5' src/ui_font.hpp
          test -f docs/RUNNER_V0725_ART_LEG_HOTFIX.md
          test -f tests/v0725_art_leg_hotfix_tests.cpp
          test ! -e tools/apply_v0725_art_leg_hotfix.py
          test ! -e tools/apply_v0725_font_sync.py
          test ! -e tools/v0725-prtrigger.txt
          test ! -e .github/workflows/apply-v0725-art-leg-hotfix.yml
          cmake -DRUNNER_SOURCE_DIR="$PWD" -P tools/repository_audit.cmake
      - name: Configure Linux deterministic suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/linux-v0725 -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build and test Linux
        run: |
          cmake --build build/linux-v0725 --parallel
          ctest --test-dir build/linux-v0725 --output-on-failure -V --timeout 1800

  windows-package:
    needs: linux-validation
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.linux-validation.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg
      - uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0725-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: runner-v0725-${{ runner.os }}-
      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure Windows SDL3/Vulkan application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $selected = $null
          foreach ($candidate in @('windows-release', 'windows-vs2022-release')) {
            Write-Host "Trying CMake preset $candidate"
            cmake --preset $candidate --fresh
            if ($LASTEXITCODE -eq 0) {
              $selected = $candidate
              break
            }
          }
          if (-not $selected) { throw 'No supported Windows CMake preset configured successfully' }
          $buildDir = if ($selected -eq 'windows-release') {
            'build/windows-release'
          } else {
            'build/windows-vs2022-release'
          }
          "ACTIVE_PRESET=$selected" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BUILD_DIR=$buildDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows release
        shell: pwsh
        run: |
          cmake --build --preset $env:ACTIVE_PRESET --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Run complete Windows test matrix
        shell: pwsh
        run: |
          ctest --preset $env:ACTIVE_PRESET --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
      - name: Verify build-tree runtime diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path "$env:BUILD_DIR/Release/Runner.exe").Path
          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.25') { throw "Version mismatch: $version" }
            foreach ($diagnostic in @('--diagnose-package', '--diagnose-acceptance', '--diagnose-camera', '--diagnose-ui')) {
              & $exe $diagnostic
              if ($LASTEXITCODE -ne 0) { throw "Build-tree diagnostic failed: $diagnostic" }
            }
          }
          finally { Pop-Location }
      - name: Install complete Windows package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install $env:BUILD_DIR --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md, AGENTS.md -Destination $stage -Force
          Get-ChildItem "$env:BUILD_DIR/Release" -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe', 'run.bat', 'README.md', 'LICENSE', 'CHANGELOG.md',
            'missioncache.md', 'AGENTS.md', 'assets/chicken.ppm',
            'assets/ui/runner_icon_source.png', 'assets/ui/runner_icon.png',
            'assets/ui/runner_icon.bmp', 'assets/ui/runner.ico',
            'shaders/flat.vert.spv', 'shaders/flat.frag.spv',
            'docs/RUNNER_V0725_ART_LEG_HOTFIX.md',
            'docs/RUNNER_V0724_STRUCTURAL_METRICS_ICON.md',
            'docs/SANDHYBRID_INTEGRATION_BRIDGE.md')) {
            if (-not (Test-Path (Join-Path $stage $required))) {
              throw "Missing package file: $required"
            }
          }
          "STAGE=$stage" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify installed package
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          try {
            foreach ($diagnostic in @('--diagnose-package', '--diagnose-acceptance', '--diagnose-camera', '--diagnose-ui')) {
              & "$env:STAGE/Runner.exe" $diagnostic
              if ($LASTEXITCODE -ne 0) { throw "Installed diagnostic failed: $diagnostic" }
            }
            $launched = (& cmd.exe /d /c "call `"$env:STAGE\run.bat`" --version" | Out-String).Trim()
            if ($launched -ne 'Runner 0.7.25') { throw "run.bat mismatch: $launched" }
            $optional = Join-Path $env:STAGE 'assets/optional'
            if (Test-Path $optional) {
              $backup = Join-Path $env:RUNNER_TEMP 'runner-v0725-optional-backup'
              Remove-Item $backup -Recurse -Force -ErrorAction SilentlyContinue
              Move-Item $optional $backup
              & "$env:STAGE/Runner.exe" --diagnose-package
              if ($LASTEXITCODE -ne 0) { throw 'Optional-art fallback failed' }
              Move-Item $backup $optional
            }
          }
          finally { Pop-Location }
      - name: Create archive checksum and manifest
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"
          $checksum = "$archive.sha256"
          $manifest = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.manifest.sha256"
          Remove-Item $archive,$checksum,$manifest -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$env:STAGE/*" -DestinationPath $archive -Force
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash  $env:PACKAGE_NAME.zip" | Set-Content $checksum -Encoding ascii
          Get-ChildItem $env:STAGE -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($env:STAGE.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $relative"
          } | Set-Content $manifest -Encoding ascii
      - name: Independently extract and audit archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"
          $audit = Join-Path $env:RUNNER_TEMP 'runner-v0725-extracted'
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          Push-Location $env:RUNNER_TEMP
          try {
            foreach ($diagnostic in @('--diagnose-package', '--diagnose-acceptance', '--diagnose-camera', '--diagnose-ui')) {
              & "$audit/Runner.exe" $diagnostic
              if ($LASTEXITCODE -ne 0) { throw "Extracted diagnostic failed: $diagnostic" }
            }
          }
          finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            ${{ env.PACKAGE_NAME }}.zip.sha256
            ${{ env.PACKAGE_NAME }}.manifest.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push'
    needs: [linux-validation, windows-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATION_SOURCE: ${{ needs.linux-validation.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.linux-validation.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: release-assets
      - name: Verify exact validated assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/$PACKAGE_NAME.zip"
          test -f "release-assets/$PACKAGE_NAME.zip.sha256"
          test -f "release-assets/$PACKAGE_NAME.manifest.sha256"
          (cd release-assets && sha256sum -c "$PACKAGE_NAME.zip.sha256")
      - name: Tag and publish Runner v0.7.25
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
          git tag -a "$RELEASE_TAG" "$VALIDATION_SOURCE" -m "Runner $RELEASE_VERSION"
          git push origin "$RELEASE_TAG"
          cat > release-notes.md <<'NOTES'
          Runner v0.7.25 is the compact-art, stance-integrity, and readable-font release.

          - Keeps the approved helmet and foot artwork while replacing the oversized translucent torso sheet with compact node-attached chest, shoulder, forearm, and indicator geometry.
          - Prevents paired walking legs from folding into a telescoping-looking stack, including recovery and body-contact frames.
          - Reconstructs knees from exact authored two-link lengths with iterative shared-pelvis convergence.
          - Tightens structural-compression rejection to two percent and isolates v0.7.25 training state.
          - Synchronizes Runner with EpochGui's logical-pixel font contract at commit 130f33fe31d73564a35a622f3bb5ddcc2b5105d5 without modifying EpochGui.
          - Adds the missing percent glyph and replaces overflowing compact counters with UPDATES READY, RUNS READY, and TESTS READY.
          - Clarifies that training samples provide the first 80 percent and repeat mastery tests provide the final 20 percent.
          - Passes Linux GCC14 warnings-as-errors, full Windows SDL3/Vulkan build and tests, 24/24 live acceptance, installed/extracted package diagnostics, checksums, and manifest verification.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Runner v0.7.25" --notes-file release-notes.md
      - name: Re-download and byte-verify published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-download
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-download
          for source in release-assets/*; do
            file=$(basename "$source")
            test -f "release-download/$file"
            cmp --silent "$source" "release-download/$file"
          done
          (cd release-download && sha256sum -c "$PACKAGE_NAME.zip.sha256")
      - name: Delete temporary implementation branch
        shell: bash
        run: |
          encoded='agent%2Fv0725-art-leg-hotfix'
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" 2>/dev/null || true
