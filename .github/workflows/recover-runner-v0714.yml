name: Recover Runner v0.7.14 Windows package

on:
  push:
    branches: [agent/v0714-sandhybrid-live-map-integration]

permissions:
  actions: read
  contents: write

concurrency:
  group: recover-runner-v0714
  cancel-in-progress: false

jobs:
  linux-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.freeze.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Apply Windows stack fix
        run: |
          set -euo pipefail
          python3 tools/fix_v0714_windows_stack.py
          grep -F '#include <vector>' src/deformable_terrain.hpp
          grep -F 'std::vector<FineCell> fine_cells_{ fine_cell_count };' src/deformable_terrain.hpp
          grep -F 'WALK-WINSTACK-137' missioncache.md
          git diff --check

      - name: Configure Linux deterministic suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -S . -B build/linux-v0714-recovery -G Ninja -DRUNNER_BUILD_APP=OFF -DRUNNER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build and test Linux suite
        run: |
          cmake --build build/linux-v0714-recovery --parallel
          ctest --test-dir build/linux-v0714-recovery --output-on-failure -V --timeout 1800

      - name: Freeze exact tested recovery source
        id: freeze
        run: |
          set -euo pipefail
          rm -f tools/fix_v0714_windows_stack.py
          rm -f .github/workflows/recover-runner-v0714.yml
          rm -f .github/workflows/validate-runner-v0714.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Runner v0.7.14 Windows terrain stack overflow'
          git push origin HEAD:agent/v0714-sandhybrid-live-map-integration
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-package:
    needs: linux-source
    runs-on: windows-2025
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.linux-source.outputs.source_sha }}
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0714-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: runner-v0714-vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Run complete Windows tests
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

      - name: Verify build-tree diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            if ((& $exe --version | Out-String).Trim() -ne 'Runner 0.7.14') { throw 'Version mismatch' }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'All-rig acceptance failed' }
          }
          finally { Pop-Location }

      - name: Install and verify optional-art fallback
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.14-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md,LICENSE,CHANGELOG.md,missioncache.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe','run.bat','README.md','LICENSE','CHANGELOG.md','missioncache.md',
            'assets/chicken.ppm','shaders/flat.vert.spv','shaders/flat.frag.spv',
            'docs/SANDHYBRID_INTEGRATION_BRIDGE.md','docs/SandHybrid-missioncache.md',
            'assets/optional/runner_armor_concepts/runner_armor_concepts.webp',
            'assets/optional/runner_armor_concepts/README.md')) {
            if (-not (Test-Path "$stage/$required")) { throw "Missing package file: $required" }
          }
          $artHash = (Get-FileHash "$stage/assets/optional/runner_armor_concepts/runner_armor_concepts.webp" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($artHash -ne '2f99c87459bb1fbc28bc556e8df07b58a5b2d51650a300563bffcb8a38a57f19') { throw "Optional art hash mismatch: $artHash" }
          Push-Location $env:RUNNER_TEMP
          try {
            & "$stage/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed package diagnostic failed' }
            & "$stage/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Installed acceptance failed' }
            if ((& cmd.exe /d /c "call `"$stage\run.bat`" --version" | Out-String).Trim() -ne 'Runner 0.7.14') { throw 'run.bat mismatch' }
          }
          finally { Pop-Location }

          $fallback = "$env:RUNNER_TEMP/Runner-v0.7.14-no-optional-art"
          Remove-Item $fallback -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $fallback | Out-Null
          Copy-Item "$stage/*" -Destination $fallback -Recurse -Force
          Remove-Item "$fallback/assets/optional" -Recurse -Force
          Push-Location $env:RUNNER_TEMP
          try {
            & "$fallback/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'No-optional-art package diagnostic failed' }
            & "$fallback/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'No-optional-art acceptance failed' }
          }
          finally { Pop-Location }
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create and audit archive
        id: package
        shell: pwsh
        run: |
          $archive = "$env:GITHUB_WORKSPACE/Runner-v0.7.14-windows-x64.zip"
          $checksum = "$archive.sha256"
          $manifest = "$env:GITHUB_WORKSPACE/Runner-v0.7.14-windows-x64.manifest.sha256"
          Compress-Archive -Path "$env:STAGE/*" -DestinationPath $archive -Force
          $zipHash = (Get-FileHash $archive -Algorithm SHA256).Hash
          $zipHash | Set-Content $checksum
          Get-ChildItem $env:STAGE -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($env:STAGE.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          } | Set-Content $manifest
          $audit = "$env:RUNNER_TEMP/runner-v0714-recovery-extracted"
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          $expected = Get-Content $manifest
          $actual = Get-ChildItem $audit -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($audit.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          }
          if (Compare-Object $expected $actual) { throw 'Extracted manifest mismatch' }
          Push-Location $env:RUNNER_TEMP
          try {
            & "$audit/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package diagnostic failed' }
            & "$audit/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Extracted acceptance failed' }
          }
          finally { Pop-Location }
          "zip_sha256=$($zipHash.ToUpperInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload validated package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Runner-v0.7.14-windows-x64-recovery
          path: |
            Runner-v0.7.14-windows-x64.zip
            Runner-v0.7.14-windows-x64.zip.sha256
            Runner-v0.7.14-windows-x64.manifest.sha256
          if-no-files-found: error
          retention-days: 14
