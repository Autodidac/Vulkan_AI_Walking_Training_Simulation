name: Finalize Runner v0.7.8

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-runner-v078.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.7.8
      EXPECTED_SHA: 073e10be71d589145beb93e025f946a6661403d3
      WORK_BRANCH: agent/v078-deformable-sand-burial
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify published release assets
        shell: bash
        run: |
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets)"
          test "$(jq -r '.tagName' <<<"$release_json")" = "$TAG"
          for file in \
            Runner-v0.7.8-windows-x64.zip \
            Runner-v0.7.8-windows-x64.zip.sha256 \
            Runner-v0.7.8-windows-x64.manifest.sha256
          do
            jq -e --arg file "$file" '.assets[] | select(.name == $file)' <<<"$release_json" >/dev/null
          done
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$tag_sha" = "$EXPECTED_SHA"
          rm -rf release-audit
          mkdir release-audit
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-audit
          expected="$(tr -d '\r\n ' < release-audit/Runner-v0.7.8-windows-x64.zip.sha256 | tr 'A-F' 'a-f')"
          actual="$(sha256sum release-audit/Runner-v0.7.8-windows-x64.zip | awk '{print $1}')"
          test "$expected" = "$actual"
          test -s release-audit/Runner-v0.7.8-windows-x64.manifest.sha256

      - name: Record final release state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')

          def status(mission: str, value: str) -> None:
              global text
              pattern = rf'(### {re.escape(mission)}[^\n]*\n\*\*Status:\*\*)[^\n]*'
              text, count = re.subn(pattern, rf'\1 {value}', text, count=1)
              if count != 1:
                  raise SystemExit(f'missing mission {mission}')

          text, count = re.subn(
              r'\*\*Release state:\*\*[^\n]*',
              '**Release state:** PUBLISHED — v0.7.8 assets verified after re-download; released-package live confirmation remains authoritative',
              text,
              count=1)
          if count != 1:
              raise SystemExit('missing release state')

          status('WALK-RELEASE-095', 'PUBLISHED — RELEASE ASSETS VERIFIED')
          for mission in ('WALK-SAND-091', 'WALK-MATERIAL-092', 'WALK-BURIAL-093',
                          'WALK-ESCAPE-094', 'WALK-VISUAL-097', 'WALK-ACCEPT-098'):
              status(mission, 'PUBLISHED — PACKAGE VERIFIED')
          status('WALK-CHICKEN-096', 'PUBLISHED — PACKAGE VERIFIED; LIVE CONFIRMATION PENDING')

          marker = '## v0.7.8 immutable publication evidence'
          if marker not in text:
              run_id = os.environ['GITHUB_RUN_ID']
              text = text.rstrip() + f'''\n\n{marker}\n\n- Clean tagged source: `073e10be71d589145beb93e025f946a6661403d3`\n- Published tag and release: `v0.7.8`\n- Final release verification workflow run: `{run_id}`\n- Published assets: Windows ZIP, ZIP SHA-256, and per-file manifest\n- Release assets were re-downloaded and the ZIP checksum was independently verified\n- The publication workflow also byte-compared every uploaded asset after release creation\n- Release tag resolves exactly to the clean tagged source commit\n- Merged work branch deletion and zero-open-PR audit are performed by this finalizer\n- Adam's released-package screenshots remain final authority for WALK-LIVE-066, WALK-REG-029, and the live portion of WALK-CHICKEN-096\n'''
          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add missioncache.md
          git commit -m "Record Runner v0.7.8 publication evidence"
          git push origin HEAD:main

      - name: Remove merged branch and audit open PRs
        shell: bash
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$WORK_BRANCH" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$WORK_BRANCH"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$WORK_BRANCH" >/dev/null 2>&1; then
            echo "Merged branch still exists"
            exit 1
          fi
          test "$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number --jq 'length')" = 0
