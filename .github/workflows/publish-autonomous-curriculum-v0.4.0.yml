name: Repair Autonomous Curriculum v0.4.0 Source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-autonomous-curriculum-v0.4.0.yml"
      - "tools/v04-payload-*.part"
      - "tools/apply_v04_payload.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: epochrunner-repair-v0.4-source-publication
  cancel-in-progress: true

jobs:
  verify-publish-retarget-clean:
    runs-on: windows-2025

    steps:
      - name: Checkout exact validated payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct and verify every validated source file
        shell: pwsh
        run: |
          python tools/apply_v04_payload.py
          git diff --check

          $expected = @{
            "CMakeLists.txt" = "560457ed1ca394aca589fb642b81713045347cee12734197118624e9edc733da"
            "vcpkg.json" = "617e52c00a47904698cc9f6724478d01a2be45e08cd4c01cf3463d7b56807609"
            "README.md" = "f792436551b0d688baee004b6d06cec5a4fc988edccfe5f72968571f9729fd6b"
            "src/main.cpp" = "1e8b44bd6ec49f798b55aaf6c1f03535ac6b39f38ec74af08431656526d9f12e"
            "src/app.cpp" = "a78a4c0262d23fe1096893c6e744b8f0bb974792401ca19aae2fc6329966430f"
            "src/simulation.hpp" = "09d7d2f96b3710b17b17842a8be7707cf4829d97b82fbae051884e3809c68399"
            "src/simulation.cpp" = "a5110e625396260ba1952aa0401da8512489d29c23d84270766afadd54391461"
            "src/ppo.hpp" = "f10beff1d7012fdebe86802c90e72e01e70d6ba9b1658e2bec2d4cd116dd475d"
            "src/ppo_network.cpp" = "4ad91c25c48faf25f2531fb76a1103f3cd02ae6b846f50ba648c91065bd547ba"
            "src/ppo_trainer.cpp" = "a5e7793288791d0ef58f4b9d9365a47be10710e3c3e4dead4fb5631b30d910f5"
            "src/training_checkpoint.cpp" = "addd3ad33e98d91d483977958663374ce048f828507391fa62636d60f07ab6b7"
            "src/autonomy.hpp" = "256d74805e655a875aacf19c717660cdc860a898a4d661ceb6b8558489a31eaa"
            "src/autonomy.cpp" = "dbbad69e99ec95e03f9b43c00e34ff9aaddba526c26e139c8d9e018eb2dc86b2"
            "tests/core_tests.cpp" = "b0823f77cc3f03ec460bc4c38e7ae4918fce0bd201f56a4fc9d040d58b158ac1"
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = (Get-FileHash $entry.Key -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) {
              throw "Validated source hash mismatch for $($entry.Key): $actual"
            }
          }

          $archive = Join-Path $env:RUNNER_TEMP "epochrunner-v04-validated-source.tar"
          tar -cf $archive CMakeLists.txt vcpkg.json README.md src/main.cpp src/app.cpp src/simulation.hpp src/simulation.cpp src/ppo.hpp src/ppo_network.cpp src/ppo_trainer.cpp src/training_checkpoint.cpp src/autonomy.hpp src/autonomy.cpp tests/core_tests.cpp

      - name: Publish complete tested source to main
        id: publish
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "epochrunner-v04-validated-source.tar"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B validated-v0.4-source origin/main --force
          git reset --hard origin/main
          tar -xf $archive

          if ((Select-String -Path CMakeLists.txt -Pattern "VERSION 0.4.0").Count -ne 1) {
            throw "CMake version was not repaired to 0.4.0"
          }
          if ((Select-String -Path vcpkg.json -Pattern '"version-semver": "0.4.0"').Count -ne 1) {
            throw "vcpkg version was not repaired to 0.4.0"
          }

          git add CMakeLists.txt vcpkg.json README.md src/main.cpp src/app.cpp src/simulation.hpp src/simulation.cpp src/ppo.hpp src/ppo_network.cpp src/ppo_trainer.cpp src/training_checkpoint.cpp src/autonomy.hpp src/autonomy.cpp tests/core_tests.cpp
          git diff --cached --check
          $changed = @(git diff --cached --name-only)
          if ($changed.Count -lt 12) {
            throw "Publication repair staged only $($changed.Count) files; expected at least 12"
          }
          git commit -m "Publish complete autonomous curriculum source"
          git push origin HEAD:main
          $sourceSha = git rev-parse HEAD
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Retarget existing binary release to corrected source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.publish.outputs.source_sha }}
        run: |
          gh release edit v0.4.0 --repo $env:GH_REPO --target $env:SOURCE_SHA

      - name: Remove repair branch and close staging PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close $env:PR_NUMBER --repo $env:GH_REPO --comment "The complete SHA-verified v0.4.0 source is now on main and the existing binary release was retargeted." 2>$null
          $branches = gh api "repos/$env:GITHUB_REPOSITORY/branches?per_page=100" | ConvertFrom-Json
          foreach ($branch in $branches) {
            if ($branch.name -ne "main") {
              $encoded = [Uri]::EscapeDataString($branch.name)
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$encoded"
            }
          }
