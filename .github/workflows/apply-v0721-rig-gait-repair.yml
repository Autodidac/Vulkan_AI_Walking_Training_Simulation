name: Apply Runner v0.7.21 rig and gait repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v0721-readable-telemetry'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0721-readable-telemetry
          fetch-depth: 0
      - name: Apply cached rig, gait, preset, and Rig Lab repair
        run: |
          set -euo pipefail
          python3 tools/apply_v0721_rig_gait_repair.py
          git diff --check
          grep -F "training_semantics_version = 0x0007'2101u" src/ppo.hpp
          grep -F 'automatic_rig_tuning_candidate' src/autonomy_curriculum.cpp
          grep -F 'completes_side_view_crossing' src/simulation.cpp
          grep -F 'RigPanelPage::presets' src/app.cpp
          grep -F 'rig_lab_layout_valid' src/ui_layout.hpp
          test -f tests/v0721_rig_gait_tests.cpp
      - name: Remove one-shot source scripts
        run: |
          rm -f tools/apply_v0721_rig_gait_repair.py
          rm -f tools/cache_v0721_rig_repair.py
          rm -rf tools/__pycache__
      - name: Commit exact repaired source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix v0.7.21 rigs, side-view gait, and Rig Lab'
          git push origin HEAD:agent/v0721-readable-telemetry
