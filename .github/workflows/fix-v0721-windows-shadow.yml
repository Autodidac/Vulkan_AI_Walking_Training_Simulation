name: Fix Runner v0.7.21 Windows shadow warning

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/v0721-readable-telemetry'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0721-readable-telemetry
          fetch-depth: 0
      - name: Repair MSVC warning and reuse validated dependency caches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/app.cpp')
          text = app.read_text(encoding='utf-8')
          pattern = re.compile(
              r'const std::size_t\s+leg\s*=\s*motor_index / 2u;\n'
              r'\s*const bool phase_a = leg == 0u \|\| leg == 3u;')
          replacement = (
              'const std::size_t support_leg = motor_index / 2u;\n'
              '                        const bool phase_a = support_leg == 0u '
              '|| support_leg == 3u;')
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'app shadow declaration matches: {count}')
          app.write_text(text, encoding='utf-8', newline='\n')

          expression = '${' + '{ runner.os }}'
          for path, current, previous in (
              ('.github/workflows/runner-pr-validation.yml',
               'runner-v0721-pr-', 'runner-v0720-pr-'),
              ('.github/workflows/runner-v0721-release.yml',
               'runner-v0721-release-', 'runner-v0720-release-')):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              old = f'          restore-keys: {current}{expression}-\n'
              new = (
                  '          restore-keys: |\n'
                  f'            {current}{expression}-\n'
                  f'            {previous}{expression}-\n')
              if old in source:
                  source = source.replace(old, new, 1)
              elif f'{previous}{expression}-' not in source:
                  raise SystemExit(f'{path}: cache restore marker missing')
              file.write_text(source, encoding='utf-8', newline='\n')
          PY
          git diff --check
          grep -F 'support_leg' src/app.cpp
          grep -F 'runner-v0720-pr-' .github/workflows/runner-pr-validation.yml
          grep -F 'runner-v0720-release-' .github/workflows/runner-v0721-release.yml
      - name: Commit corrected Windows contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.cpp .github/workflows/runner-pr-validation.yml .github/workflows/runner-v0721-release.yml
          git commit -m 'Fix v0.7.21 Windows shadow warning'
          git push origin HEAD:agent/v0721-readable-telemetry
