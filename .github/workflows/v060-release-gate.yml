name: Build and release EpochRunner v0.6.0

on:
  push:
    paths:
      - ".github/workflows/v060-release-gate.yml"

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  verified-release:
    runs-on: windows-2025

    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-v060-release-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-v060-vcpkg-${{ runner.os }}-
            epochrunner-v060-release-${{ runner.os }}-

      - name: Execute complete release gate and preserve output
        id: gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force validation | Out-Null
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

          function Run-Stage([string]$Name, [scriptblock]$Command) {
            $path = "validation/v060-release-$Name.log"
            & $Command *> $path
            return $LASTEXITCODE
          }

          $bootstrapExit = Run-Stage "bootstrap" { cmd /c "call `"$env:VCPKG_ROOT\bootstrap-vcpkg.bat`" -disableMetrics" }
          $configureExit = -1
          $buildExit = -1
          $testExit = -1
          $versionExit = -1
          $vulkanExit = -1
          $installExit = -1

          if ($bootstrapExit -eq 0) {
            $configureExit = Run-Stage "configure" { cmake --preset windows-release --fresh }
          } else {
            "Configure skipped because vcpkg bootstrap failed." | Set-Content validation/v060-release-configure.log
          }

          if ($configureExit -eq 0) {
            $buildExit = Run-Stage "build" { cmake --build --preset windows-release }
          } else {
            "Build skipped because configuration failed." | Set-Content validation/v060-release-build.log
          }

          if ($buildExit -eq 0) {
            $testExit = Run-Stage "test" { ctest --preset windows-release --output-on-failure -V }
            $versionExit = Run-Stage "version" { build/windows-release/Release/EpochRunner.exe --version }
            $vulkanExit = Run-Stage "vulkan" { build/windows-release/Release/EpochRunner.exe --diagnose-vulkan }
            $installExit = Run-Stage "install" { cmake --install build/windows-release --config Release --prefix package/EpochRunner-v0.6.0-windows-x64 }
          } else {
            "Tests skipped because compilation failed." | Set-Content validation/v060-release-test.log
            "Version check skipped because compilation failed." | Set-Content validation/v060-release-version.log
            "Vulkan diagnostic skipped because compilation failed." | Set-Content validation/v060-release-vulkan.log
            "Install skipped because compilation failed." | Set-Content validation/v060-release-install.log
          }

          $env:CANDIDATE_SHA = (git rev-parse HEAD).Trim()
          $env:BOOTSTRAP_EXIT = "$bootstrapExit"
          $env:CONFIGURE_EXIT = "$configureExit"
          $env:BUILD_EXIT = "$buildExit"
          $env:TEST_EXIT = "$testExit"
          $env:VERSION_EXIT = "$versionExit"
          $env:VULKAN_EXIT = "$vulkanExit"
          $env:INSTALL_EXIT = "$installExit"

          @'
          from pathlib import Path
          import os

          stages = [
              ("vcpkg bootstrap", "BOOTSTRAP_EXIT", "bootstrap"),
              ("Full configure", "CONFIGURE_EXIT", "configure"),
              ("Full Vulkan build", "BUILD_EXIT", "build"),
              ("Core, course, recovery, and concurrency tests", "TEST_EXIT", "test"),
              ("Executable version", "VERSION_EXIT", "version"),
              ("SDL3/Vulkan diagnostic", "VULKAN_EXIT", "vulkan"),
              ("Install staging", "INSTALL_EXIT", "install"),
          ]

          def status(key: str) -> str:
              value = int(os.environ[key])
              if value == 0:
                  return "success"
              if value == -1:
                  return "skipped"
              return f"failed ({value})"

          lines = [
              "# EpochRunner v0.6.0 release gate",
              "",
              f"Release candidate: `{os.environ['CANDIDATE_SHA']}`",
              "",
          ]
          for label, key, _ in stages:
              lines.append(f"- {label}: {status(key)}")

          for label, _, filename in stages:
              path = Path("validation") / f"v060-release-{filename}.log"
              content = path.read_text(encoding="utf-8", errors="replace") if path.exists() else "missing log"
              lines.extend(["", f"## {label}", "", "```text", content, "```"])

          Path("validation/v060-release-gate.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          '@ | python -

          "bootstrap_exit=$bootstrapExit" >> $env:GITHUB_OUTPUT
          "configure_exit=$configureExit" >> $env:GITHUB_OUTPUT
          "build_exit=$buildExit" >> $env:GITHUB_OUTPUT
          "test_exit=$testExit" >> $env:GITHUB_OUTPUT
          "version_exit=$versionExit" >> $env:GITHUB_OUTPUT
          "vulkan_exit=$vulkanExit" >> $env:GITHUB_OUTPUT
          "install_exit=$installExit" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Commit release-gate evidence regardless of result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/v060-release-gate.md
          git commit -m "Record v0.6 release gate"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Stop before release when any gate failed
        if: >-
          steps.gate.outputs.bootstrap_exit != '0' ||
          steps.gate.outputs.configure_exit != '0' ||
          steps.gate.outputs.build_exit != '0' ||
          steps.gate.outputs.test_exit != '0' ||
          steps.gate.outputs.version_exit != '0' ||
          steps.gate.outputs.vulkan_exit != '0' ||
          steps.gate.outputs.install_exit != '0'
        shell: pwsh
        run: throw "EpochRunner v0.6.0 release gate failed; inspect validation/v060-release-gate.md"

      - name: Finalize verified source ledger
        id: source
        if: >-
          steps.gate.outputs.bootstrap_exit == '0' &&
          steps.gate.outputs.configure_exit == '0' &&
          steps.gate.outputs.build_exit == '0' &&
          steps.gate.outputs.test_exit == '0' &&
          steps.gate.outputs.version_exit == '0' &&
          steps.gate.outputs.vulkan_exit == '0' &&
          steps.gate.outputs.install_exit == '0'
        shell: pwsh
        run: |
          git fetch origin main
          git switch -C main origin/main
          @'
          from pathlib import Path

          path = Path("MISSIONS.md")
          text = path.read_text(encoding="utf-8")
          start = text.index("## WALK-COURSE-001")
          end = text.index("## Current warning", start)
          section = text[start:end].replace("**Status:** ACTIVE", "**Status:** VERIFIED", 1)
          text = text[:start] + section + text[end:]
          warning = "## Current warning\n\nEpochRunner v0.6.0 passed its full Windows/Vulkan build, procedural course and recovery tests, concurrency benchmark, runtime diagnostics, and package gate. Remaining ACTIVE/OPEN missions carry forward unchanged.\n"
          text = text[:text.index("## Current warning")] + warning
          path.write_text(text, encoding="utf-8")
          '@ | python -

          Remove-Item .github/workflows/v060-release-gate.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/v060-core-diagnostic.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/v060-full-diagnostic.yml -ErrorAction SilentlyContinue
          git add -A
          git commit -m "Verify EpochRunner v0.6.0 procedural obstacle recovery course"
          git push origin HEAD:main
          $sourceSha = (git rev-parse HEAD).Trim()
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Package verified source and create checksum
        id: package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, MISSIONS.md -Destination package/EpochRunner-v0.6.0-windows-x64 -Force
          $archive = "EpochRunner-v0.6.0-windows-x64.zip"
          Compress-Archive -Path "package/EpochRunner-v0.6.0-windows-x64/*" -DestinationPath $archive -Force
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
          $checksum | Set-Content "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Publish immutable v0.6.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release view v0.6.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "v0.6.0 already exists; refusing to replace an existing release"
          }
          gh release create v0.6.0 $env:ARCHIVE "$env:ARCHIVE.sha256" `
            --target $env:SOURCE_SHA `
            --title "EpochRunner v0.6.0" `
            --notes "Procedural obstacle and recovery treadmill: moving road dashes and numbered metre/mile markers; continuous inclines, plateaus, declines, hills, and uneven terrain; rocks, hurdles, overhead bars, moving hazards, and thrown projectiles; bounded physical disturbance and timed recovery reward; v0.5 concurrency architecture retained."

      - name: Record immutable release evidence
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          git fetch origin main
          git switch -C main origin/main
          New-Item -ItemType Directory -Force validation | Out-Null
          @"
          # EpochRunner v0.6.0 release evidence

          - Source commit: `$env:SOURCE_SHA`
          - Windows runner: `windows-2025`
          - Generator: `Visual Studio 18 2026`
          - Full Vulkan application build: passed
          - Procedural terrain and obstacle tests: passed
          - Stationary-course advancement test: passed
          - Recovery reward/state tests: passed
          - Concurrency and speed-mode benchmark: passed
          - Executable version check: passed
          - SDL3/Vulkan diagnostic: passed
          - Package: `$env:ARCHIVE`
          - SHA-256: `$env:CHECKSUM`
          "@ | Set-Content -Encoding UTF8 validation/v0.6.0.md
          git add validation/v0.6.0.md
          git commit -m "Record v0.6.0 release evidence"
          git push origin HEAD:main
