name: Apply Runner v0.7.22 black-frame hotfix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v0722-black-frame-hotfix'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0722-black-frame-hotfix
          fetch-depth: 0
      - name: Apply rendering repair
        run: |
          set -euo pipefail
          python3 tools/apply_v0722_black_frame_hotfix.py
          git diff --check
          grep -F 'project(Runner VERSION 0.7.22 LANGUAGES CXX)' CMakeLists.txt
          grep -F 'ui_render::transparent_fill' src/app.cpp
          ! grep -F 'Color{}' src/app.cpp
          grep -F 'RunnerV0722VisibleFrameTests' CMakeLists.txt
          test -f tests/v0722_visible_frame_tests.cpp
          test -f docs/RUNNER_V0722_BLACK_FRAME_HOTFIX.md
      - name: Remove temporary non-workflow executors
        run: |
          rm -f tools/cache_v0722_black_frame.py
          rm -f tools/apply_v0722_black_frame_hotfix.py
          rm -f tools/v0722.cache-trigger
          rm -f tools/v0722.cache-trigger2
          rm -f tools/v0722.cache-trigger3
          rm -rf tools/__pycache__
      - name: Commit repaired source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Runner v0.7.22 black-frame rendering'
          git push origin HEAD:agent/v0722-black-frame-hotfix
