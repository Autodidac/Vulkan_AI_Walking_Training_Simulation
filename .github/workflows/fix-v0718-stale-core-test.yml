name: Fix stale v0.7.18 core marker assertions

on:
  push:
    branches:
      - agent/v0719-walk-coordinate-recovery

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0719-walk-coordinate-recovery
          fetch-depth: 0
      - name: Correct obsolete quarter-distance expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/core_tests.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''    require(std::abs(ui_layout::course_reference_marker_spacing_m(
                  ui_layout::DistanceUnits::metric) - 250.0f) < 0.001f,
              "metric markers are not quarter-kilometre spaced");
          require(std::abs(ui_layout::course_reference_marker_spacing_m(
                  ui_layout::DistanceUnits::imperial) - 402.336f) < 0.001f,
              "imperial markers are not quarter-mile spaced");'''
          new = '''    require(std::abs(ui_layout::course_reference_marker_spacing_m(
                  ui_layout::DistanceUnits::metric) - 10.0f) < 0.001f,
              "metric near-course markers are not 10 metres apart");
          require(std::abs(ui_layout::course_reference_marker_spacing_m(
                  ui_layout::DistanceUnits::imperial) - 15.24f) < 0.001f,
              "imperial near-course markers are not 50 feet apart");'''
          if old not in text:
              raise SystemExit('stale marker assertion block not found exactly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/core_tests.cpp
          git commit -m 'Update core marker tests for v0.7.18 near-course spacing'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-v0718-stale-core-test.yml
          git commit -m 'Remove temporary v0.7.18 test-fix workflow'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
