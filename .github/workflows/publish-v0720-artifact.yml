name: Publish validated Runner v0.7.20 artifact

on:
  push:
    branches: [agent/v0720-release-watch]
    paths:
      - .github/workflows/publish-v0720-artifact.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  SOURCE_RUN_ID: 31197421312
  VALIDATION_SOURCE: 93d5480dc7edf71d8e21c61d0538a6dab6362a05
  RELEASE_TAG: v0.7.20
  PACKAGE_NAME: Runner-v0.7.20-windows-x64

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Report publication start
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment 72 --repo "$GITHUB_REPOSITORY"
          --body "Publication-only recovery started from validated workflow artifact 9001566160 (source run $SOURCE_RUN_ID). No rebuild is being substituted."
      - name: Download exact validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir release-assets
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$PACKAGE_NAME" --dir release-assets
          test -f "release-assets/$PACKAGE_NAME.zip"
          test -f "release-assets/$PACKAGE_NAME.zip.sha256"
          test -f "release-assets/$PACKAGE_NAME.manifest.sha256"
          (cd release-assets && sha256sum -c "$PACKAGE_NAME.zip.sha256")
      - name: Record release evidence on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          mission = Path('missioncache.md')
          text = mission.read_text(encoding='utf-8')
          heading = '# Runner v0.7.20 viewport, preview continuity, and application identity\n'
          section_start = text.index(heading)
          carried = text.index('# Carried open work\n', section_start)
          section = text[section_start:carried]
          section = section.replace(
              '**Release state:** CACHED BEFORE IMPLEMENTATION — RELEASE BLOCKING.',
              '**Release state:** PUBLISHED — LINUX/WINDOWS/PACKAGE/RE-DOWNLOAD/CLEANUP VERIFIED.', 1)
          for number in range(253, 263):
              section = re.sub(
                  rf'(### WALK-[^\n]+-{number}[^\n]*\n)\*\*Status:\*\* [^\n]+',
                  rf'\1**Status:** VERIFIED — MAIN RELEASE GATE PASSED',
                  section, count=1)
          section = re.sub(
              r'(### WALK-RELEASE-262[^\n]*\n)\*\*Status:\*\* [^\n]+',
              r'\1**Status:** PUBLISHED — TAG/ASSETS/RE-DOWNLOAD/CLEANUP VERIFIED',
              section, count=1)
          text = text[:section_start] + section + text[carried:]
          evidence = (
              f"\n- v0.7.20 validation source: `{os.environ['VALIDATION_SOURCE']}`.\n"
              f"- Main release workflow run: `{os.environ['SOURCE_RUN_ID']}`.\n"
              "- Publication recovery reused the byte-identical validated workflow artifact after a non-fast-forward evidence push race.\n")
          if '## Runner v0.7.20\n' not in text:
              text = text.replace(
                  '## Runner v0.7.19\n',
                  '## Runner v0.7.20\n\n**Status:** PUBLISHED.\n'
                  + evidence + '\n## Runner v0.7.19\n', 1)
          mission.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm -f .github/workflows/runner-v0720-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md .github/workflows/runner-v0720-release.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Record Runner v0.7.20 release evidence [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Tag and publish exact validated package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout --detach origin/main
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
          git tag -a "$RELEASE_TAG" -m "Runner 0.7.20"
          git push origin "$RELEASE_TAG"
          cat > release-notes.md <<'NOTES'
          Runner v0.7.20 is the UI, preview-continuity, and application-identity release.

          - Fixes Windows high-DPI scaling by keeping application layout/input in logical SDL coordinates while Vulkan maps to the drawable surface.
          - Clips terrain, distance markers, hazards, rigs, particles, and training PIP content to their intended cards.
          - Rebuilds live telemetry, PIP placement, bottom status, side-panel spacing, and minimum readable text sizing.
          - Stops immutable training publications from restarting the large preview near the starting line.
          - Keeps complete live episodes running when a better retained champion is published.
          - Removes the configure-time source patcher and compiles the canonical C++23 source directly.
          - Includes the supplied icon direction as a cyan/amber articulated-runner concept source plus transparent PNG, SDL BMP, and embedded multi-resolution Windows ICO assets.
          - Adds deterministic UI-size, DPI, clipping, preview-reset, icon-format, Windows package, and extracted-package gates.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Runner v0.7.20" --notes-file release-notes.md
      - name: Re-download and byte-verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-download
          mkdir release-download
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-download
          for source in release-assets/*; do
            file=$(basename "$source")
            test -f "release-download/$file"
            cmp --silent "$source" "release-download/$file"
          done
          (cd release-download && sha256sum -c "$PACKAGE_NAME.zip.sha256")
      - name: Report success and clean temporary branches
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment 72 --repo "$GITHUB_REPOSITORY" \
            --body "Runner v0.7.20 published. Exact validated assets were re-downloaded and byte-verified. Cleaning temporary v0.7.20 branches now."
          gh pr close 72 --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          for branch in agent/v0720-ui-preview-icon agent/v0720-release-watch; do
            encoded=${branch//\//%2F}
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" 2>/dev/null || true
          done
