name: Execute Runner v0.7.16 camera batch

on:
  push:
    branches:
      - agent/v0716-camera-batch25

permissions:
  contents: write

concurrency:
  group: execute-runner-v0716-camera-batch25
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      implementation_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0716-camera-batch25
          fetch-depth: 0

      - name: Apply repaired implementation
        run: python tools/repair_v0716_retry.py

      - name: Remove temporary implementation machinery
        run: |
          rm tools/apply_v0716_batch25.py
          rm tools/repair_v0716_retry.py
          rm .github/workflows/apply-v0716-batch25.yml
          rm .github/workflows/retry-v0716-batch25.yml
          rm .github/workflows/execute-v0716-batch25.yml

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "Implement Runner v0.7.16 adaptive camera batch"
          git push origin HEAD:agent/v0716-camera-batch25

      - name: Record implementation source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux-validation:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.implementation_sha }}
          fetch-depth: 0

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Configure Linux deterministic suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/linux-v0716 -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build and test Linux
        run: |
          cmake --build build/linux-v0716 --parallel
          ctest --test-dir build/linux-v0716 --output-on-failure -V --timeout 1800

  windows-validation:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.implementation_sha }}
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0716-execute-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: runner-v0716-execute-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Run Windows tests and diagnostics
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.16') { throw "Version mismatch: $version" }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Acceptance diagnostic failed' }
            & $exe --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Camera diagnostic failed' }
          }
          finally {
            Pop-Location
          }

  finalize-ledger:
    needs:
      - prepare
      - linux-validation
      - windows-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0716-camera-batch25
          fetch-depth: 0

      - name: Finalize validated ledger
        env:
          VALIDATED_SHA: ${{ needs.prepare.outputs.implementation_sha }}
        run: python tools/finalize_v0716_ledger.py

      - name: Remove final temporary script and commit evidence
        run: |
          rm tools/finalize_v0716_ledger.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "Record Runner v0.7.16 cross-platform validation"
          git push origin HEAD:agent/v0716-camera-batch25
