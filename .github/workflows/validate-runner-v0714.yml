name: Validate Runner v0.7.15 viewport and recovery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: validate-runner-v0715-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-source:
    if: github.head_ref == 'agent/v0715-ground-camera-character-scale'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Verify v0.7.15 source contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'project(Runner VERSION 0.7.15 LANGUAGES CXX)' CMakeLists.txt
          test ! -f tools/apply_v0715_patch.py
          test ! -f .github/workflows/patch-runner-v0715.yml
          if [[ -f cmake/generate_runner_v0715_sources.cmake ]]; then
            grep -F 'generate_runner_v0715_sources.cmake' CMakeLists.txt
            grep -F 'live_pixels_per_meter = 22.0f' cmake/generate_runner_v0715_sources.cmake
            grep -F 'surface-aware macro-tile renderer' cmake/generate_runner_v0715_sources.cmake
            grep -F 'RESTORED CHAMPION AND RESTARTED LESSON' cmake/generate_runner_v0715_sources.cmake
          else
            grep -F 'live_pixels_per_meter = 22.0f' src/app.cpp
            ! grep -F 'draw_course_ground(environment, viewport, camera_x, 90.0f)' src/app.cpp
            ! grep -F 'std::vector<Vec2> surface' src/app.cpp
            grep -F 'if (index <= 0)' src/app.cpp
            grep -F 'runner-v0715-autosave.eppo' src/app.cpp
            grep -F 'RESTORED CHAMPION AND RESTARTED LESSON' src/autonomy_curriculum.cpp
            grep -F "training_semantics_version = 0x0007'1500u" src/ppo.hpp
          fi

      - name: Configure Linux deterministic suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -S . -B build/linux-v0715 -G Ninja -DRUNNER_BUILD_APP=OFF -DRUNNER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Verify compiled source selection
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f build/linux-v0715/generated/v0715/app.cpp ]]; then
            app=build/linux-v0715/generated/v0715/app.cpp
            curriculum=build/linux-v0715/generated/v0715/autonomy_curriculum.cpp
          else
            app=src/app.cpp
            curriculum=src/autonomy_curriculum.cpp
          fi
          grep -F 'live_pixels_per_meter = 22.0f' "$app"
          ! grep -F 'draw_course_ground(environment, viewport, camera_x, 90.0f)' "$app"
          ! grep -F 'std::vector<Vec2> surface' "$app"
          grep -F 'if (index <= 0)' "$app"
          grep -F 'runner-v0715-autosave.eppo' "$app"
          grep -F 'RESTORED CHAMPION AND RESTARTED LESSON' "$curriculum"

      - name: Build and test Linux deterministic suite
        run: |
          cmake --build build/linux-v0715 --parallel
          ctest --test-dir build/linux-v0715 --output-on-failure -V --timeout 1800

      - name: Materialize tested v0.7.15 source
        if: hashFiles('tools/materialize_runner_v0715.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize_runner_v0715.py build/linux-v0715/generated/v0715
          git diff --check
          test ! -f tools/materialize_runner_v0715.py
          test ! -f cmake/generate_runner_v0715_sources.cmake
          grep -F 'live_pixels_per_meter = 22.0f' src/app.cpp
          grep -F 'RESTORED CHAMPION AND RESTARTED LESSON' src/autonomy_curriculum.cpp
          grep -F "training_semantics_version = 0x0007'1500u" src/ppo.hpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize Runner v0.7.15 viewport terrain and recovery fixes'
          git push origin HEAD:agent/v0715-ground-camera-character-scale

  windows-package:
    needs: linux-source
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0715-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: runner-v0715-vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build full Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Run complete Windows tests
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

      - name: Verify build-tree diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            if ((& $exe --version | Out-String).Trim() -ne 'Runner 0.7.15') { throw 'Version mismatch' }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'All-rig acceptance diagnostic failed' }
          }
          finally { Pop-Location }

      - name: Install and verify package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.15-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe','run.bat','README.md','CHANGELOG.md','missioncache.md',
            'assets/chicken.ppm','shaders/flat.vert.spv','shaders/flat.frag.spv',
            'docs/SANDHYBRID_INTEGRATION_BRIDGE.md','docs/SandHybrid-missioncache.md')) {
            if (-not (Test-Path "$stage/$required")) { throw "Missing package file: $required" }
          }
          Push-Location $env:RUNNER_TEMP
          try {
            & "$stage/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed package diagnostic failed' }
            & "$stage/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Installed all-rig acceptance failed' }
            if ((& cmd.exe /d /c "call `"$stage\run.bat`" --version" | Out-String).Trim() -ne 'Runner 0.7.15') { throw 'run.bat mismatch' }
          }
          finally { Pop-Location }
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create and audit archive
        shell: pwsh
        run: |
          $archive = "$env:GITHUB_WORKSPACE/Runner-v0.7.15-windows-x64.zip"
          $checksum = "$archive.sha256"
          $manifest = "$env:GITHUB_WORKSPACE/Runner-v0.7.15-windows-x64.manifest.sha256"
          Compress-Archive -Path "$env:STAGE/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Set-Content $checksum
          Get-ChildItem $env:STAGE -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($env:STAGE.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          } | Set-Content $manifest
          $audit = "$env:RUNNER_TEMP/runner-v0715-extracted"
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          Push-Location $env:RUNNER_TEMP
          try {
            & "$audit/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package diagnostic failed' }
            & "$audit/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Extracted all-rig acceptance failed' }
          }
          finally { Pop-Location }

      - uses: actions/upload-artifact@v4
        with:
          name: Runner-v0.7.15-windows-x64
          path: |
            Runner-v0.7.15-windows-x64.zip
            Runner-v0.7.15-windows-x64.zip.sha256
            Runner-v0.7.15-windows-x64.manifest.sha256
          if-no-files-found: error
          retention-days: 14
