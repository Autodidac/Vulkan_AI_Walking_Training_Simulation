name: Validate Runner v0.7.15 terrain and rig evolution

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: validate-runner-v0715-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cache-first:
    if: github.head_ref == 'agent/v0715-ground-camera-character-scale'
    runs-on: ubuntu-24.04
    outputs:
      materialized: ${{ steps.cache.outputs.materialized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Materialize mission cache before implementation
        id: cache
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f tools/apply_v0716_missioncache.py ]]; then
            echo 'materialized=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/apply_v0716_missioncache.py
          rm -f tools/apply_v0716_missioncache.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md tools/apply_v0716_missioncache.py
          git commit -m 'Cache Runner v0.7.16 missions before implementation'
          git push origin HEAD:agent/v0715-ground-camera-character-scale
          echo 'materialized=true' >> "$GITHUB_OUTPUT"

  linux-source:
    needs: cache-first
    if: needs.cache-first.outputs.materialized != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Apply staged v0.7.15 completion patches
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/apply_v0715_rig_evolution.py ]]; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/apply_v0715_rig_evolution.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('sim::Vec2{', 'Vec2{')

          old = '''                const std::size_t bone_index = static_cast<std::size_t>(
                    generation % candidate.bones.size());
                const sim::DistanceConstraint original = candidate.bones[bone_index];
          '''
          new = '''                std::vector<std::size_t> splittable{};
                for (std::size_t index = 0; index < candidate.bones.size(); ++index)
                {
                    const sim::DistanceConstraint& bone = candidate.bones[index];
                    if (bone.stiffness < 0.20f
                        || candidate.is_support_seed(bone.a)
                        || candidate.is_support_seed(bone.b))
                        continue;
                    splittable.push_back(index);
                }
                if (splittable.empty())
                    break;
                const std::size_t bone_index = splittable[static_cast<std::size_t>(
                    generation % splittable.size())];
                const sim::DistanceConstraint original = candidate.bones[bone_index];
          '''
          if old not in text:
              raise SystemExit('split-bone selection anchor was not found')
          text = text.replace(old, new, 1)

          old = '''        require(mutation.blueprint.valid(),
            "rig evolution published a structurally invalid candidate");
        topology_mutation_seen = topology_mutation_seen || mutation.topology_changed;
          '''
          new = '''        require(mutation.blueprint.valid(),
            "rig evolution published a structurally invalid candidate");
        const auto foot_topology_intact = [](const sim::CreatureBlueprint& rig,
            bool left)
        {
            const auto& extra = left ? rig.additional_left_contact_nodes
                : rig.additional_right_contact_nodes;
            if (extra.size() < 2u)
                return true;
            const std::uint16_t ball = extra[0];
            const std::uint16_t toe = extra[1];
            return std::ranges::any_of(rig.bones,
                [ball, toe](const sim::DistanceConstraint& bone)
                {
                    return (bone.a == ball && bone.b == toe)
                        || (bone.a == toe && bone.b == ball);
                });
        };
        require(foot_topology_intact(mutation.blueprint, true)
                && foot_topology_intact(mutation.blueprint, false),
            "topology evolution broke articulated ball-to-toe semantics");
        topology_mutation_seen = topology_mutation_seen || mutation.topology_changed;
          '''
          if old not in text:
              raise SystemExit('topology test anchor was not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
            python3 tools/apply_v0715_rig_evolution.py
          fi
          rm -f tools/apply_v0715_rig_evolution.py tools/v0715-evolution-retry.txt
          git diff --check

      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'project(Runner VERSION 0.7.15 LANGUAGES CXX)' CMakeLists.txt
          grep -F 'live_pixels_per_meter = 22.0f' src/app.cpp
          grep -F 'stage_uses_deformable_terrain(environment.course_stage())' src/app.cpp
          grep -F 'const float source_left = sim::terrain_sample_x(left, progress);' src/app.cpp
          grep -F 'constexpr float terrain_sample_x' src/simulation.hpp
          grep -F 'constexpr float terrain_world_x' src/simulation.hpp
          grep -F 'static CreatureBlueprint scaffold();' src/simulation.hpp
          grep -F 'RigMutationCandidate evolve_rig_candidate' src/autonomy_curriculum.cpp
          grep -F 'std::vector<std::size_t> splittable' src/autonomy_curriculum.cpp
          grep -F 'TOPOLOGY NURSERY' src/autonomy_curriculum.cpp
          grep -F 'PpoTrainer nursery(candidate, 16, false);' src/autonomy_curriculum.cpp
          grep -F "training_semantics_version = 0x0007'1501u" src/ppo.hpp
          grep -F 'SCAFFOLD' src/app.cpp
          grep -F 'topology evolution broke articulated ball-to-toe semantics' tests/core_tests.cpp
          test ! -f tools/apply_v0715_rig_evolution.py
          test ! -f tools/materialize_runner_v0715.py
          test ! -f cmake/generate_runner_v0715_sources.cmake

      - name: Configure, build, and test Linux
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build/linux-v0715 -G Ninja -DRUNNER_BUILD_APP=OFF -DRUNNER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux-v0715 --parallel
          ctest --test-dir build/linux-v0715 --output-on-failure -V --timeout 1800

      - name: Commit exact tested source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m 'Complete Runner v0.7.15 structural rig evolution'
            git push origin HEAD:agent/v0715-ground-camera-character-scale
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-package:
    needs: linux-source
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.linux-source.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0715-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: runner-v0715-vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Build and test Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

      - name: Verify, install, and archive package
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            if ((& $exe --version | Out-String).Trim() -ne 'Runner 0.7.15') { throw 'Version mismatch' }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Build package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Build acceptance diagnostic failed' }
          }
          finally { Pop-Location }

          $stage = "$env:RUNNER_TEMP/Runner-v0.7.15-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe','run.bat','README.md','CHANGELOG.md','missioncache.md',
            'assets/chicken.ppm','shaders/flat.vert.spv','shaders/flat.frag.spv',
            'docs/SANDHYBRID_INTEGRATION_BRIDGE.md','docs/SandHybrid-missioncache.md',
            'docs/RUNNER_V0715_VIEWPORT_RECOVERY.md')) {
            if (-not (Test-Path "$stage/$required")) { throw "Missing package file: $required" }
          }
          Push-Location $env:RUNNER_TEMP
          try {
            & "$stage/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed package diagnostic failed' }
            & "$stage/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Installed acceptance diagnostic failed' }
            if ((& cmd.exe /d /c "call `"$stage\run.bat`" --version" | Out-String).Trim() -ne 'Runner 0.7.15') { throw 'run.bat mismatch' }
          }
          finally { Pop-Location }

          $archive = "$env:GITHUB_WORKSPACE/Runner-v0.7.15-windows-x64.zip"
          $checksum = "$archive.sha256"
          $manifest = "$env:GITHUB_WORKSPACE/Runner-v0.7.15-windows-x64.manifest.sha256"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Set-Content $checksum
          Get-ChildItem $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          } | Set-Content $manifest
          $audit = "$env:RUNNER_TEMP/runner-v0715-extracted"
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          Push-Location $env:RUNNER_TEMP
          try {
            & "$audit/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package diagnostic failed' }
            & "$audit/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Extracted acceptance diagnostic failed' }
          }
          finally { Pop-Location }

      - uses: actions/upload-artifact@v4
        with:
          name: Runner-v0.7.15-windows-x64
          path: |
            Runner-v0.7.15-windows-x64.zip
            Runner-v0.7.15-windows-x64.zip.sha256
            Runner-v0.7.15-windows-x64.manifest.sha256
          if-no-files-found: error
          retention-days: 14
