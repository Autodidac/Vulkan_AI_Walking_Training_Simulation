name: Validate Runner v0.7.14 SandHybrid live map

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: validate-runner-v0714-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-source:
    if: github.head_ref == 'agent/v0714-sandhybrid-live-map-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Materialize combined v0.7.14 source
        run: |
          set -euo pipefail
          python3 tools/prepare_v0714_sandhybrid_integration.py
          python3 tools/apply_v0714_sandhybrid_integration.py
          git diff --check
          test ! -f tools/prepare_v0714_sandhybrid_integration.py
          test ! -f tools/apply_v0714_sandhybrid_integration.py
          test ! -f .github/workflows/publish-runner-v0713.yml
          test ! -f tools/publish_v0713.ps1
          grep -F 'project(Runner VERSION 0.7.14 LANGUAGES CXX)' CMakeLists.txt
          grep -F 'GIT_TAG 99dd8acddfa9be1402981052b39cbf6284ed99ae' CMakeLists.txt
          grep -F 'SandHybrid::SandHybrid' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'1400u" src/ppo.hpp
          grep -F 'macro_cell_side = sandhybrid::terrain::tile_size' src/deformable_terrain.hpp
          grep -F 'SANDHYBRID_INTEGRATION_BRIDGE.md' missioncache.md
          grep -F 'WALK-CLIMB-134' missioncache.md

      - name: Configure Linux combined deterministic suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -S . -B build/linux-v0714 -G Ninja -DRUNNER_BUILD_APP=OFF -DRUNNER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build and test Linux combined suite
        run: |
          cmake --build build/linux-v0714 --parallel
          ctest --test-dir build/linux-v0714 --output-on-failure -V --timeout 1800

      - name: Commit exact tested source
        id: source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate SandHybrid live terrain into Runner training'
          git push origin HEAD:agent/v0714-sandhybrid-live-map-integration
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-package:
    needs: linux-source
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.linux-source.outputs.source_sha }}
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0714-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: runner-v0714-vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build full Windows combined application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Run complete Windows tests
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

      - name: Verify build-tree diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            if ((& $exe --version | Out-String).Trim() -ne 'Runner 0.7.14') { throw 'Version mismatch' }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'All-rig acceptance diagnostic failed' }
          }
          finally { Pop-Location }

      - name: Install and verify combined package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.14-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe','run.bat','README.md','CHANGELOG.md','missioncache.md',
            'assets/chicken.ppm','shaders/flat.vert.spv','shaders/flat.frag.spv',
            'docs/SANDHYBRID_INTEGRATION_BRIDGE.md','docs/SandHybrid-missioncache.md')) {
            if (-not (Test-Path "$stage/$required")) { throw "Missing package file: $required" }
          }
          Push-Location $env:RUNNER_TEMP
          try {
            & "$stage/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed package diagnostic failed' }
            & "$stage/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Installed all-rig acceptance failed' }
            if ((& cmd.exe /d /c "call `"$stage\run.bat`" --version" | Out-String).Trim() -ne 'Runner 0.7.14') { throw 'run.bat mismatch' }
          }
          finally { Pop-Location }
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create and audit archive
        shell: pwsh
        run: |
          $archive = "$env:GITHUB_WORKSPACE/Runner-v0.7.14-windows-x64.zip"
          $checksum = "$archive.sha256"
          $manifest = "$env:GITHUB_WORKSPACE/Runner-v0.7.14-windows-x64.manifest.sha256"
          Compress-Archive -Path "$env:STAGE/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Set-Content $checksum
          Get-ChildItem $env:STAGE -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($env:STAGE.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          } | Set-Content $manifest
          $audit = "$env:RUNNER_TEMP/runner-v0714-extracted"
          Expand-Archive $archive -DestinationPath $audit -Force
          Push-Location $env:RUNNER_TEMP
          try {
            & "$audit/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package diagnostic failed' }
            & "$audit/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Extracted all-rig acceptance failed' }
          }
          finally { Pop-Location }

      - uses: actions/upload-artifact@v4
        with:
          name: Runner-v0.7.14-windows-x64
          path: |
            Runner-v0.7.14-windows-x64.zip
            Runner-v0.7.14-windows-x64.zip.sha256
            Runner-v0.7.14-windows-x64.manifest.sha256
          if-no-files-found: error
          retention-days: 14
