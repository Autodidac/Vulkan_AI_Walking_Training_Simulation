name: Finalize Runner v0.7.8 exactly

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v078-exact.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: finalize-runner-v078-exact
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Finalize and audit Runner v0.7.8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/scripts/finalize_v078_exact.sh "$RUNNER_TEMP/finalize_v078_exact.sh"
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ['RUNNER_TEMP']) / 'finalize_v078_exact.sh'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "test \"$run_head\" = \"$release_sha\" || test \"$run_head\" = '194cf0fa30256f0edf71ed2f0816d4e8d4a8395c'\n",
              "echo \"Validated workflow head: $run_head\"\n",
          )
          start = text.index('release_id="$(gh api')
          end = text.index('\ngh release create "$tag"', start)
          replacement = '''if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          verify_release_tag() {
            local ref_sha ref_type target_sha
            ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
            ref_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.type)"
            if [[ "$ref_type" = tag ]]; then
              target_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" --jq .object.sha)"
            else
              target_sha="$ref_sha"
            fi
            test "$target_sha" = "$release_sha"
          }
          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace('--target "$release_sha"', '--target "release/v078-exact-source"')
          direct_check = 'test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$release_sha"'
          text = text.replace(direct_check, 'verify_release_tag')
          cleanup_anchor = '''if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$work_branch" >/dev/null 2>&1; then
            gh api --silent -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$work_branch"
          fi
          '''
          cleanup_replacement = cleanup_anchor + '''if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/v078-exact-source" >/dev/null 2>&1; then
            gh api --silent -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release/v078-exact-source"
          fi
          '''
          text = text.replace(cleanup_anchor, cleanup_replacement)
          path.write_text(text, encoding='utf-8')
          PY
          bash "$RUNNER_TEMP/finalize_v078_exact.sh"
