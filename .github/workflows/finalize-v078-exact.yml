name: Finalize Runner v0.7.8 exactly

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v078-exact.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: finalize-runner-v078-exact
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Finalize and audit Runner v0.7.8
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/finalize_v078_exact.sh
