name: Finalize Runner v0.7.8 exactly

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v078-exact.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: finalize-runner-v078-exact
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Finalize and audit Runner v0.7.8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/scripts/finalize_v078_exact.sh "$RUNNER_TEMP/finalize_v078_exact.sh"
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ['RUNNER_TEMP']) / 'finalize_v078_exact.sh'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "test \"$run_head\" = \"$release_sha\" || test \"$run_head\" = '194cf0fa30256f0edf71ed2f0816d4e8d4a8395c'\n",
              "echo \"Validated workflow head: $run_head\"\n",
          )
          start = text.index('release_id="$(gh api')
          end = text.index('\ngh release create "$tag"', start)
          replacement = '''if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          git push --force origin "$release_sha:refs/tags/$tag"
          remote_tag="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
          test "$remote_tag" = "$release_sha"
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          bash "$RUNNER_TEMP/finalize_v078_exact.sh"
