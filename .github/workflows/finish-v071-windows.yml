name: Finish EpochRunner v0.7.1 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/finish-v071-windows.yml]

concurrency:
  group: epochrunner-v071-missioncache
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: read

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize every v0.7.1 mission
        shell: pwsh
        run: |
          python tools/apply_training_quality_v071.py apply
          if ($LASTEXITCODE -ne 0) { throw 'Base materialization failed' }
          $scripts = @(
            'tools/refine_training_quality_v071.py',
            'tools/fix_balance_diagnostic_v071.py',
            'tools/fix_stance_hysteresis_v071.py',
            'tools/fix_balance_seed_robustness_v071.py',
            'tools/fix_balance_evaluation_v071.py',
            'tools/fix_runtime_launch_v071.py',
            'tools/simplify_runtime_deployment_v071.py',
            'tools/patch_launch_release_metadata_v071.py',
            'tools/patch_split_validation_evidence_v071.py',
            'tools/finish_release_v071.py'
          )
          foreach ($script in $scripts) {
            python $script
            if ($LASTEXITCODE -ne 0) { throw "Materialization failed: $script" }
          }
          if (-not (Test-Path run.bat)) { throw 'run.bat is missing' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Materialized source contains whitespace errors' }
          Copy-Item tools/write_missioncache_v071.py "$env:RUNNER_TEMP/write_missioncache_v071.py" -Force

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-v071-glslc-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-v071-current-runner-${{ runner.os }}-
            epochrunner-v071-final-launch-${{ runner.os }}-
            epochrunner-v071-runtime-launch-${{ runner.os }}-
            epochrunner-v070-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure full Windows application
        shell: pwsh
        timeout-minutes: 25
        env:
          VCPKG_MAX_CONCURRENCY: 4
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build full Windows application
        shell: pwsh
        timeout-minutes: 15
        run: cmake --build --preset windows-release --parallel 4

      - name: Run full Windows acceptance suite
        timeout-minutes: 15
        run: ctest --preset windows-release --output-on-failure -V --timeout 900

      - name: Verify executable and source-tree run.bat
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE/build/windows-release/Release/EpochRunner.exe"
          $version = (& $exe --version | Out-String).Trim()
          if ($version -ne 'EpochRunner 0.7.1') { throw "Unexpected version: $version" }
          & $exe --diagnose-vulkan
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan diagnostic failed' }
          Push-Location $env:RUNNER_TEMP
          try {
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Executable-relative build-tree launch failed' }
            cmd /d /c "`"$env:GITHUB_WORKSPACE\run.bat`" --version"
            if ($LASTEXITCODE -ne 0) { throw 'Source-tree run.bat version launch failed' }
            cmd /d /c "`"$env:GITHUB_WORKSPACE\run.bat`" --diagnose-package"
            if ($LASTEXITCODE -ne 0) { throw 'Source-tree run.bat package launch failed' }
          } finally {
            Pop-Location
          }

      - name: Complete authoritative mission cache
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python "$env:RUNNER_TEMP/write_missioncache_v071.py" validate --run-id $env:RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Mission validation failed' }
          $unfinished = Select-String -Path missioncache.md -Pattern '\*\*Status:\*\* (OPEN|PARTIAL|REGRESSION|BLOCKED)'
          if ($unfinished) {
            $unfinished | ForEach-Object { Write-Host $_.Line }
            throw 'Mission cache still contains unfinished v0.7.1 work'
          }

      - name: Package and validate extracted release
        id: package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/EpochRunner-v0.7.1-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          Copy-Item README.md, LICENSE, missioncache.md, RELEASE_NOTES_v0.7.1.md, run.bat -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          Get-ChildItem vcpkg_installed/x64-windows/bin -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force

          $required = @(
            "$stage/EpochRunner.exe",
            "$stage/run.bat",
            "$stage/shaders/flat.vert.spv",
            "$stage/shaders/flat.frag.spv",
            "$stage/assets"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing packaged item: $path" }
          }

          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& "$stage/EpochRunner.exe" --version | Out-String).Trim()
            if ($version -ne 'EpochRunner 0.7.1') { throw "Installed package version failed: $version" }
            & "$stage/EpochRunner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed executable launch failed' }
            cmd /d /c "`"$stage\run.bat`" --version"
            if ($LASTEXITCODE -ne 0) { throw 'Installed run.bat version launch failed' }
            cmd /d /c "`"$stage\run.bat`" --diagnose-package"
            if ($LASTEXITCODE -ne 0) { throw 'Installed run.bat package launch failed' }
          } finally {
            Pop-Location
          }

          $archive = 'EpochRunner-v0.7.1-windows-x64.zip'
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
          $checksum | Set-Content "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Commit exact tested source and clean temporary files
        id: source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $temporary = @(
            '.github/workflows/complete-missioncache-v071.yml',
            '.github/workflows/finish-v071.yml',
            '.github/workflows/finish-v071-fast.yml',
            '.github/workflows/finish-v071-final.yml',
            '.github/workflows/finish-v071-windows.yml',
            '.github/workflows/probe-v071.yml',
            '.github/workflows/kick-v071.yml',
            '.github/workflows/kick-v071-now.yml',
            'tools/apply_training_quality_v071.py',
            'tools/refine_training_quality_v071.py',
            'tools/fix_humanoid_observation_v071.py',
            'tools/fix_balance_diagnostic_v071.py',
            'tools/fix_stance_hysteresis_v071.py',
            'tools/fix_balance_seed_robustness_v071.py',
            'tools/fix_balance_evaluation_v071.py',
            'tools/fix_runtime_launch_v071.py',
            'tools/simplify_runtime_deployment_v071.py',
            'tools/patch_launch_release_metadata_v071.py',
            'tools/patch_split_validation_evidence_v071.py',
            'tools/finish_release_v071.py',
            'tools/write_missioncache_v071.py',
            'tools/complete_missioncache_v071.py',
            'validation/v0.7.1-run.md',
            'validation/v0.7.1-windows-runs.json',
            'validation/v0.7.1-windows-runs.md',
            'validation/v0.7.1-failure.md',
            'validation/v0.7.1-failure.log',
            'validation/v0.7.1-live-failure.log',
            'validation/v0.7.1-live.json',
            'validation/v0.7.1-live.md',
            'validation/v0.7.1-release-lock.md'
          )
          foreach ($path in $temporary) { git rm -f --ignore-unmatch $path }
          git add -A
          git commit -m 'Complete EpochRunner v0.7.1 missions and launch path'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit exact tested source' }
          git fetch origin main
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not rebase exact tested source' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish exact tested source' }
          $sourceSha = (git rev-parse HEAD).Trim()
          "sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Publish v0.7.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release view v0.7.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.7.1 $env:ARCHIVE "$env:ARCHIVE.sha256" --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset replacement failed' }
            gh release edit v0.7.1 --target $env:SOURCE_SHA --title 'EpochRunner v0.7.1' --notes-file RELEASE_NOTES_v0.7.1.md
          } else {
            gh release create v0.7.1 $env:ARCHIVE "$env:ARCHIVE.sha256" --target $env:SOURCE_SHA --title 'EpochRunner v0.7.1' --notes-file RELEASE_NOTES_v0.7.1.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

      - name: Finalize evidence and repository cleanup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          python "$env:RUNNER_TEMP/write_missioncache_v071.py" finalize --source-sha $env:SOURCE_SHA --run-id $env:RUN_ID --archive $env:ARCHIVE --checksum $env:CHECKSUM
          if ($LASTEXITCODE -ne 0) { throw 'Final ledger generation failed' }
          $unfinished = Select-String -Path missioncache.md -Pattern '\*\*Status:\*\* (OPEN|PARTIAL|REGRESSION|BLOCKED)'
          if ($unfinished) { throw 'Final mission cache contains unfinished missions' }
          git add missioncache.md validation/v0.7.1.md
          git commit -m 'Record verified EpochRunner v0.7.1 release evidence'
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Final evidence publication failed' }

          $assetNames = @(gh release view v0.7.1 --json assets --jq '.assets[].name')
          if ($assetNames -notcontains $env:ARCHIVE -or $assetNames -notcontains "$env:ARCHIVE.sha256") {
            throw "Release assets incomplete: $($assetNames -join ', ')"
          }
          $prs = (gh pr list --state open --limit 100 --json number --jq 'length').Trim()
          if ($prs -ne '0') { throw "$prs open pull requests remain" }
          $branches = @(gh api "repos/$env:GH_REPO/branches" --paginate --jq '.[].name')
          if ($branches.Count -ne 1 -or $branches[0].Trim() -ne 'main') {
            throw "Unexpected branches remain: $($branches -join ', ')"
          }
