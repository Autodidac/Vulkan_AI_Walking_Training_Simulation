name: Cache Runner v0.7.21 rig repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cache:
    if: github.head_ref == 'agent/v0721-readable-telemetry'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0721-readable-telemetry
          fetch-depth: 0
      - name: Cache rig, gait, and editor missions before source edits
        run: |
          set -euo pipefail
          python3 tools/cache_v0721_rig_repair.py
          grep -F 'WALK-AUTO-TUNING-275' missioncache.md
          grep -F 'WALK-SIDE-GAIT-276' missioncache.md
          grep -F 'WALK-RIG-LAB-279' missioncache.md
          grep -F 'WALK-RELEASE-283' missioncache.md
          git diff --check
      - name: Commit authoritative mission cache
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git commit -m 'Cache v0.7.21 rig and gait repair missions'
          git push origin HEAD:agent/v0721-readable-telemetry
