name: Record Runner v0.7.16 validation evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: record-runner-v0716-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record:
    if: github.head_ref == 'agent/v0716-camera-batch25'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0716-camera-batch25
          fetch-depth: 0

      - name: Close validated mission statuses
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')

          for mission in range(156, 180):
              pattern = re.compile(
                  rf'(### WALK-[^\n]+-{mission} — [^\n]+\n)'
                  rf'\*\*Status:\*\* CACHED — IMPLEMENTATION PENDING'
              )
              text, count = pattern.subn(
                  rf'\1**Status:** VERIFIED — LINUX, WINDOWS, PACKAGE, AND DIAGNOSTIC GATES PASSED',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'mission {mission} status marker not found')

          text, count = re.subn(
              r'(### WALK-RELEASE-180 — [^\n]+\n)'
              r'\*\*Status:\*\* CACHED — IMPLEMENTATION PENDING',
              r'\1**Status:** READY FOR MERGE — AUDITED PR PACKAGE GATE PASSED',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('release mission status marker not found')

          text = text.replace(
              '**Release state:** CACHED — 25 MISSIONS SELECTED FOR ONE AUDITED RELEASE.',
              '**Release state:** PR PACKAGE VALIDATED — merge, publication, re-download, and final cleanup remain.',
              1,
          )

          marker = '# Runner v0.7.17 equipment, carry, and target curriculum'
          evidence = '''## v0.7.16 audited PR validation evidence

- Exact validated clean source: `794bda73f8d1398d5310311172345343004e5f78`.
- Pull request: `#55`.
- Validation workflow run: `31027771680`.
- Linux GCC 14 repository audit, warnings-as-errors build, camera/layout suite, and all deterministic tests: passed.
- Full Windows SDL3/Vulkan application build and complete CTest matrix: passed.
- Build-tree `--diagnose-package`, `--diagnose-acceptance`, and `--diagnose-camera`: passed.
- Installed package, executable-relative `run.bat`, acceptance, camera diagnostic, and optional-asset fallback: passed.
- ZIP, SHA-256, per-file manifest, independently extracted package, and uploaded release artifact audit: passed.
- Temporary applicators, materializers, generated workflow copies, and the superseded v0.7.15 workflow are absent.
- Publication remains blocked only on merge, main-branch publisher completion, release re-download verification, and branch cleanup.

'''
          if '## v0.7.16 audited PR validation evidence' not in text:
              if marker not in text:
                  raise SystemExit('v0.7.17 carry-forward marker missing')
              text = text.replace(marker, evidence + marker, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit validation evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git diff --cached --check
          git commit -m "Record Runner v0.7.16 audited package validation"
          git push origin HEAD:agent/v0716-camera-batch25
