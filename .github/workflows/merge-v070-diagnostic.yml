name: Diagnose v0.7 runtime integration

on:
  push:
    branches:
      - feature/self-imitation-mission-cache
    paths:
      - .github/workflows/merge-v070-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/self-imitation-mission-cache
          fetch-depth: 0
      - name: Merge v0.7 runtime branch without committing
        shell: bash
        run: |
          git fetch origin feature/v070-runtime-pipeline
          set +e
          git merge --no-commit --no-ff origin/feature/v070-runtime-pipeline
          status=$?
          echo "MERGE_STATUS=$status"
          echo "CONFLICTS_BEGIN"
          git diff --name-only --diff-filter=U || true
          echo "CONFLICTS_END"
          git status --short
          exit $status
