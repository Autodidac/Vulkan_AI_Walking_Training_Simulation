name: Cache Runner v0.7.22 black-frame hotfix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cache:
    if: github.head_ref == 'agent/v0722-black-frame-hotfix'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0722-black-frame-hotfix
          fetch-depth: 0
      - name: Cache observed failure before product-source edits
        run: |
          set -euo pipefail
          python3 tools/cache_v0722_black_frame.py
          git diff --check
          grep -F 'WALK-BLACK-FRAME-284' missioncache.md
          grep -F 'WALK-RELEASE-289' missioncache.md
          grep -F '# Runner v0.7.23 equipment' missioncache.md
      - name: Commit mission cache
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git commit -m 'Cache Runner v0.7.22 black-frame missions'
          git push origin HEAD:agent/v0722-black-frame-hotfix
