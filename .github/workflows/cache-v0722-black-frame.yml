name: Cache Runner v0.7.22 black-frame hotfix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cache:
    if: github.head_ref == 'agent/v0722-black-frame-hotfix'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0722-black-frame-hotfix
          fetch-depth: 0
      - name: Cache observed failure before source edits
        shell: bash
        run: |
          set -euo pipefail
          echo 'Cache execution is provided by the temporary pull_request_target workflow on main.'

# trigger: source audit confirmed Color{} alpha 1 black-panel mask
