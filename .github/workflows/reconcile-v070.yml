name: Reconcile v0.7 runtime with v0.6.5

on:
  push:
    branches:
      - feature/v070-runtime-pipeline
    paths:
      - .github/workflows/reconcile-v070.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v070-runtime-pipeline
          fetch-depth: 0
      - name: Diagnose merge with current main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          echo "MERGE_STATUS=$status"
          echo "CONFLICTS_BEGIN"
          git diff --name-only --diff-filter=U || true
          echo "CONFLICTS_END"
          git status --short
          exit $status
