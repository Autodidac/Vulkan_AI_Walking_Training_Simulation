name: Publish Joint Lab v0.2.0

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-joint-lab-v0.2.0.yml"
      - "tools/apply_joint_lab_upgrade.py"
      - "tools/fix_joint_lab_patcher.py"

permissions:
  contents: write

concurrency:
  group: epochrunner-joint-lab-v0.2.0
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  build-test-package-release:
    runs-on: windows-2025

    steps:
      - name: Checkout staged upgrade
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply Joint Lab source upgrade
        shell: pwsh
        run: |
          python tools/fix_joint_lab_patcher.py
          python tools/apply_joint_lab_upgrade.py
          git diff --check

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-windows-x64-vulkan-d015e31-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-x64-vulkan-d015e31-
            vcpkg-windows-x64-d015e31-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure MSVC manifest build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build Release
        run: cmake --build --preset windows-release

      - name: Run preset and PPO core tests
        run: ctest --preset windows-release --output-on-failure

      - name: Package runtime
        shell: pwsh
        run: |
          $package = Join-Path $PWD "package/EpochRunner-windows-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          cmake --install build/windows-release --config Release --prefix $package
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $package -Force
          Copy-Item README.md, LICENSE -Destination $package -Force
          Compress-Archive -Path "$package/*" -DestinationPath "EpochRunner-windows-x64.zip" -Force

      - name: Validate packaged SDL3 Vulkan support
        shell: pwsh
        run: |
          Push-Location package/EpochRunner-windows-x64
          & .\EpochRunner.exe --diagnose-vulkan
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged Vulkan diagnostic failed with exit code $LASTEXITCODE"
          }
          Pop-Location

      - name: Publish validated source to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_joint_lab_upgrade.py tools/fix_joint_lab_patcher.py .github/workflows/publish-joint-lab-v0.2.0.yml
          git add -A
          git commit -m "Add guided rig presets and Joint Lab"
          git push origin HEAD:main

      - name: Publish v0.2.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $sourceSha = git rev-parse HEAD
          $notes = @"
          Adds a guided Joint Lab with visible limit arcs, neutral and target rays, grouped ghost-pose testing, named motor channels, degree controls, endpoint reassignment, safe default-node deletion, and chicken, biped, humanoid, quadruped, and monoped rig presets. Calmer default motor ranges and strength values replace the unstable original defaults.
          "@
          if (gh release view v0.2.0 2>$null) {
            gh release upload v0.2.0 EpochRunner-windows-x64.zip --clobber
            gh release edit v0.2.0 --target $sourceSha --title "EpochRunner v0.2.0 - Joint Lab" --notes $notes
          }
          else {
            gh release create v0.2.0 EpochRunner-windows-x64.zip --target $sourceSha --title "EpochRunner v0.2.0 - Joint Lab" --notes $notes
          }

      - name: Remove every non-main branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branches = gh api "repos/$env:GITHUB_REPOSITORY/branches?per_page=100" | ConvertFrom-Json
          foreach ($branch in $branches) {
            if ($branch.name -ne "main") {
              $encoded = [Uri]::EscapeDataString($branch.name)
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$encoded"
            }
          }
