name: Release EpochRunner v0.6.3

on:
  push:
    branches:
      - main
    paths:
      - tools/integrate_v063_sandsim.py
      - .github/workflows/v063-release.yml

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  release:
    runs-on: windows-2025

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.6.3 integration
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("tools/integrate_v063_sandsim.py")
          text = path.read_text(encoding="utf-8")
          old = '''replace_once("src/app.cpp", "0.98f, muted, usable_width, 4.0f);",
                       "1.06f, muted, usable_width, 4.0f);")
          replace_once("src/app.cpp", "0.98f, muted, usable_width, 4.0f);",
                       "1.06f, muted, usable_width, 4.0f);")'''
          new = '''replace_all("src/app.cpp", "0.98f, muted, usable_width, 4.0f);",
                      "1.06f, muted, usable_width, 4.0f);", 2)'''
          if text.count(old) != 1:
              raise RuntimeError("could not repair duplicated 0.98 UI replacements")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "v0.6.3 driver repair failed" }
          python tools/integrate_v063_sandsim.py
          if ($LASTEXITCODE -ne 0) { throw "v0.6.3 integration failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Integrated source contains whitespace errors" }

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-v063-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-v062-${{ runner.os }}-
            epochrunner-v061-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure full MSVC release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build full Vulkan application
        run: cmake --build --preset windows-release

      - name: Run deterministic and concurrency tests
        run: ctest --preset windows-release --output-on-failure -V

      - name: Verify executable identity and Vulkan path
        shell: pwsh
        run: |
          $version = (& build/windows-release/Release/EpochRunner.exe --version | Out-String).Trim()
          if ($version -ne "EpochRunner 0.6.3") { throw "Unexpected version: $version" }
          build/windows-release/Release/EpochRunner.exe --diagnose-vulkan
          if ($LASTEXITCODE -ne 0) { throw "Vulkan diagnostic failed" }

      - name: Package tested build
        id: package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/EpochRunner-v0.6.3-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          Copy-Item README.md, LICENSE, MISSIONS.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          $archive = "EpochRunner-v0.6.3-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
          $checksum | Set-Content "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Commit exact tested source
        id: source
        shell: pwsh
        run: |
          Remove-Item tools/integrate_v063_sandsim.py
          Remove-Item .github/workflows/v063-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md MISSIONS.md
          git add src/main.cpp src/app.cpp src/simulation.cpp src/simulation.hpp
          git add src/autonomy_curriculum.cpp tests/core_tests.cpp
          git add -u tools/integrate_v063_sandsim.py .github/workflows/v063-release.yml
          git commit -m "Release EpochRunner v0.6.3 sand-sim enemy locomotion hotfix"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit tested source" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Failed to push tested source" }
          $sourceSha = (git rev-parse HEAD).Trim()
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpochRunner-v0.6.3-windows-x64
          path: |
            EpochRunner-v0.6.3-windows-x64.zip
            EpochRunner-v0.6.3-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.6.3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release view v0.6.3 *> $null
          if ($LASTEXITCODE -eq 0) { throw "v0.6.3 already exists; refusing replacement" }
          gh release create v0.6.3 $env:ARCHIVE "$env:ARCHIVE.sha256" `
            --target $env:SOURCE_SHA `
            --title "EpochRunner v0.6.3" `
            --notes "Sand-sim enemy locomotion hotfix. Text is substantially larger throughout the UI. The curriculum now uses long flat patrol zones separated by sand mounds and loose terrain, with early obstacles restricted to flat pads and mixed terrain hazards reserved for advanced combat traversal. Head, tail, torso, knee, and other non-foot rolling is a hard invalid gate. Body-ground motion receives no gait credit. Obstacles remain present through contact, are culled only after passing behind the actor, are labeled as hazards, and cannot create a positive recovery-reward loop. A fresh v0.6.3 autosave namespace prevents the old rolling controller from resuming."
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }

      - name: Record release evidence
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch main" }
          git switch -C main origin/main
          if ($LASTEXITCODE -ne 0) { throw "Failed to switch to main" }
          New-Item -ItemType Directory -Force validation | Out-Null
          @"
          # EpochRunner v0.6.3 release evidence

          - Exact tested source commit: `$env:SOURCE_SHA`
          - Windows runner: `windows-2025`
          - Generator: `Visual Studio 18 2026`
          - Full SDL3/Vulkan/EpochGui application build: passed
          - Deterministic core and concurrency tests: passed
          - Long flat terrain and separated sand-mound tests: passed
          - Flat-zone obstacle curriculum test: passed
          - Obstacle-retention/pickup regression test: passed
          - Head/tail/body rolling gate tests: passed
          - Obstacle recovery-reward regression test: passed
          - Larger typography and sand-sim UI: compiled and packaged; user visual acceptance remains ACTIVE
          - Executable version and Vulkan diagnostic: passed
          - Package: `$env:ARCHIVE`
          - Package SHA-256: `$env:CHECKSUM`
          "@ | Set-Content -Encoding UTF8 validation/v0.6.3.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/v0.6.3.md
          git commit -m "Record verified EpochRunner v0.6.3 build evidence"
          if ($LASTEXITCODE -ne 0) { throw "Evidence commit failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Evidence push failed" }
