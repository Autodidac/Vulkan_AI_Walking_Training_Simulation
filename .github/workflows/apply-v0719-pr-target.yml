name: Apply Runner v0.7.19 PR source refinement

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event.pull_request.number == 69
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Apply cached v0.7.19 refinement
        run: |
          set -euo pipefail
          python3 tools/run_v0719_executor.py
          git diff --check
          grep -F "project(Runner VERSION 0.7.19 LANGUAGES CXX)" CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'1901u" src/ppo.hpp
          test -f src/locomotion_strategy.hpp
          test -f tests/v0719_general_locomotion_tests.cpp
          test -f docs/RUNNER_V0719_GENERAL_LOCOMOTION.md
          test -f tools/generate_v0719_sources.py
          test -f .github/workflows/runner-v0719-release.yml
      - name: Remove branch-local executor scaffolding
        run: |
          rm -f tools/apply_v0719_general_locomotion.py
          rm -f tools/run_v0719_executor.py
          rm -f tools/v0719.prtrigger
          rm -f .github/workflows/apply-v0719-general-locomotion.yml
      - name: Commit refined source to PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Runner v0.7.19 general locomotion'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
