name: Publish validated v0.1.1

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  build-test-release:
    runs-on: windows-2025

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-windows-x64-d015e31-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure manifest build with MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build Release
        run: cmake --build --preset windows-release

      - name: Run tests
        run: ctest --preset windows-release

      - name: Package runtime
        shell: pwsh
        run: |
          $package = Join-Path $PWD "package/EpochRunner-windows-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          cmake --install build/windows-release --config Release --prefix $package

          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $package -Force

          Copy-Item README.md, LICENSE -Destination $package -Force
          Compress-Archive -Path "$package/*" -DestinationPath "EpochRunner-windows-x64.zip" -Force

      - name: Create or replace GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $sourceSha = git rev-parse HEAD
          if (gh release view v0.1.1 2>$null) {
            gh release upload v0.1.1 EpochRunner-windows-x64.zip --clobber
          }
          else {
            gh release create v0.1.1 EpochRunner-windows-x64.zip `
              --target $sourceSha `
              --title "EpochRunner v0.1.1" `
              --notes "C++23 Vulkan walking-training simulation using EpochGui, SDL3, manifest-mode vcpkg, deterministic articulated physics, and PPO training."
          }

      - name: Remove validator from main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-release.yml
          git commit -m "Remove one-time release validator"
          git push origin HEAD:main

      - name: Delete every non-main branch
        shell: pwsh
        run: |
          $branches = git ls-remote --heads origin | ForEach-Object {
            if ($_ -match 'refs/heads/(.+)$') {
              $Matches[1]
            }
          }

          foreach ($branch in $branches) {
            if ($branch -and $branch -ne 'main') {
              Write-Host "Deleting branch: $branch"
              git push origin --delete $branch
            }
          }
