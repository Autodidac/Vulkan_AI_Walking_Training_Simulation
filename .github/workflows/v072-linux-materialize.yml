name: EpochRunner v0.7.2 Linux materialization

on:
  push:
    branches: [fix/sim-coordination-ducking-v072]
    paths: [.github/workflows/v072-linux-materialize.yml]

permissions:
  contents: write

jobs:
  materialize-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sim-coordination-ducking-v072
          fetch-depth: 0

      - name: Repair temporary patch-script literal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_v072_sim_regression.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('notes = """# EpochRunner v0.7.2\\n\\n"', 'notes = "# EpochRunner v0.7.2\\n\\n"')
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile tools/apply_v072_sim_regression.py

      - name: Apply complete v0.7.2 regression correction
        run: |
          python3 tools/apply_v072_sim_regression.py
          git diff --check

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Configure Linux C++23 core
        run: |
          cmake -S . -B build/linux-v072 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DEPOCHRUNNER_BUILD_APP=OFF \
            -DEPOCHRUNNER_BUILD_TESTS=ON 2>&1 | tee validation-v072-configure.log

      - name: Build Linux core and tests
        run: cmake --build build/linux-v072 --parallel 2 2>&1 | tee validation-v072-build.log

      - name: Run full Linux deterministic suite
        run: ctest --test-dir build/linux-v072 --output-on-failure -V --timeout 1200 2>&1 | tee validation-v072-tests.log

      - name: Commit exact Linux-tested source
        shell: bash
        run: |
          rm -f validation-v072-configure.log validation-v072-build.log validation-v072-tests.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix coordinated movement, feet, ducking, and sample integrity'
          git push origin HEAD:fix/sim-coordination-ducking-v072

      - name: Record failure evidence
        if: failure()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p validation
          {
            echo '# EpochRunner v0.7.2 Linux materialization failure'
            echo
            echo "- Workflow: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo
            for log in validation-v072-configure.log validation-v072-build.log validation-v072-tests.log; do
              if [ -f "$log" ]; then
                echo "## $log"
                echo '```text'
                tail -n 240 "$log"
                echo '```'
              fi
            done
          } > validation/v0.7.2-failure.md
          git add validation/v0.7.2-failure.md
          git commit -m 'Record v0.7.2 Linux materialization failure' || true
          git push origin HEAD:fix/sim-coordination-ducking-v072 || true
