name: Retry Runner v0.7.17 crouch correction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: retry-runner-v0717-crouch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  retry:
    if: ${{ github.head_ref == 'agent/v0717-eye-test-feet-gait-batch25' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0717-eye-test-feet-gait-batch25
          fetch-depth: 0

      - name: Repair test matcher and apply cached source correction
        run: python tools/retry_v0717_crouch_recovery.py

      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          rm tools/fix_v0717_crouch_recovery.py
          rm tools/retry_v0717_crouch_recovery.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Correct Runner v0.7.17 crouch topology and recovery'
          git push origin HEAD:agent/v0717-eye-test-feet-gait-batch25
