name: Validate v0.7 Windows application

on:
  push:
    branches:
      - work/mission-cache-completion
    paths:
      - .github/workflows/v070-windows-validation.yml

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  windows-full:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/mission-cache-completion
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-v070-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-v066-stable-gait-${{ runner.os }}-
            epochrunner-v065-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure full MSVC release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build full SDL3 Vulkan EpochGui application
        run: cmake --build --preset windows-release

      - name: Run deterministic, concurrency, runtime, persistence, arm, and UI tests
        run: ctest --preset windows-release --output-on-failure -V

      - name: Verify executable version and Vulkan path
        shell: pwsh
        run: |
          $version = (& build/windows-release/Release/EpochRunner.exe --version | Out-String).Trim()
          if ($version -ne "EpochRunner 0.7.0") { throw "Unexpected version: $version" }
          build/windows-release/Release/EpochRunner.exe --diagnose-vulkan
          if ($LASTEXITCODE -ne 0) { throw "Vulkan diagnostic failed" }

      - name: Record exact pre-merge Windows validation
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          Remove-Item .github/workflows/v070-windows-validation.yml
          New-Item -ItemType Directory -Force validation | Out-Null
          @"
          # EpochRunner v0.7.0 pre-merge Windows validation

          - Exact tested source commit: `$sourceSha`
          - Workflow run: `$env:RUN_ID`
          - Windows runner: `windows-2025`
          - Full SDL3/Vulkan/EpochGui application build: passed
          - Deterministic core tests: passed
          - Concurrency benchmark: passed
          - Worker-owned coroutine pipeline tests: passed
          - Asynchronous persistence and checkpoint-under-load tests: passed
          - Eight-motor articulated humanoid arm tests: passed
          - Deterministic UI/PIP layout contract tests: passed
          - Executable version and Vulkan diagnostic: passed
          "@ | Set-Content -Encoding UTF8 validation/v0.7.0-windows-premerge.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record v0.7.0 Windows validation"
          git push origin HEAD:work/mission-cache-completion
