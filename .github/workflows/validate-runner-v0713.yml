name: Validate Runner v0.7.13 toe rate gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: validate-runner-v0713-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-source:
    if: github.head_ref == 'agent/v0713-toe-rate-gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Materialize v0.7.13 toe-rate correction
        run: |
          set -euo pipefail
          python3 tools/prepare_v0713_toe_rate_gate.py
          python3 tools/apply_v0713_toe_rate_gate.py
          git diff --check
          test ! -f tools/prepare_v0713_toe_rate_gate.py
          test ! -f tools/apply_v0713_toe_rate_gate.py
          grep -F 'project(Runner VERSION 0.7.13 LANGUAGES CXX)' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'1300u" src/ppo.hpp
          grep -F 'rate_limited_toe_command' src/simulation.hpp
          grep -F 'limit_articulated_toe_rates' src/simulation.cpp
          grep -F 'runner-v0713-autosave.eppo' src/app.cpp
          grep -F 'WALK-TOE-RATE-127' missioncache.md

      - name: Configure Linux deterministic suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -S . -B build/linux-v0713 -G Ninja -DRUNNER_BUILD_APP=OFF -DRUNNER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build and test Linux suite
        run: |
          cmake --build build/linux-v0713 --parallel
          ctest --test-dir build/linux-v0713 --output-on-failure -V --timeout 1800

      - name: Commit exact tested source
        id: source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Gate articulated toe stabilization and push-off rate'
          git push origin HEAD:agent/v0713-toe-rate-gate
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
