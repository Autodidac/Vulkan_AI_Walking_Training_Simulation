name: Validate Runner v0.7.13 toe rate gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-runner-v0713-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-source:
    if: github.head_ref == 'agent/v0713-toe-rate-gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Verify exact source invariants
        run: |
          set -euo pipefail
          git diff --check
          test ! -f tools/apply_v0713_toe_rate_gate.py
          test ! -f tools/prepare_v0713_toe_rate_gate.py
          grep -F 'project(Runner VERSION 0.7.13 LANGUAGES CXX)' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'1300u" src/ppo.hpp
          grep -F 'rate_limited_toe_command' src/simulation.hpp
          grep -F 'limit_articulated_toe_rates' src/simulation.cpp
          grep -F 'runner-v0713-autosave.eppo' src/app.cpp
          grep -F 'WALK-TOE-RATE-127' missioncache.md

      - name: Configure Linux deterministic suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -S . -B build/linux-v0713 -G Ninja -DRUNNER_BUILD_APP=OFF -DRUNNER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build and test Linux suite
        run: |
          cmake --build build/linux-v0713 --parallel
          ctest --test-dir build/linux-v0713 --output-on-failure -V --timeout 1800

  windows-package:
    needs: linux-source
    runs-on: windows-2025
    timeout-minutes: 100
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0713-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: runner-v0713-vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Build, test, install, and audit Windows package
        shell: pwsh
        run: ./tools/validate_v0713_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Runner-v0.7.13-windows-x64
          path: |
            Runner-v0.7.13-windows-x64.zip
            Runner-v0.7.13-windows-x64.zip.sha256
            Runner-v0.7.13-windows-x64.manifest.sha256
          if-no-files-found: error
          retention-days: 14
