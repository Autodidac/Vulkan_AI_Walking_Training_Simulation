name: Publish corrected Runner v0.7.10

on:
  repository_dispatch:
    types: [publish_runner_v0710]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: publish-runner-v0710-final
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      TAG: v0.7.10
      RELEASE_TITLE: Runner v0.7.10
      ARTIFACT_ID: '8861165056'
      ARTIFACT_DIGEST: sha256:a76e72afae050dbf053976cfba9c8f76f8de7e10762f33ed104235e72728324a
      TESTED_SOURCE: 041bf4c7480b8429c95fa2c344dee11662311a6c
      VALIDATION_RUN: '30806258665'
      LINUX_JOB: '91729382610'
      WINDOWS_JOB: '91729635569'
      VERIFIED_BINARY_ZIP_SHA256: 09B4EB3523E9E7A92B30999C073FDD2987E6E317F923DBF8D33C14341EB4B3DA
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm clean corrected source
        shell: pwsh
        run: |
          if (-not (Select-String -Path CMakeLists.txt -SimpleMatch 'project(Runner VERSION 0.7.10 LANGUAGES CXX)')) {
            throw 'Runner v0.7.10 source is missing'
          }
          foreach ($path in @(
            '.github/workflows/validate-runner-v0710-live-fix.yml',
            '.github/workflows/push-runner-v0710-live-fix.yml',
            '.github/workflows/finalize-runner-v0710.yml',
            'tools/apply_v0710_press_curriculum_fix.py',
            'tools/apply_v0710_cleanup.py')) {
            if (Test-Path $path) { throw "Temporary source remains on main: $path" }
          }
          if (-not (Select-String -Path src/simulation.cpp -SimpleMatch 'press_anchor_x')) { throw 'Press anchor fix missing' }
          if (-not (Select-String -Path src/autonomy.hpp -SimpleMatch 'balance_mastery_lock_confirmations = 3')) { throw 'Stand progression fix missing' }
          if (-not (Select-String -Path src/app.cpp -SimpleMatch 'ORIGINAL RUNNER ART')) { throw 'Original artwork integration missing' }
          if (-not (Select-String -Path src/app.cpp -SimpleMatch 'runner-v0710-autosave.eppo')) { throw 'v0.7.10 autosave isolation missing' }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout is dirty' }

      - name: Download and audit validated artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $outer = "$env:RUNNER_TEMP/Runner-v0.7.10-validated-artifact.zip"
          $artifact = "$env:RUNNER_TEMP/runner-v0710-artifact"
          Remove-Item $outer -Force -ErrorAction SilentlyContinue
          Remove-Item $artifact -Recurse -Force -ErrorAction SilentlyContinue
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip" -Headers $headers -OutFile $outer
          Expand-Archive $outer -DestinationPath $artifact -Force
          foreach ($required in @(
            'Runner-v0.7.10-windows-x64.zip',
            'Runner-v0.7.10-windows-x64.zip.sha256',
            'Runner-v0.7.10-windows-x64.manifest.sha256')) {
            if (-not (Test-Path "$artifact/$required")) { throw "Artifact file missing: $required" }
          }
          $binaryZip = "$artifact/Runner-v0.7.10-windows-x64.zip"
          $binaryHash = (Get-FileHash $binaryZip -Algorithm SHA256).Hash
          if ($binaryHash -ne $env:VERIFIED_BINARY_ZIP_SHA256) {
            throw "Validated binary ZIP changed: $binaryHash"
          }
          $recorded = (Get-Content "$artifact/Runner-v0.7.10-windows-x64.zip.sha256").Split()[0].ToUpperInvariant()
          if ($recorded -ne $binaryHash) { throw 'Validated artifact checksum file mismatch' }
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.10-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $binaryZip -DestinationPath $stage -Force
          $expected = Get-Content "$artifact/Runner-v0.7.10-windows-x64.manifest.sha256"
          $actual = Get-ChildItem $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          }
          if (Compare-Object $expected $actual) { throw 'Validated artifact manifest mismatch' }
          foreach ($required in @('Runner.exe','run.bat','assets/chicken.ppm','shaders/flat.vert.spv','shaders/flat.frag.spv')) {
            if (-not (Test-Path "$stage/$required")) { throw "Validated package file missing: $required" }
          }
          Push-Location $env:RUNNER_TEMP
          try {
            if ((& "$stage/Runner.exe" --version | Out-String).Trim() -ne 'Runner 0.7.10') { throw 'Validated executable version mismatch' }
            & "$stage/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Validated package diagnostic failed' }
            & "$stage/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Validated acceptance diagnostic failed' }
          }
          finally { Pop-Location }
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Freeze clean package source and mission state
        shell: pwsh
        run: |
          git pull --rebase origin main
          @'
          import re
          from pathlib import Path

          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'^\*\*Release state:\*\*.*$',
              '**Release state:** PACKAGE VERIFIED — corrected Runner v0.7.10 passed press/progression/art regressions, Linux, full Windows Vulkan, installed/extracted diagnostics, and archive audit; publication pending.',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          for mission in range(104, 114):
              pattern = rf'(### WALK-[^\n]*-{mission:03d}[^\n]*\n)\*\*Status:\*\*[^\n]*'
              text, count = re.subn(pattern, rf'\1**Status:** PACKAGE VERIFIED', text, count=1)
              if count != 1:
                  raise SystemExit(f'missing v0.7.10 mission {mission}')
          marker = '## v0.7.10 package validation evidence'
          if marker in text:
              text = text[:text.index(marker)].rstrip() + '\n'
          evidence = f'''

          ## v0.7.10 package validation evidence

          - Exact tested implementation source: `041bf4c7480b8429c95fa2c344dee11662311a6c`
          - Validation workflow run: `30806258665`
          - Linux deterministic job: `91729382610` — passed
          - Windows application/package job: `91729635569` — passed
          - Validated artifact ID: `8861165056`
          - Validated artifact digest: `sha256:a76e72afae050dbf053976cfba9c8f76f8de7e10762f33ed104235e72728324a`
          - Validated binary ZIP SHA-256: `09B4EB3523E9E7A92B30999C073FDD2987E6E317F923DBF8D33C14341EB4B3DA`
          - Duck-press anchor and velocity-preservation regressions: passed
          - Stand mastery/progression regressions: passed
          - Original packaged artwork load/render path: built and package-verified
          - v0.7.10 autosave isolation: verified
          - GCC 14 warnings-as-errors and all Linux suites: passed
          - Full MSVC/SDL3/Vulkan build and all Windows suites: passed
          - Build-tree, installed, and independently extracted diagnostics and acceptance: passed
          - ZIP checksum and per-file manifest audit: passed
          '''
          lines = [line.strip() for line in evidence.strip().splitlines()]
          text = text.rstrip() + '\n\n' + '\n'.join(lines) + '\n'
          path.write_text(text, encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Package mission update failed' }
          git rm .github/workflows/publish-runner-v0710-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git commit -m 'Freeze corrected Runner v0.7.10 package source'
          git pull --rebase origin main
          git push origin HEAD:main
          $releaseSha = (git rev-parse HEAD).Trim()
          "RELEASE_SHA=$releaseSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build final documented release archive
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md -Destination $env:STAGE -Force
          $archive = "$env:GITHUB_WORKSPACE/Runner-v0.7.10-windows-x64.zip"
          $checksum = "$archive.sha256"
          $manifest = "$env:GITHUB_WORKSPACE/Runner-v0.7.10-windows-x64.manifest.sha256"
          Remove-Item $archive,$checksum,$manifest -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$env:STAGE/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Set-Content $checksum
          Get-ChildItem $env:STAGE -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($env:STAGE.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          } | Set-Content $manifest
          $audit = "$env:RUNNER_TEMP/runner-v0710-final-extracted"
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          $expected = Get-Content $manifest
          $actual = Get-ChildItem $audit -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($audit.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          }
          if (Compare-Object $expected $actual) { throw 'Final archive manifest audit failed' }
          foreach ($required in @('Runner.exe','run.bat','README.md','CHANGELOG.md','missioncache.md','assets/chicken.ppm')) {
            if (-not (Test-Path "$audit/$required")) { throw "Final archive file missing: $required" }
          }
          Push-Location $env:RUNNER_TEMP
          try {
            if ((& "$audit/Runner.exe" --version | Out-String).Trim() -ne 'Runner 0.7.10') { throw 'Final archive version mismatch' }
            & "$audit/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Final archive package diagnostic failed' }
            & "$audit/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Final archive acceptance diagnostic failed' }
            if ((& cmd.exe /d /c "call `"$audit\run.bat`" --version" | Out-String).Trim() -ne 'Runner 0.7.10') { throw 'Final run.bat version mismatch' }
          }
          finally { Pop-Location }
          $finalSha = (Get-FileHash $archive -Algorithm SHA256).Hash
          "FINAL_ZIP_SHA256=$finalSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish and re-audit GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "$env:RUNNER_TEMP/Runner-v0.7.10-release-notes.md"
          @"
          # Runner v0.7.10

          Corrects the screenshot-confirmed duck-press and curriculum regressions and restores the original Runner artwork to the live application.

          - Duck press remains fixed over the authored station and no longer injects backward sliding energy.
          - Stand mastery uses the visible qualification limits and advances after three consecutive all-six-seed confirmations.
          - Later curriculum stages retain eight-confirmation strict mastery.
          - The original packaged `assets/chicken.ppm` artwork is loaded and rendered in the live top bar.
          - v0.7.10 uses isolated `runner-v0710-*` autosaves so stale v0.7.8 state cannot resume.
          - Consolidated `CHANGELOG.md` and the single authoritative `missioncache.md` are included.

          Validation: Linux GCC 14 warnings-as-errors, full Windows SDL3/Vulkan build, all deterministic suites, build-tree/installed/extracted diagnostics, acceptance matrix, ZIP checksum, and per-file manifest audit passed.
          "@ | Set-Content $notes
          if (gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release delete $env:TAG --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
          }
          gh release create $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --title $env:RELEASE_TITLE `
            --target $env:RELEASE_SHA `
            --notes-file $notes `
            Runner-v0.7.10-windows-x64.zip `
            Runner-v0.7.10-windows-x64.zip.sha256 `
            Runner-v0.7.10-windows-x64.manifest.sha256
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          $download = "$env:RUNNER_TEMP/runner-v0710-release-audit"
          Remove-Item $download -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $download | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          foreach ($file in @(
            'Runner-v0.7.10-windows-x64.zip',
            'Runner-v0.7.10-windows-x64.zip.sha256',
            'Runner-v0.7.10-windows-x64.manifest.sha256')) {
            $localHash = (Get-FileHash $file -Algorithm SHA256).Hash
            $remoteHash = (Get-FileHash "$download/$file" -Algorithm SHA256).Hash
            if ($localHash -ne $remoteHash) { throw "Published asset mismatch: $file" }
          }
          $expectedZip = (Get-Content "$download/Runner-v0.7.10-windows-x64.zip.sha256").Split()[0].ToUpperInvariant()
          $actualZip = (Get-FileHash "$download/Runner-v0.7.10-windows-x64.zip" -Algorithm SHA256).Hash
          if ($expectedZip -ne $actualZip -or $actualZip -ne $env:FINAL_ZIP_SHA256) { throw 'Published ZIP checksum mismatch' }
          $releaseExtract = "$env:RUNNER_TEMP/runner-v0710-release-extracted"
          Remove-Item $releaseExtract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "$download/Runner-v0.7.10-windows-x64.zip" -DestinationPath $releaseExtract -Force
          $expected = Get-Content "$download/Runner-v0.7.10-windows-x64.manifest.sha256"
          $actual = Get-ChildItem $releaseExtract -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($releaseExtract.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          }
          if (Compare-Object $expected $actual) { throw 'Published manifest audit failed' }
          & "$releaseExtract/Runner.exe" --diagnose-package
          if ($LASTEXITCODE -ne 0) { throw 'Released package diagnostic failed' }
          & "$releaseExtract/Runner.exe" --diagnose-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Released acceptance diagnostic failed' }
          $tagSha = (git ls-remote origin "refs/tags/$env:TAG").Split()[0]
          if ($tagSha -ne $env:RELEASE_SHA) { throw "Tag target mismatch: expected $env:RELEASE_SHA, got $tagSha" }

      - name: Clean repository branches and pull requests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $openPrs = gh pr list --repo $env:GITHUB_REPOSITORY --state open --limit 100 --json number --jq '.[].number'
          foreach ($number in $openPrs) {
            gh pr close $number --repo $env:GITHUB_REPOSITORY --comment 'Closed after the corrected Runner v0.7.10 release was validated, merged, and published.'
            if ($LASTEXITCODE -ne 0) { throw "Could not close PR $number" }
          }
          $branches = gh api --paginate "repos/$env:GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'
          foreach ($branch in $branches) {
            if ($branch -eq 'main') { continue }
            gh api --silent -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$branch"
            if ($LASTEXITCODE -ne 0) { throw "Could not delete branch $branch" }
          }
          $remainingPrs = gh pr list --repo $env:GITHUB_REPOSITORY --state open --limit 100 --json number --jq length
          if ($remainingPrs -ne '0') { throw "Open pull requests remain: $remainingPrs" }
          $remainingBranches = gh api --paginate "repos/$env:GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | Sort-Object
          if (($remainingBranches -join ',') -ne 'main') { throw "Unexpected branches remain: $remainingBranches" }

      - name: Record immutable release evidence
        shell: pwsh
        run: |
          git pull --rebase origin main
          @'
          import os
          import re
          from pathlib import Path

          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'^\*\*Release state:\*\*.*$',
              '**Release state:** PUBLISHED — corrected Runner v0.7.10 package, original artwork, release assets, checksum, manifest, released executable, branch cleanup, and PR audit verified.',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          for mission in range(104, 114):
              pattern = rf'(### WALK-[^\n]*-{mission:03d}[^\n]*\n)\*\*Status:\*\*[^\n]*'
              text, count = re.subn(pattern, rf'\1**Status:** PUBLISHED — RELEASE VERIFIED', text, count=1)
              if count != 1:
                  raise SystemExit(f'missing v0.7.10 mission {mission}')
          marker = '## v0.7.10 immutable release evidence'
          if marker in text:
              text = text[:text.index(marker)].rstrip() + '\n'
          evidence = f'''

          ## v0.7.10 immutable release evidence

          - Exact tested implementation source: `041bf4c7480b8429c95fa2c344dee11662311a6c`
          - Exact tagged package/document source: `{os.environ['RELEASE_SHA']}`
          - Validation workflow run: `30806258665`
          - Linux deterministic job: `91729382610` — passed
          - Windows application/package job: `91729635569` — passed
          - Validated artifact ID: `8861165056`
          - Validated artifact digest: `sha256:a76e72afae050dbf053976cfba9c8f76f8de7e10762f33ed104235e72728324a`
          - Published tag and title: `v0.7.10` / `Runner v0.7.10`
          - Published Windows ZIP SHA-256: `{os.environ['FINAL_ZIP_SHA256']}`
          - Published assets: Windows ZIP, ZIP SHA-256, and per-file manifest
          - Duck press fixed-anchor and no-injected-drag tests: passed
          - Stand all-six-seed progression and visible joint-speed gate tests: passed
          - Original `assets/chicken.ppm` artwork is packaged, startup-loaded, and live-rendered
          - Stale v0.7.8 autosaves cannot resume; v0.7.10 uses `runner-v0710-*`
          - Linux GCC 14 warnings-as-errors and all deterministic suites: passed
          - Full Windows SDL3/Vulkan build and all tests: passed
          - Build-tree, installed, validated-artifact, final-extracted, and re-downloaded release diagnostics and acceptance: passed
          - Published assets were byte-compared; ZIP checksum and extracted per-file manifest: passed
          - Temporary publisher removed before tagging; open pull requests: `0`; remaining branches: `main`
          - Contradictory released-package evidence reopens only the exact affected mission
          '''
          lines = [line.strip() for line in evidence.strip().splitlines()]
          text = text.rstrip() + '\n\n' + '\n'.join(lines) + '\n'
          path.write_text(text, encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Final mission evidence update failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git commit -m 'Publish corrected Runner v0.7.10 and record release evidence'
          git push origin HEAD:main
