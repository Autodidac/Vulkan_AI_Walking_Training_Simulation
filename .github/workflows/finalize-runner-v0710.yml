name: Finalize Runner v0.7.10

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-runner-v0710.yml

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: finalize-runner-v0710
  cancel-in-progress: false

jobs:
  linux-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove one-shot release workflow
        shell: bash
        run: rm -f .github/workflows/finalize-runner-v0710.yml

      - name: Verify consolidated source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -f tools/apply_v0710_cleanup.py
          test ! -f .github/workflows/validate-runner-v0710.yml
          test ! -f .github/workflows/finalize-runner-v0710.yml
          test -f CHANGELOG.md
          test -f missioncache.md
          test -f tools/repository_audit.cmake
          test "$(find . -type f -name 'RELEASE_NOTES*.md' -print | wc -l)" -eq 0
          test "$(find . -type f -iname '*mission*.md' ! -name missioncache.md -print | wc -l)" -eq 0
          grep -F 'project(Runner VERSION 0.7.10 LANGUAGES CXX)' CMakeLists.txt
          grep -F 'Runner.RepositoryHygiene' CMakeLists.txt
          grep -F 'WALK-RELEASE-108' missioncache.md

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Build and test Linux source
        env:
          CC: gcc-14
          CXX: g++-14
        shell: bash
        run: |
          cmake -S . -B build/linux-v0710-release -G Ninja \
            -DRUNNER_BUILD_APP=OFF \
            -DRUNNER_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux-v0710-release --parallel
          ctest --test-dir build/linux-v0710-release --output-on-failure -V --timeout 1200

      - name: Commit exact release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove Runner v0.7.10 one-shot release workflow'
          git push origin HEAD:main

  windows-package:
    needs: linux-source
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
      TAG: v0.7.10
      RELEASE_TITLE: Runner v0.7.10
      WORK_BRANCH: agent/v0710-consolidated-changelog-cleanup
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm clean release source
        shell: pwsh
        run: |
          foreach ($path in @(
            'tools/apply_v0710_cleanup.py',
            '.github/workflows/validate-runner-v0710.yml',
            '.github/workflows/finalize-runner-v0710.yml')) {
            if (Test-Path $path) { throw "Temporary release tool remains: $path" }
          }
          if (-not (Test-Path CHANGELOG.md)) { throw 'CHANGELOG.md is missing' }
          if (Get-ChildItem -Recurse -File -Filter 'RELEASE_NOTES*.md') { throw 'Per-release notes remain' }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Windows source tree is dirty' }

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: runner-v0710-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            runner-v079-${{ runner.os }}-
            runner-v078-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build full Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Run complete Windows tests
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1200
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

      - name: Verify build-tree diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.10') { throw "Unexpected version: $version" }
            & $exe --diagnose-vulkan
            if ($LASTEXITCODE -ne 0) { throw 'Vulkan diagnostic failed' }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Acceptance diagnostic failed' }
          }
          finally { Pop-Location }

      - name: Record package-verified mission state
        shell: pwsh
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'^\*\*Release state:\*\*.*$',
              '**Release state:** PACKAGE VERIFIED — Runner v0.7.10 passed consolidated source, Linux, Windows, package, and executable acceptance; publication audit pending.',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          for mission in range(104, 109):
              pattern = rf'(### WALK-[^\n]*-{mission:03d}[^\n]*\n)\*\*Status:\*\*[^\n]*'
              text, count = re.subn(pattern, rf'\1**Status:** PACKAGE VERIFIED', text, count=1)
              if count != 1:
                  raise SystemExit(f'missing mission {mission}')
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git commit -m 'Record Runner v0.7.10 package validation'
          git push origin HEAD:main
          "RELEASE_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install release candidate
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.10-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe','run.bat','README.md','CHANGELOG.md','missioncache.md',
            'shaders/flat.vert.spv','shaders/flat.frag.spv','assets/chicken.ppm')) {
            if (-not (Test-Path "$stage/$required")) { throw "Missing package file: $required" }
          }

      - name: Verify installed executable and launcher
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.10-windows-x64"
          $outside = "$env:RUNNER_TEMP/runner-v0710-installed-unrelated"
          New-Item -ItemType Directory -Force $outside | Out-Null
          Push-Location $outside
          try {
            $version = (& "$stage/Runner.exe" --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.10') { throw "Installed version mismatch: $version" }
            & "$stage/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed package diagnostic failed' }
            & "$stage/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Installed acceptance diagnostic failed' }
            $batchVersion = (& cmd.exe /d /c "call `"$stage\run.bat`" --version" | Out-String).Trim()
            if ($batchVersion -ne 'Runner 0.7.10') { throw "run.bat version mismatch: $batchVersion" }
          }
          finally { Pop-Location }

      - name: Create and independently audit archive
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.10-windows-x64"
          $archive = "$env:GITHUB_WORKSPACE/Runner-v0.7.10-windows-x64.zip"
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Set-Content "$archive.sha256"
          Get-ChildItem $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $relative"
          } | Set-Content 'Runner-v0.7.10-windows-x64.manifest.sha256'

          $audit = "$env:RUNNER_TEMP/runner-v0710-extracted"
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          $expected = Get-Content 'Runner-v0.7.10-windows-x64.manifest.sha256'
          $actual = Get-ChildItem $audit -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($audit.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $relative"
          }
          if (Compare-Object $expected $actual) { throw 'Archive manifest audit failed' }
          Push-Location $env:RUNNER_TEMP
          try {
            & "$audit/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package diagnostic failed' }
            & "$audit/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Extracted acceptance diagnostic failed' }
          }
          finally { Pop-Location }

      - id: package
        uses: actions/upload-artifact@v4
        with:
          name: Runner-v0.7.10-windows-x64
          path: |
            Runner-v0.7.10-windows-x64.zip
            Runner-v0.7.10-windows-x64.zip.sha256
            Runner-v0.7.10-windows-x64.manifest.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build release notes from changelog
        shell: pwsh
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(r'^## \[0\.7\.10\].*?\n(.*?)(?=^## \[|\Z)', text, flags=re.MULTILINE | re.DOTALL)
          if not match:
              raise SystemExit('v0.7.10 changelog section not found')
          Path('release-body-v0.7.10.md').write_text(match.group(1).strip() + '\n', encoding='utf-8')
          PY

      - name: Publish and re-audit GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release delete $env:TAG --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
          }
          gh release create $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --title $env:RELEASE_TITLE `
            --target $env:RELEASE_SHA `
            --notes-file release-body-v0.7.10.md `
            Runner-v0.7.10-windows-x64.zip `
            Runner-v0.7.10-windows-x64.zip.sha256 `
            Runner-v0.7.10-windows-x64.manifest.sha256
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }

          $download = "$env:RUNNER_TEMP/runner-v0710-release-audit"
          Remove-Item $download -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $download | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          foreach ($file in @(
            'Runner-v0.7.10-windows-x64.zip',
            'Runner-v0.7.10-windows-x64.zip.sha256',
            'Runner-v0.7.10-windows-x64.manifest.sha256')) {
            $localHash = (Get-FileHash $file -Algorithm SHA256).Hash
            $remoteHash = (Get-FileHash "$download/$file" -Algorithm SHA256).Hash
            if ($localHash -ne $remoteHash) { throw "Published asset mismatch: $file" }
          }
          $expectedZip = (Get-Content "$download/Runner-v0.7.10-windows-x64.zip.sha256").Split()[0]
          $actualZip = (Get-FileHash "$download/Runner-v0.7.10-windows-x64.zip" -Algorithm SHA256).Hash
          if ($expectedZip -ne $actualZip) { throw 'Published ZIP checksum mismatch' }

          $releaseExtract = "$env:RUNNER_TEMP/runner-v0710-release-extracted"
          Remove-Item $releaseExtract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "$download/Runner-v0.7.10-windows-x64.zip" -DestinationPath $releaseExtract -Force
          $expected = Get-Content "$download/Runner-v0.7.10-windows-x64.manifest.sha256"
          $actual = Get-ChildItem $releaseExtract -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($releaseExtract.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $relative"
          }
          if (Compare-Object $expected $actual) { throw 'Published manifest audit failed' }
          & "$releaseExtract/Runner.exe" --diagnose-package
          if ($LASTEXITCODE -ne 0) { throw 'Released package diagnostic failed' }
          & "$releaseExtract/Runner.exe" --diagnose-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Released acceptance diagnostic failed' }

          $tagSha = (git ls-remote origin "refs/tags/$env:TAG").Split()[0]
          if ($tagSha -ne $env:RELEASE_SHA) { throw "Tag target mismatch: $tagSha" }

      - name: Clean work branch and verify repository state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --silent -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$env:WORK_BRANCH" 2>$null
          $openPrs = gh pr list --repo $env:GITHUB_REPOSITORY --state open --limit 100 --json number --jq length
          if ($openPrs -ne '0') { throw "Open pull requests remain: $openPrs" }
          $branches = gh api --paginate "repos/$env:GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | Sort-Object
          if (($branches -join ',') -ne 'main') { throw "Unexpected branches remain: $branches" }

      - name: Record final release evidence
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.package.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.package.outputs.artifact-digest }}
        run: |
          git pull --rebase origin main
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'^\*\*Release state:\*\*.*$',
              '**Release state:** PUBLISHED — Runner v0.7.10 changelog, mission cache, source cleanup, acceptance hardening, package, release assets, branch cleanup, and PR audit verified.',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          for mission in range(104, 109):
              pattern = rf'(### WALK-[^\n]*-{mission:03d}[^\n]*\n)\*\*Status:\*\*[^\n]*'
              text, count = re.subn(pattern, rf'\1**Status:** PUBLISHED — RELEASE VERIFIED', text, count=1)
              if count != 1:
                  raise SystemExit(f'missing mission {mission}')

          evidence = f'''\n## v0.7.10 immutable release evidence\n\n- Exact tagged package source: `{os.environ['RELEASE_SHA']}`\n- Validation and publication workflow run: `{os.environ['GITHUB_RUN_ID']}`\n- Artifact ID: `{os.environ['ARTIFACT_ID']}`\n- Artifact digest: `{os.environ['ARTIFACT_DIGEST']}`\n- Release tag and title: `v0.7.10` / `Runner v0.7.10`\n- Published assets: Windows ZIP, ZIP SHA-256, and per-file manifest\n- Single release-history document: `CHANGELOG.md`\n- Single mission ledger: `missioncache.md`\n- Linux GCC 14 warnings-as-errors build and all deterministic suites: passed\n- Full Windows Vulkan build and all tests: passed\n- Build-tree, installed, independently extracted, and released diagnostics: passed\n- Published assets were byte-compared; ZIP checksum and extracted per-file manifest: passed\n- Work branch removed; open pull requests: `0`; remaining branches: `main`\n- Contradictory released-package evidence reopens only the exact affected mission\n'''
          marker = '## v0.7.10 immutable release evidence'
          if marker in text:
              text = text[:text.index(marker)].rstrip()
          text = text.rstrip() + '\n' + evidence
          path.write_text(text, encoding='utf-8')
          PY
          Remove-Item release-body-v0.7.10.md -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git add -u
          git commit -m 'Publish Runner v0.7.10 and record release evidence'
          git push origin HEAD:main
