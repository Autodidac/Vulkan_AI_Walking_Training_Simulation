name: Clean all Runner v0.7.25 automation

on:
  workflow_run:
    workflows: ["Runner v0.7.25 validation and release"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: runner-v0725-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Remove every temporary v0.7.25 workflow and branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/apply-v0725-pr-target.yml
          rm -f .github/workflows/finalize-v0725-pr-target.yml
          rm -f .github/workflows/finalize-v0725-pr-target-v2.yml
          rm -f .github/workflows/finalize-v0725-authoritative.yml
          rm -f .github/workflows/merge-v0725-after-finalizer.yml
          rm -f .github/workflows/merge-v0725-after-finalizer-v2.yml
          rm -f .github/workflows/cleanup-v0725-after-release.yml
          rm -f .github/workflows/cleanup-v0725-authoritative-after-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Clean all Runner v0.7.25 automation [skip ci]'
            for attempt in 1 2 3 4; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                break
              fi
              test "$attempt" -lt 4
              git rebase --abort 2>/dev/null || true
              sleep 4
            done
          fi
          gh pr close 80 --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/agent%2Fv0725-art-leg-hotfix" \
            2>/dev/null || true
