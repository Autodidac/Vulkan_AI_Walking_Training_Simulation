name: Finalize Runner v0.7.25 PR

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: runner-v0725-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.number == 80
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - id: gate
        shell: bash
        run: |
          if [ -f tools/apply_v0725_art_leg_hotfix.py ] \
            && [ -f tools/apply_v0725_font_sync.py ] \
            && [ -f tools/finalize_v0725.py ] \
            && [ -f tools/finalize_v0725_audit.py ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi

      - id: execute
        if: steps.gate.outputs.apply == 'true'
        continue-on-error: true
        env:
          CC: gcc-14
          CXX: g++-14
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python3 - <<'PY'
          from pathlib import Path

          art = Path('tools/apply_v0725_art_leg_hotfix.py')
          text = art.read_text(encoding='utf-8')
          structural_old = """'''        if (elapsed_seconds_ >= 0.75f
                      && (!std::isfinite(structural_error) || structural_error > 0.040f))
                      invalidate(InvalidMotion::structural_compression);
          '''"""
          structural_new = """'''        if (elapsed_seconds_ >= 0.75f
                      && stage_requires_forward_gait(course_stage_)
                      && blueprint_.paired_leg_chains()
                      && !blueprint_.horizontal_multi_support_plan()
                      && (!std::isfinite(structural_error) || structural_error > 0.040f))
                      invalidate(InvalidMotion::structural_compression);
          '''"""
          if structural_old in text:
              text = text.replace(structural_old, structural_new, 1)

          stale_old = '        "        tools/v0724-rescue-trigger.txt)\\n",'
          stale_new = (
              '        "        tools/v0724-rescue-trigger.txt\\n"\n'
              '        "        .github/workflows/fix-v0724-scoped-rigidity.yml)\\n",')
          if stale_old in text:
              text = text.replace(stale_old, stale_new, 1)

          stale_result_old = '        "        tools/apply_v0725_art_leg_hotfix.py)\\n",'
          stale_result_new = (
              '        "        tools/apply_v0725_art_leg_hotfix.py\\n"\n'
              '        "        .github/workflows/fix-v0724-scoped-rigidity.yml)\\n",')
          if stale_result_old in text:
              text = text.replace(stale_result_old, stale_result_new, 1)
          art.write_text(text, encoding='utf-8', newline='\n')

          font = Path('tools/apply_v0725_font_sync.py')
          text = font.read_text(encoding='utf-8')
          text = text.replace(
              'if "ui_font_scale" in text:',
              'if "constexpr float ui_font_scale" in text:')
          # The dedicated final audit is marker-based and replaces the brittle
          # exact stale-list patch in the original temporary migration.
          text = text.replace(
              '    patch_repository_audit()\n    print("Runner v0.7.25 EpochGui font and progress synchronization applied")',
              '    print("Runner v0.7.25 EpochGui font and progress synchronization applied")')
          font.write_text(text, encoding='utf-8', newline='\n')
          PY

            python3 -m py_compile \
              tools/apply_v0725_art_leg_hotfix.py \
              tools/apply_v0725_font_sync.py \
              tools/finalize_v0725.py \
              tools/finalize_v0725_audit.py
            python3 tools/apply_v0725_art_leg_hotfix.py
            python3 tools/apply_v0725_font_sync.py
            python3 tools/finalize_v0725.py
            python3 tools/finalize_v0725_audit.py

            rm -f \
              tools/apply_v0725_art_leg_hotfix.py \
              tools/apply_v0725_font_sync.py \
              tools/finalize_v0725.py \
              tools/finalize_v0725_audit.py \
              tools/v0725-prtrigger.txt
            rm -rf tools/__pycache__

            git diff --check
            grep -F 'project(Runner VERSION 0.7.25 LANGUAGES CXX)' CMakeLists.txt
            grep -F "training_semantics_version = 0x0007'2501u" src/ppo.hpp
            grep -F 'COMPACT SEGMENTED BODY ARMOR' src/app.cpp
            grep -F 'shared_pelvis_passes' src/simulation.cpp
            grep -F 'font::make_bitmap_font_metrics' src/app.cpp
            grep -F 'TRAINING SAMPLES READY' src/app.cpp
            grep -F "case '%'" src/ui_font.hpp
            grep -F '130f33fe31d73564a35a622f3bb5ddcc2b5105d5' src/ui_font.hpp
            ! grep -Fq 'constexpr float ui_font_scale' src/app.cpp
            ! grep -Fq 'draw_pixel_art(canvas, optional_torso_art' src/app.cpp
            ! grep -Fq 'runner::sim::length' tests/v0725_art_leg_hotfix_tests.cpp

            sudo apt-get update
            sudo apt-get install -y g++-14 ninja-build python3
            cmake -S . -B build/v0725-final -G Ninja \
              -DRUNNER_BUILD_APP=OFF \
              -DRUNNER_BUILD_TESTS=ON \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build/v0725-final --parallel
            ctest --test-dir build/v0725-final --output-on-failure -V \
              -R '^Runner\.V0725ArtLegHotfix$' --timeout 1800
            ctest --test-dir build/v0725-final --output-on-failure -V --timeout 1800
          } 2>&1 | tee /tmp/v0725-final.log

      - name: Commit validated canonical source
        if: steps.gate.outputs.apply == 'true' && steps.execute.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Runner v0.7.25 art, stance, font, and readable progress'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Report finalizer result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "v0.7.25 isolated finalizer: ${{ steps.execute.outcome }}"
            echo "workflow run: $GITHUB_RUN_ID"
            echo "EpochGui/Egui repositories were read-only; no shared branch was modified."
            if [ -f /tmp/v0725-final.log ]; then
              echo
              echo '```text'
              grep -E 'FAILED:|tests passed|tests failed|The following tests FAILED|100% tests passed|Runner v0.7.25' \
                /tmp/v0725-final.log | tail -n 100 || true
              echo '```'
            fi
          } > /tmp/v0725-final-report.md
          gh pr comment 80 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v0725-final-report.md
          test '${{ steps.gate.outputs.apply }}' != 'true' \
            || test '${{ steps.execute.outcome }}' = 'success'
