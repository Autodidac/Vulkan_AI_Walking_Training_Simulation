name: EpochRunner v0.5 core diagnostic

on:
  push:
    paths:
      - ".github/workflows/v050-core-diagnostic.yml"
      - "CMakeLists.txt"
      - "src/**"
      - "tests/**"
      - "vcpkg.json"

permissions:
  contents: write

jobs:
  core-diagnostic:
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure core-only MSVC build
        id: configure
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cmake -S . -B build/core-diagnostic -G "Visual Studio 18 2026" -A x64 `
            -DEPOCHRUNNER_BUILD_APP=OFF -DEPOCHRUNNER_BUILD_TESTS=ON 2>&1 |
            Tee-Object -FilePath configure.log
          exit $LASTEXITCODE

      - name: Build core tests
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cmake --build build/core-diagnostic --config Release 2>&1 |
            Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Run core and throughput tests
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          ctest --test-dir build/core-diagnostic -C Release -V 2>&1 |
            Tee-Object -FilePath test.log
          exit $LASTEXITCODE

      - name: Commit diagnostic result
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation | Out-Null
          $configure = if (Test-Path configure.log) { Get-Content configure.log -Raw } else { "not run" }
          $build = if (Test-Path build.log) { Get-Content build.log -Raw } else { "not run" }
          $test = if (Test-Path test.log) { Get-Content test.log -Raw } else { "not run" }
          $result = @"
          # EpochRunner v0.5 core diagnostic

          Source: $env:GITHUB_SHA

          Configure: ${{ steps.configure.outcome }}
          Build: ${{ steps.build.outcome }}
          Test: ${{ steps.test.outcome }}

          ## Configure log
          ```text
          $configure
          ```

          ## Build log
          ```text
          $build
          ```

          ## Test log
          ```text
          $test
          ```
          "@
          Set-Content validation/v050-core-diagnostic.md $result -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/v050-core-diagnostic.md
          git commit -m "Record v0.5 core diagnostic" || exit 0
          git push origin HEAD:main

      - name: Fail unsuccessful diagnostic
        if: steps.configure.outcome != 'success' || steps.build.outcome != 'success' || steps.test.outcome != 'success'
        shell: pwsh
        run: exit 1
