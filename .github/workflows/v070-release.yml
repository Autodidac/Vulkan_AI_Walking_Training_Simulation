name: Release EpochRunner v0.7.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v070-release.yml

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  linux-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure Linux C++23 release
        run: >-
          cmake -S . -B build/linux-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEPOCHRUNNER_BUILD_APP=OFF
          -DEPOCHRUNNER_BUILD_TESTS=ON

      - name: Build and run Linux tests
        run: |
          cmake --build build/linux-release --parallel 2
          ctest --test-dir build/linux-release --output-on-failure -V

      - name: Run Linux ThreadSanitizer runtime regression
        run: |
          cmake -S . -B build/linux-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DEPOCHRUNNER_BUILD_APP=OFF \
            -DEPOCHRUNNER_BUILD_TESTS=ON \
            -DEPOCHRUNNER_ENABLE_TSAN=ON
          cmake --build build/linux-tsan --target EpochRunnerRuntimePipelineTests --parallel 2
          TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1 \
            ctest --test-dir build/linux-tsan -R EpochRunner.RuntimePipeline --output-on-failure -V

  windows-package:
    runs-on: windows-2025
    outputs:
      checksum: ${{ steps.package.outputs.checksum }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-v070-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-v070-${{ runner.os }}-
            epochrunner-v066-stable-gait-${{ runner.os }}-
            epochrunner-v065-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build full Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          cmake --build --preset windows-release

      - name: Run Windows tests and diagnostics
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V
          if ($LASTEXITCODE -ne 0) { throw "Windows test suite failed" }
          $version = (& build/windows-release/Release/EpochRunner.exe --version | Out-String).Trim()
          if ($version -ne "EpochRunner 0.7.0") { throw "Unexpected version: $version" }
          build/windows-release/Release/EpochRunner.exe --diagnose-vulkan
          if ($LASTEXITCODE -ne 0) { throw "Vulkan diagnostic failed" }

      - name: Package exact tested build
        id: package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/EpochRunner-v0.7.0-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          Copy-Item README.md, LICENSE, MISSIONS.md, missioncache.md, V070_MASTER_PLAN.md -Destination $stage -Force -ErrorAction SilentlyContinue
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          $archive = "EpochRunner-v0.7.0-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
          $checksum | Set-Content "$archive.sha256"
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: EpochRunner-v0.7.0-windows-x64
          path: |
            EpochRunner-v0.7.0-windows-x64.zip
            EpochRunner-v0.7.0-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [linux-validate, windows-package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: EpochRunner-v0.7.0-windows-x64
          path: dist

      - name: Verify and publish exact tested release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          CHECKSUM: ${{ needs.windows-package.outputs.checksum }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          actual=$(sha256sum dist/EpochRunner-v0.7.0-windows-x64.zip | awk '{print toupper($1)}')
          expected=$(echo "$CHECKSUM" | tr '[:lower:]' '[:upper:]')
          test "$actual" = "$expected"
          if gh release view v0.7.0 >/dev/null 2>&1; then
            echo 'v0.7.0 already exists; refusing replacement' >&2
            exit 1
          fi
          gh release create v0.7.0 \
            dist/EpochRunner-v0.7.0-windows-x64.zip \
            dist/EpochRunner-v0.7.0-windows-x64.zip.sha256 \
            --target "$SOURCE_SHA" \
            --title 'EpochRunner v0.7.0' \
            --notes 'Completes the ordered locomotion and acrobatics curriculum, worker-owned C++23 coroutine training pipeline, asynchronous checkpoint persistence, deterministic cross-platform concurrency coverage, eight independently controlled humanoid leg and arm motors, and deterministic responsive UI/PIP layout contracts. Includes bounded powered airtime, controlled flips with a three-spin limit, anti-rolling and anti-skating gates, best-policy regression protection, and best-result self-imitation.'

      - name: Record release evidence and close mission cache
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          CHECKSUM: ${{ needs.windows-package.outputs.checksum }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          python - <<'PY'
          import os
          from pathlib import Path

          mission = Path('missioncache.md')
          text = mission.read_text(encoding='utf-8')
          text = text.replace(
              '**Release state:** VALIDATED — merge, exact-source packaging, publication, and cleanup pending',
              '**Release state:** VERIFIED — EpochRunner v0.7.0 published')
          text = text.replace(
              '### WALK-REL-011 — Verified v0.7.0 release\n**Status:** READY FOR RELEASE',
              '### WALK-REL-011 — Verified v0.7.0 release\n**Status:** VERIFIED')
          text = text.replace(
              'Remaining release transaction:\n\n- merge the validated completion branch without rewriting history;\n- validate and package the exact merged source;\n- record the Windows x64 package SHA-256;\n- publish tag and GitHub release from the exact tested source;\n- update this release mission to `VERIFIED` with final evidence;\n- remove work, diagnostic, release, and obsolete feature branches;\n- leave zero open cleanup pull requests.\n',
              'Final release evidence is recorded in `validation/v0.7.0.md`. Repository branch and pull-request cleanup is performed immediately after publication.\n')
          mission.write_text(text, encoding='utf-8')

          evidence = Path('validation/v0.7.0.md')
          evidence.parent.mkdir(parents=True, exist_ok=True)
          evidence.write_text(
              '# EpochRunner v0.7.0 release evidence\n\n'
              f'- Exact tested source commit: `{os.environ["SOURCE_SHA"]}`\n'
              f'- Release workflow run: `{os.environ["RUN_ID"]}`\n'
              '- Windows runner: `windows-2025`\n'
              '- Full SDL3/Vulkan/EpochGui Windows application build: passed\n'
              '- Windows deterministic, concurrency, runtime-pipeline, persistence, arm, and UI tests: passed\n'
              '- Executable version and Vulkan diagnostic: passed\n'
              '- Linux C++23 deterministic, concurrency, runtime-pipeline, persistence, arm, and UI tests: passed\n'
              '- Linux ThreadSanitizer runtime-pipeline test: passed\n'
              '- Worker-owned C++23 coroutine stages and immutable publication: passed\n'
              '- Asynchronous atomic checkpoint/autosave persistence under load: passed\n'
              '- Eight independently controlled humanoid leg/shoulder/elbow motors: passed\n'
              '- Ordered stand, duck, jump, walk/run, moving traversal, flip, and mixed-goal curriculum: passed\n'
              '- Deterministic minimum-window UI and PIP non-overlap contracts: passed\n'
              '- Package: `EpochRunner-v0.7.0-windows-x64.zip`\n'
              f'- Package SHA-256: `{os.environ["CHECKSUM"]}`\n',
              encoding='utf-8')
          PY
          git rm .github/workflows/v070-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md validation/v0.7.0.md
          git commit -m 'Record verified EpochRunner v0.7.0 release evidence'
          git push origin HEAD:main
