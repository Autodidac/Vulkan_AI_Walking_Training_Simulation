name: Diagnose Runner v0.7.8 finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-v078-finalizer.yml

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record recent finalizer runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=30" \
            --jq '[.workflow_runs[] | select(.name == "Finalize Runner v0.7.8 exactly") | {id, status, conclusion, head_sha, created_at, updated_at, html_url}]' \
            > FINALIZER_RUNS.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-v078-finalizer.yml
          git add FINALIZER_RUNS.json
          git commit -m "Record Runner v0.7.8 finalizer diagnostics"
          git push origin HEAD:main
