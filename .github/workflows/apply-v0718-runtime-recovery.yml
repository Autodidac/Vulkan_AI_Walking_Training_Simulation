name: Apply Runner v0.7.18 runtime recovery

on:
  push:
    branches: [agent/v0718-runtime-recovery]

permissions:
  contents: write

concurrency:
  group: apply-runner-v0718-runtime-recovery
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0718-runtime-recovery
          fetch-depth: 0

      - name: Cache released runtime regressions first
        run: python tools/apply_v0718_runtime_recovery.py cache

      - name: Commit mission cache before product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git diff --cached --check
          git commit -m 'Cache Runner v0.7.18 runtime recovery missions'
          git push origin HEAD:agent/v0718-runtime-recovery

      - name: Apply source-wide runtime recovery
        run: python tools/apply_v0718_runtime_recovery.py implement

      - name: Commit source docs and tests
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_v0718_runtime_recovery.py
          git add -A
          git diff --cached --check
          git commit -m 'Implement Runner v0.7.18 runtime recovery'
          git push origin HEAD:agent/v0718-runtime-recovery
