name: Watch Runner v0.7.19 release

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  watch:
    if: github.event.pull_request.head.ref == 'agent/v0719-release-watch'
    runs-on: ubuntu-24.04
    steps:
      - name: Report v0.7.19 publisher state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&event=push&per_page=30")
          run_id=$(jq -r '[.workflow_runs[] | select(.name == "Runner v0.7.19 validation and release")][0].id // empty' <<<"$json")
          if [ -z "$run_id" ]; then
            body='No Runner v0.7.19 main push release run was found.'
          else
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
            status=$(jq -r '.status' <<<"$run")
            conclusion=$(jq -r '.conclusion // "pending"' <<<"$run")
            head=$(jq -r '.head_sha' <<<"$run")
            body="Runner v0.7.19 release run: $run_id\nStatus: $status\nConclusion: $conclusion\nHead: $head\nJobs:\n"
            while IFS=$'\t' read -r name jstatus jconclusion jid; do
              body+="- $name: $jstatus / ${jconclusion:-pending} (job $jid)\n"
            done < <(jq -r '.jobs[] | [.name,.status,(.conclusion // "pending"),(.id|tostring)] | @tsv' <<<"$jobs")
          fi
          printf '%b' "$body" > /tmp/body.txt
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
