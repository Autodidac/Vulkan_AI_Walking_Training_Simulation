name: Finalize Runner v0.7.18 walk-coordinate recovery

on:
  push:
    branches:
      - agent/v0719-walk-coordinate-recovery

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/v0719-walk-coordinate-recovery
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Update release gate for corrected walking semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/runner-v0717-release.yml')
          text = path.read_text(encoding='utf-8')
          anchor = "          grep -F 'WALK-RELEASE-225' missioncache.md\n"
          if "WALK-COURSE-FRAME-226" not in text:
              assert anchor in text
              text = text.replace(anchor, anchor +
                  "          grep -F 'WALK-COURSE-FRAME-226' missioncache.md\n"
                  "          grep -F 'WALK-COORDINATE-TEST-232' missioncache.md\n", 1)
          text = text.replace('for number in range(211, 225):',
                              'for number in range(211, 233):')
          text = text.replace(
              '          - Terrain simulation and terrain coordinates are intentionally unchanged.\n',
              '          - Terrain material/shape simulation is retained; moving-course locomotion coordinates now correctly use terrain-relative progress.\n')
          bootstrap = '          - Strengthens early sagittal walking bootstrap without weakening crab-walk rejection.\n'
          if 'Checkpoints safe incremental two-step sagittal walkers' not in text:
              assert bootstrap in text
              text = text.replace(bootstrap, bootstrap +
                  '          - Fixes the treadmill/world coordinate mismatch so real side-view steps accumulate ground-relative distance and speed.\n'
                  '          - Checkpoints safe incremental two-step sagittal walkers before final mastery instead of discarding them.\n', 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git add .github/workflows/runner-v0717-release.yml
          git commit -m 'Gate v0.7.18 release on treadmill-coordinate recovery'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
      - name: Remove temporary executor infrastructure
        run: |
          git rm tools/apply_v0718_walk_coordinate_recovery.py
          git rm .github/workflows/apply-v0718-walk-coordinate-recovery.yml
          git commit -m 'Remove temporary v0.7.18 repair executor'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
