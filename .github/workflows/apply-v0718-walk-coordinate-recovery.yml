name: Apply Runner v0.7.18 walk-coordinate recovery

on:
  push:
    branches:
      - agent/v0719-walk-coordinate-recovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/v0719-walk-coordinate-recovery
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Apply terrain-coordinate helpers
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('fix', 'tools/apply_v0718_walk_coordinate_recovery.py')
          fix = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fix)
          fix.implement_simulation_header()
          PY
          git diff --check
          git add src/simulation.hpp
          git commit -m 'Add terrain-relative locomotion coordinate helpers'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
      - name: Apply simulation coordinate correction
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('fix', 'tools/apply_v0718_walk_coordinate_recovery.py')
          fix = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fix)
          fix.implement_simulation_cpp()
          PY
          git diff --check
          git add src/simulation.cpp
          git commit -m 'Measure moving-course gait relative to terrain'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
      - name: Apply learning and regression correction
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('fix', 'tools/apply_v0718_walk_coordinate_recovery.py')
          fix = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fix)
          fix.implement_ppo_header()
          fix.implement_ppo_trainer()
          fix.implement_tests()
          fix.implement_changelog()
          fix.implement_release_workflow()
          fix.implement_docs()
          PY
          python3 -m py_compile tools/apply_v0718_walk_coordinate_recovery.py
          git diff --check
          git add src/ppo.hpp src/ppo_trainer.cpp tests/v0718_runtime_recovery_tests.cpp \
            CHANGELOG.md docs/RUNNER_V0718_RUNTIME_RECOVERY.md \
            .github/workflows/runner-v0717-release.yml
          git commit -m 'Checkpoint incremental sagittal walkers in v0.7.18'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
      - name: Remove temporary executor infrastructure
        run: |
          git rm tools/apply_v0718_walk_coordinate_recovery.py
          git rm .github/workflows/apply-v0718-walk-coordinate-recovery.yml
          git commit -m 'Remove temporary v0.7.18 repair executor'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
