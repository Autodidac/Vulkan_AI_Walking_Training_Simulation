name: Finish Runner v0.7.18 walk-coordinate recovery

on:
  push:
    branches:
      - agent/v0719-walk-coordinate-recovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/v0719-walk-coordinate-recovery
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Fix candidate qualification semantics
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('fix', 'tools/apply_v0718_walk_coordinate_recovery.py')
          fix = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fix)
          fix.implement_ppo_header()
          PY
          git diff --check
          git add src/ppo.hpp
          git commit -m 'Separate incremental Walk qualification from mastery'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
      - name: Extend early sagittal bootstrap
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('fix', 'tools/apply_v0718_walk_coordinate_recovery.py')
          fix = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fix)
          fix.implement_ppo_trainer()
          PY
          git diff --check
          git add src/ppo_trainer.cpp
          git commit -m 'Extend early sagittal Walk bootstrap'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
      - name: Add coordinate regression contracts
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('fix', 'tools/apply_v0718_walk_coordinate_recovery.py')
          fix = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fix)
          fix.implement_tests()
          PY
          git diff --check
          git add tests/v0718_runtime_recovery_tests.cpp
          git commit -m 'Test terrain-relative walking coordinates'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
      - name: Document corrected runtime semantics
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('fix', 'tools/apply_v0718_walk_coordinate_recovery.py')
          fix = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fix)
          fix.implement_changelog()
          fix.implement_docs()
          PY
          git diff --check
          git add CHANGELOG.md docs/RUNNER_V0718_RUNTIME_RECOVERY.md
          git commit -m 'Document v0.7.18 treadmill-coordinate correction'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
      - name: Extend release audit to coordinate missions
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('fix', 'tools/apply_v0718_walk_coordinate_recovery.py')
          fix = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fix)
          fix.implement_release_workflow()
          PY
          git diff --check
          git add .github/workflows/runner-v0717-release.yml
          git commit -m 'Gate v0.7.18 release on walking-coordinate correction'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
      - name: Remove temporary executor infrastructure
        run: |
          git rm tools/apply_v0718_walk_coordinate_recovery.py
          git rm .github/workflows/apply-v0718-walk-coordinate-recovery.yml
          git commit -m 'Remove temporary v0.7.18 repair executor'
          git push origin HEAD:agent/v0719-walk-coordinate-recovery
