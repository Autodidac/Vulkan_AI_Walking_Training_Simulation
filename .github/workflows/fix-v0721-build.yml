name: Fix Runner v0.7.21 test dependency wiring

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/v0721-readable-telemetry'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0721-readable-telemetry
          fetch-depth: 0
      - name: Link telemetry test to the complete core dependency graph
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CMakeLists.txt')
          text = path.read_text(encoding='utf-8')
          marker = '    target_include_directories(RunnerV0721ReadableTelemetryTests PRIVATE\n'
          link = '    target_link_libraries(RunnerV0721ReadableTelemetryTests PRIVATE Runner::Core)\n'
          if link not in text:
              if text.count(marker) != 1:
                  raise SystemExit('telemetry include marker not found exactly once')
              text = text.replace(marker, link + marker, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          grep -F 'target_link_libraries(RunnerV0721ReadableTelemetryTests PRIVATE Runner::Core)' CMakeLists.txt
      - name: Commit dependency repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Fix v0.7.21 telemetry test dependencies'
            git push origin HEAD:agent/v0721-readable-telemetry
          fi
