name: Release EpochRunner v0.5.0

on:
  push:
    paths:
      - ".github/workflows/release-v050.yml"

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  release:
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build --preset windows-release 2>&1 | Tee-Object -FilePath release-build.log

      - name: Run core and throughput tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ctest --preset windows-release -V 2>&1 | Tee-Object -FilePath release-tests.log

      - name: Verify executable version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          build/windows-release/Release/EpochRunner.exe --version 2>&1 |
            Tee-Object -FilePath release-version.log
          if (-not (Select-String -Path release-version.log -Pattern "EpochRunner 0.5.0" -Quiet)) {
            throw "Packaged executable does not report EpochRunner 0.5.0"
          }

      - name: Run Vulkan diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          build/windows-release/Release/EpochRunner.exe --diagnose-vulkan 2>&1 |
            Tee-Object -FilePath release-vulkan.log

      - name: Update validation evidence and mission ledger
        shell: pwsh
        run: |
          @'
          import re
          from pathlib import Path

          mission = Path("MISSIONS.md")
          text = mission.read_text(encoding="utf-8")
          verified = {
              "WALK-RIG-001": "VERIFIED",
              "WALK-CONC-001": "VERIFIED",
              "WALK-UI-001": "VERIFIED",
              "WALK-OPT-001": "VERIFIED",
              "WALK-REL-001": "VERIFIED",
          }
          for mission_id, status in verified.items():
              pattern = rf"(## {re.escape(mission_id)}[^#]*?\*\*Status:\*\*)\s+\w+"
              text, count = re.subn(pattern, rf"\1 {status}", text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f"Could not update {mission_id}")
          text = text.replace(
              "The concurrent runtime source is under active integration. It must not be described as released or verified until WALK-REL-001 closes.",
              "EpochRunner v0.5.0 passed its Windows build, concurrency tests, speed-mode benchmark, Vulkan diagnostic, and packaging gate. Remaining ACTIVE/OPEN missions carry forward unchanged.")
          mission.write_text(text, encoding="utf-8")
          '@ | Set-Content -Encoding UTF8 update_release_ledger.py
          python update_release_ledger.py
          Remove-Item update_release_ledger.py

          New-Item -ItemType Directory -Force validation | Out-Null
          $tests = Get-Content release-tests.log -Raw
          $version = Get-Content release-version.log -Raw
          $vulkan = Get-Content release-vulkan.log -Raw
          $source = git rev-parse HEAD
          $evidence = @"
          # EpochRunner v0.5.0 release validation

          Build source: $source
          Compiler: Visual Studio 2026 / MSVC 19.51
          Configuration: Windows x64 Release

          ## Version check
          ```text
          $version
          ```

          ## Vulkan diagnostic
          ```text
          $vulkan
          ```

          ## Core and concurrency tests
          ```text
          $tests
          ```
          "@
          Set-Content validation/v050-release.md $evidence -Encoding UTF8

      - name: Package Windows release
        shell: pwsh
        run: |
          $package = Join-Path $PWD "package/EpochRunner-v0.5.0-windows-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          cmake --install build/windows-release --config Release --prefix $package
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $package -Force
          Copy-Item README.md, LICENSE, MISSIONS.md -Destination $package -Force
          New-Item -ItemType Directory -Force "$package/validation" | Out-Null
          Copy-Item validation/v050-release.md -Destination "$package/validation" -Force
          Compress-Archive -Path "$package/*" -DestinationPath "EpochRunner-v0.5.0-windows-x64.zip" -Force
          $hash = (Get-FileHash EpochRunner-v0.5.0-windows-x64.zip -Algorithm SHA256).Hash
          Add-Content validation/v050-release.md "`nPackage SHA256: $hash"

      - name: Commit verified release evidence
        shell: pwsh
        run: |
          Remove-Item .github/workflows/release-v050.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MISSIONS.md validation/v050-release.md .github/workflows/release-v050.yml
          git commit -m "Verify EpochRunner v0.5.0 release"
          git push origin HEAD:main

      - name: Publish v0.5.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $target = git rev-parse HEAD
          gh release create v0.5.0 EpochRunner-v0.5.0-windows-x64.zip `
            --target $target `
            --title "EpochRunner v0.5.0" `
            --notes "Persistent parallel rollout, PPO gradient, and deterministic evaluation workers; real NORMAL/FASTER/MAX CPU budgets with measured throughput; C++23 coroutine trainer supervisor; non-blocking coalesced rig edits; hip-edit lockup regression coverage; live worker/update/queue telemetry. Exact source: $target"
