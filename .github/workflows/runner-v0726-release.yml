name: Runner v0.7.26 training truth validation and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: [tools/v0726-release-trigger.txt]

permissions:
  contents: write
  pull-requests: write

env:
  RELEASE_VERSION: 0.7.26
  RELEASE_TAG: v0.7.26
  PACKAGE_NAME: Runner-v0.7.26-windows-x64

jobs:
  source-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      source_sha: ${{ steps.final.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install deterministic Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3

      - name: Apply v0.7.26 source correction
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v0726_training_truth.py
          python3 tools/fix_v0726_case_scope.py
          rm -f tools/apply_v0726_training_truth.py
          rm -f tools/fix_v0726_case_scope.py
          rm -f tools/v0726-release-trigger.txt
          rm -f .github/workflows/runner-v0726-release.yml

          git diff --check
          grep -F 'project(Runner VERSION 0.7.26 LANGUAGES CXX)' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'2601u" src/ppo.hpp
          grep -F 'motor_drives_support_branch' src/ppo.hpp
          grep -F 'reset_policy(0xC0FFEEu, true)' src/ppo_trainer.cpp
          grep -F 'set_preview_course_motion_enabled(false)' src/autonomy_runtime.cpp
          grep -F 'PREVIEW RESTARTS 0 - REAL STATIC COURSE' src/app.cpp
          grep -F 'TOTAL RIG UPDATES' src/app.cpp
          grep -F 'User-supplied modular armor, bounded to the physical torso' src/app.cpp
          if grep -Fq 'const TrainingMetrics& reset_metrics' src/autonomy_commands.cpp; then
            echo 'Unscoped switch-case metric reference remains'
            exit 1
          fi
          test -f docs/RUNNER_V0726_TRAINING_TRUTH.md
          test -f tests/v0726_training_truth_tests.cpp
          test -f assets/optional/runner_armor_concepts/runtime/foot_side.ppm
          test -f assets/optional/runner_armor_concepts/runtime/helmet_side.ppm
          test -f assets/optional/runner_armor_concepts/runtime/torso_side.ppm
          test -f assets/optional/runner_armor_concepts/runtime/weapon_side.ppm
          cmake -DRUNNER_SOURCE_DIR="$PWD" -P tools/repository_audit.cmake

      - name: Configure Linux full deterministic suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/linux-v0726 -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build and test Linux
        run: |
          cmake --build build/linux-v0726 --parallel
          ctest --test-dir build/linux-v0726 --output-on-failure -V --timeout 1800

      - name: Commit validated source directly to main
        id: final
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Runner v0.7.26 rig training truth and preview correction [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              break
            fi
            test "$attempt" -lt 5
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-package:
    needs: source-validation
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-validation.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0726-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: runner-v0726-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure Windows SDL3/Vulkan application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $selected = $null
          foreach ($candidate in @('windows-release', 'windows-vs2022-release')) {
            Write-Host "Trying CMake preset $candidate"
            cmake --preset $candidate --fresh
            if ($LASTEXITCODE -eq 0) {
              $selected = $candidate
              break
            }
          }
          if (-not $selected) { throw 'No supported Windows CMake preset configured successfully' }
          $buildDir = if ($selected -eq 'windows-release') {
            'build/windows-release'
          } else {
            'build/windows-vs2022-release'
          }
          "ACTIVE_PRESET=$selected" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BUILD_DIR=$buildDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build complete Windows release
        shell: pwsh
        run: |
          cmake --build --preset $env:ACTIVE_PRESET --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Run complete Windows test matrix
        shell: pwsh
        run: |
          ctest --preset $env:ACTIVE_PRESET --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

      - name: Verify build-tree diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path "$env:BUILD_DIR/Release/Runner.exe").Path
          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.26') { throw "Version mismatch: $version" }
            foreach ($diagnostic in @('--diagnose-package', '--diagnose-acceptance', '--diagnose-camera', '--diagnose-ui')) {
              & $exe $diagnostic
              if ($LASTEXITCODE -ne 0) { throw "Build-tree diagnostic failed: $diagnostic" }
            }
          }
          finally { Pop-Location }

      - name: Install complete Windows package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install $env:BUILD_DIR --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md, AGENTS.md -Destination $stage -Force
          Get-ChildItem "$env:BUILD_DIR/Release" -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe', 'run.bat', 'README.md', 'LICENSE', 'CHANGELOG.md',
            'missioncache.md', 'AGENTS.md', 'assets/chicken.ppm',
            'assets/optional/runner_armor_concepts/runtime/foot_side.ppm',
            'assets/optional/runner_armor_concepts/runtime/helmet_side.ppm',
            'assets/optional/runner_armor_concepts/runtime/torso_side.ppm',
            'assets/optional/runner_armor_concepts/runtime/weapon_side.ppm',
            'assets/ui/runner_icon.png', 'assets/ui/runner.ico',
            'shaders/flat.vert.spv', 'shaders/flat.frag.spv',
            'docs/RUNNER_V0726_TRAINING_TRUTH.md')) {
            if (-not (Test-Path (Join-Path $stage $required))) {
              throw "Missing package file: $required"
            }
          }
          "STAGE=$stage" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify installed package and optional-art fallback
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          try {
            foreach ($diagnostic in @('--diagnose-package', '--diagnose-acceptance', '--diagnose-camera', '--diagnose-ui')) {
              & "$env:STAGE/Runner.exe" $diagnostic
              if ($LASTEXITCODE -ne 0) { throw "Installed diagnostic failed: $diagnostic" }
            }
            $launched = (& cmd.exe /d /c "call `"$env:STAGE\run.bat`" --version" | Out-String).Trim()
            if ($launched -ne 'Runner 0.7.26') { throw "run.bat mismatch: $launched" }
            $optional = Join-Path $env:STAGE 'assets/optional'
            $backup = Join-Path $env:RUNNER_TEMP 'runner-v0726-optional-backup'
            Remove-Item $backup -Recurse -Force -ErrorAction SilentlyContinue
            Move-Item $optional $backup
            & "$env:STAGE/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Optional-art fallback failed' }
            Move-Item $backup $optional
          }
          finally { Pop-Location }

      - name: Create archive checksum and manifest
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"
          $checksum = "$archive.sha256"
          $manifest = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.manifest.sha256"
          Remove-Item $archive,$checksum,$manifest -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$env:STAGE/*" -DestinationPath $archive -Force
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash  $env:PACKAGE_NAME.zip" | Set-Content $checksum -Encoding ascii
          Get-ChildItem $env:STAGE -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($env:STAGE.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $relative"
          } | Set-Content $manifest -Encoding ascii

      - name: Independently extract and audit archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"
          $audit = Join-Path $env:RUNNER_TEMP 'runner-v0726-extracted'
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          Push-Location $env:RUNNER_TEMP
          try {
            foreach ($diagnostic in @('--diagnose-package', '--diagnose-acceptance', '--diagnose-camera', '--diagnose-ui')) {
              & "$audit/Runner.exe" $diagnostic
              if ($LASTEXITCODE -ne 0) { throw "Extracted diagnostic failed: $diagnostic" }
            }
          }
          finally { Pop-Location }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            ${{ env.PACKAGE_NAME }}.zip.sha256
            ${{ env.PACKAGE_NAME }}.manifest.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: [source-validation, windows-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.source-validation.outputs.source_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: release-assets

      - name: Publish and independently verify v0.7.26
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" | wc -l)" -eq 0 || {
            echo "$RELEASE_TAG already exists"
            exit 1
          }
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Runner v0.7.26" \
            --notes "Topology-aware multi-rig training fix. Quadruped/crawler/hexapod support motors are no longer mistaken for arms; switching rigs now starts clean rig-scoped totals and lesson baselines; the large preview runs a static real course and reports why it auto-restarted; packaged modular armor art is enabled and bounded to the physical rig. Linux GCC14 and complete Windows SDL3/Vulkan build/tests/package diagnostics passed."
          mkdir verify
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir verify
          cd verify
          sha256sum -c "$PACKAGE_NAME.zip.sha256"
          test -s "$PACKAGE_NAME.manifest.sha256"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish)" = "$SOURCE_SHA"
