name: Publish Runner v0.7.13

on:
  repository_dispatch:
    types: [publish_runner_v0713]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: publish-runner-v0713-final
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish and independently audit Runner v0.7.13
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/patch_publish_selectstring_v0713.py
          if ($LASTEXITCODE -ne 0) { throw 'Publisher PowerShell correction failed' }
          python tools/patch_publish_v0713.py
          if ($LASTEXITCODE -ne 0) { throw 'Publisher finalization failed' }
          $publisher = Get-Content tools/publish_v0713.ps1 -Raw
          & ([scriptblock]::Create($publisher))
