name: Delete stale parent reaction branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-stale-parent-reaction-branch.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete temporary branch and verify pull-request state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git push origin --delete fix/humanoid-parent-reaction-v071
          open_prs=$(gh pr list --state open --limit 100 --json number --jq 'length')
          test "$open_prs" = "0"
          branches=$(gh api "repos/$GH_REPO/branches" --paginate --jq '.[].name')
          test "$branches" = "main"

      - name: Remove cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/delete-stale-parent-reaction-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove stale parent reaction cleanup workflow'
          git push origin HEAD:main
