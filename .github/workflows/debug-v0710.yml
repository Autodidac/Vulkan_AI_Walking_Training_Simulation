name: Debug Runner v0.7.10 consolidation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Materialize and inspect
        shell: bash
        run: |
          set -u
          python3 tools/apply_v0710_cleanup.py
          echo '--- git diff check ---'
          git diff --check || true
          echo '--- root files ---'
          find . -maxdepth 2 -type f | sort
          echo '--- release notes ---'
          find . -type f -name 'RELEASE_NOTES*.md' -print
          echo '--- mission docs ---'
          find . -type f -iname '*mission*.md' ! -name missioncache.md -print
          echo '--- required checks ---'
          for path in .github/workflows/finalize-runner-v0710.yml CHANGELOG.md missioncache.md tools/repository_audit.cmake; do
            if test -f "$path"; then echo "PASS file $path"; else echo "FAIL file $path"; fi
          done
          for expression in \
            'project(Runner VERSION 0.7.10 LANGUAGES CXX)|CMakeLists.txt' \
            'Runner.RepositoryHygiene|CMakeLists.txt' \
            'std::hypot|src/acceptance.cpp' \
            '!cases.empty()|src/acceptance.cpp' \
            'WALK-RELEASE-108|missioncache.md'; do
            pattern=${expression%%|*}
            file=${expression#*|}
            if grep -F "$pattern" "$file"; then echo "PASS grep $pattern"; else echo "FAIL grep $pattern in $file"; fi
          done
