name: Probe EpochRunner v0.7.1 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-v071.yml]

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record Windows release workflow state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run list --workflow finish-v071-windows.yml --limit 10 \
            --json databaseId,status,conclusion,headSha,createdAt,updatedAt,name,displayTitle \
            > validation/v0.7.1-windows-runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          runs = json.loads(Path('validation/v0.7.1-windows-runs.json').read_text())
          lines = ['# EpochRunner v0.7.1 Windows release runs', '']
          for run in runs:
              lines.append(
                  f"- `{run['databaseId']}` — {run['status']} / {run.get('conclusion') or 'pending'} — "
                  f"`{run['headSha']}` — {run['createdAt']}"
              )
          Path('validation/v0.7.1-windows-runs.md').write_text('\n'.join(lines) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/v0.7.1-windows-runs.json validation/v0.7.1-windows-runs.md
          git commit -m 'Record active v0.7.1 Windows release status'
          git pull --rebase origin main
          git push origin HEAD:main
