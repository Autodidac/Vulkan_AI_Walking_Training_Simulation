name: Trigger final EpochRunner v0.7.1 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/kick-v071-now.yml]

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Trigger corrected Windows release workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '\n# proven shaderc final release trigger\n' >> .github/workflows/finish-v071-windows.yml
          git rm .github/workflows/kick-v071-now.yml
          git add .github/workflows/finish-v071-windows.yml
          git commit -m 'Start final v0.7.1 release gate'
          git pull --rebase origin main
          git push origin HEAD:main
