name: Clean EpochRunner v0.7.0 branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v070-cleanup.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove completed work and diagnostic branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete work/mission-cache-completion
          git push origin --delete diagnostics/v066-build

      - name: Verify repository cleanup and record evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          open_prs=$(gh pr list --state open --limit 100 --json number --jq 'length')
          test "$open_prs" = "0"
          branches=$(gh api "repos/$GH_REPO/branches" --paginate --jq '.[].name')
          test "$branches" = "main"
          mkdir -p validation
          cat > validation/repository-cleanup-v0.7.0.md <<EOF
          # Repository cleanup after EpochRunner v0.7.0

          - Remaining branches: \`main\`
          - Open pull requests: \`0\`
          - Deleted completed branch: \`work/mission-cache-completion\`
          - Deleted diagnostic branch: \`diagnostics/v066-build\`
          - Release, integration, validation, and cleanup workflows removed from the final repository state.
          EOF
          git rm .github/workflows/v070-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/repository-cleanup-v0.7.0.md
          git commit -m 'Record final EpochRunner v0.7.0 repository cleanup'
          git push origin HEAD:main
