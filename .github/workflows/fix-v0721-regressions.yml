name: Repair Runner v0.7.21 preset regression gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/v0721-readable-telemetry'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0721-readable-telemetry
          fetch-depth: 0
      - name: Repair proven preset and compatibility regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('src/simulation.cpp')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text,
          '''            { 0.00f, 2.82f }, { 0.02f, 4.20f }, { 0.12f, 4.98f },
                      { -0.09f, 1.56f }, { -0.14f, 0.25f },
                      { 0.09f, 1.56f }, { 0.14f, 0.25f },
                      { -0.04f, 4.04f }, { -0.34f, 3.46f }, { -0.18f, 2.78f },
                      { 0.04f, 4.04f }, { 0.34f, 3.46f }, { 0.18f, 2.78f }
          ''',
          '''            { -0.0034f, 2.8127f }, { -0.0060f, 4.2000f }, { -0.0060f, 4.9800f },
                      { -0.09f, 1.56f }, { -0.14f, 0.25f },
                      { 0.09f, 1.56f }, { 0.14f, 0.25f },
                      { -0.42f, 4.0200f }, { -0.78f, 3.43f }, { -0.60f, 2.76f },
                      { 0.40f, 4.0200f }, { 0.76f, 3.43f }, { 0.58f, 2.76f }
          ''', 'stable humanoid upper body')
          text = replace_once(text,
          '''            { 7, 10, 0.0f, 0.48f },
                      { 2, 7, 0.0f, 0.90f }, { 2, 10, 0.0f, 0.90f }
          ''',
          '''            { 7, 10, 0.0f, 0.72f },
                      { 2, 7, 0.0f, 0.94f }, { 2, 10, 0.0f, 0.94f }
          ''', 'stable humanoid shoulder frame')
          text = replace_once(text,
          '''            result.calibrate_motor(index, knee ? 60.0f : 40.0f,
                          knee ? 60.0f : 40.0f, strength);
                  }
                  result.calibrate_motor(4, 88.0f, 88.0f, 0.032f);
                  result.calibrate_motor(5, 100.0f, 100.0f, 0.030f);
                  result.calibrate_motor(6, 88.0f, 88.0f, 0.032f);
                  result.calibrate_motor(7, 100.0f, 100.0f, 0.030f);
          ''',
          '''            result.calibrate_motor(index, knee ? 58.0f : 36.0f,
                          knee ? 58.0f : 36.0f, strength);
                  }
                  result.calibrate_motor(4, 95.0f, 95.0f, 0.034f);
                  result.calibrate_motor(5, 108.0f, 108.0f, 0.031f);
                  result.calibrate_motor(6, 95.0f, 95.0f, 0.034f);
                  result.calibrate_motor(7, 108.0f, 108.0f, 0.031f);
          ''', 'stable humanoid motor calibration')
          text = replace_once(text,
          '''        result.left_contact_node = 4u;
                  result.additional_left_contact_nodes = { 7u, 8u };
                  result.right_contact_node = 5u;
                  result.additional_right_contact_nodes = { 6u, 9u };
          ''',
          '''        result.left_contact_node = 4u;
                  result.additional_left_contact_nodes = { 6u, 8u };
                  result.right_contact_node = 5u;
                  result.additional_right_contact_nodes = { 7u, 9u };
          ''', 'hexapod tripod phases')
          text = replace_once(text,
          '''            { 0.00f, 2.85f }, { 0.04f, 3.86f }, { 0.12f, 4.62f },
                      { 0.00f, 1.62f }, { -0.18f, 0.22f },
                      { 0.00f, 0.68f }, { 0.18f, 0.22f }
                  };
                  result.radii = { 0.27f, 0.29f, 0.25f, 0.19f, 0.15f, 0.18f, 0.15f };
          ''',
          '''            { 0.00f, 2.85f }, { 0.00f, 3.86f }, { 0.00f, 4.62f },
                      { 0.00f, 1.62f }, { -0.34f, 0.22f },
                      { 0.00f, 0.68f }, { 0.34f, 0.22f }
                  };
                  result.radii = { 0.27f, 0.29f, 0.25f, 0.19f, 0.17f, 0.18f, 0.17f };
          ''', 'stable monoped support fork')
          text = replace_once(text,
              '        calibrate_grounded_defaults(result, 34.0f, 50.0f, 0.043f, 0.049f);\n',
              '        calibrate_grounded_defaults(result, 32.0f, 48.0f, 0.043f, 0.049f);\n',
              'stable monoped calibration')
          text = replace_once(text,
              '        forward_speed_ = 0.0f;\n',
              '        forward_speed_ = course_speed();\n',
              'moving-course speed initialization')
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('src/ppo.hpp')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text,
          '''            const float phase = environment.elapsed_seconds() * 2.0f * pi
                          * movement.cadence_hz;
                      const float swing = std::sin(phase) * movement.direction;
          ''',
          '''            const float phase = environment.elapsed_seconds() * 2.0f * pi
                          * movement.cadence_hz + pi * 0.5f;
                      const float swing = std::sin(phase) * movement.direction;
          ''', 'multi-support initial gait phase')
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('tests/runtime_pipeline_tests.cpp')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text,
          '''    for (const sim::CreatureBlueprint& rig : {
                  sim::CreatureBlueprint::biped(), sim::CreatureBlueprint::chicken(),
                  sim::CreatureBlueprint::quadruped(), sim::CreatureBlueprint::crawler4(),
                  sim::CreatureBlueprint::hexapod(), sim::CreatureBlueprint::monoped() })
              {
                  require(rig.valid(), "four-motor built-in rig became invalid after policy expansion");
                  require(rig.active_motor_count == 4,
                      "non-humanoid rig did not preserve its four active motors");
              }
          ''',
          '''    const std::array<std::pair<sim::CreatureBlueprint, std::size_t>, 6> motor_contracts{
                  std::pair{ sim::CreatureBlueprint::biped(), 4u },
                  std::pair{ sim::CreatureBlueprint::chicken(), 4u },
                  std::pair{ sim::CreatureBlueprint::quadruped(), 8u },
                  std::pair{ sim::CreatureBlueprint::crawler4(), 8u },
                  std::pair{ sim::CreatureBlueprint::hexapod(), 6u },
                  std::pair{ sim::CreatureBlueprint::monoped(), 4u }
              };
              for (const auto& [rig, expected_motors] : motor_contracts)
              {
                  require(rig.valid(), "built-in rig became invalid after policy expansion");
                  require(rig.active_motor_count == expected_motors,
                      "built-in rig does not expose its authored articulated motor count");
              }
          ''', 'runtime preset motor contracts')
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('src/app.cpp')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text,
          '''        [[nodiscard]] float test_input_for_motor(std::size_t motor_index) const noexcept
                  {
                      return sim::rig_test_motor_input(rig_test_pattern, motor_index,
                          session_runtime_seconds * 2.0f * pi * 1.05f, joint_test_input);
                  }
          ''',
          '''        [[nodiscard]] float test_input_for_motor(std::size_t motor_index) const noexcept
                  {
                      const float phase = session_runtime_seconds * 2.0f * pi * 1.05f;
                      if (rig_test_pattern != sim::RigTestPattern::gait)
                          return sim::rig_test_motor_input(rig_test_pattern,
                              motor_index, phase, joint_test_input);
                      const float swing = std::sin(phase);
                      if (rig_preset == RigPreset::quadruped
                          || rig_preset == RigPreset::crawler4)
                      {
                          const std::size_t leg = motor_index / 2u;
                          const bool phase_a = leg == 0u || leg == 3u;
                          const float drive = phase_a ? swing : -swing;
                          return (motor_index & 1u) == 0u
                              ? 0.52f * drive
                              : 0.48f * std::max(0.0f, drive)
                                  - 0.20f * std::max(0.0f, -drive);
                      }
                      if (rig_preset == RigPreset::hexapod && motor_index < 6u)
                      {
                          const bool phase_a = motor_index == 0u
                              || motor_index == 2u || motor_index == 4u;
                          return 0.55f * (phase_a ? swing : -swing);
                      }
                      return sim::rig_test_motor_input(rig_test_pattern,
                          motor_index, phase, joint_test_input);
                  }
          ''', 'multi-support Rig Lab gait test')
          text = replace_once(text,
          '''            case RigPreset::quadruped:
                          return { "REAR NEAR LEG", "REAR FAR LEG", "FRONT NEAR LEG", "FRONT FAR LEG",
                              "UNUSED 5", "UNUSED 6", "UNUSED 7", "UNUSED 8" };
                      case RigPreset::crawler4:
                          return { "REAR LEG", "MID-REAR LEG", "MID-FRONT LEG", "FRONT LEG",
                              "UNUSED 5", "UNUSED 6", "UNUSED 7", "UNUSED 8" };
                      case RigPreset::hexapod:
                          return { "REAR PAIR A", "REAR PAIR B", "MID PAIR", "FRONT PAIR",
                              "UNUSED 5", "UNUSED 6", "UNUSED 7", "UNUSED 8" };
          ''',
          '''            case RigPreset::quadruped:
                          return { "REAR PHASE A HIP", "REAR PHASE A KNEE",
                              "REAR PHASE B HIP", "REAR PHASE B KNEE",
                              "FRONT PHASE B HIP", "FRONT PHASE B KNEE",
                              "FRONT PHASE A HIP", "FRONT PHASE A KNEE" };
                      case RigPreset::crawler4:
                          return { "REAR PHASE A HIP", "REAR PHASE A KNEE",
                              "REAR PHASE B HIP", "REAR PHASE B KNEE",
                              "FRONT PHASE B HIP", "FRONT PHASE B KNEE",
                              "FRONT PHASE A HIP", "FRONT PHASE A KNEE" };
                      case RigPreset::hexapod:
                          return { "REAR PHASE A", "REAR PHASE B",
                              "MIDDLE PHASE A", "MIDDLE PHASE B",
                              "FRONT PHASE A", "FRONT PHASE B",
                              "UNUSED 7", "UNUSED 8" };
          ''', 'truthful multi-support motor labels')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          grep -F 'forward_speed_ = course_speed();' src/simulation.cpp
          grep -F 'MIDDLE PHASE A' src/app.cpp
          grep -F 'expected_motors' tests/runtime_pipeline_tests.cpp
      - name: Commit repaired regression contracts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/simulation.cpp src/ppo.hpp src/app.cpp tests/runtime_pipeline_tests.cpp
          git commit -m 'Repair v0.7.21 preset regression gates'
          git push origin HEAD:agent/v0721-readable-telemetry
