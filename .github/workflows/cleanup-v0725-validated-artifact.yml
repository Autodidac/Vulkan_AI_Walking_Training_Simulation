name: Clean stale validated artifact staging

on:
  push:
    branches: [agent/v0725-art-leg-hotfix]
    paths:
      - .github/workflows/cleanup-v0725-validated-artifact.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0725-art-leg-hotfix
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Remove stale artifact staging and this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch validated-artifact
          git rm --ignore-unmatch .github/workflows/cleanup-v0725-validated-artifact.yml
          if git diff --cached --quiet; then
            echo 'Nothing to clean.'
            exit 0
          fi
          git commit -m 'Remove stale validated-artifact staging directory'
          git push origin HEAD:agent/v0725-art-leg-hotfix
