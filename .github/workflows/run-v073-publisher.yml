name: Run EpochRunner v0.7.3 publisher

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  publish:
    if: github.event.pull_request.number == 25
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python .github/scripts/publish_v073.py
