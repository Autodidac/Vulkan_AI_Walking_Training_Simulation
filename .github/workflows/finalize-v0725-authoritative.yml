name: Finalize Runner v0.7.25 authoritative

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: runner-v0725-authoritative
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.number == 80
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Canonicalize source from either branch state
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'project(Runner VERSION 0.7.25 LANGUAGES CXX)' CMakeLists.txt; then
            echo 'Canonical v0.7.25 source already generated; applying final cleanup/strictness only.'
          else
            test -f tools/apply_v0725_art_leg_hotfix.py
            test -f tools/apply_v0725_font_sync.py
            test -f tools/finalize_v0725.py
            test -f tools/finalize_v0725_audit.py
            python3 - <<'PY'
          from pathlib import Path
          art = Path('tools/apply_v0725_art_leg_hotfix.py')
          text = art.read_text(encoding='utf-8')
          structural_old = """'''        if (elapsed_seconds_ >= 0.75f
                      && (!std::isfinite(structural_error) || structural_error > 0.040f))
                      invalidate(InvalidMotion::structural_compression);
          '''"""
          structural_new = """'''        if (elapsed_seconds_ >= 0.75f
                      && stage_requires_forward_gait(course_stage_)
                      && blueprint_.paired_leg_chains()
                      && !blueprint_.horizontal_multi_support_plan()
                      && (!std::isfinite(structural_error) || structural_error > 0.040f))
                      invalidate(InvalidMotion::structural_compression);
          '''"""
          if structural_old in text:
              text = text.replace(structural_old, structural_new, 1)
          stale_old = '        "        tools/v0724-rescue-trigger.txt)\\n",'
          stale_new = ('        "        tools/v0724-rescue-trigger.txt\\n"\n'
              '        "        .github/workflows/fix-v0724-scoped-rigidity.yml)\\n",')
          if stale_old in text:
              text = text.replace(stale_old, stale_new, 1)
          stale_result_old = '        "        tools/apply_v0725_art_leg_hotfix.py)\\n",'
          stale_result_new = ('        "        tools/apply_v0725_art_leg_hotfix.py\\n"\n'
              '        "        .github/workflows/fix-v0724-scoped-rigidity.yml)\\n",')
          if stale_result_old in text:
              text = text.replace(stale_result_old, stale_result_new, 1)
          art.write_text(text, encoding='utf-8', newline='\n')

          font = Path('tools/apply_v0725_font_sync.py')
          text = font.read_text(encoding='utf-8')
          text = text.replace('if "ui_font_scale" in text:',
              'if "constexpr float ui_font_scale" in text:')
          text = text.replace(
              '    patch_repository_audit()\n    print("Runner v0.7.25 EpochGui font and progress synchronization applied")',
              '    print("Runner v0.7.25 EpochGui font and progress synchronization applied")')
          font.write_text(text, encoding='utf-8', newline='\n')
          PY
            python3 tools/apply_v0725_art_leg_hotfix.py
            python3 tools/apply_v0725_font_sync.py
            python3 tools/finalize_v0725.py
            if [ -f tools/finalize_v0725_strict_geometry.py ]; then
              python3 tools/finalize_v0725_strict_geometry.py
            fi
            python3 tools/finalize_v0725_audit.py
          fi

          # A prior successful temporary pass may have generated canonical
          # source but left its final strictness helper behind. Apply it once.
          if [ -f tools/finalize_v0725_strict_geometry.py ]; then
            python3 tools/finalize_v0725_strict_geometry.py
          fi

          python3 - <<'PY'
          from pathlib import Path
          test = Path('tests/v0725_art_leg_hotfix_tests.cpp')
          text = test.read_text(encoding='utf-8')
          text = text.replace('using runner::sim::Vec2;\n', '')
          text = text.replace('runner::sim::length', 'runner::length')
          test.write_text(text, encoding='utf-8', newline='\n')
          PY

          rm -f tools/apply_v0725_art_leg_hotfix.py
          rm -f tools/apply_v0725_font_sync.py
          rm -f tools/finalize_v0725.py
          rm -f tools/finalize_v0725_audit.py
          rm -f tools/finalize_v0725_strict_geometry.py
          rm -f tools/v0725-prtrigger.txt
          rm -f tools/v0725-v2-kick.txt
          rm -rf tools/__pycache__

          git diff --check
          grep -F 'project(Runner VERSION 0.7.25 LANGUAGES CXX)' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'2501u" src/ppo.hpp
          grep -F 'COMPACT SEGMENTED BODY ARMOR' src/app.cpp
          grep -F 'shared_pelvis_passes' src/simulation.cpp
          grep -F 'font::make_bitmap_font_metrics' src/app.cpp
          grep -F 'TRAINING SAMPLES READY' src/app.cpp
          grep -F "case '%'" src/ui_font.hpp
          grep -F '130f33fe31d73564a35a622f3bb5ddcc2b5105d5' src/ui_font.hpp
          test -f .github/workflows/runner-v0725-release.yml
          ! grep -Fq 'runner::sim::length' tests/v0725_art_leg_hotfix_tests.cpp
          ! grep -Fq 'constexpr float ui_font_scale' src/app.cpp
          ! grep -Fq 'draw_pixel_art(canvas, optional_torso_art' src/app.cpp

      - name: Build and test authoritative Linux source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
          cmake -S . -B build/v0725-authoritative -G Ninja \
            -DRUNNER_BUILD_APP=OFF \
            -DRUNNER_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/v0725-authoritative --parallel
          ctest --test-dir build/v0725-authoritative --output-on-failure -V \
            -R '^Runner\.V0725ArtLegHotfix$' --timeout 1800
          ctest --test-dir build/v0725-authoritative --output-on-failure -V --timeout 1800

      - name: Commit canonical branch if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Implement Runner v0.7.25 art, stance, font, and readable progress'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Merge canonical PR
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh pr view 80 --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" = OPEN ]; then
            head=$(gh pr view 80 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/80/merge" \
              -f merge_method=squash \
              -f sha="$head" \
              -f commit_title='Runner v0.7.25 art, stance, font, and readable progress' \
              -f commit_message='Authoritative Linux suite passed. Windows SDL3/Vulkan, installed/extracted package, publication, re-download, and cleanup remain enforced by the v0.7.25 release workflow.'
          fi
