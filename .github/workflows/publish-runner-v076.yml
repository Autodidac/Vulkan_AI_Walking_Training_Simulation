name: Publish Runner v0.7.6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-runner-v076.yml

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: publish-runner-v076
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: Autodidac/Vulkan_AI_Walking_Training_Simulation
      VALIDATION_RUN: '30760774468'
      VALIDATION_LINUX_JOB: '91530745311'
      VALIDATION_WINDOWS_JOB: '91530869350'
      VALIDATED_SOURCE_SHA: c53e75b5b126c0c48c2290f751116636b16dc8ff
      MERGE_SHA: 28949c6ce9c0b841e2e452ecb6da22e5e766b2cf
      ARTIFACT_ID: '8837612890'
      ARTIFACT_DIGEST: sha256:efa109bd28053245125dbd908e7c41f1300d24236c8eae8eea70b897f0b5ae17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean merged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = "$MERGE_SHA"
          grep -q 'project(Runner VERSION 0.7.6' CMakeLists.txt
          grep -q "training_semantics_version = 0x0007'0600u" src/ppo.hpp
          test ! -e tools/apply_v076_standing_pip.py
          test ! -e tools/fix_v076_display_gate.py
          test ! -e tools/apply_v076_spin_semantics.py
          test -f RELEASE_NOTES_v0.7.6.md
          git diff --check

      - name: Download validated Windows package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validated
          gh run download "$VALIDATION_RUN" --repo "$REPOSITORY" \
            --name Runner-v0.7.6-windows-x64 --dir validated
          test -f validated/Runner-v0.7.6-windows-x64.zip
          test -f validated/Runner-v0.7.6-windows-x64.zip.sha256
          test -f validated/Runner-v0.7.6-windows-x64.manifest.sha256
          api_digest="$(gh api "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .digest)"
          test "$api_digest" = "$ARTIFACT_DIGEST"

      - name: Finalize mission ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '**Release state:** IN PROGRESS - v0.7.5 live screenshot reopened standing mastery and PIP acceptance',
              '**Release state:** PUBLISHED - v0.7.6 assets independently audited; awaiting Adam\'s live packaged-runtime confirmation',
              1,
          )

          statuses = {
              'WALK-STAND-080': 'PACKAGE VERIFIED - LIVE ACCEPTANCE PENDING',
              'WALK-SHOULDER-081': 'PACKAGE VERIFIED - LIVE ACCEPTANCE PENDING',
              'WALK-PIP-082': 'PACKAGE VERIFIED - LIVE ACCEPTANCE PENDING',
              'WALK-RELEASE-083': 'PUBLISHED - RELEASE ASSETS VERIFIED',
          }
          for mission, status in statuses.items():
              pattern = rf'(### {re.escape(mission)}[^\n]*\n\*\*Status:\*\*)[^\n]*'
              text, count = re.subn(pattern, rf'\1 {status}', text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update {mission}')

          evidence_heading = '## v0.7.6 immutable release evidence'
          if evidence_heading in text:
              text = text[:text.index(evidence_heading)].rstrip() + '\n'
          evidence = f'''

          {evidence_heading}

          - Pull request: `#31`
          - Exact validated source: `{os.environ['VALIDATED_SOURCE_SHA']}`
          - Merge commit: `{os.environ['MERGE_SHA']}`
          - Validation workflow run: `{os.environ['VALIDATION_RUN']}`
          - Linux deterministic job: `{os.environ['VALIDATION_LINUX_JOB']}` - passed
          - Windows application/package job: `{os.environ['VALIDATION_WINDOWS_JOB']}` - passed
          - Validated workflow artifact: `{os.environ['ARTIFACT_ID']}`
          - Workflow artifact digest: `{os.environ['ARTIFACT_DIGEST']}`
          - Publication workflow run: `{os.environ['GITHUB_RUN_ID']}`
          - Full MSVC/Vulkan build and all four Windows tests: passed
          - Build-tree version, Vulkan, and package diagnostics from an unrelated working directory: passed
          - Installed executable and executable-relative `run.bat`: passed from an unrelated working directory
          - ZIP extraction and per-file manifest audit: passed before publication
          - Published assets are re-downloaded, byte-compared, checksum-verified, extracted, and manifest-audited by the publisher
          - Temporary release workflows and the source branch are removed after publication
          - Open pull requests after cleanup: `0`; remaining branch after cleanup: `main`
          - Live screenshot-level behavior remains pending Adam's released-package confirmation; contradictory behavior reopens the exact mission
          '''
          path.write_text(text.rstrip() + evidence + '\n', encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Commit clean release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-runner-v076.yml
          rm -f .github/workflows/publish-runner-v076.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize clean Runner v0.7.6 release source'
          git push origin HEAD:main
          release_sha="$(git rev-parse HEAD)"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Rebuild release archive with final ledger
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging release
          mkdir -p staging release
          unzip -q validated/Runner-v0.7.6-windows-x64.zip -d staging
          cp missioncache.md staging/missioncache.md
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import zipfile

          stage = Path('staging')
          out = Path('release/Runner-v0.7.6-windows-x64.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for file in sorted(p for p in stage.rglob('*') if p.is_file()):
                  archive.write(file, file.relative_to(stage).as_posix())

          digest = sha256(out.read_bytes()).hexdigest()
          Path(str(out) + '.sha256').write_text(digest + '  ' + out.name + '\n', encoding='utf-8')
          manifest = []
          for file in sorted(p for p in stage.rglob('*') if p.is_file()):
              manifest.append(f"{sha256(file.read_bytes()).hexdigest()}  {file.relative_to(stage).as_posix()}")
          Path('release/Runner-v0.7.6-windows-x64.manifest.sha256').write_text(
              '\n'.join(manifest) + '\n', encoding='utf-8')
          PY

      - name: Audit final archive before publication
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cut -d' ' -f1 release/Runner-v0.7.6-windows-x64.zip.sha256)"
          actual="$(sha256sum release/Runner-v0.7.6-windows-x64.zip | cut -d' ' -f1)"
          test "$expected" = "$actual"
          rm -rf prepublish-audit
          unzip -q release/Runner-v0.7.6-windows-x64.zip -d prepublish-audit
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('prepublish-audit')
          expected = Path('release/Runner-v0.7.6-windows-x64.manifest.sha256').read_text(encoding='utf-8').splitlines()
          actual = []
          for file in sorted(p for p in root.rglob('*') if p.is_file()):
              actual.append(f"{sha256(file.read_bytes()).hexdigest()}  {file.relative_to(root).as_posix()}")
          if expected != actual:
              raise SystemExit('Pre-publication manifest mismatch')
          ledger = (root / 'missioncache.md').read_text(encoding='utf-8')
          if 'PUBLISHED - RELEASE ASSETS VERIFIED' not in ledger:
              raise SystemExit('Final mission ledger was not embedded in the package')
          PY

      - name: Create v0.7.6 release
        shell: bash
        run: |
          set -euo pipefail
          release_sha='${{ steps.source.outputs.release_sha }}'
          test -n "$release_sha"
          if git rev-parse v0.7.6 >/dev/null 2>&1; then
            echo 'v0.7.6 tag already exists' >&2
            exit 1
          fi
          git tag -a v0.7.6 "$release_sha" -m 'Runner v0.7.6'
          git push origin v0.7.6
          gh release create v0.7.6 \
            release/Runner-v0.7.6-windows-x64.zip \
            release/Runner-v0.7.6-windows-x64.zip.sha256 \
            release/Runner-v0.7.6-windows-x64.manifest.sha256 \
            --repo "$REPOSITORY" \
            --target "$release_sha" \
            --title 'Runner v0.7.6' \
            --notes-file RELEASE_NOTES_v0.7.6.md

      - name: Re-download and audit published assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf published published-audit
          mkdir -p published
          gh release download v0.7.6 --repo "$REPOSITORY" --dir published
          for file in Runner-v0.7.6-windows-x64.zip Runner-v0.7.6-windows-x64.zip.sha256 Runner-v0.7.6-windows-x64.manifest.sha256; do
            cmp "release/$file" "published/$file"
          done
          expected="$(cut -d' ' -f1 published/Runner-v0.7.6-windows-x64.zip.sha256)"
          actual="$(sha256sum published/Runner-v0.7.6-windows-x64.zip | cut -d' ' -f1)"
          test "$expected" = "$actual"
          unzip -q published/Runner-v0.7.6-windows-x64.zip -d published-audit
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('published-audit')
          expected = Path('published/Runner-v0.7.6-windows-x64.manifest.sha256').read_text(encoding='utf-8').splitlines()
          actual = []
          for file in sorted(p for p in root.rglob('*') if p.is_file()):
              actual.append(f"{sha256(file.read_bytes()).hexdigest()}  {file.relative_to(root).as_posix()}")
          if expected != actual:
              raise SystemExit('Published release manifest mismatch')
          required = ['Runner.exe', 'run.bat', 'missioncache.md', 'RELEASE_NOTES_v0.7.6.md',
                      'shaders/flat.vert.spv', 'shaders/flat.frag.spv', 'assets/chicken.ppm']
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f'Missing published package files: {missing}')
          PY

      - name: Clean repository branches and verify final state
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete agent/runner-v076-standing-pip
          open_prs="$(gh pr list --repo "$REPOSITORY" --state open --json number --jq 'length')"
          test "$open_prs" = '0'
          mapfile -t branches < <(gh api "repos/$REPOSITORY/branches" --paginate --jq '.[].name' | sort)
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = 'main'
          test "$(gh release view v0.7.6 --repo "$REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = 'false'
