name: Audit Runner v0.7.8 Cleanup

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-runner-v078.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  audit-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.7.8
      EXPECTED_SHA: 073e10be71d589145beb93e025f946a6661403d3
      WORK_BRANCH: agent/v078-deformable-sand-burial
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release and publisher
        shell: bash
        run: |
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,url,assets)"
          test "$(jq -r '.tagName' <<<"$release_json")" = "$TAG"
          for file in \
            Runner-v0.7.8-windows-x64.zip \
            Runner-v0.7.8-windows-x64.zip.sha256 \
            Runner-v0.7.8-windows-x64.manifest.sha256
          do
            jq -e --arg file "$file" '.assets[] | select(.name == $file)' \
              <<<"$release_json" >/dev/null
          done
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$tag_sha" = "$EXPECTED_SHA"
          publisher="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow publish-runner-v078.yml --limit 1 \
            --json databaseId,conclusion,headSha --jq '.[0]')"
          test "$(jq -r '.conclusion' <<<"$publisher")" = success
          test "$(jq -r '.headSha' <<<"$publisher")" = 06c911c46316382ae982dcb7a09a6fc7ad328d84
          jq -r '.databaseId' <<<"$publisher" > publisher-run-id.txt
          jq -r '.url' <<<"$release_json" > release-url.txt

      - name: Re-download and audit published assets
        shell: bash
        run: |
          rm -rf release-audit extracted
          mkdir release-audit extracted
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-audit
          expected="$(tr -d '\r\n ' \
            < release-audit/Runner-v0.7.8-windows-x64.zip.sha256 | tr 'A-F' 'a-f')"
          actual="$(sha256sum release-audit/Runner-v0.7.8-windows-x64.zip | awk '{print $1}')"
          test "$expected" = "$actual"
          unzip -q release-audit/Runner-v0.7.8-windows-x64.zip -d extracted
          while read -r hash relative; do
            test -f "extracted/$relative"
            actual_file="$(sha256sum "extracted/$relative" | awk '{print $1}')"
            test "${hash,,}" = "$actual_file"
          done < release-audit/Runner-v0.7.8-windows-x64.manifest.sha256
          test "$(find extracted -type f | wc -l)" = \
            "$(wc -l < release-audit/Runner-v0.7.8-windows-x64.manifest.sha256)"

      - name: Record publication evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')

          def set_status(mission: str, status: str) -> None:
              global text
              pattern = rf'(### {re.escape(mission)}[^\n]*\n\*\*Status:\*\*)[^\n]*'
              text, count = re.subn(pattern, rf'\1 {status}', text, count=1)
              if count != 1:
                  raise SystemExit(f'missing mission {mission}')

          text, count = re.subn(
              r'\*\*Release state:\*\*[^\n]*',
              '**Release state:** PUBLISHED — v0.7.8 release assets re-downloaded and verified; released-package live confirmation remains authoritative',
              text,
              count=1)
          if count != 1:
              raise SystemExit('missing release state')

          set_status('WALK-RELEASE-095', 'PUBLISHED — RELEASE ASSETS VERIFIED')
          for mission in ('WALK-SAND-091', 'WALK-MATERIAL-092', 'WALK-BURIAL-093',
                          'WALK-ESCAPE-094', 'WALK-VISUAL-097', 'WALK-ACCEPT-098'):
              set_status(mission, 'PUBLISHED — PACKAGE VERIFIED')
          set_status('WALK-CHICKEN-096', 'PUBLISHED — PACKAGE VERIFIED; LIVE CONFIRMATION PENDING')

          marker = '## v0.7.8 immutable publication evidence'
          if marker not in text:
              publisher_run = Path('publisher-run-id.txt').read_text().strip()
              cleanup_run = os.environ['GITHUB_RUN_ID']
              text = text.rstrip() + f'''\n\n{marker}\n\n- Clean tagged source: `073e10be71d589145beb93e025f946a6661403d3`\n- Tag and release: `v0.7.8`\n- Publication workflow run: `{publisher_run}` — passed\n- Cleanup and release-audit workflow run: `{cleanup_run}`\n- Published assets: Windows ZIP, ZIP SHA-256, and per-file manifest\n- Published assets were re-downloaded, checksum-verified, extracted, and audited against every manifest row\n- Release tag resolves exactly to the clean tagged source commit\n- Merged work branch deletion and zero-open-PR audit are performed by the same cleanup run\n- Adam's released-package screenshots remain the final authority for WALK-LIVE-066, WALK-REG-029, and the live portion of WALK-CHICKEN-096\n'''
          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add missioncache.md
          git commit -m "Record Runner v0.7.8 publication evidence"
          git push origin HEAD:main

      - name: Delete merged work branch and audit PRs
        shell: bash
        run: |
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/$WORK_BRANCH"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$WORK_BRANCH" \
              >/dev/null 2>&1; then
            echo "Merged branch still exists"
            exit 1
          fi
          test "$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number --jq 'length')" = 0
