name: Apply Runner v0.7.18 runtime recovery through recognized gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-runner-v0718-recognized-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/v0718-runtime-recovery' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0718-runtime-recovery
          fetch-depth: 0

      - name: Cache released runtime regressions first
        run: python tools/apply_v0718_runtime_recovery.py cache

      - name: Commit mission cache before source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git diff --cached --check
          git commit -m 'Cache Runner v0.7.18 runtime recovery missions'
          git push origin HEAD:agent/v0718-runtime-recovery

      - name: Apply source-wide runtime recovery
        run: python tools/apply_v0718_runtime_recovery.py implement

      - name: Commit product source, docs, and tests
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_v0718_runtime_recovery.py
          rm -f tools/v0718.trigger
          git add CMakeLists.txt README.md CHANGELOG.md missioncache.md docs tests src tools/apply_v0718_runtime_recovery.py tools/v0718.trigger
          git diff --cached --check
          git commit -m 'Implement Runner v0.7.18 runtime recovery'
          git push origin HEAD:agent/v0718-runtime-recovery
