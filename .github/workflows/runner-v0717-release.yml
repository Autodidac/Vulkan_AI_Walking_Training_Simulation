name: Finalize Runner v0.7.18 runtime recovery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: finalize-runner-v0718-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ github.head_ref == 'agent/v0718-runtime-recovery-exec' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0718-runtime-recovery-exec
          fetch-depth: 0

      - name: Apply audited v0.7.18 recovery source
        run: python tools/finalize_v0718_runtime_recovery.py

      - name: Commit source-wide recovery
        shell: bash
        run: |
          set -euo pipefail
          rm tools/finalize_v0718_runtime_recovery.py
          rm -f tools/apply_v0718_runtime_recovery.py tools/v0718.trigger
          rm -f .github/workflows/apply-v0718-runtime-recovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize Runner v0.7.18 runtime recovery source'
          git push origin HEAD:agent/v0718-runtime-recovery-exec
