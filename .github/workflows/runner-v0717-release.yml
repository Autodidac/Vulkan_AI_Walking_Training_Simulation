name: Runner v0.7.17 validation and release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: runner-v0717-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: 0.7.17
  RELEASE_TAG: v0.7.17
  PACKAGE_NAME: Runner-v0.7.17-windows-x64

jobs:
  linux-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record source SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Audit release source, missions, and optional art
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'project(Runner VERSION 0.7.17 LANGUAGES CXX)' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'1700u" src/ppo.hpp
          grep -F 'WALK-QUAD-CROUCH-181' missioncache.md
          grep -F 'WALK-RELEASE-210' missioncache.md
          grep -F '# Runner v0.7.18 equipment, carry, and target curriculum' missioncache.md
          grep -F 'RUNNER_V0717_EYE_TEST_CORRECTION.md' README.md
          test -f AGENTS.md
          test -f docs/RUNNER_V0717_EYE_TEST_CORRECTION.md
          test -f assets/optional/runner_armor_concepts/PROVENANCE.md
          test -f assets/optional/runner_armor_concepts/source/concept_modular_pair.ppm
          test -f assets/optional/runner_armor_concepts/source/concept_humanoid_parts.ppm
          test -f assets/optional/runner_armor_concepts/source/concept_helmeted_parts.ppm
          test -f assets/optional/runner_armor_concepts/source/concept_pixel_parts.ppm
          test -f assets/optional/runner_armor_concepts/runtime/foot_side.ppm
          test -f assets/optional/runner_armor_concepts/runtime/helmet_side.ppm
          test -f assets/optional/runner_armor_concepts/runtime/torso_side.ppm
          test -f assets/optional/runner_armor_concepts/runtime/weapon_side.ppm
          test ! -e tools/finalize_v0717_eye_test.py
          test ! -e tools/materialize_v0717_optional_art.py
          test ! -e tools/runner-v0717-release.generated.yml
          test ! -e .github/workflows/finalize-v0717-eye-test.yml
          test ! -e .github/workflows/apply-v0717-eye-test.yml
          test ! -e .github/workflows/runner-v0716-release.yml

      - name: Configure Linux deterministic suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/linux-release -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build and test Linux
        run: |
          cmake --build build/linux-release --parallel
          ctest --test-dir build/linux-release --output-on-failure -V --timeout 1800

  windows-package:
    needs: linux-validation
    runs-on: windows-2025
    timeout-minutes: 210
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.linux-validation.outputs.source_sha }}
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0717-release-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: runner-v0717-release-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build Windows SDL3/Vulkan application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Run complete Windows test matrix
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

      - name: Verify build-tree diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.17') { throw "Version mismatch: $version" }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Build-tree package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Build-tree acceptance matrix failed' }
            & $exe --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Build-tree camera diagnostic failed' }
          }
          finally { Pop-Location }

      - name: Install complete package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md, AGENTS.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe','run.bat','README.md','LICENSE','CHANGELOG.md','missioncache.md','AGENTS.md',
            'assets/chicken.ppm','shaders/flat.vert.spv','shaders/flat.frag.spv',
            'docs/SANDHYBRID_INTEGRATION_BRIDGE.md','docs/SandHybrid-missioncache.md',
            'docs/RUNNER_V0715_VIEWPORT_RECOVERY.md','docs/RUNNER_V0716_CAMERA_BATCH.md',
            'docs/RUNNER_V0717_EYE_TEST_CORRECTION.md',
            'assets/optional/runner_armor_concepts/PROVENANCE.md',
            'assets/optional/runner_armor_concepts/source/concept_modular_pair.ppm',
            'assets/optional/runner_armor_concepts/source/concept_humanoid_parts.ppm',
            'assets/optional/runner_armor_concepts/source/concept_helmeted_parts.ppm',
            'assets/optional/runner_armor_concepts/source/concept_pixel_parts.ppm',
            'assets/optional/runner_armor_concepts/runtime/foot_side.ppm',
            'assets/optional/runner_armor_concepts/runtime/helmet_side.ppm',
            'assets/optional/runner_armor_concepts/runtime/torso_side.ppm',
            'assets/optional/runner_armor_concepts/runtime/weapon_side.ppm')) {
            if (-not (Test-Path (Join-Path $stage $required))) {
              throw "Missing package file: $required"
            }
          }
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify installed package and optional-art fallback
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          try {
            & "$env:STAGE/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed package diagnostic failed' }
            & "$env:STAGE/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Installed acceptance matrix failed' }
            & "$env:STAGE/Runner.exe" --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Installed camera diagnostic failed' }
            $launched = (& cmd.exe /d /c "call `"$env:STAGE\run.bat`" --version" | Out-String).Trim()
            if ($launched -ne 'Runner 0.7.17') { throw "run.bat mismatch: $launched" }
            $optional = Join-Path $env:STAGE 'assets/optional'
            $backup = Join-Path $env:RUNNER_TEMP 'runner-optional-assets-backup'
            Remove-Item $backup -Recurse -Force -ErrorAction SilentlyContinue
            Move-Item $optional $backup
            & "$env:STAGE/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Missing-optional-art fallback failed' }
            Move-Item $backup $optional
          }
          finally { Pop-Location }

      - name: Create archive, checksum, and manifest
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"
          $checksum = "$archive.sha256"
          $manifest = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.manifest.sha256"
          Remove-Item $archive,$checksum,$manifest -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$env:STAGE/*" -DestinationPath $archive -Force
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash  $env:PACKAGE_NAME.zip" | Set-Content $checksum -Encoding ascii
          Get-ChildItem $env:STAGE -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($env:STAGE.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $relative"
          } | Set-Content $manifest -Encoding ascii

      - name: Independently extract and re-audit archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"
          $audit = Join-Path $env:RUNNER_TEMP 'runner-v0717-extracted-audit'
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          Push-Location $env:RUNNER_TEMP
          try {
            & "$audit/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package diagnostic failed' }
            & "$audit/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Extracted acceptance matrix failed' }
            & "$audit/Runner.exe" --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Extracted camera diagnostic failed' }
            $launched = (& cmd.exe /d /c "call `"$audit\run.bat`" --version" | Out-String).Trim()
            if ($launched -ne 'Runner 0.7.17') { throw "Extracted run.bat mismatch: $launched" }
          }
          finally { Pop-Location }

      - name: Upload audited release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            ${{ env.PACKAGE_NAME }}.zip.sha256
            ${{ env.PACKAGE_NAME }}.manifest.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: release-assets
      - name: Create annotated source tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "Runner $RELEASE_VERSION"
          git push origin "$RELEASE_TAG"
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Runner v0.7.17 corrects the released crouch, gait, terrain-foot, and optional-art failures and completes the associated 30-mission cache batch.

          - Replaces terrain-hostile heel/ball/toe collision feet with one support stub per leg and forward side-view sprite boots.
          - Requires sustained sagittal gait, rejects crab walking, and prevents short inherited samples from skipping Stand, Crouch, or Walk.
          - Makes the quadruped press rig-aware and requires a stable four-chain recovery after retraction.
          - Packages compact P3 references derived from all four supplied concept sheets plus foot, helmet, torso, and Rig Lab weapon sprites with procedural fallback.
          - Adds deterministic dwell, gait, stub-foot, quadruped press/recovery, optional-art, package, and state-isolation gates.

          Equipment, target, policy-extension, and carry/fire work remains explicitly cached for Runner v0.7.18.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Runner v0.7.17" --notes-file release-notes.md
      - name: Re-download and verify published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-download
          gh release download "$RELEASE_TAG" --dir release-download
          for source in release-assets/*; do
            file=$(basename "$source")
            test -f "release-download/$file"
            cmp --silent "$source" "release-download/$file"
          done
          (cd release-download && sha256sum -c "$PACKAGE_NAME.zip.sha256")
      - name: Remove completed release branch
        shell: bash
        run: |
          encoded=${RELEASE_BRANCH//\//%2F}
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" || true
        env:
          RELEASE_BRANCH: agent/v0717-eye-test-feet-gait-batch25
