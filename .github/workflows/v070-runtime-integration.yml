name: Validate v0.7 runtime completion

on:
  push:
    branches:
      - work/mission-cache-completion
    paths:
      - tools/integrate_v070_runtime.py
      - tests/runtime_pipeline_tests.cpp
      - .github/workflows/v070-runtime-integration.yml

permissions:
  contents: write

jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/mission-cache-completion
          fetch-depth: 0

      - name: Integrate runtime completion
        run: |
          python tools/integrate_v070_runtime.py
          git diff --check

      - name: Configure Linux CPU release
        run: >-
          cmake -S . -B build/linux-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEPOCHRUNNER_BUILD_APP=OFF
          -DEPOCHRUNNER_BUILD_TESTS=ON

      - name: Build Linux CPU tests
        run: cmake --build build/linux-release --parallel 2

      - name: Run Linux deterministic and runtime tests
        run: ctest --test-dir build/linux-release --output-on-failure -V

      - name: Configure ThreadSanitizer
        run: >-
          cmake -S . -B build/linux-tsan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DEPOCHRUNNER_BUILD_APP=OFF
          -DEPOCHRUNNER_BUILD_TESTS=ON
          -DEPOCHRUNNER_ENABLE_TSAN=ON

      - name: Build ThreadSanitizer runtime test
        run: cmake --build build/linux-tsan --target EpochRunnerRuntimePipelineTests --parallel 2

      - name: Run ThreadSanitizer runtime test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build/linux-tsan -R EpochRunner.RuntimePipeline --output-on-failure -V

      - name: Commit exact Linux-tested source
        run: |
          rm tools/integrate_v070_runtime.py
          rm .github/workflows/v070-runtime-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete v0.7 worker-owned runtime pipeline'
          git push origin HEAD:work/mission-cache-completion
