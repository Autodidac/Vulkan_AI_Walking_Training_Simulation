name: Refine Runner v0.7.15 cache first

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: refine-runner-v0715-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cache:
    if: startsWith(github.head_ref, 'agent/v0715-')
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.cache.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Materialize cached risks before implementation
        id: cache
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f tools/cache_v0715_refinement.py ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/cache_v0715_refinement.py
          rm -f tools/cache_v0715_refinement.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Cache final Runner v0.7.15 refinement risks'
          git push origin HEAD:"${{ github.head_ref }}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  linux:
    needs: cache
    if: needs.cache.outputs.changed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Apply final cached refinement
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/apply_v0715_refinement.py ]]; then
            python3 tools/apply_v0715_refinement.py
          fi
          rm -f tools/apply_v0715_refinement.py tools/v0715-refinement-*.txt
          git diff --check

      - name: Configure, build, and test Linux
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build/refine -G Ninja -DRUNNER_BUILD_APP=OFF -DRUNNER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/refine --parallel
          ctest --test-dir build/refine --output-on-failure -V --timeout 1800

      - name: Commit exact tested source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m 'Remove crouch foot pinning and preserve physical traction'
            git push origin HEAD:"${{ github.head_ref }}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    needs: linux
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.linux.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0715-refine-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: runner-v0715-refine-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Build and test Windows SDL3/Vulkan application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

      - name: Diagnose exact Windows runtime
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Acceptance diagnostic failed' }
          }
          finally { Pop-Location }
