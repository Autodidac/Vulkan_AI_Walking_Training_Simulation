name: Apply Runner v0.7.15 repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-runner-v0714-final.yml

permissions:
  contents: write

concurrency:
  group: runner-v0715-repair
  cancel-in-progress: false

jobs:
  patch-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/v0715-ground-camera-character-scale

      - name: Apply staged source repair
        run: python3 tools/apply_v0715_patch.py

      - name: Remove temporary branch patch machinery
        run: rm -f tools/apply_v0715_patch.py .github/workflows/patch-runner-v0715.yml

      - name: Configure core tests
        run: cmake -S . -B build -G Ninja -DRUNNER_BUILD_APP=OFF -DRUNNER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build core tests
        run: cmake --build build --parallel 2

      - name: Run core tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify v0.7.15 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'live_pixels_per_meter = 22.0f' src/app.cpp
          ! grep -q 'draw_course_ground(environment, viewport, camera_x, 90.0f)' src/app.cpp
          ! grep -q 'std::vector<Vec2> surface' src/app.cpp
          grep -q 'RESTORED CHAMPION AND RESTARTED LESSON' src/autonomy_curriculum.cpp
          grep -q "0x0007'1500u" src/ppo.hpp
          grep -q 'project(Runner VERSION 0.7.15' CMakeLists.txt

      - name: Commit validated repair to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix v0.7.15 live scale terrain rendering and failed-policy recovery'
          git push origin HEAD:agent/v0715-ground-camera-character-scale
