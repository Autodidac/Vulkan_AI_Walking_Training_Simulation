name: Finalize Runner v0.7.14 release ledger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-runner-v0714-final.yml

permissions:
  contents: write

concurrency:
  group: finalize-runner-v0714-ledger
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATED_SOURCE_SHA: 4d7b43af2372d6f0ea3fc7739b90c8387395b51d
      RELEASE_SOURCE_SHA: 3b1eed7cc7fd8dfac6166e9d6220fe1e45d8a53f
      VALIDATION_RUN_ID: '30933084549'
      RELEASE_AUDIT_RUN_ID: '30943464643'
      VALIDATED_ARTIFACT_ID: '8902626678'
      VALIDATED_ARTIFACT_DIGEST: sha256:516142ef91ac9d7f52f6e8cf259212484a201a4ccd1cc5a9e99558806b670d36
      FINAL_ZIP_SHA256: A7A550DF7CC7E9FE7943C7856769DCC623816B6A6FB2CE8670E0479B6629149B
      RELEASE_URL: https://github.com/Autodidac/Vulkan_AI_Walking_Training_Simulation/releases/tag/v0.7.14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-audit published release bytes
        shell: bash
        run: |
          set -euo pipefail
          audit="$RUNNER_TEMP/runner-v0714-final-ledger-audit"
          rm -rf "$audit"
          mkdir -p "$audit"
          gh release view v0.7.14 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release download v0.7.14 --repo "$GITHUB_REPOSITORY" --dir "$audit"
          for required in \
            Runner-v0.7.14-windows-x64.zip \
            Runner-v0.7.14-windows-x64.zip.sha256 \
            Runner-v0.7.14-windows-x64.manifest.sha256; do
            test -f "$audit/$required"
          done
          actual="$(sha256sum "$audit/Runner-v0.7.14-windows-x64.zip" | awk '{print toupper($1)}')"
          expected="$(tr -d '\r\n[:space:]' < "$audit/Runner-v0.7.14-windows-x64.zip.sha256" | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$expected"
          test "$actual" = "$FINAL_ZIP_SHA256"
          mkdir -p "$audit/extracted"
          unzip -q "$audit/Runner-v0.7.14-windows-x64.zip" -d "$audit/extracted"
          sed -i 's/\r$//' "$audit/Runner-v0.7.14-windows-x64.manifest.sha256"
          (cd "$audit/extracted" && sha256sum -c "$audit/Runner-v0.7.14-windows-x64.manifest.sha256")
          echo '2f99c87459bb1fbc28bc556e8df07b58a5b2d51650a300563bffcb8a38a57f19  assets/optional/runner_armor_concepts/runner_armor_concepts.webp' |
            (cd "$audit/extracted" && sha256sum -c -)

      - name: Publish immutable mission evidence and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'^\*\*Release state:\*\*.*$',
              '**Release state:** PUBLISHED — Runner v0.7.14 source, natural toe-motion gate, live SandHybrid terrain, Windows stack fix, optional armor reference, no-asset fallback, Windows package, checksum, manifest, released executable, release download audit, pull-request cleanup, and branch cleanup verified.',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit('release state missing')

          for name in (
              'WALK-SANDLIB-129',
              'WALK-TERRAINSCALE-130',
              'WALK-HYBRIDMAP-131',
              'WALK-LIVEMAP-132',
              'WALK-BRIDGE-133',
              'WALK-WINSTACK-137',
              'WALK-RELEASE-135',
          ):
              pattern = rf'(### {name}[^\n]*\n)\*\*Status:\*\*[^\n]*'
              text, count = re.subn(
                  pattern,
                  rf'\1**Status:** PUBLISHED — RELEASE VERIFIED',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'missing mission {name}')

          pattern = r'(### WALK-ART-136[^\n]*\n)\*\*Status:\*\*[^\n]*'
          text, count = re.subn(
              pattern,
              r'\1**Status:** PUBLISHED — OPTIONAL REFERENCE, NON-BLOCKING',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('missing mission WALK-ART-136')

          marker = '## v0.7.14 immutable release evidence'
          if marker in text:
              text = text[:text.index(marker)].rstrip() + '\n'

          evidence = f'''\n## v0.7.14 immutable release evidence

- Published tag and title: `v0.7.14` / `Runner v0.7.14`
- Exact tested source: `{os.environ['VALIDATED_SOURCE_SHA']}`
- Release source commit: `{os.environ['RELEASE_SOURCE_SHA']}`
- Validation workflow run: `{os.environ['VALIDATION_RUN_ID']}`
- Release package/executable audit workflow run: `{os.environ['RELEASE_AUDIT_RUN_ID']}`
- Final ledger audit workflow run: `{os.environ['GITHUB_RUN_ID']}`
- Actions artifact ID: `{os.environ['VALIDATED_ARTIFACT_ID']}`
- Actions artifact digest: `{os.environ['VALIDATED_ARTIFACT_DIGEST']}`
- Published Windows ZIP SHA-256: `{os.environ['FINAL_ZIP_SHA256']}`
- Release URL: `{os.environ['RELEASE_URL']}`
- Published assets: Windows ZIP, ZIP SHA-256, and per-file manifest
- Published assets re-downloaded and byte-compared with the validated artifact: passed
- Published ZIP checksum and per-file manifest re-audit: passed
- Released executable, `run.bat`, package diagnostics, and all-rig acceptance: passed on Windows
- Linux GCC 14 warnings-as-errors build and deterministic suite: passed
- Full Windows SDL3/Vulkan build and complete test matrix: passed
- Every preset Stand 6/6 and static Crouch 4/4 acceptance gate: passed
- Optional armor concept contact sheet packaged with verified hash: passed
- Missing optional-art fallback package and all-rig diagnostics: passed
- Reachable ledge climbing and backward controlled descent remain explicitly open for the next release
- Contradictory released-package evidence reopens only the exact affected mission
'''
          path.write_text(text.rstrip() + '\n\n' + evidence.strip() + '\n', encoding='utf-8', newline='\n')
          PY

          git rm .github/workflows/publish-runner-v0714-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git commit -m 'Finalize immutable Runner v0.7.14 release ledger'
          git push origin main

      - name: Remove temporary release branches
        if: always()
        shell: bash
        run: |
          for branch in \
            agent/v0713-publish-trigger \
            agent/v0713-toe-rate-gate \
            agent/v0714-run-observer \
            agent/v0714-sandhybrid-live-map-integration; do
            git push origin --delete "$branch" 2>/dev/null || true
          done
