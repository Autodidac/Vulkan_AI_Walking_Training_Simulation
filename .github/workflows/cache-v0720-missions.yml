name: Cache Runner v0.7.20 missions

on:
  push:
    branches: [agent/v0720-ui-preview-icon]
    paths:
      - tools/cache_v0720_ui_preview.py
      - .github/workflows/cache-v0720-missions.yml

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0720-ui-preview-icon
          fetch-depth: 0
      - name: Cache missions
        run: |
          set -euo pipefail
          python3 tools/cache_v0720_ui_preview.py
          grep -F 'WALK-DPI-253' missioncache.md
          grep -F 'WALK-RELEASE-262' missioncache.md
          rm tools/cache_v0720_ui_preview.py
          rm .github/workflows/cache-v0720-missions.yml
          git diff --check
      - name: Commit authoritative mission cache
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Cache Runner v0.7.20 UI and preview missions'
          git push origin HEAD:agent/v0720-ui-preview-icon
