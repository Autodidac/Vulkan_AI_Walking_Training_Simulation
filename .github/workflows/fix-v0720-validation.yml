name: Fix Runner v0.7.20 validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/v0720-ui-preview-icon'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0720-ui-preview-icon
          fetch-depth: 0
      - name: Apply targeted repair
        run: |
          set -euo pipefail
          python3 tools/fix_v0720_validation.py
          rm tools/fix_v0720_validation.py
          rm -rf tools/__pycache__
          git diff --check
          grep -F 'minimum_window_width = 1280.0f' src/ui_layout.hpp
          grep -F 'live_layout_valid(1280.0f, 820.0f)' tests/core_tests.cpp
      - name: Commit repaired source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix v0.7.20 minimum layout validation'
          git push origin HEAD:agent/v0720-ui-preview-icon
