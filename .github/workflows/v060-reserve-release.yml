name: Reserve EpochRunner v0.6.0 release tag

on:
  push:
    paths:
      - ".github/workflows/v060-reserve-release.yml"

permissions:
  contents: write

jobs:
  reserve:
    runs-on: ubuntu-latest
    steps:
      - name: Reserve v0.6.0 as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view v0.6.0 >/dev/null 2>&1; then
            echo "v0.6.0 is already reserved or published"
            exit 0
          fi
          gh release create v0.6.0 \
            --draft \
            --target "$GITHUB_SHA" \
            --title "EpochRunner v0.6.0 — reserved during final validation" \
            --notes "Temporary draft reservation. Final assets are published only after the current full release gate passes."
