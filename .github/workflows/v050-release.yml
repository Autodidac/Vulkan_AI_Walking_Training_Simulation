name: EpochRunner v0.5.0 validation and release

on:
  push:
    paths:
      - ".github/workflows/v050-release.yml"

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  build-test-release:
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.5 source integration
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          app = Path("src/app.cpp")
          text = app.read_text(encoding="utf-8")
          text = text.replace("epochrunner-v041-autosave.eppo", "epochrunner-v050-autosave.eppo")
          text = text.replace("epochrunner-v041-evolved.epochrig", "epochrunner-v050-evolved.epochrig")
          text = text.replace("epochrunner-v041-autonomy.state", "epochrunner-v050-autonomy.state")
          text = text.replace(
              '            trainer.set_blueprint(blueprint, true);\n            set_status(std::format("{} - CONTROLLER TRANSFERRED AND RECALIBRATING", reason));',
              '            trainer.set_blueprint(blueprint, true);\n            set_status(std::format("{} - QUEUED WITHOUT BLOCKING; CONTROLLER RECALIBRATES IN BACKGROUND", reason));')
          stale_sync = '''            if (!dragging_node && !rig_edit_pending
              && trainer.blueprint().signature() != blueprint.signature())
          {
              blueprint = trainer.blueprint();
              rig_preset = RigPreset::custom;
          }
'''
          if stale_sync not in text:
              raise SystemExit("Expected blocking rig synchronization block was not found")
          text = text.replace(stale_sync, "")
          metrics_anchor = '''            add_text(canvas, cursor, std::format("{} CPU ROLLOUT THREADS / {} ENVIRONMENTS",
              autonomy.rollout_threads, autonomy.environment_count), 1.12f, muted);
          cursor.y += 23.0f;
'''
          metrics_replacement = metrics_anchor + '''            add_text(canvas, cursor, std::format("TRAIN {:.2f} UPDATES/S   MODE {}   QUEUED {}",
              autonomy.updates_per_second, autonomy.speed_mode, autonomy.pending_commands), 1.10f, white);
          cursor.y += 23.0f;
'''
          if metrics_anchor not in text:
              raise SystemExit("Expected trainer metrics anchor was not found")
          text = text.replace(metrics_anchor, metrics_replacement)
          app.write_text(text, encoding="utf-8")

          tests = Path("tests/core_tests.cpp")
          text = tests.read_text(encoding="utf-8")
          text = text.replace("epochrunner-v041-core-test.eppo", "epochrunner-v050-core-test.eppo")
          old = '''        autonomous.train_one_update();
          for (int attempt = 0; attempt < 400 && autonomous.metrics().update == 0; ++attempt)
          {
              std::this_thread::sleep_for(std::chrono::milliseconds(5));
              autonomous.synchronize();
          }
          require(autonomous.metrics().update >= 1, "coroutine background worker did not process requested update");
'''
          new = old + '''
          sim::CreatureBlueprint edited = humanoid;
          edited.nodes[1].x += 0.01f;
          edited.rebuild_rest_lengths();
          const auto command_started = std::chrono::steady_clock::now();
          autonomous.set_blueprint(edited, true);
          const auto command_elapsed = std::chrono::steady_clock::now() - command_started;
          require(command_elapsed < std::chrono::milliseconds(20),
              "hip edit blocked the caller on active training work");
          for (int attempt = 0; attempt < 800 && autonomous.rig_signature() != edited.signature(); ++attempt)
          {
              std::this_thread::sleep_for(std::chrono::milliseconds(5));
              autonomous.synchronize();
          }
          require(autonomous.rig_signature() == edited.signature(),
              "queued hip edit was not eventually applied");
          autonomous.set_updates_per_cycle(1);
          require(autonomous.updates_per_cycle() == 1, "normal speed mode did not latch");
          autonomous.set_updates_per_cycle(2);
          require(autonomous.updates_per_cycle() == 2, "faster speed mode did not latch");
          autonomous.set_updates_per_cycle(4);
          require(autonomous.updates_per_cycle() == 4, "max CPU speed mode did not latch");
'''
          if old not in text:
              raise SystemExit("Expected autonomous test anchor was not found")
          text = text.replace(old, new)
          text = text.replace(
              'std::cout << "EpochRunner v0.4.1 autonomous gait and curriculum tests passed\\n";',
              'std::cout << "EpochRunner v0.5.0 concurrent trainer, gait, and rig-edit tests passed\\n";')
          tests.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("Version 0.4.1", "Version 0.5.0")
          text = text.replace("Version 0.4", "Version 0.5")
          text = text.replace(
              "- A coroutine-driven background supervisor handles training cycles, deterministic evaluation, curriculum transitions, autosaves, rollback, and bounded rig evolution.",
              "- A real C++23 coroutine pipeline separates queued UI commands, PPO updates, curriculum work, snapshot publication, and throttling into resumable stages.\n- Rig edits never wait on PPO, evaluation, evolution, or autosave locks; they are coalesced and applied by the trainer thread.\n- Persistent rollout workers parallelize environment simulation, while deterministic rig candidates evaluate concurrently.")
          text = text.replace(
              "- Rollouts are divided across up to 16 CPU workers while reserving CPU capacity for the application and Vulkan presentation.",
              "- Rollouts are divided across up to 16 persistent CPU workers while reserving CPU capacity for the application and Vulkan presentation. NORMAL, FASTER, and MAX CPU now control measured trainer duty cycle.")
          readme.write_text(text, encoding="utf-8")
          '@ | Set-Content -Encoding UTF8 patch_v050.py
          python patch_v050.py
          Remove-Item patch_v050.py

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-vs2022-release --fresh

      - name: Build Windows release
        run: cmake --build --preset windows-vs2022-release

      - name: Run deterministic and concurrency tests
        run: ctest --preset windows-vs2022-release --output-on-failure

      - name: Verify executable version
        shell: pwsh
        run: build/windows-vs2022-release/Release/EpochRunner.exe --version

      - name: Package Windows release
        shell: pwsh
        run: |
          $package = Join-Path $PWD "package/EpochRunner-v0.5.0-windows-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          cmake --install build/windows-vs2022-release --config Release --prefix $package
          Get-ChildItem build/windows-vs2022-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $package -Force
          Copy-Item README.md, LICENSE -Destination $package -Force
          Compress-Archive -Path "$package/*" -DestinationPath "EpochRunner-v0.5.0-windows-x64.zip" -Force

      - name: Commit validated source and remove one-time workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/v050-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md src tests .github/workflows/v050-release.yml
          git commit -m "Release EpochRunner v0.5.0 concurrent trainer"
          git push origin HEAD:main

      - name: Publish v0.5.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $target = git rev-parse HEAD
          gh release create v0.5.0 EpochRunner-v0.5.0-windows-x64.zip `
            --target $target `
            --title "EpochRunner v0.5.0" `
            --notes "Non-blocking rig editing; real coroutine-staged trainer runtime; persistent parallel rollout workers; concurrent rig evaluation; functional NORMAL, FASTER, and MAX CPU modes; measured updates-per-second telemetry; hip-edit regression coverage."
