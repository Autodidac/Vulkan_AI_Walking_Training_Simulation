name: Correct Runner v0.7.11 artwork ledger

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  correct:
    if: github.head_ref == 'maintenance/v0711-ledger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct superseded artwork acceptance text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')
          old = 'The original `assets/chicken.ppm` artwork is loaded during application startup, rendered in the live top bar, and remains a required packaged runtime asset. Missing or malformed art fails initialization instead of silently reverting to a placeholder.'
          new = 'The original `assets/chicken.ppm` artwork is loaded during application startup and rendered in the live top bar when valid. Release/package validation requires a valid packaged asset; normal startup shows an artwork warning and continues without the decoration if a user-side copy is missing or malformed.'
          if text.count(old) != 1:
              raise SystemExit(f'expected one obsolete artwork sentence, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F 'normal startup shows an artwork warning and continues' missioncache.md
          git diff --check
      - name: Commit ledger correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git commit -m 'Align v0.7.11 artwork mission with released behavior'
          git push origin HEAD:main
      - name: Close trigger PR and remove branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --comment 'Ledger correction applied to main.'
          gh api --silent -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/${{ github.head_ref }}"
