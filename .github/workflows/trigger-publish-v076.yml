name: Trigger Runner v0.7.6 Publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - tools/publish_v076.py
      - .github/workflows/trigger-publish-v076.yml

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: publish-runner-v076
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Publish and audit Runner v0.7.6
        run: python3 tools/publish_v076.py
