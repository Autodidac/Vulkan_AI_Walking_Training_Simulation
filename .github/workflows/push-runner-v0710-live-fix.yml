name: Push validate Runner v0.7.10 live fix

on:
  push:
    branches:
      - agent/v0710-press-curriculum-fix

permissions:
  contents: write

concurrency:
  group: runner-v0710-live-fix-push
  cancel-in-progress: true

jobs:
  linux-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0710-press-curriculum-fix
          fetch-depth: 0

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Apply fixes and remove temporary branch workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v0710_press_curriculum_fix.py
          rm -f .github/workflows/fix-publish-runner-v0710.yml
          rm -f VALIDATE_LIVE_FIX.tmp PUBLISH_TRIGGER_v0710.tmp PUBLISH_RUN_v0710.tmp PUBLISH_RUN_v0710_2.tmp
          git diff --check
          grep -F 'press_anchor_x' src/simulation.cpp
          grep -F 'particle.previous += correction;' src/simulation.cpp
          grep -F 'balance_mastery_lock_confirmations = 3' src/autonomy.hpp
          grep -F 'standing_mastery_joint_speed_limit = 10.0f' src/autonomy.hpp
          grep -F 'JOINT {:.1f}/{:.1f}' src/autonomy_curriculum.cpp
          grep -F 'WALK-PRESS-109' missioncache.md
          grep -F 'WALK-CURRICULUM-110' missioncache.md

      - name: Build and test Linux suite
        env:
          CC: gcc-14
          CXX: g++-14
        shell: bash
        run: |
          cmake -S . -B build/linux-v0710-live-fix -G Ninja \
            -DRUNNER_BUILD_APP=OFF \
            -DRUNNER_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux-v0710-live-fix --parallel
          ctest --test-dir build/linux-v0710-live-fix --output-on-failure -V --timeout 1200

      - name: Commit exact Linux-tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix duck press sliding and unlock Stand curriculum'
          git push origin HEAD:agent/v0710-press-curriculum-fix

  windows-package:
    if: github.actor != 'github-actions[bot]'
    needs: linux-source
    runs-on: windows-2025
    timeout-minutes: 100
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0710-press-curriculum-fix
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: runner-v0710-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            runner-v079-${{ runner.os }}-
            runner-v078-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Build and test full Windows application
        shell: pwsh
        run: |
          foreach ($path in @('tools/apply_v0710_press_curriculum_fix.py','.github/workflows/fix-publish-runner-v0710.yml','VALIDATE_LIVE_FIX.tmp')) {
            if (Test-Path $path) { throw "Temporary source remains: $path" }
          }
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          ctest --preset windows-release --output-on-failure -V --timeout 1200
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            if ((& $exe --version | Out-String).Trim() -ne 'Runner 0.7.10') { throw 'Version mismatch' }
            & $exe --diagnose-vulkan
            if ($LASTEXITCODE -ne 0) { throw 'Vulkan diagnostic failed' }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Acceptance diagnostic failed' }
          }
          finally { Pop-Location }

      - name: Install and audit package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.10-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue | Copy-Item -Destination $stage -Force
          foreach ($required in @('Runner.exe','run.bat','README.md','CHANGELOG.md','missioncache.md','shaders/flat.vert.spv','shaders/flat.frag.spv','assets/chicken.ppm')) {
            if (-not (Test-Path "$stage/$required")) { throw "Missing package file: $required" }
          }
          $outside = "$env:RUNNER_TEMP/runner-v0710-live-fix-unrelated"
          New-Item -ItemType Directory -Force $outside | Out-Null
          Push-Location $outside
          try {
            if ((& "$stage/Runner.exe" --version | Out-String).Trim() -ne 'Runner 0.7.10') { throw 'Installed version mismatch' }
            & "$stage/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed package diagnostic failed' }
            & "$stage/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Installed acceptance diagnostic failed' }
            if ((& cmd.exe /d /c "call `"$stage\run.bat`" --version" | Out-String).Trim() -ne 'Runner 0.7.10') { throw 'run.bat version mismatch' }
          }
          finally { Pop-Location }
          $archive = "$env:GITHUB_WORKSPACE/Runner-v0.7.10-windows-x64.zip"
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Set-Content "$archive.sha256"
          Get-ChildItem $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          } | Set-Content 'Runner-v0.7.10-windows-x64.manifest.sha256'
          $audit = "$env:RUNNER_TEMP/runner-v0710-live-fix-extracted"
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          $expected = Get-Content 'Runner-v0.7.10-windows-x64.manifest.sha256'
          $actual = Get-ChildItem $audit -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($audit.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          }
          if (Compare-Object $expected $actual) { throw 'Archive manifest audit failed' }
          & "$audit/Runner.exe" --diagnose-package
          if ($LASTEXITCODE -ne 0) { throw 'Extracted package diagnostic failed' }
          & "$audit/Runner.exe" --diagnose-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Extracted acceptance diagnostic failed' }

      - id: package
        uses: actions/upload-artifact@v4
        with:
          name: Runner-v0.7.10-windows-x64-live-fix
          path: |
            Runner-v0.7.10-windows-x64.zip
            Runner-v0.7.10-windows-x64.zip.sha256
            Runner-v0.7.10-windows-x64.manifest.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Record validated package evidence
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.package.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.package.outputs.artifact-digest }}
        run: |
          $path = 'missioncache.md'
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, '(?m)^\*\*Release state:\*\*.*$', '**Release state:** PACKAGE VERIFIED — corrected Runner v0.7.10 passed press/curriculum regressions, Linux, full Windows Vulkan, installed/extracted diagnostics, and archive audit; publication pending.', 1)
          foreach ($mission in 109..111) {
            $pattern = "(?m)(### WALK-[^`r`n]*-{0:D3}[^`r`n]*\r?\n)\*\*Status:\*\*[^`r`n]*" -f $mission
            $updated = [regex]::Replace($text, $pattern, '$1**Status:** PACKAGE VERIFIED', 1)
            if ($updated -eq $text) { throw "Missing mission $mission" }
            $text = $updated
          }
          $marker = '## v0.7.10 corrected validation evidence'
          $index = $text.IndexOf($marker)
          if ($index -ge 0) { $text = $text.Substring(0, $index).TrimEnd() }
          $evidence = @"

## v0.7.10 corrected validation evidence

- Validation workflow run: `$env:GITHUB_RUN_ID`
- Exact validated source: `$(git rev-parse HEAD)`
- Artifact ID: `$env:ARTIFACT_ID`
- Artifact digest: `$env:ARTIFACT_DIGEST`
- Press fixed anchor and velocity-preserving correction tests: passed
- Stand all-six-seed mastery and visible joint-speed gate tests: passed
- Linux GCC 14 warnings-as-errors and all tests: passed
- Full Windows Vulkan build and all tests: passed
- Build-tree, installed, and extracted diagnostics: passed
- ZIP checksum and per-file manifest audit: passed
"@
          Set-Content $path ($text.TrimEnd() + $evidence) -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git commit -m 'Record corrected Runner v0.7.10 package validation'
          git push origin HEAD:agent/v0710-press-curriculum-fix
