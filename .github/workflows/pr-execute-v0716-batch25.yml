name: PR materialize Runner v0.7.16 source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr-materialize-runner-v0716-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/v0716-camera-batch25'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0716-camera-batch25
          fetch-depth: 0

      - name: Apply repaired implementation
        run: python tools/repair_v0716_retry.py

      - name: Preserve generated release workflow outside workflow directory
        run: cp .github/workflows/runner-v0716-release.yml tools/runner-v0716-release.generated.yml

      - name: Restore workflow directory for token-safe source push
        run: |
          git checkout HEAD -- .github/workflows
          rm -f .github/workflows/runner-v0716-release.yml

      - name: Remove consumed source applicators
        run: |
          rm tools/apply_v0716_batch25.py
          rm tools/repair_v0716_retry.py

      - name: Commit product source, tests, and documents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "Implement Runner v0.7.16 adaptive camera batch"
          git push origin HEAD:agent/v0716-camera-batch25
