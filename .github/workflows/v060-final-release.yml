name: Finalize EpochRunner v0.6.0

on:
  push:
    paths:
      - ".github/workflows/v060-final-release.yml"

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  build-test-package-release:
    runs-on: windows-2025

    steps:
      - name: Checkout exact current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-v060-final-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-v060-release-${{ runner.os }}-
            epochrunner-v060-vcpkg-${{ runner.os }}-

      - name: Run complete release gate and preserve evidence
        id: gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force validation | Out-Null
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

          function Run-Stage([string]$Name, [scriptblock]$Command) {
            $log = "validation/v060-final-$Name.log"
            & $Command *> $log
            return $LASTEXITCODE
          }

          $bootstrap = Run-Stage "bootstrap" { cmd /c "call `"$env:VCPKG_ROOT\bootstrap-vcpkg.bat`" -disableMetrics" }
          $configure = -1
          $build = -1
          $tests = -1
          $version = -1
          $vulkan = -1
          $install = -1

          if ($bootstrap -eq 0) {
            $configure = Run-Stage "configure" { cmake --preset windows-release --fresh }
          } else {
            "Skipped because vcpkg bootstrap failed." | Set-Content validation/v060-final-configure.log
          }

          if ($configure -eq 0) {
            $build = Run-Stage "build" { cmake --build --preset windows-release }
          } else {
            "Skipped because configuration failed." | Set-Content validation/v060-final-build.log
          }

          if ($build -eq 0) {
            $tests = Run-Stage "tests" { ctest --preset windows-release --output-on-failure -V }
            $version = Run-Stage "version" { build/windows-release/Release/EpochRunner.exe --version }
            $vulkan = Run-Stage "vulkan" { build/windows-release/Release/EpochRunner.exe --diagnose-vulkan }
            $install = Run-Stage "install" { cmake --install build/windows-release --config Release --prefix package/EpochRunner-v0.6.0-windows-x64 }
          } else {
            "Skipped because compilation failed." | Set-Content validation/v060-final-tests.log
            "Skipped because compilation failed." | Set-Content validation/v060-final-version.log
            "Skipped because compilation failed." | Set-Content validation/v060-final-vulkan.log
            "Skipped because compilation failed." | Set-Content validation/v060-final-install.log
          }

          $env:CANDIDATE_SHA = (git rev-parse HEAD).Trim()
          $env:BOOTSTRAP_EXIT = "$bootstrap"
          $env:CONFIGURE_EXIT = "$configure"
          $env:BUILD_EXIT = "$build"
          $env:TESTS_EXIT = "$tests"
          $env:VERSION_EXIT = "$version"
          $env:VULKAN_EXIT = "$vulkan"
          $env:INSTALL_EXIT = "$install"

          @'
          from pathlib import Path
          import os

          stages = [
              ("vcpkg bootstrap", "BOOTSTRAP_EXIT", "bootstrap"),
              ("Visual Studio 2026 configure", "CONFIGURE_EXIT", "configure"),
              ("Full SDL3/Vulkan/EpochGui build", "BUILD_EXIT", "build"),
              ("Course, recovery, rig, concurrency, and throughput tests", "TESTS_EXIT", "tests"),
              ("Executable version check", "VERSION_EXIT", "version"),
              ("SDL3/Vulkan diagnostic", "VULKAN_EXIT", "vulkan"),
              ("Install/package staging", "INSTALL_EXIT", "install"),
          ]

          def state(key: str) -> str:
              code = int(os.environ[key])
              if code == 0:
                  return "success"
              if code == -1:
                  return "skipped"
              return f"failed ({code})"

          lines = [
              "# EpochRunner v0.6.0 final release gate",
              "",
              f"Candidate commit: `{os.environ['CANDIDATE_SHA']}`",
              "",
          ]
          for label, key, _ in stages:
              lines.append(f"- {label}: {state(key)}")
          for label, _, suffix in stages:
              path = Path("validation") / f"v060-final-{suffix}.log"
              log = path.read_text(encoding="utf-8", errors="replace") if path.exists() else "missing log"
              lines.extend(["", f"## {label}", "", "```text", log, "```"])
          Path("validation/v060-final-release-gate.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          '@ | python -

          "bootstrap=$bootstrap" >> $env:GITHUB_OUTPUT
          "configure=$configure" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          "tests=$tests" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "vulkan=$vulkan" >> $env:GITHUB_OUTPUT
          "install=$install" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Commit gate evidence regardless of result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/v060-final-release-gate.md
          git commit -m "Record final v0.6.0 release gate"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Reject failed release candidate
        if: >-
          steps.gate.outputs.bootstrap != '0' ||
          steps.gate.outputs.configure != '0' ||
          steps.gate.outputs.build != '0' ||
          steps.gate.outputs.tests != '0' ||
          steps.gate.outputs.version != '0' ||
          steps.gate.outputs.vulkan != '0' ||
          steps.gate.outputs.install != '0'
        shell: pwsh
        run: throw "EpochRunner v0.6.0 failed its final gate; inspect validation/v060-final-release-gate.md"

      - name: Mark course mission verified and clean temporary machinery
        id: source
        shell: pwsh
        run: |
          git fetch origin main
          git switch -C main origin/main
          @'
          from pathlib import Path

          path = Path("MISSIONS.md")
          text = path.read_text(encoding="utf-8")
          start = text.index("## WALK-COURSE-001")
          end = text.index("## Current warning", start)
          section = text[start:end].replace("**Status:** ACTIVE", "**Status:** VERIFIED", 1)
          text = text[:start] + section + text[end:]
          warning = (
              "## Current warning\n\n"
              "EpochRunner v0.6.0 passed the full Windows/Vulkan build, procedural course and recovery tests, "
              "concurrency benchmark, executable diagnostics, and packaging gate. Remaining ACTIVE/OPEN missions "
              "carry forward unchanged.\n"
          )
          text = text[:text.index("## Current warning")] + warning
          path.write_text(text, encoding="utf-8")
          '@ | python -

          Remove-Item .github/workflows/v060-final-release.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/v060-release-gate.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/v060-core-diagnostic.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/v060-full-diagnostic.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/v060-reserve-release.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/v060-integrate-release.yml -ErrorAction SilentlyContinue
          Remove-Item tools/integrate_v060.py -ErrorAction SilentlyContinue
          Remove-Item tools/patch_recovery_grace.py -ErrorAction SilentlyContinue

          git add -A
          git commit -m "Verify EpochRunner v0.6.0 procedural obstacle recovery course"
          git push origin HEAD:main
          $sourceSha = (git rev-parse HEAD).Trim()
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Build archive and checksum
        id: package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, MISSIONS.md -Destination package/EpochRunner-v0.6.0-windows-x64 -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination package/EpochRunner-v0.6.0-windows-x64 -Force
          $archive = "EpochRunner-v0.6.0-windows-x64.zip"
          Compress-Archive -Path "package/EpochRunner-v0.6.0-windows-x64/*" -DestinationPath $archive -Force
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
          $checksum | Set-Content "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Replace draft reservation with immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $draft = gh release view v0.6.0 --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft.Trim() -ne "true") {
              throw "A non-draft v0.6.0 release already exists; refusing to replace it"
            }
            gh release delete v0.6.0 --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Failed to remove temporary v0.6.0 reservation" }
          }

          gh release create v0.6.0 $env:ARCHIVE "$env:ARCHIVE.sha256" `
            --target $env:SOURCE_SHA `
            --title "EpochRunner v0.6.0" `
            --notes "Procedural obstacle and recovery treadmill: moving road dashes and numbered metre/mile markers; continuous inclines, plateaus, declines, hills, and uneven terrain; rocks, hurdles, overhead bars, moving hazards, and thrown projectiles; bounded physical disturbance; recoverable near-falls; timed recovery reward; persistent concurrent PPO architecture retained."
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish EpochRunner v0.6.0" }

      - name: Record immutable release evidence
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          git fetch origin main
          git switch -C main origin/main
          @"
          # EpochRunner v0.6.0 release evidence

          - Source commit: `$env:SOURCE_SHA`
          - Windows runner: `windows-2025`
          - Generator: `Visual Studio 18 2026`
          - Full SDL3/Vulkan/EpochGui application build: passed
          - Procedural terrain and all obstacle-class tests: passed
          - Stationary-course advancement and road-marker integration: passed
          - Recovery objective and near-fall grace tests: passed
          - Hip-edit, concurrency, optimizer, and speed-mode tests: passed
          - Executable version check: passed
          - SDL3/Vulkan diagnostic: passed
          - Package: `$env:ARCHIVE`
          - SHA-256: `$env:CHECKSUM`
          "@ | Set-Content -Encoding UTF8 validation/v0.6.0.md
          git add validation/v0.6.0.md
          git commit -m "Record v0.6.0 release evidence"
          git push origin HEAD:main
