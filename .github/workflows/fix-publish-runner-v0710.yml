name: Fix and publish Runner v0.7.10

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: runner-v0710-final-fix
  cancel-in-progress: false

jobs:
  linux-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Apply live press and curriculum fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v0710_press_curriculum_fix.py
          rm -f .github/workflows/fix-publish-runner-v0710.yml
          rm -f PUBLISH_TRIGGER_v0710.tmp PUBLISH_RUN_v0710.tmp PUBLISH_RUN_v0710_2.tmp

      - name: Verify corrected source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -f tools/apply_v0710_press_curriculum_fix.py
          test ! -f .github/workflows/fix-publish-runner-v0710.yml
          grep -F 'press_anchor_x' src/simulation.cpp
          grep -F 'particle.previous += correction;' src/simulation.cpp
          grep -F 'balance_mastery_lock_confirmations = 3' src/autonomy.hpp
          grep -F 'standing_mastery_joint_speed_limit = 10.0f' src/autonomy.hpp
          grep -F 'JOINT {:.1f}/{:.1f}' src/autonomy_curriculum.cpp
          grep -F 'WALK-PRESS-109' missioncache.md
          grep -F 'WALK-CURRICULUM-110' missioncache.md
          grep -F 'Live regression fixes' CHANGELOG.md

      - name: Configure Linux deterministic suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/linux-v0710-fix -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build and test Linux suite
        run: |
          cmake --build build/linux-v0710-fix --parallel
          ctest --test-dir build/linux-v0710-fix --output-on-failure -V --timeout 1200

      - name: Commit exact tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix duck press sliding and unlock Stand curriculum'
          git push origin HEAD:${{ github.head_ref }}

  windows-release:
    needs: linux-source
    runs-on: windows-2025
    timeout-minutes: 100
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
      TAG: v0.7.10
      RELEASE_TITLE: Runner v0.7.10
      PR_NUMBER: ${{ github.event.pull_request.number }}
      FIX_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Confirm exact clean fixed source
        shell: pwsh
        run: |
          foreach ($path in @(
            'tools/apply_v0710_press_curriculum_fix.py',
            '.github/workflows/fix-publish-runner-v0710.yml')) {
            if (Test-Path $path) { throw "Temporary validation source remains: $path" }
          }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Windows source checkout is dirty' }

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: runner-v0710-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            runner-v079-${{ runner.os }}-
            runner-v078-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build full Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Run complete Windows tests
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1200
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

      - name: Verify executable diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            if ((& $exe --version | Out-String).Trim() -ne 'Runner 0.7.10') { throw 'Version mismatch' }
            & $exe --diagnose-vulkan
            if ($LASTEXITCODE -ne 0) { throw 'Vulkan diagnostic failed' }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Acceptance diagnostic failed' }
          }
          finally { Pop-Location }

      - name: Record package-verified source state
        shell: pwsh
        run: |
          $path = 'missioncache.md'
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, '(?m)^\*\*Release state:\*\*.*$', '**Release state:** PACKAGE VERIFIED — corrected Runner v0.7.10 passed Linux, Windows, press/curriculum regression tests, executable diagnostics, and acceptance; publication audit pending.', 1)
          foreach ($mission in 109..111) {
            $pattern = "(?m)(### WALK-[^`r`n]*-{0:D3}[^`r`n]*\r?\n)\*\*Status:\*\*[^`r`n]*" -f $mission
            $updated = [regex]::Replace($text, $pattern, '$1**Status:** PACKAGE VERIFIED', 1)
            if ($updated -eq $text) { throw "Missing mission $mission" }
            $text = $updated
          }
          Set-Content $path $text -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git commit -m 'Record corrected Runner v0.7.10 package validation'
          git push origin HEAD:$env:FIX_BRANCH
          "RELEASE_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and independently audit archive
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.10-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue | Copy-Item -Destination $stage -Force
          foreach ($required in @('Runner.exe','run.bat','README.md','CHANGELOG.md','missioncache.md','shaders/flat.vert.spv','shaders/flat.frag.spv','assets/chicken.ppm')) {
            if (-not (Test-Path "$stage/$required")) { throw "Missing package file: $required" }
          }
          $outside = "$env:RUNNER_TEMP/runner-v0710-fix-unrelated"
          New-Item -ItemType Directory -Force $outside | Out-Null
          Push-Location $outside
          try {
            if ((& "$stage/Runner.exe" --version | Out-String).Trim() -ne 'Runner 0.7.10') { throw 'Installed version mismatch' }
            & "$stage/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed package diagnostic failed' }
            & "$stage/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Installed acceptance diagnostic failed' }
            if ((& cmd.exe /d /c "call `"$stage\run.bat`" --version" | Out-String).Trim() -ne 'Runner 0.7.10') { throw 'run.bat version mismatch' }
          }
          finally { Pop-Location }

          $archive = "$env:GITHUB_WORKSPACE/Runner-v0.7.10-windows-x64.zip"
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Set-Content "$archive.sha256"
          Get-ChildItem $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          } | Set-Content 'Runner-v0.7.10-windows-x64.manifest.sha256'
          $audit = "$env:RUNNER_TEMP/runner-v0710-fix-extracted"
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          $expected = Get-Content 'Runner-v0.7.10-windows-x64.manifest.sha256'
          $actual = Get-ChildItem $audit -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($audit.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          }
          if (Compare-Object $expected $actual) { throw 'Archive manifest audit failed' }
          & "$audit/Runner.exe" --diagnose-package
          if ($LASTEXITCODE -ne 0) { throw 'Extracted package diagnostic failed' }
          & "$audit/Runner.exe" --diagnose-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Extracted acceptance diagnostic failed' }

      - id: package
        uses: actions/upload-artifact@v4
        with:
          name: Runner-v0.7.10-windows-x64-corrected
          path: |
            Runner-v0.7.10-windows-x64.zip
            Runner-v0.7.10-windows-x64.zip.sha256
            Runner-v0.7.10-windows-x64.manifest.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish and re-audit corrected release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, '(?ms)^## \[0\.7\.10\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)')
          if (-not $match.Success) { throw 'v0.7.10 changelog section not found' }
          Set-Content release-body-v0.7.10.md $match.Groups[1].Value.Trim() -Encoding utf8
          if (gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release delete $env:TAG --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
          }
          gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --title $env:RELEASE_TITLE --target $env:RELEASE_SHA --notes-file release-body-v0.7.10.md Runner-v0.7.10-windows-x64.zip Runner-v0.7.10-windows-x64.zip.sha256 Runner-v0.7.10-windows-x64.manifest.sha256
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          $download = "$env:RUNNER_TEMP/runner-v0710-fix-release"
          Remove-Item $download -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $download | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          foreach ($file in @('Runner-v0.7.10-windows-x64.zip','Runner-v0.7.10-windows-x64.zip.sha256','Runner-v0.7.10-windows-x64.manifest.sha256')) {
            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne (Get-FileHash "$download/$file" -Algorithm SHA256).Hash) { throw "Published asset mismatch: $file" }
          }
          if ((Get-Content "$download/Runner-v0.7.10-windows-x64.zip.sha256").Split()[0] -ne (Get-FileHash "$download/Runner-v0.7.10-windows-x64.zip" -Algorithm SHA256).Hash) { throw 'Published ZIP checksum mismatch' }
          $released = "$env:RUNNER_TEMP/runner-v0710-fix-release-extracted"
          Remove-Item $released -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "$download/Runner-v0.7.10-windows-x64.zip" -DestinationPath $released -Force
          $expected = Get-Content "$download/Runner-v0.7.10-windows-x64.manifest.sha256"
          $actual = Get-ChildItem $released -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($released.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
          }
          if (Compare-Object $expected $actual) { throw 'Published manifest audit failed' }
          & "$released/Runner.exe" --diagnose-package
          if ($LASTEXITCODE -ne 0) { throw 'Released package diagnostic failed' }
          & "$released/Runner.exe" --diagnose-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Released acceptance diagnostic failed' }
          if ((git ls-remote origin "refs/tags/$env:TAG").Split()[0] -ne $env:RELEASE_SHA) { throw 'Tag target mismatch' }

      - name: Merge source, clean repository, and record immutable evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.package.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.package.outputs.artifact-digest }}
        run: |
          gh pr merge $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --merge --subject 'Merge corrected Runner v0.7.10 press and curriculum fixes' --body 'Fix press backward sliding, align Stand mastery, validate and publish corrected Runner v0.7.10.'
          if ($LASTEXITCODE -ne 0) { throw 'PR merge failed' }
          Start-Sleep -Seconds 2
          git fetch origin main
          git checkout -B main origin/main
          $path = 'missioncache.md'
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, '(?m)^\*\*Release state:\*\*.*$', '**Release state:** PUBLISHED — corrected Runner v0.7.10 press behavior, Stand progression, consolidated changelog, single mission cache, package, release assets, branch cleanup, and PR audit verified.', 1)
          foreach ($mission in 109..111) {
            $pattern = "(?m)(### WALK-[^`r`n]*-{0:D3}[^`r`n]*\r?\n)\*\*Status:\*\*[^`r`n]*" -f $mission
            $updated = [regex]::Replace($text, $pattern, '$1**Status:** PUBLISHED — RELEASE VERIFIED', 1)
            if ($updated -eq $text) { throw "Missing mission $mission" }
            $text = $updated
          }
          $marker = '## v0.7.10 corrected immutable release evidence'
          $index = $text.IndexOf($marker)
          if ($index -ge 0) { $text = $text.Substring(0, $index).TrimEnd() }
          $evidence = @"

## v0.7.10 corrected immutable release evidence

- Exact tagged package source: `$env:RELEASE_SHA`
- Validation and publication workflow run: `$env:GITHUB_RUN_ID`
- Artifact ID: `$env:ARTIFACT_ID`
- Artifact digest: `$env:ARTIFACT_DIGEST`
- Duck press fixed-world anchor and velocity-preserving contact regression tests: passed
- Stand all-six-seed mastery gate and visible joint-speed blocker regression tests: passed
- Linux GCC 14 warnings-as-errors build and all deterministic tests: passed
- Full Windows Vulkan build and all tests: passed
- Build-tree, installed, independently extracted, and released diagnostics: passed
- Published assets byte comparison, ZIP checksum, and extracted manifest: passed
- Release tag and title: `v0.7.10` / `Runner v0.7.10`
"@
          Set-Content $path ($text.TrimEnd() + $evidence) -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git commit -m 'Record corrected Runner v0.7.10 release evidence'
          git push origin HEAD:main

          foreach ($branch in @('agent/v0710-consolidated-changelog-cleanup','release/v0710-publisher-rescue',$env:FIX_BRANCH) | Select-Object -Unique) {
            gh api --silent -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$branch" 2>$null
          }
          $openPrs = gh pr list --repo $env:GITHUB_REPOSITORY --state open --limit 100 --json number --jq length
          if ($openPrs -ne '0') { throw "Open pull requests remain: $openPrs" }
          $branches = gh api --paginate "repos/$env:GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | Sort-Object
          if (($branches -join ',') -ne 'main') { throw "Unexpected branches remain: $branches" }
