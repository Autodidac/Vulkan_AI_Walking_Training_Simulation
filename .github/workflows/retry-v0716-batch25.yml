name: Retry Runner v0.7.16 camera batch

on:
  push:
    branches: [agent/v0716-camera-batch25]

permissions:
  contents: write

concurrency:
  group: retry-runner-v0716-camera-batch25
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      implementation_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0716-camera-batch25
          fetch-depth: 0

      - name: Repair applicator retry hazards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/apply_v0716_batch25.py')
          text = path.read_text(encoding='utf-8')

          old = '''    text = replace_all_checked(text, "0.7.15", "0.7.16", 10, "workflow version")
              text = replace_all_checked(text, "v0.7.15", "v0.7.16", 4, "workflow tag")'''.replace('              ', '    ')
          new = '''    text = replace_all_checked(text, "v0.7.15", "v0.7.16", 4, "workflow tag")
              text = replace_all_checked(text, "0.7.15", "0.7.16", 10, "workflow version")'''.replace('              ', '    ')
          if old not in text:
              raise SystemExit('workflow replacement-order anchor missing')
          text = text.replace(old, new, 1)

          anchor = '    text = replace_all_checked(text, "v0715", "v0716", 5, "workflow identifier")\n'
          if anchor not in text:
              raise SystemExit('workflow identifier anchor missing')
          text = text.replace(anchor, anchor + '    text = text.replace("0x0007\\\'1503u", "0x0007\\\'1600u")\n', 1)

          live_anchor = '    text = replace_once(text, old_live, new_live, "adaptive live camera")'
          if live_anchor not in text:
              raise SystemExit('adaptive live-camera anchor missing')
          live_fix = '''    old_live = "\\n".join(("        " + line if line else line)
                  for line in old_live.split("\\n"))
              new_live = "\\n".join(("        " + line if line else line)
                  for line in new_live.split("\\n"))
              '''.replace('              ', '    ')
          text = text.replace(live_anchor, live_fix + live_anchor, 1)

          text = text.replace(
              'inline constexpr float minimum_pixels_per_meter = 30.0f;',
              'inline constexpr float minimum_pixels_per_meter = 30.24f;',
              1,
          )

          ui_anchor = 'def patch_ui_layout() -> None:\n    text = read("src/ui_layout.hpp")\n'
          if ui_anchor not in text:
              raise SystemExit('ui-layout patch anchor missing')
          ui_fix = (
              ui_anchor
              + '    text = replace_once(\n'
              + '        text,\n'
              + '        "#include <algorithm>\\n",\n'
              + '        "#include <algorithm>\\n#include <cstdint>\\n",\n'
              + '        "self-contained ui layout include",\n'
              + '    )\n'
          )
          text = text.replace(ui_anchor, ui_fix, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Confirm cache-first mission selection
        run: |
          python tools/apply_v0716_batch25.py cache
          git add missioncache.md
          if ! git diff --cached --quiet; then
            git commit -m "Cache Runner v0.7.16 batch of 25 missions"
            git push origin HEAD:agent/v0716-camera-batch25
          else
            echo "The 25-mission cache commit is already present."
          fi

      - name: Apply implementation and remove temporary machinery
        run: |
          python tools/apply_v0716_batch25.py implement
          rm tools/apply_v0716_batch25.py
          rm .github/workflows/apply-v0716-batch25.yml
          rm .github/workflows/retry-v0716-batch25.yml
          git add -A
          git diff --cached --check
          git commit -m "Implement Runner v0.7.16 adaptive camera batch"
          git push origin HEAD:agent/v0716-camera-batch25

      - name: Record implementation source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux-validation:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.implementation_sha }}
          fetch-depth: 0
      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build
      - name: Configure Linux suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/linux-v0716 -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build and test Linux
        run: |
          cmake --build build/linux-v0716 --parallel
          ctest --test-dir build/linux-v0716 --output-on-failure -V --timeout 1800

  windows-validation:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.implementation_sha }}
          fetch-depth: 0
      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0716-retry-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: runner-v0716-retry-${{ runner.os }}-
      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure and build Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Run Windows tests and diagnostics
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.16') { throw "Version mismatch: $version" }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Acceptance diagnostic failed' }
            & $exe --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Camera diagnostic failed' }
          }
          finally { Pop-Location }

  finalize-ledger:
    needs: [prepare, linux-validation, windows-validation]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0716-camera-batch25
          fetch-depth: 0
      - name: Record exact validation evidence
        env:
          VALIDATED_SHA: ${{ needs.prepare.outputs.implementation_sha }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path('missioncache.md')
          text = path.read_text(encoding='utf-8')
          for mission in range(156, 180):
              pattern = re.compile(
                  rf'(### WALK-[^\n]+-{mission} — [^\n]+\n)\*\*Status:\*\* CACHED — IMPLEMENTATION PENDING'
              )
              text, count = pattern.subn(
                  rf'\1**Status:** VERIFIED — IMPLEMENTED AND CROSS-PLATFORM VALIDATED',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'mission {mission} status not found')
          text, count = re.subn(
              r'(### WALK-RELEASE-180 — [^\n]+\n)\*\*Status:\*\* CACHED — IMPLEMENTATION PENDING',
              r'\1**Status:** READY FOR PUBLICATION — FULL PR PACKAGE GATE REQUIRED',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('release mission status not found')
          text = text.replace(
              '**Release state:** CACHED — 25 MISSIONS SELECTED FOR ONE AUDITED RELEASE.',
              '**Release state:** IMPLEMENTED AND CROSS-PLATFORM VALIDATED — PR package and publication gates remain.',
              1,
          )
          marker = '# Runner v0.7.17 equipment, carry, and target curriculum'
          evidence = f'''## v0.7.16 pre-publication validation evidence

- Cache-first mission commit preceded product source changes.
- Exact implementation source: `{os.environ['VALIDATED_SHA']}`.
- Linux GCC 14 and Windows Server 2025 / MSVC validation passed.
- Repository hygiene, camera math/layout tests, deterministic suites, full SDL3/Vulkan build, `--diagnose-package`, `--diagnose-acceptance`, and `--diagnose-camera` passed.
- Final PR source contains no temporary applicator or one-use workflow.
- The PR release workflow must repeat installation, extraction, checksum, manifest, and artifact auditing before merge.

'''
          if '## v0.7.16 pre-publication validation evidence' not in text:
              text = text.replace(marker, evidence + marker, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git diff --cached --check
          git commit -m "Record Runner v0.7.16 cross-platform validation"
          git push origin HEAD:agent/v0716-camera-batch25
