# Registered robust v0.7.9 publisher wrapper.
name: Publish Runner v0.7.9 wrapper

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-runner-v079-wrapper.yml
  workflow_run:
    workflows: ["Publish Runner v0.7.9"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: publish-runner-v079-wrapper
  cancel-in-progress: false

jobs:
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preserve release script outside cleaned source
        shell: pwsh
        run: Copy-Item .github/scripts/publish_v079.ps1 "$env:RUNNER_TEMP/publish_v079.ps1" -Force

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: runner-v079-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            runner-v078-${{ runner.os }}-
            runner-v077-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Build, test, freeze source, and package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& "$env:RUNNER_TEMP/publish_v079.ps1" -Phase build'

      - id: package
        uses: actions/upload-artifact@v4
        with:
          name: Runner-v0.7.9-windows-x64
          path: |
            Runner-v0.7.9-windows-x64.zip
            Runner-v0.7.9-windows-x64.zip.sha256
            Runner-v0.7.9-windows-x64.manifest.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish, re-audit, clean, and record evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.package.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.package.outputs.artifact-digest }}
        run: '& "$env:RUNNER_TEMP/publish_v079.ps1" -Phase release'

      - name: Record exact publication failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& "$env:RUNNER_TEMP/publish_v079.ps1" -Phase failure'
