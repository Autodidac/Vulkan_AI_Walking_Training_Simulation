# Registered materializer workflow.
name: Materialize Runner v0.7.9

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-runner-v079.yml

permissions:
  contents: write

concurrency:
  group: materialize-runner-v079
  cancel-in-progress: false

jobs:
  linux-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize and validate exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          record_failure() {
            status=$?
            line=$1
            trap - ERR
            git fetch origin main
            git reset --hard origin/main
            printf 'Runner v0.7.9 Linux materialization failed\nrun_id=%s\nline=%s\nstatus=%s\n' \
              "$GITHUB_RUN_ID" "$line" "$status" > VALIDATION_v0.7.9_FAILURE.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add VALIDATION_v0.7.9_FAILURE.txt
            git commit -m 'Record Runner v0.7.9 Linux materialization failure' || true
            git push origin HEAD:main || true
            exit "$status"
          }
          trap 'record_failure $LINENO' ERR

          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build
          python3 tools/apply_v079_acceptance.py
          rm -f .github/workflows/finalize-runner-v079.yml
          rm -f .github/workflows/materialize-runner-v079.yml
          rm -f VALIDATION_v0.7.9_FAILURE.txt

          git diff --check
          test ! -f tools/apply_v079_acceptance.py
          test ! -f .github/workflows/validate-runner-v079.yml
          test ! -f .github/workflows/finalize-runner-v079.yml
          test ! -f .github/workflows/materialize-runner-v079.yml
          test -f .github/workflows/publish-runner-v079.yml
          grep -F 'project(Runner VERSION 0.7.9 LANGUAGES CXX)' CMakeLists.txt
          grep -F 'Runner.LiveAcceptance' CMakeLists.txt
          grep -F -- '--diagnose-acceptance' src/main.cpp
          grep -F 'WALK-RELEASE-103' missioncache.md

          CC=gcc-14 CXX=g++-14 cmake -S . -B build/linux-v079 -G Ninja \
            -DRUNNER_BUILD_APP=OFF \
            -DRUNNER_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux-v079 --parallel
          ctest --test-dir build/linux-v079 --output-on-failure -V --timeout 1200

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Runner v0.7.9 live acceptance matrix'
          git pull --rebase origin main
          git push origin HEAD:main
