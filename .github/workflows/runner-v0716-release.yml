name: Runner v0.7.16 validation and release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: runner-v0716-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: 0.7.16
  RELEASE_TAG: v0.7.16
  PACKAGE_NAME: Runner-v0.7.16-windows-x64

jobs:
  linux-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record source SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Audit release source and documentation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'project(Runner VERSION 0.7.16 LANGUAGES CXX)' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'1600u" src/ppo.hpp
          grep -F 'WALK-VIEW-156' missioncache.md
          grep -F 'WALK-RELEASE-180' missioncache.md
          grep -F '# Runner v0.7.17 equipment, carry, and target curriculum' missioncache.md
          grep -F -- '--diagnose-camera' README.md
          test -f AGENTS.md
          test -f docs/RUNNER_V0716_CAMERA_BATCH.md
          test ! -e tools/apply_v0716_batch25.py
          test ! -e tools/repair_v0716_retry.py
          test ! -e tools/finalize_v0716_ledger.py
          test ! -e tools/runner-v0716-release.generated.yml
          test ! -e .github/workflows/apply-v0716-batch25.yml
          test ! -e .github/workflows/retry-v0716-batch25.yml
          test ! -e .github/workflows/execute-v0716-batch25.yml
          test ! -e .github/workflows/pr-execute-v0716-batch25.yml
          test ! -e .github/workflows/record-v0716-validation.yml
          test ! -e .github/workflows/runner-v0715-release.yml

      - name: Configure Linux deterministic suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/linux-release -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build and test Linux
        run: |
          cmake --build build/linux-release --parallel
          ctest --test-dir build/linux-release --output-on-failure -V --timeout 1800

  windows-package:
    needs: linux-validation
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.linux-validation.outputs.source_sha }}
          fetch-depth: 0

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: runner-v0716-release-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: runner-v0716-release-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build Windows SDL3/Vulkan application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Run complete Windows test matrix
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

      - name: Verify build-tree runtime diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.16') { throw "Version mismatch: $version" }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Build-tree package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Build-tree acceptance matrix failed' }
            & $exe --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Build-tree camera diagnostic failed' }
          }
          finally { Pop-Location }

      - name: Install complete package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md, AGENTS.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe','run.bat','README.md','LICENSE','CHANGELOG.md','missioncache.md','AGENTS.md',
            'assets/chicken.ppm','shaders/flat.vert.spv','shaders/flat.frag.spv',
            'docs/SANDHYBRID_INTEGRATION_BRIDGE.md','docs/SandHybrid-missioncache.md',
            'docs/RUNNER_V0715_VIEWPORT_RECOVERY.md','docs/RUNNER_V0716_CAMERA_BATCH.md')) {
            if (-not (Test-Path (Join-Path $stage $required))) {
              throw "Missing package file: $required"
            }
          }
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify installed package and optional-asset fallback
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          try {
            & "$env:STAGE/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed package diagnostic failed' }
            & "$env:STAGE/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Installed acceptance matrix failed' }
            & "$env:STAGE/Runner.exe" --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Installed camera diagnostic failed' }
            $launched = (& cmd.exe /d /c "call `"$env:STAGE\run.bat`" --version" | Out-String).Trim()
            if ($launched -ne 'Runner 0.7.16') { throw "run.bat mismatch: $launched" }

            $optional = Join-Path $env:STAGE 'assets/optional'
            $backup = Join-Path $env:RUNNER_TEMP 'runner-optional-assets-backup'
            Remove-Item $backup -Recurse -Force -ErrorAction SilentlyContinue
            if (Test-Path $optional) {
              Move-Item $optional $backup
              & "$env:STAGE/Runner.exe" --diagnose-package
              if ($LASTEXITCODE -ne 0) { throw 'Missing-optional-asset fallback failed' }
              Move-Item $backup $optional
            }
          }
          finally { Pop-Location }

      - name: Create archive, checksum, and per-file manifest
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"
          $checksum = "$archive.sha256"
          $manifest = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.manifest.sha256"
          Remove-Item $archive,$checksum,$manifest -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$env:STAGE/*" -DestinationPath $archive -Force
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash  $env:PACKAGE_NAME.zip" | Set-Content $checksum -Encoding ascii
          Get-ChildItem $env:STAGE -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($env:STAGE.Length + 1).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $relative"
          } | Set-Content $manifest -Encoding ascii

      - name: Independently extract and re-audit archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"
          $audit = Join-Path $env:RUNNER_TEMP 'runner-v0716-extracted-audit'
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          Push-Location $env:RUNNER_TEMP
          try {
            & "$audit/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package diagnostic failed' }
            & "$audit/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Extracted acceptance matrix failed' }
            & "$audit/Runner.exe" --diagnose-camera
            if ($LASTEXITCODE -ne 0) { throw 'Extracted camera diagnostic failed' }
            $launched = (& cmd.exe /d /c "call `"$audit\run.bat`" --version" | Out-String).Trim()
            if ($launched -ne 'Runner 0.7.16') { throw "Extracted run.bat mismatch: $launched" }
          }
          finally { Pop-Location }

      - name: Upload audited release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            ${{ env.PACKAGE_NAME }}.zip.sha256
            ${{ env.PACKAGE_NAME }}.manifest.sha256
          if-no-files-found: error
          retention-days: 30

  record-validation:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/v0716-camera-batch25'
    needs: [linux-validation, windows-package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0716-camera-batch25
          fetch-depth: 0

      - name: Close the audited v0.7.16 mission batch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')

          verified = '**Status:** VERIFIED — LINUX, WINDOWS, PACKAGE, AND DIAGNOSTIC GATES PASSED'
          for mission in range(156, 180):
              pattern = re.compile(
                  rf'(### WALK-[^\n]+-{mission} — [^\n]+\n)'
                  rf'\*\*Status:\*\* CACHED — IMPLEMENTATION PENDING'
              )
              text, count = pattern.subn(rf'\1{verified}', text, count=1)
              if count == 0 and verified not in text:
                  raise SystemExit(f'mission {mission} status marker missing')

          release_ready = '**Status:** READY FOR MERGE — AUDITED PR PACKAGE GATE PASSED'
          text, count = re.subn(
              r'(### WALK-RELEASE-180 — [^\n]+\n)'
              r'\*\*Status:\*\* CACHED — IMPLEMENTATION PENDING',
              rf'\1{release_ready}',
              text,
              count=1,
          )
          if count == 0 and release_ready not in text:
              raise SystemExit('release mission status marker missing')

          text = text.replace(
              '**Release state:** CACHED — 25 MISSIONS SELECTED FOR ONE AUDITED RELEASE.',
              '**Release state:** PR PACKAGE VALIDATED — merge, publication, re-download, and final cleanup remain.',
              1,
          )
          text = text.replace(
              '**Status:** VERIFIED — CACHE-FIRST HISTORY AND OPEN v0.7.16 CARRY-FORWARD RECORDED',
              '**Status:** VERIFIED — CACHE-FIRST HISTORY AND OPEN v0.7.17 CARRY-FORWARD RECORDED',
              1,
          )
          text = text.replace(
              '- **Runner v0.7.16:** equipment and target curriculum, because learned carry/aim/fire adds policy state and checkpoint compatibility concerns that must not be smuggled into locomotion without dedicated tests. Groundwork may land earlier, but unfinished equipment behavior remains explicitly OPEN and blocks only v0.7.16.',
              '- **Runner v0.7.16:** adaptive viewport, PIP readability, camera diagnostics, documentation, and release-process hardening.\n- **Runner v0.7.17:** equipment and target curriculum, because learned carry/aim/fire adds policy state and checkpoint compatibility concerns that require dedicated tests.',
              1,
          )
          text = text.replace(
              '**Status:** VALIDATED — FULL LINUX/WINDOWS SUITES AND RUNTIME DIAGNOSTICS PASS; FINAL PACKAGE AUDIT PENDING',
              '**Status:** PUBLISHED — v0.7.15 RELEASE ASSETS AND PACKAGE AUDIT VERIFIED',
              1,
          )
          text = text.replace(
              '**Release state:** IMPLEMENTED — Linux and Windows package validation in progress.',
              '**Release state:** PUBLISHED — superseded by the v0.7.16 adaptive viewport release.',
              1,
          )
          text = text.replace('- [ ] Pass the complete Linux deterministic suite.', '- [x] Pass the complete Linux deterministic suite.', 1)
          text = text.replace('- [ ] Pass the complete Windows SDL3/Vulkan build, tests, diagnostics, installation, and extracted-package audit.', '- [x] Pass the complete Windows SDL3/Vulkan build, tests, diagnostics, installation, and extracted-package audit.', 1)
          text = text.replace('- [ ] Merge, publish Runner v0.7.15, and remove temporary validation infrastructure and stale observer work.', '- [x] Merge, publish Runner v0.7.15, and remove temporary validation infrastructure and stale observer work.', 1)

          marker = '# Runner v0.7.17 equipment, carry, and target curriculum'
          evidence = '''## v0.7.16 audited PR validation evidence

- Exact validated product source: `794bda73f8d1398d5310311172345343004e5f78`.
- Final documentation and workflow-only refinement source: `${{ needs.linux-validation.outputs.source_sha }}`.
- Pull request: `#55`.
- Validation workflow run: `${{ github.run_id }}`.
- Linux GCC 14 repository audit, warnings-as-errors build, camera/layout suite, and all deterministic tests: passed.
- Full Windows SDL3/Vulkan application build and complete CTest matrix: passed.
- Build-tree `--diagnose-package`, `--diagnose-acceptance`, and `--diagnose-camera`: passed.
- Installed package, executable-relative `run.bat`, acceptance, camera diagnostic, and optional-asset fallback: passed.
- ZIP, SHA-256, per-file manifest, independently extracted package, and uploaded release artifact audit: passed.
- Temporary applicators, materializers, generated workflow copies, standalone recorders, and the superseded v0.7.15 workflow are absent.
- Publication remains blocked only on merge, the main-branch publisher, published-asset re-download verification, and release-branch cleanup.

'''
          if '## v0.7.16 audited PR validation evidence' not in text:
              if marker not in text:
                  raise SystemExit('v0.7.17 carry-forward marker missing')
              text = text.replace(marker, evidence + marker, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit exact validation evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          if git diff --cached --quiet; then
            echo 'Mission ledger is already closed.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Record Runner v0.7.16 audited package validation'
          git push origin HEAD:agent/v0716-camera-batch25

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: release-assets

      - name: Create annotated source tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "Runner $RELEASE_VERSION"
          git push origin "$RELEASE_TAG"

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Runner v0.7.16 completes a cache-first 25-mission adaptive viewport and usability pass.

          - Keeps the corrected physical world scale while replacing the distant fixed 22 px/m live camera.
          - Adds bounded rig-height auto fitting, viewport-only wheel zoom, direct panel controls, reset-to-auto, useful lookahead, elapsed-time smoothing, and a camera dead zone.
          - Enlarges and tightens the training PIP without shrinking the rig for distant hazards.
          - Adds camera telemetry, deterministic camera/layout tests, and packaged `--diagnose-camera` coverage.
          - Adds `AGENTS.md` and reconciles mission cache, changelog, README, focused documentation, packaging, and release automation.

          Equipment, target, policy-extension, and combined carry/fire curriculum remain explicitly cached for Runner v0.7.17.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "Runner v0.7.16" \
            --notes-file release-notes.md

      - name: Re-download and verify published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-download
          gh release download "$RELEASE_TAG" --dir release-download
          for source in release-assets/*; do
            file=$(basename "$source")
            test -f "release-download/$file"
            cmp --silent "$source" "release-download/$file"
          done
          (cd release-download && sha256sum -c "$PACKAGE_NAME.zip.sha256")

      - name: Remove completed release branch
        shell: bash
        run: |
          encoded=${RELEASE_BRANCH//\//%2F}
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" || true
        env:
          RELEASE_BRANCH: agent/v0716-camera-batch25
