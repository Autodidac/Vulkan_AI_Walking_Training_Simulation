name: Release EpochRunner v0.6.5

on:
  push:
    branches:
      - feature/self-imitation-mission-cache
    paths:
      - tools/integrate_v065_release.py
      - .github/workflows/v065-release.yml

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  release:
    runs-on: windows-2025

    steps:
      - name: Checkout completed mission branch
        uses: actions/checkout@v4
        with:
          ref: feature/self-imitation-mission-cache
          fetch-depth: 0

      - name: Prepare exact v0.6.5 source
        shell: pwsh
        run: |
          python tools/integrate_v065_release.py
          if ($LASTEXITCODE -ne 0) { throw "v0.6.5 source integration failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Integrated source contains whitespace errors" }

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-v065-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-guided-training-${{ runner.os }}-
            epochrunner-flat-foot-${{ runner.os }}-
            epochrunner-v063-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure full MSVC release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build full SDL3 Vulkan EpochGui application
        run: cmake --build --preset windows-release

      - name: Run deterministic and concurrency tests
        run: ctest --preset windows-release --output-on-failure -V

      - name: Verify executable identity and Vulkan path
        shell: pwsh
        run: |
          $version = (& build/windows-release/Release/EpochRunner.exe --version | Out-String).Trim()
          if ($version -ne "EpochRunner 0.6.5") { throw "Unexpected version: $version" }
          build/windows-release/Release/EpochRunner.exe --diagnose-vulkan
          if ($LASTEXITCODE -ne 0) { throw "Vulkan diagnostic failed" }

      - name: Package exact tested build
        id: package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/EpochRunner-v0.6.5-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          Copy-Item README.md, LICENSE, MISSIONS.md, V070_MASTER_PLAN.md -Destination $stage -Force -ErrorAction SilentlyContinue
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          $archive = "EpochRunner-v0.6.5-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
          $checksum | Set-Content "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Commit exact tested source and fast-forward main
        id: source
        shell: pwsh
        run: |
          Remove-Item tools/integrate_v065_release.py
          Remove-Item .github/workflows/v065-release.yml
          Remove-Item .github/workflows/merge-v070-diagnostic.yml -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md MISSIONS.md
          git add -u tools/integrate_v065_release.py
          git add -u .github/workflows/v065-release.yml .github/workflows/merge-v070-diagnostic.yml
          git commit -m "Release EpochRunner v0.6.5 guided multi-leg training"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit exact tested source" }
          $sourceSha = (git rev-parse HEAD).Trim()
          git push origin HEAD:feature/self-imitation-mission-cache
          if ($LASTEXITCODE -ne 0) { throw "Failed to update completed mission branch" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Failed to fast-forward main" }
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Upload verified package artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpochRunner-v0.6.5-windows-x64
          path: |
            EpochRunner-v0.6.5-windows-x64.zip
            EpochRunner-v0.6.5-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.6.5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release view v0.6.5 *> $null
          if ($LASTEXITCODE -eq 0) { throw "v0.6.5 already exists; refusing replacement" }
          gh release create v0.6.5 $env:ARCHIVE "$env:ARCHIVE.sha256" `
            --target $env:SOURCE_SHA `
            --title "EpochRunner v0.6.5" `
            --notes "Guided sand-sim enemy locomotion release. Adds a true four-leg quadruped, separate four-leg crawler, six-leg hexapod support groups, side-view leg separation, flat semantic feet, mature body and orange-foot anti-rolling gates with brief startup grace, a forty-metre safe learning runway, prompt zero-motion reset, automatic best-result self-imitation, relaxed knee/foot clearance guidance, and a real exploratory training picture-in-picture. Obstacles remain physical hazards rather than pickups. All non-visual locomotion missions have passing deterministic tests, full Windows SDL3/Vulkan/EpochGui build evidence, and Vulkan diagnostics. Typography and PIP placement remain explicitly marked for user visual review."
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }

      - name: Record v0.6.5 release evidence
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch main" }
          git switch -C main origin/main
          if ($LASTEXITCODE -ne 0) { throw "Failed to switch to main" }
          New-Item -ItemType Directory -Force validation | Out-Null
          @"
          # EpochRunner v0.6.5 release evidence

          - Exact tested source commit: `$env:SOURCE_SHA`
          - Release workflow run: `$env:RUN_ID`
          - Windows runner: `windows-2025`
          - Generator: `Visual Studio 18 2026`
          - Full SDL3/Vulkan/EpochGui application build: passed
          - Deterministic core and concurrency tests: passed
          - True four-leg quadruped support semantics: passed
          - Four-leg crawler and six-leg hexapod support semantics: passed
          - Flat semantic-foot and foot-pivot anti-rolling tests: passed
          - Startup-only rolling grace and mature strict rolling gates: passed
          - Forty-metre obstacle runway scheduling: passed
          - Relaxed natural knee-lead guidance: passed
          - Zero-movement reset state machine: passed
          - Automatic best-result self-imitation eligibility and decay: passed
          - Actual worker-rollout PIP publication path: compiled and packaged
          - Executable version and Vulkan diagnostic: passed
          - Package: `$env:ARCHIVE`
          - Package SHA-256: `$env:CHECKSUM`
          - User visual review remains explicit for typography and PIP placement
          "@ | Set-Content -Encoding UTF8 validation/v0.6.5.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/v0.6.5.md
          git commit -m "Record verified EpochRunner v0.6.5 release evidence"
          if ($LASTEXITCODE -ne 0) { throw "Evidence commit failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Evidence push failed" }

      - name: Remove completed temporary branches
        shell: pwsh
        run: |
          $branches = @(
            "feature/mission-cache-completion",
            "diagnostics/action-status",
            "feature/self-imitation-mission-cache"
          )
          foreach ($branch in $branches) {
            git push origin --delete $branch
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Branch already absent or could not be deleted: $branch"
              $global:LASTEXITCODE = 0
            }
          }
          Write-Host "Kept feature/v070-runtime-pipeline because it contains unfinished tracked v0.7 architecture work."
