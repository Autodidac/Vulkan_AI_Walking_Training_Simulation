name: Validate EpochRunner v0.7.2 correction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: epochrunner-v072-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply idempotent materialized-source corrections
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/fix_v072_materialized.py
          python3 tools/fix_v072_materialized.py
          if [ -f tools/fix_v072_display_segments.py ]; then
            python3 tools/fix_v072_display_segments.py
          fi
          git diff --check

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Configure Linux C++23 core
        run: |
          cmake -S . -B build/linux-v072 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DEPOCHRUNNER_BUILD_APP=OFF \
            -DEPOCHRUNNER_BUILD_TESTS=ON

      - name: Build Linux core and tests
        run: cmake --build build/linux-v072 --parallel 2

      - name: Run full deterministic suite
        run: ctest --test-dir build/linux-v072 --output-on-failure -V --timeout 1200

      - name: Publish tested source state
        if: always()
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refine stable coordinated locomotion correction'
          git push origin HEAD:"$HEAD_BRANCH"

  windows-package:
    needs: linux-test
    runs-on: windows-2025
    timeout-minutes: 70
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Confirm exact clean source
        shell: pwsh
        run: |
          python tools/fix_v072_materialized.py
          if ($LASTEXITCODE -ne 0) { throw "Materialized-source correction failed" }
          if (Test-Path tools/fix_v072_display_segments.py) {
            python tools/fix_v072_display_segments.py
            if ($LASTEXITCODE -ne 0) { throw "Display-segment correction failed" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Source contains whitespace errors" }
          if (-not (git diff --quiet)) { throw "PR head was not the exact Linux-tested source" }

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-v072-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-v071-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build full Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw "Windows configure failed" }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }

      - name: Run full Windows test suite
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1200
          if ($LASTEXITCODE -ne 0) { throw "Windows tests failed" }

      - name: Verify build-tree runtime from unrelated directory
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/EpochRunner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'EpochRunner 0.7.2') { throw "Unexpected version: $version" }
            & $exe --diagnose-vulkan
            if ($LASTEXITCODE -ne 0) { throw "Vulkan diagnostic failed" }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw "Build-tree package diagnostic failed" }
          }
          finally { Pop-Location }

      - name: Install and assemble release package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/EpochRunner-v0.7.2-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw "Install failed" }
          Copy-Item README.md, LICENSE, missioncache.md, RELEASE_NOTES_v0.7.2.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          if (-not (Test-Path "$stage/EpochRunner.exe")) { throw "Packaged executable missing" }
          if (-not (Test-Path "$stage/run.bat")) { throw "Packaged run.bat missing" }
          if (-not (Test-Path "$stage/shaders/flat.vert.spv")
              -or -not (Test-Path "$stage/shaders/flat.frag.spv")) {
            throw "Packaged shaders missing"
          }
          if (-not (Test-Path "$stage/assets/chicken.ppm")) { throw "Packaged assets missing" }

      - name: Verify installed executable and run.bat from unrelated directory
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/EpochRunner-v0.7.2-windows-x64"
          $exe = "$stage/EpochRunner.exe"
          $outside = "$env:RUNNER_TEMP/unrelated-launch-directory"
          New-Item -ItemType Directory -Force $outside | Out-Null
          Push-Location $outside
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'EpochRunner 0.7.2') { throw "Installed executable version mismatch: $version" }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw "Installed executable package diagnostic failed" }
            $batchVersion = (& cmd.exe /d /c "call `"$stage\run.bat`" --version" | Out-String).Trim()
            if ($batchVersion -ne 'EpochRunner 0.7.2') { throw "run.bat version mismatch: $batchVersion" }
            & cmd.exe /d /c "call `"$stage\run.bat`" --diagnose-package"
            if ($LASTEXITCODE -ne 0) { throw "run.bat package diagnostic failed" }
          }
          finally { Pop-Location }

      - name: Create ZIP, checksum, and per-file manifest
        id: package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/EpochRunner-v0.7.2-windows-x64"
          $archive = "$env:GITHUB_WORKSPACE/EpochRunner-v0.7.2-windows-x64.zip"
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
          $checksum | Set-Content "$archive.sha256"
          $manifest = Get-ChildItem $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $relative"
          }
          $manifest | Set-Content 'EpochRunner-v0.7.2-windows-x64.manifest.sha256'
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Independently extract and audit ZIP
        shell: pwsh
        run: |
          $archive = "$env:GITHUB_WORKSPACE/EpochRunner-v0.7.2-windows-x64.zip"
          $audit = "$env:RUNNER_TEMP/v072-independent-audit"
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          $expected = Get-Content 'EpochRunner-v0.7.2-windows-x64.manifest.sha256'
          $actual = Get-ChildItem $audit -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($audit.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $relative"
          }
          if (Compare-Object $expected $actual) { throw "Extracted artifact does not match its manifest" }
          $outside = "$env:RUNNER_TEMP/v072-audit-cwd"
          New-Item -ItemType Directory -Force $outside | Out-Null
          Push-Location $outside
          try {
            $version = (& "$audit/EpochRunner.exe" --version | Out-String).Trim()
            if ($version -ne 'EpochRunner 0.7.2') { throw "Audited executable version mismatch: $version" }
            & "$audit/EpochRunner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw "Audited executable failed package diagnostic" }
            $batchVersion = (& cmd.exe /d /c "call `"$audit\run.bat`" --version" | Out-String).Trim()
            if ($batchVersion -ne 'EpochRunner 0.7.2') { throw "Audited run.bat version mismatch: $batchVersion" }
            & cmd.exe /d /c "call `"$audit\run.bat`" --diagnose-package"
            if ($LASTEXITCODE -ne 0) { throw "Audited run.bat failed package diagnostic" }
          }
          finally { Pop-Location }
          Write-Host "Artifact SHA-256: $((Get-FileHash $archive -Algorithm SHA256).Hash)"
          Write-Host "Artifact file count: $($actual.Count)"

      - uses: actions/upload-artifact@v4
        with:
          name: EpochRunner-v0.7.2-windows-x64
          path: |
            EpochRunner-v0.7.2-windows-x64.zip
            EpochRunner-v0.7.2-windows-x64.zip.sha256
            EpochRunner-v0.7.2-windows-x64.manifest.sha256
          if-no-files-found: error
          retention-days: 14
