name: Validate EpochRunner v0.7.2 correction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: epochrunner-v072-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-materialize-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Materialize v0.7.2 source when required
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'project(EpochRunner VERSION 0.7.2' CMakeLists.txt; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/apply_v072_sim_regression.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'notes = """# EpochRunner v0.7.2\\n\\n"',
              'notes = "# EpochRunner v0.7.2\\n\\n"',
          )

          misplaced = '''    text = replace_once(
                  text,
                  "        if (stage == CourseStage::ramps || stage == CourseStage::uneven)\\n"
                  "            return CourseFeatureKind::rock;",
                  "        if (stage == CourseStage::walk)\\n"
                  "            return CourseFeatureKind::overhead_bar;\\n"
                  "        if (stage == CourseStage::ramps || stage == CourseStage::uneven)\\n"
                  "            return CourseFeatureKind::rock;",
                  "walk stage obstacle schedule",
              )
          '''
          if misplaced not in text:
              raise RuntimeError('could not locate misplaced course schedule patch')
          text = text.replace(misplaced, '', 1)

          schedule = '''    text = replace_once(
                  text,
                  "        if (stage == CourseStage::ramps || stage == CourseStage::uneven)\\n"
                  "            return CourseFeatureKind::rock;",
                  "        if (stage == CourseStage::walk)\\n"
                  "            return CourseFeatureKind::overhead_bar;\\n"
                  "        if (stage == CourseStage::ramps || stage == CourseStage::uneven)\\n"
                  "            return CourseFeatureKind::rock;",
                  "walk stage obstacle schedule",
              )
          '''
          marker = '    write(path, text)\n\n\ndef patch_simulation_source() -> None:'
          if marker not in text:
              raise RuntimeError('could not locate simulation header publication point')
          text = text.replace(
              marker,
              schedule + '    write(path, text)\n\n\ndef patch_simulation_source() -> None:',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
            python3 -m py_compile tools/apply_v072_sim_regression.py
            python3 tools/apply_v072_sim_regression.py
          fi

          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('tests/core_tests.cpp')
          tests = test_path.read_text(encoding='utf-8')
          old_test = '''    require(rl::elite_motion_eligible(sim::CourseStage::walk, true, 0, 0.0f, 4.0f, 0.8f),
                  "valid duck result cannot seed self-imitation");
          '''
          new_test = '''    require(!rl::elite_motion_eligible(sim::CourseStage::walk, true, 0, 0.0f, 4.0f, 0.8f),
                  "ducking without clearing a low bar can still seed self-imitation");
              require(rl::elite_motion_eligible(sim::CourseStage::walk, true, 0, 0.0f, 4.0f,
                      0.8f, 0u, 0.0f, 0u, 1u),
                  "valid duck-and-clear result cannot seed self-imitation");
          '''
          if old_test in tests:
              tests = tests.replace(old_test, new_test, 1)
          elif 'ducking without clearing a low bar can still seed self-imitation' not in tests:
              raise RuntimeError('could not update duck imitation acceptance test')
          test_path.write_text(tests, encoding='utf-8')

          policy_path = Path('src/ppo.hpp')
          policy = policy_path.read_text(encoding='utf-8')
          old_gate = '''        if (environment.blueprint().support_seed_count() > 2u)
                  return action;
          '''
          new_gate = '''        const sim::CreatureBlueprint& rig = environment.blueprint();
              const bool paired_leg_chains = rig.active_motor_count >= 4u
                  && rig.motors[0].enabled && rig.motors[1].enabled
                  && rig.motors[2].enabled && rig.motors[3].enabled
                  && rig.motors[0].pivot == rig.motors[2].pivot
                  && rig.motors[1].a == rig.motors[0].pivot
                  && rig.motors[3].a == rig.motors[2].pivot;
              if (!paired_leg_chains)
                  return action;
          '''
          if old_gate in policy:
              policy = policy.replace(old_gate, new_gate, 1)
          elif 'const bool paired_leg_chains' not in policy:
              raise RuntimeError('could not replace support-count coordination heuristic')
          policy_path.write_text(policy, encoding='utf-8')
          PY
          git diff --check

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Configure Linux C++23 core
        run: |
          cmake -S . -B build/linux-v072 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DEPOCHRUNNER_BUILD_APP=OFF \
            -DEPOCHRUNNER_BUILD_TESTS=ON

      - name: Build Linux core and tests
        run: cmake --build build/linux-v072 --parallel 2

      - name: Run full deterministic suite
        run: ctest --test-dir build/linux-v072 --output-on-failure -V --timeout 1200

      - name: Publish exact Linux-tested source to correction branch
        if: success()
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/v072-linux-materialize.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix coordinated movement, feet, ducking, and sample integrity'
          git push origin HEAD:"$HEAD_BRANCH"
