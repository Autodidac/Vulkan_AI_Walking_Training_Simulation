name: Validate EpochRunner v0.7.2 correction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: epochrunner-v072-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply idempotent materialized-source corrections
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/fix_v072_materialized.py
          python3 tools/fix_v072_materialized.py
          git diff --check

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Configure Linux C++23 core
        run: |
          cmake -S . -B build/linux-v072 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DEPOCHRUNNER_BUILD_APP=OFF \
            -DEPOCHRUNNER_BUILD_TESTS=ON

      - name: Build Linux core and tests
        run: cmake --build build/linux-v072 --parallel 2

      - name: Run full deterministic suite
        run: ctest --test-dir build/linux-v072 --output-on-failure -V --timeout 1200

      - name: Publish tested source state
        if: always()
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refine stable coordinated locomotion correction'
          git push origin HEAD:"$HEAD_BRANCH"
