name: Watch Runner v0.7.25 completion

on:
  push:
    branches: [main]
    paths: [.github/workflows/watch-v0725-completion.yml]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: runner-v0725-completion-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge canonical PR if finalizer completed
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh pr view 80 --repo "$REPO" --json state --jq .state 2>/dev/null || echo UNKNOWN)
          if [ "$state" = OPEN ]; then
            rm -rf /tmp/runner-v0725
            gh repo clone "$REPO" /tmp/runner-v0725 -- \
              --branch agent/v0725-art-leg-hotfix --single-branch
            cd /tmp/runner-v0725
            if grep -Fq 'project(Runner VERSION 0.7.25 LANGUAGES CXX)' CMakeLists.txt \
              && grep -Fq 'shared_pelvis_passes' src/simulation.cpp \
              && grep -Fq 'TRAINING SAMPLES READY' src/app.cpp \
              && grep -Fq "case '%'" src/ui_font.hpp \
              && test -f .github/workflows/runner-v0725-release.yml \
              && test ! -e tools/apply_v0725_art_leg_hotfix.py \
              && test ! -e tools/apply_v0725_font_sync.py \
              && test ! -e tools/finalize_v0725.py \
              && test ! -e tools/finalize_v0725_audit.py \
              && test ! -e tools/finalize_v0725_strict_geometry.py; then
              head=$(gh pr view 80 --repo "$REPO" --json headRefOid --jq .headRefOid)
              gh api --method PUT "repos/$REPO/pulls/80/merge" \
                -f merge_method=squash -f sha="$head" \
                -f commit_title='Runner v0.7.25 art, stance, font, and readable progress' \
                -f commit_message='Canonical v0.7.25 source verified by completion watchdog. Windows/package/publication gates remain mandatory.'
            fi
          fi
      - name: Recover one failed release run
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.7.25 --repo "$REPO" >/dev/null 2>&1; then
            echo 'Runner v0.7.25 is already published.'
            exit 0
          fi
          run=$(gh run list --repo "$REPO" \
            --workflow 'runner-v0725-release.yml' \
            --limit 1 --json databaseId,status,conclusion,attempt \
            --jq '.[0] // empty' 2>/dev/null || true)
          if [ -z "$run" ]; then
            echo 'No v0.7.25 release run is visible yet.'
            exit 0
          fi
          id=$(jq -r '.databaseId' <<<"$run")
          status=$(jq -r '.status' <<<"$run")
          conclusion=$(jq -r '.conclusion // ""' <<<"$run")
          attempt=$(jq -r '.attempt // 1' <<<"$run")
          if [ "$status" = completed ] && [ "$conclusion" = failure ] \
            && [ "$attempt" -lt 2 ]; then
            gh run rerun "$id" --failed --repo "$REPO"
          fi
