name: Rescue Runner v0.7.24 migration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.head_ref == 'agent/v0724-structural-metrics-icon'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0724-structural-metrics-icon
          fetch-depth: 0
      - name: Apply hardened migration if pending
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'project(Runner VERSION 0.7.24 LANGUAGES CXX)' CMakeLists.txt; then
            echo 'Migration already present; validating current source.'
          else
            test -s assets/ui/runner_icon_source.png
            python3 tools/run_v0724_migration.py
          fi
          git diff --check
          grep -F 'project(Runner VERSION 0.7.24 LANGUAGES CXX)' CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'2401u" src/ppo.hpp
          grep -F 'project_rigid_structure' src/simulation.cpp
          grep -F 'completed_episode_passes_stage' src/ppo_trainer.cpp
          grep -F 'PASSED STAGE CHECKS' src/app.cpp
          test -f tests/v0724_structural_metrics_icon_tests.cpp
      - name: Build focused regression
        env:
          CC: gcc-14
          CXX: g++-14
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build python3
          cmake -S . -B build/v0724-rescue -G Ninja \
            -DRUNNER_BUILD_APP=OFF \
            -DRUNNER_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/v0724-rescue \
            --target RunnerV0724StructuralMetricsIconTests --parallel
          ./build/v0724-rescue/RunnerV0724StructuralMetricsIconTests
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_v0724_structural_metrics_icon.py
          rm -f tools/run_v0724_migration.py
          rm -rf tools/__pycache__
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Runner v0.7.24 structural integrity and truthful telemetry'
          git push origin HEAD:agent/v0724-structural-metrics-icon
      - name: Report status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 78 --repo "$GITHUB_REPOSITORY" \
            --body "Hardened v0.7.24 migration finished: ${{ job.status }}"
