name: Validate Real EpochRunner v0.4.0

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-real-v0.4.0.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: epochrunner-validate-real-v0.4.0
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  build-test-package-release:
    runs-on: windows-2025

    steps:
      - name: Checkout complete v0.4 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact corrected source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          import hashlib
          import subprocess

          expected = {
              "CMakeLists.txt": "560457ed1ca394aca589fb642b81713045347cee12734197118624e9edc733da",
              "vcpkg.json": "617e52c00a47904698cc9f6724478d01a2be45e08cd4c01cf3463d7b56807609",
              "README.md": "f792436551b0d688baee004b6d06cec5a4fc988edccfe5f72968571f9729fd6b",
              "src/main.cpp": "1e8b44bd6ec49f798b55aaf6c1f03535ac6b39f38ec74af08431656526d9f12e",
              "src/app.cpp": "a78a4c0262d23fe1096893c6e744b8f0bb974792401ca19aae2fc6329966430f",
              "src/simulation.hpp": "09d7d2f96b3710b17b17842a8be7707cf4829d97b82fbae051884e3809c68399",
              "src/simulation.cpp": "a5110e625396260ba1952aa0401da8512489d29c23d84270766afadd54391461",
              "src/ppo.hpp": "f10beff1d7012fdebe86802c90e72e01e70d6ba9b1658e2bec2d4cd116dd475d",
              "src/ppo_network.cpp": "4ad91c25c48faf25f2531fb76a1103f3cd02ae6b846f50ba648c91065bd547ba",
              "src/ppo_trainer.cpp": "a5e7793288791d0ef58f4b9d9365a47be10710e3c3e4dead4fb5631b30d910f5",
              "src/training_checkpoint.cpp": "addd3ad33e98d91d483977958663374ce048f828507391fa62636d60f07ab6b7",
              "src/autonomy.hpp": "256d74805e655a875aacf19c717660cdc860a898a4d661ceb6b8558489a31eaa",
              "src/autonomy.cpp": "dbbad69e99ec95e03f9b43c00e34ff9aaddba526c26e139c8d9e018eb2dc86b2",
              "tests/core_tests.cpp": "b0823f77cc3f03ec460bc4c38e7ae4918fce0bd201f56a4fc9d040d58b158ac1",
          }
          for path, digest in expected.items():
              data = subprocess.check_output(["git", "show", f"HEAD:{path}"])
              actual = hashlib.sha256(data).hexdigest()
              if actual != digest:
                  raise SystemExit(f"Corrected v0.4 Git blob mismatch for {path}: {actual}")
          print(f"Verified {len(expected)} corrected v0.4 Git blobs")
          '@ | python -
          git diff --check

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-windows-x64-vulkan-d015e31-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-x64-vulkan-d015e31-
            vcpkg-windows-x64-d015e31-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure real v0.4 MSVC manifest build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build real v0.4 Release
        run: cmake --build --preset windows-release

      - name: Run real v0.4 curriculum and anti-exploit tests
        run: ctest --preset windows-release --output-on-failure

      - name: Package real v0.4 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $package = Join-Path $PWD "package/EpochRunner-windows-x64"
          Remove-Item package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $package | Out-Null
          cmake --install build/windows-release --config Release --prefix $package
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $package -Force
          Copy-Item README.md,LICENSE -Destination $package -Force
          Compress-Archive -Path "$package/*" -DestinationPath "EpochRunner-windows-x64.zip" -Force

      - name: Validate packaged real v0.4 SDL3 Vulkan support
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location package/EpochRunner-windows-x64
          & .\EpochRunner.exe --diagnose-vulkan
          Pop-Location

      - name: Replace invalid release asset with real v0.4 build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git fetch origin main
          $sourceSha = git rev-parse origin/main
          $notes = @"
          EpochRunner v0.4.0 replaces separate training/run workflows with a live autonomous trainer. A coroutine-driven background supervisor uses multithreaded CPU rollouts while Vulkan presents only the current best verified controller. The curriculum advances from balance to flat walking, ramps, uneven terrain, hurdles, overhead bars, and moving hazards. Checkpoints, rollback, autosave, difficulty progression, and bounded rig evolution are automatic. Hard validity gates reject flipping, speeds above 50 km/h, course escape, sustained flight, and micro-movement exploits. The humanoid defaults use the uploaded human-like rig proportions with slightly reduced motor power and larger, clearer UI text.
          "@
          gh release upload v0.4.0 EpochRunner-windows-x64.zip --repo $env:GH_REPO --clobber
          gh release edit v0.4.0 --repo $env:GH_REPO --target $sourceSha --title "EpochRunner v0.4.0 - Autonomous Curriculum" --notes $notes

      - name: Remove validation branch and close PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close $env:PR_NUMBER --repo $env:GH_REPO --comment "The complete SHA-verified v0.4.0 source passed Windows MSVC, tests, packaging, and the packaged Vulkan diagnostic. The release asset was replaced." 2>$null
          $branches = gh api "repos/$env:GITHUB_REPOSITORY/branches?per_page=100" | ConvertFrom-Json
          foreach ($branch in $branches) {
            if ($branch.name -ne "main") {
              $encoded = [Uri]::EscapeDataString($branch.name)
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$encoded"
            }
          }
