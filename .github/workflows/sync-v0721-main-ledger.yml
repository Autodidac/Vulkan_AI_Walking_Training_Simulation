name: Reconcile Runner v0.7.21 with published main ledger

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/v0721-readable-telemetry'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0721-readable-telemetry
          fetch-depth: 0
      - name: Preserve v0.7.21 work on top of authoritative published history
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('missioncache.md')
          branch_text = path.read_text(encoding='utf-8')
          heading = '# Runner v0.7.21 plain-language training dashboard\n'
          carried = '# Carried open work\n'
          start = branch_text.index(heading)
          end = branch_text.index(carried, start)
          v0721 = branch_text[start:end]

          main_text = subprocess.check_output(
              ['git', 'show', 'origin/main:missioncache.md'], text=True)
          if heading in main_text:
              existing_start = main_text.index(heading)
              existing_end = main_text.index(carried, existing_start)
              main_text = main_text[:existing_start] + main_text[existing_end:]
          insertion = main_text.index(carried)
          merged = main_text[:insertion] + v0721 + main_text[insertion:]
          merged = merged.replace(
              '# Runner v0.7.20 equipment, carry, and target curriculum',
              '# Runner v0.7.22 equipment, carry, and target curriculum')
          merged = merged.replace(
              '**Release state:** CACHED AND OPEN — intentionally separated from the v0.7.19 general-locomotion release because equipment changes policy dimensions and checkpoint compatibility.',
              '**Release state:** CACHED AND OPEN — intentionally separated from the v0.7.21 readable rig/gait release because equipment changes policy dimensions and checkpoint compatibility.')
          path.write_text(merged, encoding='utf-8', newline='\n')
          PY
          rm -f .github/workflows/runner-v0720-release.yml
          git diff --check
          grep -F '## Runner v0.7.20' missioncache.md
          grep -F '**Status:** PUBLISHED.' missioncache.md
          grep -F 'WALK-RELEASE-283' missioncache.md
          grep -F '# Runner v0.7.22 equipment, carry, and target curriculum' missioncache.md
          test ! -e .github/workflows/runner-v0720-release.yml
      - name: Commit reconciled release history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md .github/workflows/runner-v0720-release.yml
          git commit -m 'Reconcile v0.7.21 with published v0.7.20 history'
          git push origin HEAD:agent/v0721-readable-telemetry
