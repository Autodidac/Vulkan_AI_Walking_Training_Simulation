name: Final repository cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-repository-cleanup.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Close every open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t prs < <(gh pr list --state open --limit 100 --json number --jq '.[].number')
          for pr in "${prs[@]}"; do
            gh pr close "$pr" --comment "Closed during final repository cleanup. The validated v0.6.5 source is already on main."
          done

      - name: Delete final non-main branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/feature/v070-runtime-pipeline" || true

      - name: Remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/final-repository-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/final-repository-cleanup.yml
          git commit -m 'Remove final repository cleanup workflow'
          git push origin HEAD:main
