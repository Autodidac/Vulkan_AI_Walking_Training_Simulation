name: Repair Runner v0.7.9 publisher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-v079-publisher.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair publisher and trigger one clean run
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/publish-runner-v079.yml')
          text = path.read_text(encoding='utf-8')
          needle = "      - name: Record package validation and remove publisher\n        shell: pwsh\n        run: |\n          @'\n"
          replacement = "      - name: Record package validation and remove publisher\n        shell: pwsh\n        run: |\n          git pull --rebase origin main\n          @'\n"
          if text.count(needle) != 1:
              raise SystemExit('publisher package-evidence step anchor mismatch')
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')

          cmake = Path('CMakeLists.txt')
          source = cmake.read_text(encoding='utf-8')
          marker = '# Runner v0.7.9 publication retry after PowerShell fix.\n'
          if marker not in source:
              source = source.replace('cmake_minimum_required(VERSION 3.28)\n',
                                      'cmake_minimum_required(VERSION 3.28)\n\n' + marker,
                                      1)
          cmake.write_text(source, encoding='utf-8')
          PY
          rm -f VALIDATION_v0.7.9_FAILURE.txt
          git rm .github/workflows/patch-v079-publisher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/publish-runner-v079.yml CMakeLists.txt
          git add -u
          git commit -m 'Repair and rerun Runner v0.7.9 Windows publisher'
          git pull --rebase origin main
          git push origin HEAD:main
