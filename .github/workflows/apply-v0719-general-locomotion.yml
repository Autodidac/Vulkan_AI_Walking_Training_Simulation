name: Apply Runner v0.7.19 general locomotion

on:
  push:
    branches: [agent/v0719-general-locomotion]
    paths:
      - tools/apply_v0719_general_locomotion.py
      - .github/workflows/apply-v0719-general-locomotion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0719-general-locomotion
          fetch-depth: 0
      - name: Apply cached source refinement
        run: |
          set -euo pipefail
          python3 tools/apply_v0719_general_locomotion.py
          git diff --check
          grep -F "project(Runner VERSION 0.7.19 LANGUAGES CXX)" CMakeLists.txt
          grep -F "training_semantics_version = 0x0007'1901u" src/ppo.hpp
          grep -F "WALK-BALANCE-RESERVE-233" missioncache.md
          grep -F "WALK-RELEASE-252" missioncache.md
          test -f src/locomotion_strategy.hpp
          test -f tests/v0719_general_locomotion_tests.cpp
          test -f docs/RUNNER_V0719_GENERAL_LOCOMOTION.md
          test -f tools/generate_v0719_sources.py
          test -f .github/workflows/runner-v0719-release.yml
      - name: Remove temporary executor
        run: |
          rm tools/apply_v0719_general_locomotion.py
          rm .github/workflows/apply-v0719-general-locomotion.yml
      - name: Commit refined source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Runner v0.7.19 general locomotion'
          git push origin HEAD:agent/v0719-general-locomotion
