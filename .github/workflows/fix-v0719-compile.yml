name: Fix Runner v0.7.19 compile migration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/v0719-general-locomotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0719-general-locomotion
          fetch-depth: 0
      - name: Apply targeted repair
        run: |
          set -euo pipefail
          python3 tools/fix_v0719_compile.py
          rm -f tools/fix_v0719_compile.py
          rm -rf tools/__pycache__
          git diff --check
          grep -F 'const Vec2 root =' src/ppo.hpp
          ! grep -F 'PpoTrainer::PpoTrainer    }' src/ppo_trainer.cpp
      - name: Commit repaired source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix v0.7.19 migration compile defects'
          git push origin HEAD:agent/v0719-general-locomotion
