name: Final validation Runner v0.7.10 cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: runner-v0710-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Materialize and clean source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v0710_cleanup.py

          # Release products and historical validation snapshots do not belong in source.
          rm -rf artifact published-audit published-final published-preliminary release-stage validation
          rm -f src/autonomy.cpp

          # Remove all one-shot workflows except the post-merge publisher.
          rm -f .github/workflows/debug-v0710.yml
          rm -f .github/workflows/validate-runner-v0710.yml
          rm -f .github/workflows/consolidate-runner-v0710.yml
          rm -f .github/workflows/consolidate-runner-v0710-final.yml

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'tests/core_tests.cpp': {
                  'Runner v0.7.6 standing, PIP, obstacle, integrity, telemetry, concurrency, gait, and rig-edit tests passed':
                  'Runner core standing, PIP, obstacle, integrity, telemetry, concurrency, gait, and rig-edit tests passed',
              },
              'tests/concurrency_benchmark.cpp': {
                  'Runner v0.6.2 speed-mode throughput benchmark passed':
                  'Runner speed-mode throughput benchmark passed',
              },
              'tests/runtime_pipeline_tests.cpp': {
                  'Runner v0.7 runtime pipeline, arms, and async persistence tests passed':
                  'Runner runtime pipeline, arms, and async persistence tests passed',
              },
          }
          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          ignore = Path('.gitignore')
          text = ignore.read_text(encoding='utf-8') if ignore.exists() else ''
          additions = [
              '/artifact/', '/published-*/', '/release-stage/', '/validation/',
              '/VALIDATION_v*.txt', '/Runner-v*.zip', '/Runner-v*.zip.sha256',
              '/Runner-v*.manifest.sha256',
          ]
          lines = text.splitlines()
          for entry in additions:
              if entry not in lines:
                  lines.append(entry)
          ignore.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          PY

          cat > tools/repository_audit.cmake <<'CMAKE'
          if(NOT DEFINED RUNNER_SOURCE_DIR)
              message(FATAL_ERROR "RUNNER_SOURCE_DIR was not provided")
          endif()

          foreach(required IN ITEMS CHANGELOG.md missioncache.md README.md)
              if(NOT EXISTS "${RUNNER_SOURCE_DIR}/${required}")
                  message(FATAL_ERROR "Missing required repository document: ${required}")
              endif()
          endforeach()

          file(GLOB release_notes "${RUNNER_SOURCE_DIR}/RELEASE_NOTES*.md")
          if(release_notes)
              list(JOIN release_notes ", " release_note_list)
              message(FATAL_ERROR "Per-release note files remain: ${release_note_list}")
          endif()

          file(GLOB_RECURSE markdown_files "${RUNNER_SOURCE_DIR}/*.md")
          set(mission_documents "")
          foreach(path IN LISTS markdown_files)
              if(path MATCHES "/build/")
                  continue()
              endif()
              get_filename_component(name "${path}" NAME)
              string(TOLOWER "${name}" lower_name)
              if(lower_name MATCHES "mission" AND NOT lower_name STREQUAL "missioncache.md")
                  list(APPEND mission_documents "${path}")
              endif()
          endforeach()
          if(mission_documents)
              list(JOIN mission_documents ", " mission_document_list)
              message(FATAL_ERROR "Duplicate mission documents remain: ${mission_document_list}")
          endif()

          foreach(stale IN ITEMS artifact published-audit published-final published-preliminary release-stage validation)
              if(EXISTS "${RUNNER_SOURCE_DIR}/${stale}")
                  message(FATAL_ERROR "Stale release directory remains: ${stale}")
              endif()
          endforeach()
          if(EXISTS "${RUNNER_SOURCE_DIR}/src/autonomy.cpp")
              message(FATAL_ERROR "Obsolete monolithic autonomy.cpp remains")
          endif()

          file(READ "${RUNNER_SOURCE_DIR}/CMakeLists.txt" cmake_text)
          string(FIND "${cmake_text}" "project(Runner VERSION 0.7.10 LANGUAGES CXX)" version_position)
          if(version_position EQUAL -1)
              message(FATAL_ERROR "CMake project version is not 0.7.10")
          endif()

          file(READ "${RUNNER_SOURCE_DIR}/README.md" readme_text)
          foreach(reference IN ITEMS "CHANGELOG.md" "missioncache.md" "--diagnose-acceptance")
              string(FIND "${readme_text}" "${reference}" reference_position)
              if(reference_position EQUAL -1)
                  message(FATAL_ERROR "README is missing required reference: ${reference}")
              endif()
          endforeach()

          file(READ "${RUNNER_SOURCE_DIR}/src/acceptance.cpp" acceptance_text)
          foreach(reference IN ITEMS "std::hypot" "!cases.empty()" "8. MIXED GOAL COURSE")
              string(FIND "${acceptance_text}" "${reference}" reference_position)
              if(reference_position EQUAL -1)
                  message(FATAL_ERROR "Acceptance hardening is missing: ${reference}")
              endif()
          endforeach()

          message(STATUS "Runner repository hygiene passed")
          CMAKE

      - name: Verify repository consolidation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -f tools/apply_v0710_cleanup.py
          test ! -f src/autonomy.cpp
          test ! -f .github/workflows/debug-v0710.yml
          test ! -f .github/workflows/validate-runner-v0710.yml
          test ! -f .github/workflows/consolidate-runner-v0710.yml
          test ! -f .github/workflows/consolidate-runner-v0710-final.yml
          test -f .github/workflows/finalize-runner-v0710.yml
          test -f CHANGELOG.md
          test -f missioncache.md
          test -f tools/repository_audit.cmake
          test "$(find . -path ./.git -prune -o -type f -name 'RELEASE_NOTES*.md' -print | wc -l)" -eq 0
          test "$(find . -path ./.git -prune -o -type f -iname '*mission*.md' ! -name missioncache.md -print | wc -l)" -eq 0
          for stale in artifact published-audit published-final published-preliminary release-stage validation; do test ! -e "$stale"; done
          grep -F 'project(Runner VERSION 0.7.10 LANGUAGES CXX)' CMakeLists.txt
          grep -F 'Runner.RepositoryHygiene' CMakeLists.txt
          grep -F 'std::hypot' src/acceptance.cpp
          grep -F '!cases.empty()' src/acceptance.cpp
          grep -F 'WALK-RELEASE-108' missioncache.md

      - name: Configure deterministic C++23 suite
        env:
          CC: gcc-14
          CXX: g++-14
        run: >-
          cmake -S . -B build/linux-v0710 -G Ninja
          -DRUNNER_BUILD_APP=OFF
          -DRUNNER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build and test Linux suite
        run: |
          cmake --build build/linux-v0710 --parallel
          ctest --test-dir build/linux-v0710 --output-on-failure -V --timeout 1200

      - name: Commit exact tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate Runner v0.7.10 repository and harden acceptance'
          git push origin HEAD:${{ github.head_ref }}

  windows-package:
    needs: linux-source
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Confirm clean source
        shell: pwsh
        run: |
          foreach ($path in @(
            'tools/apply_v0710_cleanup.py','src/autonomy.cpp',
            '.github/workflows/debug-v0710.yml',
            '.github/workflows/validate-runner-v0710.yml',
            '.github/workflows/consolidate-runner-v0710.yml',
            '.github/workflows/consolidate-runner-v0710-final.yml')) {
            if (Test-Path $path) { throw "Temporary or obsolete source remains: $path" }
          }
          foreach ($path in @('artifact','published-audit','published-final','published-preliminary','release-stage','validation')) {
            if (Test-Path $path) { throw "Stale release directory remains: $path" }
          }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Windows source tree is dirty' }

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: runner-v0710-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            runner-v079-${{ runner.os }}-
            runner-v078-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build full Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed' }
          cmake --build --preset windows-release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Run complete Windows tests
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure -V --timeout 1200
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

      - name: Verify build-tree diagnostics
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-release/Release/Runner.exe').Path
          Push-Location $env:RUNNER_TEMP
          try {
            $version = (& $exe --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.10') { throw "Unexpected version: $version" }
            & $exe --diagnose-vulkan
            if ($LASTEXITCODE -ne 0) { throw 'Vulkan diagnostic failed' }
            & $exe --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Package diagnostic failed' }
            & $exe --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Acceptance diagnostic failed' }
          }
          finally { Pop-Location }

      - name: Install and verify release candidate
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.10-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item README.md, LICENSE, CHANGELOG.md, missioncache.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          foreach ($required in @(
            'Runner.exe','run.bat','README.md','CHANGELOG.md','missioncache.md',
            'shaders/flat.vert.spv','shaders/flat.frag.spv','assets/chicken.ppm')) {
            if (-not (Test-Path "$stage/$required")) { throw "Missing package file: $required" }
          }
          $outside = "$env:RUNNER_TEMP/runner-v0710-installed-unrelated"
          New-Item -ItemType Directory -Force $outside | Out-Null
          Push-Location $outside
          try {
            $version = (& "$stage/Runner.exe" --version | Out-String).Trim()
            if ($version -ne 'Runner 0.7.10') { throw "Installed version mismatch: $version" }
            & "$stage/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Installed package diagnostic failed' }
            & "$stage/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Installed acceptance diagnostic failed' }
            $batchVersion = (& cmd.exe /d /c "call `"$stage\run.bat`" --version" | Out-String).Trim()
            if ($batchVersion -ne 'Runner 0.7.10') { throw "run.bat version mismatch: $batchVersion" }
          }
          finally { Pop-Location }

      - name: Create and independently audit archive
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/Runner-v0.7.10-windows-x64"
          $archive = "$env:GITHUB_WORKSPACE/Runner-v0.7.10-windows-x64.zip"
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Set-Content "$archive.sha256"
          Get-ChildItem $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $relative"
          } | Set-Content 'Runner-v0.7.10-windows-x64.manifest.sha256'

          $audit = "$env:RUNNER_TEMP/runner-v0710-extracted"
          Remove-Item $audit -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive -DestinationPath $audit -Force
          $expected = Get-Content 'Runner-v0.7.10-windows-x64.manifest.sha256'
          $actual = Get-ChildItem $audit -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($audit.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $relative"
          }
          if (Compare-Object $expected $actual) { throw 'Archive manifest audit failed' }
          Push-Location $env:RUNNER_TEMP
          try {
            & "$audit/Runner.exe" --diagnose-package
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package diagnostic failed' }
            & "$audit/Runner.exe" --diagnose-acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Extracted acceptance diagnostic failed' }
          }
          finally { Pop-Location }

      - id: package
        uses: actions/upload-artifact@v4
        with:
          name: Runner-v0.7.10-windows-x64
          path: |
            Runner-v0.7.10-windows-x64.zip
            Runner-v0.7.10-windows-x64.zip.sha256
            Runner-v0.7.10-windows-x64.manifest.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Record package validation
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.package.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.package.outputs.artifact-digest }}
        run: |
          $path = 'missioncache.md'
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, '(?m)^\*\*Release state:\*\*.*$', '**Release state:** PACKAGE VERIFIED — Runner v0.7.10 passed repository consolidation, Linux, Windows, package, and executable acceptance; publication audit pending.', 1)
          foreach ($mission in 104..107) {
            $pattern = "(?m)(### WALK-[^`n]*-{0:D3}[^`n]*`n)\*\*Status:\*\*[^`n]*" -f $mission
            $updated = [regex]::Replace($text, $pattern, '$1**Status:** PACKAGE VERIFIED', 1)
            if ($updated -eq $text) { throw "Missing mission $mission" }
            $text = $updated
          }
          $text = [regex]::Replace($text, '(?m)(### WALK-RELEASE-108[^`n]*`n)\*\*Status:\*\*[^`n]*', '$1**Status:** VALIDATED — PUBLICATION PENDING', 1)
          $marker = '## v0.7.10 validation evidence'
          $index = $text.IndexOf($marker)
          if ($index -ge 0) { $text = $text.Substring(0, $index).TrimEnd() }
          $evidence = @"

## v0.7.10 validation evidence

- Validation workflow run: `$env:GITHUB_RUN_ID`
- Exact validated source: `$(git rev-parse HEAD)`
- Artifact ID: `$env:ARTIFACT_ID`
- Artifact digest: `$env:ARTIFACT_DIGEST`
- Linux GCC 14 warnings-as-errors build and all deterministic tests: passed
- Full Windows Vulkan build and all tests: passed
- Build-tree, installed, and independently extracted diagnostics: passed
- ZIP checksum and per-file manifest audit: passed
"@
          Set-Content $path ($text.TrimEnd() + $evidence) -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git commit -m 'Record Runner v0.7.10 package validation'
          git push origin HEAD:${{ github.head_ref }}
