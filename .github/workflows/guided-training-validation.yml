name: Validate guided training mission integration

on:
  push:
    branches:
      - feature/self-imitation-mission-cache
    paths:
      - tools/patch_guided_training_phase1.py
      - tools/repair_guided_phase1_driver.py
      - tools/repair_guided_phase1_output.py
      - tools/patch_guided_training_phase2.py
      - tools/patch_relaxed_joint_clearance.py
      - .github/workflows/guided-training-validation.yml

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  validate-integrate:
    runs-on: windows-2025

    steps:
      - name: Checkout guided mission branch
        uses: actions/checkout@v4
        with:
          ref: feature/self-imitation-mission-cache
          fetch-depth: 0

      - name: Apply complete guided training integration
        shell: pwsh
        run: |
          python tools/repair_flat_foot_driver.py
          if ($LASTEXITCODE -ne 0) { throw "Flat-foot driver repair failed" }
          python tools/patch_flat_foot_contacts.py
          if ($LASTEXITCODE -ne 0) { throw "Flat-foot integration failed" }
          python tools/repair_guided_phase1_driver.py
          if ($LASTEXITCODE -ne 0) { throw "Guided training phase 1 driver repair failed" }
          python tools/patch_guided_training_phase1.py
          if ($LASTEXITCODE -ne 0) { throw "Guided training phase 1 failed" }
          python tools/repair_guided_phase1_output.py
          if ($LASTEXITCODE -ne 0) { throw "Guided training phase 1 output repair failed" }
          python tools/patch_guided_training_phase2.py
          if ($LASTEXITCODE -ne 0) { throw "Guided training phase 2 failed" }
          python tools/patch_relaxed_joint_clearance.py
          if ($LASTEXITCODE -ne 0) { throw "Relaxed joint-clearance integration failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Integrated source contains whitespace errors" }

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-guided-training-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-flat-foot-${{ runner.os }}-
            epochrunner-mission-locomotion-${{ runner.os }}-
            epochrunner-v063-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure full Windows validation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build full SDL3 Vulkan application
        run: cmake --build --preset windows-release

      - name: Run deterministic and concurrency tests
        run: ctest --preset windows-release --output-on-failure -V

      - name: Verify Vulkan runtime path
        shell: pwsh
        run: |
          build/windows-release/Release/EpochRunner.exe --diagnose-vulkan
          if ($LASTEXITCODE -ne 0) { throw "Vulkan diagnostic failed" }

      - name: Integrate exact tested source without releasing
        shell: pwsh
        run: |
          Remove-Item tools/patch_flat_foot_contacts.py
          Remove-Item tools/repair_flat_foot_driver.py
          Remove-Item tools/patch_guided_training_phase1.py
          Remove-Item tools/repair_guided_phase1_driver.py
          Remove-Item tools/repair_guided_phase1_output.py
          Remove-Item tools/patch_guided_training_phase2.py
          Remove-Item tools/patch_relaxed_joint_clearance.py
          Remove-Item .github/workflows/flat-foot-validation.yml
          Remove-Item .github/workflows/guided-training-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt MISSIONS.md src/app.cpp src/autonomy.hpp src/autonomy_persistence.cpp
          git add src/autonomy_runtime.cpp src/ppo.hpp src/ppo_parallel.cpp src/ppo_trainer.cpp
          git add src/self_imitation.cpp src/simulation.cpp src/simulation.hpp src/training_checkpoint.cpp
          git add tests/core_tests.cpp
          git add -u tools/patch_flat_foot_contacts.py tools/repair_flat_foot_driver.py
          git add -u tools/patch_guided_training_phase1.py tools/repair_guided_phase1_driver.py
          git add -u tools/repair_guided_phase1_output.py tools/patch_guided_training_phase2.py
          git add -u tools/patch_relaxed_joint_clearance.py
          git add -u .github/workflows/flat-foot-validation.yml .github/workflows/guided-training-validation.yml
          git commit -m "Add guided multi-leg training and best-result imitation"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit exact tested source" }
          git push origin HEAD:feature/self-imitation-mission-cache
          if ($LASTEXITCODE -ne 0) { throw "Failed to push exact tested source" }

      - name: Record branch validation evidence
        shell: pwsh
        run: |
          git fetch origin feature/self-imitation-mission-cache
          git switch -C feature/self-imitation-mission-cache origin/feature/self-imitation-mission-cache
          New-Item -ItemType Directory -Force validation | Out-Null
          $sourceSha = (git rev-parse HEAD).Trim()
          @"
          # Guided training mission validation

          - Exact tested source commit: $sourceSha
          - Full SDL3/Vulkan/EpochGui Windows build: passed
          - Core and concurrency tests: passed
          - Startup-only rolling gate relaxation tests: passed
          - Mature body and orange-foot rolling rejection tests: passed
          - Forty-metre safe learning runway schedule tests: passed
          - True four-leg quadruped support semantics: passed
          - Four-leg crawler and six-leg hexapod support semantics: passed
          - Side-view near/far leg separation tests: passed
          - Natural knee lead allowed while egregious low-foot body-first impact remains mildly penalized: passed
          - Actual worker-rollout picture-in-picture publication: compiled and packaged
          - Zero-movement reset state-machine tests: passed
          - Automatic best-result imitation eligibility and decay tests: passed
          - Vulkan diagnostic: passed
          - Release publication: intentionally blocked until the remaining mission ledger is complete and runtime behavior is user-confirmed
          "@ | Set-Content -Encoding UTF8 validation/guided-training.md
          git add validation/guided-training.md
          git commit -m "Record guided training validation evidence"
          git push origin HEAD:feature/self-imitation-mission-cache
