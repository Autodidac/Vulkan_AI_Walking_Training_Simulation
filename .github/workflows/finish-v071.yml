name: Finish EpochRunner v0.7.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/finish-v071.yml]

concurrency:
  group: epochrunner-v071-missioncache
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: read

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record active run
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          status="$RUNNER_TEMP/status"
          git worktree add --detach "$status" origin/main
          mkdir -p "$status/validation"
          cat > "$status/validation/v0.7.1-run.md" <<EOF
          # EpochRunner v0.7.1 completion run

          - Run ID: \`$RUN_ID\`
          - Trigger SHA: \`$TRIGGER_SHA\`
          - Stage: \`linux\`
          - Result: \`running\`
          EOF
          git -C "$status" add validation/v0.7.1-run.md
          git -C "$status" commit -m 'Record active v0.7.1 release gate'
          git -C "$status" push origin HEAD:main
          git worktree remove --force "$status"

      - name: Materialize corrected source
        run: |
          python3 tools/apply_training_quality_v071.py apply
          python3 tools/refine_training_quality_v071.py
          git diff --check

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Configure and build
        run: |
          cmake -S . -B build/linux-v071 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DEPOCHRUNNER_BUILD_APP=OFF \
            -DEPOCHRUNNER_BUILD_TESTS=ON
          cmake --build build/linux-v071 --parallel 2

      - name: Test corrected training
        run: ctest --test-dir build/linux-v071 --output-on-failure -V --timeout 900

      - name: Record Linux pass
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          status="$RUNNER_TEMP/status-pass"
          git worktree add --detach "$status" origin/main
          cat > "$status/validation/v0.7.1-run.md" <<EOF
          # EpochRunner v0.7.1 completion run

          - Run ID: \`$RUN_ID\`
          - Trigger SHA: \`$TRIGGER_SHA\`
          - Stage: \`windows-queued\`
          - Result: \`linux-passed\`
          EOF
          git -C "$status" add validation/v0.7.1-run.md
          git -C "$status" commit -m 'Record v0.7.1 Linux pass'
          git -C "$status" push origin HEAD:main
          git worktree remove --force "$status"

  windows:
    needs: linux
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record Windows start
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          $status = "$env:RUNNER_TEMP/status-windows"
          git worktree add --detach $status origin/main
          @"
          # EpochRunner v0.7.1 completion run

          - Run ID: ``$env:RUN_ID``
          - Trigger SHA: ``$env:TRIGGER_SHA``
          - Stage: ``windows``
          - Result: ``running``
          "@ | Set-Content "$status/validation/v0.7.1-run.md"
          git -C $status add validation/v0.7.1-run.md
          git -C $status commit -m "Record v0.7.1 Windows start"
          git -C $status push origin HEAD:main
          git worktree remove --force $status

      - name: Materialize corrected source
        shell: pwsh
        run: |
          python tools/apply_training_quality_v071.py apply
          if ($LASTEXITCODE -ne 0) { throw "base materialization failed" }
          python tools/refine_training_quality_v071.py
          if ($LASTEXITCODE -ne 0) { throw "eight-motor refinement failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "source whitespace validation failed" }
          git diff --binary -- . ':(exclude)validation/v0.7.1-run.md' | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/v071.patch"
          Copy-Item tools/write_missioncache_v071.py "$env:RUNNER_TEMP/write_missioncache_v071.py"

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-v071-observation-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-v071-quality-${{ runner.os }}-
            epochrunner-v070-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure and build full application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh
          cmake --build --preset windows-release

      - name: Test full application
        run: ctest --preset windows-release --output-on-failure -V --timeout 900

      - name: Verify executable and Vulkan
        shell: pwsh
        run: |
          $version = (& build/windows-release/Release/EpochRunner.exe --version | Out-String).Trim()
          if ($version -ne "EpochRunner 0.7.1") { throw "Unexpected version: $version" }
          build/windows-release/Release/EpochRunner.exe --diagnose-vulkan
          if ($LASTEXITCODE -ne 0) { throw "Vulkan diagnostic failed" }

      - name: Commit exact tested source
        id: source
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard
          git fetch origin main
          git checkout --detach origin/main
          git apply --binary "$env:RUNNER_TEMP/v071.patch"
          if ($LASTEXITCODE -ne 0) { throw "Could not apply exact tested source over status commits" }
          python "$env:RUNNER_TEMP/write_missioncache_v071.py" validate --run-id $env:RUN_ID
          if ($LASTEXITCODE -ne 0) { throw "Mission validation ledger failed" }

          git rm -f --ignore-unmatch .github/workflows/complete-missioncache-v071.yml
          git rm -f --ignore-unmatch .github/workflows/finish-v071.yml
          git rm -f --ignore-unmatch .github/workflows/kick-v071.yml
          git rm -f --ignore-unmatch .github/workflows/kick-v071-now.yml
          git rm -f --ignore-unmatch tools/apply_training_quality_v071.py
          git rm -f --ignore-unmatch tools/refine_training_quality_v071.py
          git rm -f --ignore-unmatch tools/fix_humanoid_observation_v071.py
          git rm -f --ignore-unmatch tools/write_missioncache_v071.py
          git rm -f --ignore-unmatch tools/complete_missioncache_v071.py
          git rm -f --ignore-unmatch validation/v0.7.1-run.md
          git rm -f --ignore-unmatch validation/v0.7.1-failure.md
          git rm -f --ignore-unmatch validation/v0.7.1-failure.log
          git add -A
          git commit -m "Fix eight-motor humanoid training quality"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit exact tested source" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Could not publish exact tested source" }
          "sha=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_OUTPUT

      - name: Package tested build
        id: package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/EpochRunner-v0.7.1-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          Copy-Item README.md, LICENSE, missioncache.md, RELEASE_NOTES_v0.7.1.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          $archive = "EpochRunner-v0.7.1-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
          $checksum | Set-Content "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release view v0.7.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.7.1 $env:ARCHIVE "$env:ARCHIVE.sha256" --clobber
            gh release edit v0.7.1 --target $env:SOURCE_SHA --title "EpochRunner v0.7.1" --notes-file RELEASE_NOTES_v0.7.1.md
          } else {
            gh release create v0.7.1 $env:ARCHIVE "$env:ARCHIVE.sha256" --target $env:SOURCE_SHA --title "EpochRunner v0.7.1" --notes-file RELEASE_NOTES_v0.7.1.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }

      - name: Finalize mission cache
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          GH_REPO: ${{ github.repository }}
        run: |
          python "$env:RUNNER_TEMP/write_missioncache_v071.py" finalize --source-sha $env:SOURCE_SHA --run-id $env:RUN_ID --archive $env:ARCHIVE --checksum $env:CHECKSUM
          git add missioncache.md validation/v0.7.1.md
          git commit -m "Complete EpochRunner v0.7.1 mission cache"
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Final evidence publication failed" }
          $prs = (gh pr list --state open --json number --jq 'length').Trim()
          if ($prs -ne '0') { throw "$prs open pull requests remain" }
          $branches = @(gh api "repos/$env:GH_REPO/branches" --paginate --jq '.[].name')
          if ($branches.Count -ne 1 -or $branches[0].Trim() -ne 'main') { throw "Unexpected branches: $($branches -join ', ')" }
