name: Finish EpochRunner v0.7.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finish-v071.yml

concurrency:
  group: epochrunner-v071-missioncache
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: read

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  linux-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish run identity
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          status_dir="$RUNNER_TEMP/v071-status"
          rm -rf "$status_dir"
          git worktree add --detach "$status_dir" origin/main
          mkdir -p "$status_dir/validation"
          cat > "$status_dir/validation/v0.7.1-run.md" <<EOF
          # EpochRunner v0.7.1 active completion run

          - Run ID: \`$RUN_ID\`
          - Trigger SHA: \`$TRIGGER_SHA\`
          - Stage: \`linux-started\`
          - Result: \`running\`
          EOF
          git -C "$status_dir" add validation/v0.7.1-run.md
          git -C "$status_dir" commit -m 'Record active v0.7.1 completion run'
          git -C "$status_dir" push origin HEAD:main
          git worktree remove --force "$status_dir"

      - name: Materialize strict training-quality source
        run: |
          python3 tools/apply_training_quality_v071.py apply
          python3 tools/refine_training_quality_v071.py
          git diff --check

      - name: Install GCC 14 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Configure C++23 core tests
        run: >-
          cmake -S . -B build/linux-v071 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DEPOCHRUNNER_BUILD_APP=OFF
          -DEPOCHRUNNER_BUILD_TESTS=ON

      - name: Build Linux tests
        run: cmake --build build/linux-v071 --parallel 2

      - name: Run Linux deterministic and bounded-training tests
        run: ctest --test-dir build/linux-v071 --output-on-failure -V --timeout 600

      - name: Publish Linux success
        shell: bash
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          status_dir="$RUNNER_TEMP/v071-status-success"
          rm -rf "$status_dir"
          git worktree add --detach "$status_dir" origin/main
          mkdir -p "$status_dir/validation"
          cat > "$status_dir/validation/v0.7.1-run.md" <<EOF
          # EpochRunner v0.7.1 active completion run

          - Run ID: \`$RUN_ID\`
          - Trigger SHA: \`$TRIGGER_SHA\`
          - Stage: \`linux-passed\`
          - Result: \`running\`
          EOF
          git -C "$status_dir" add validation/v0.7.1-run.md
          git -C "$status_dir" commit -m 'Record v0.7.1 Linux validation pass'
          git -C "$status_dir" push origin HEAD:main
          git worktree remove --force "$status_dir"

      - name: Publish Linux failure
        shell: bash
        if: failure()
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          status_dir="$RUNNER_TEMP/v071-status-failure"
          rm -rf "$status_dir"
          git worktree add --detach "$status_dir" origin/main
          mkdir -p "$status_dir/validation"
          cat > "$status_dir/validation/v0.7.1-run.md" <<EOF
          # EpochRunner v0.7.1 active completion run

          - Run ID: \`$RUN_ID\`
          - Trigger SHA: \`$TRIGGER_SHA\`
          - Stage: \`linux-failed\`
          - Result: \`failure\`
          EOF
          git -C "$status_dir" add validation/v0.7.1-run.md
          git -C "$status_dir" commit -m 'Record v0.7.1 Linux validation failure'
          git -C "$status_dir" push origin HEAD:main
          git worktree remove --force "$status_dir"

  windows-release:
    needs: linux-validate
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish Windows start
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          $statusDir = "$env:RUNNER_TEMP/v071-status-windows"
          Remove-Item $statusDir -Recurse -Force -ErrorAction SilentlyContinue
          git worktree add --detach $statusDir origin/main
          New-Item -ItemType Directory -Force "$statusDir/validation" | Out-Null
          @"
          # EpochRunner v0.7.1 active completion run

          - Run ID: ``$env:RUN_ID``
          - Trigger SHA: ``$env:TRIGGER_SHA``
          - Stage: ``windows-started``
          - Result: ``running``
          "@ | Set-Content "$statusDir/validation/v0.7.1-run.md"
          git -C $statusDir add validation/v0.7.1-run.md
          git -C $statusDir commit -m "Record v0.7.1 Windows validation start"
          git -C $statusDir push origin HEAD:main
          git worktree remove --force $statusDir

      - name: Materialize strict training-quality source
        shell: pwsh
        run: |
          python tools/apply_training_quality_v071.py apply
          if ($LASTEXITCODE -ne 0) { throw "v0.7.1 training-quality materialization failed" }
          python tools/refine_training_quality_v071.py
          if ($LASTEXITCODE -ne 0) { throw "v0.7.1 reciprocal partition refinement failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Materialized source contains whitespace errors" }
          Copy-Item tools/write_missioncache_v071.py "$env:RUNNER_TEMP/write_missioncache_v071.py" -Force

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-bincache
            vcpkg/downloads
          key: epochrunner-v071-quality-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            epochrunner-v071-${{ runner.os }}-
            epochrunner-v070-${{ runner.os }}-
            epochrunner-v066-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: cmd
        run: call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure full MSVC release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset windows-release --fresh

      - name: Build full SDL3 Vulkan EpochGui application
        run: cmake --build --preset windows-release

      - name: Run Windows deterministic, bounded-training, concurrency, and UI tests
        run: ctest --preset windows-release --output-on-failure -V --timeout 600

      - name: Verify executable and Vulkan path
        shell: pwsh
        run: |
          $version = (& build/windows-release/Release/EpochRunner.exe --version | Out-String).Trim()
          if ($version -ne "EpochRunner 0.7.1") { throw "Unexpected version: $version" }
          build/windows-release/Release/EpochRunner.exe --diagnose-vulkan
          if ($LASTEXITCODE -ne 0) { throw "Vulkan diagnostic failed" }

      - name: Commit exact tested source
        id: source
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python tools/write_missioncache_v071.py validate --run-id $env:RUN_ID
          if ($LASTEXITCODE -ne 0) { throw "Mission ledger validation finalization failed" }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/complete-missioncache-v071.yml
          git rm -f --ignore-unmatch .github/workflows/finish-v071.yml
          git rm -f --ignore-unmatch .github/workflows/kick-v071.yml
          git rm -f --ignore-unmatch .github/workflows/kick-v071-now.yml
          git rm -f --ignore-unmatch tools/apply_training_quality_v071.py
          git rm -f --ignore-unmatch tools/refine_training_quality_v071.py
          git rm -f --ignore-unmatch tools/write_missioncache_v071.py
          git rm -f --ignore-unmatch tools/complete_missioncache_v071.py
          git rm -f --ignore-unmatch validation/v0.7.1-run.md
          git rm -f --ignore-unmatch validation/v0.7.1-release-lock.md
          git rm -f --ignore-unmatch validation/v0.7.1-failure.md
          git rm -f --ignore-unmatch validation/v0.7.1-failure.log
          git add CMakeLists.txt `
            src/simulation.cpp src/simulation.hpp `
            src/ppo.hpp src/ppo_trainer.cpp src/ppo_parallel.cpp src/self_imitation.cpp `
            src/training_checkpoint.cpp src/autonomy_curriculum.cpp `
            src/autonomy_persistence.cpp src/autonomy_commands.cpp src/app.cpp `
            tests/core_tests.cpp missioncache.md RELEASE_NOTES_v0.7.1.md `
            validation/v0.7.1-prepublish.md
          git commit -m "Fix humanoid training quality and parent reaction"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit tested v0.7.1 source" }
          git fetch origin main
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) { throw "Failed to rebase tested source over run-status commits" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish tested v0.7.1 source" }
          $sourceSha = (git rev-parse HEAD).Trim()
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Package exact tested build
        id: package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/EpochRunner-v0.7.1-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows-release --config Release --prefix $stage
          Copy-Item README.md, LICENSE, missioncache.md, RELEASE_NOTES_v0.7.1.md -Destination $stage -Force
          Get-ChildItem build/windows-release/Release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage -Force
          $archive = "EpochRunner-v0.7.1-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
          $checksum | Set-Content "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Publish or update v0.7.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release view v0.7.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.7.1 $env:ARCHIVE "$env:ARCHIVE.sha256" --clobber
            if ($LASTEXITCODE -ne 0) { throw "v0.7.1 asset replacement failed" }
            gh release edit v0.7.1 --target $env:SOURCE_SHA --title "EpochRunner v0.7.1" --notes-file RELEASE_NOTES_v0.7.1.md
          } else {
            gh release create v0.7.1 $env:ARCHIVE "$env:ARCHIVE.sha256" `
              --target $env:SOURCE_SHA `
              --title "EpochRunner v0.7.1" `
              --notes-file RELEASE_NOTES_v0.7.1.md
          }
          if ($LASTEXITCODE -ne 0) { throw "v0.7.1 release publication failed" }

      - name: Complete mission cache and verify cleanup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python "$env:RUNNER_TEMP/write_missioncache_v071.py" finalize `
            --source-sha $env:SOURCE_SHA --run-id $env:RUN_ID `
            --archive $env:ARCHIVE --checksum $env:CHECKSUM
          if ($LASTEXITCODE -ne 0) { throw "Mission cache publication evidence failed" }

          git add missioncache.md validation/v0.7.1.md
          git commit -m "Complete EpochRunner v0.7.1 mission cache"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit final mission evidence" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish final mission evidence" }

          $openPrs = (gh pr list --state open --limit 100 --json number --jq 'length').Trim()
          if ($openPrs -ne "0") { throw "Repository still has $openPrs open pull requests" }
          $branches = @(gh api "repos/$env:GH_REPO/branches" --paginate --jq '.[].name')
          if ($branches.Count -ne 1 -or $branches[0].Trim() -ne "main") {
            throw "Repository branches are not clean: $($branches -join ', ')"
          }

      - name: Publish Windows failure status
        shell: pwsh
        if: failure()
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          $statusDir = "$env:RUNNER_TEMP/v071-status-failed"
          Remove-Item $statusDir -Recurse -Force -ErrorAction SilentlyContinue
          git worktree add --detach $statusDir origin/main
          New-Item -ItemType Directory -Force "$statusDir/validation" | Out-Null
          @"
          # EpochRunner v0.7.1 active completion run

          - Run ID: ``$env:RUN_ID``
          - Trigger SHA: ``$env:TRIGGER_SHA``
          - Stage: ``windows-failed``
          - Result: ``failure``
          "@ | Set-Content "$statusDir/validation/v0.7.1-run.md"
          git -C $statusDir add validation/v0.7.1-run.md
          git -C $statusDir commit -m "Record v0.7.1 Windows validation failure"
          git -C $statusDir push origin HEAD:main
          git worktree remove --force $statusDir

# checkpoint-anchor correction trigger
# controlled-stance predicate trigger
# worker-backed evaluation trigger
# bounded-standing acquisition trigger
