name: Validate EpochRunner v0.7.1 balance controller

on:
  push:
    branches: [main]
    paths: [.github/workflows/finish-v071.yml]

concurrency:
  group: epochrunner-v071-missioncache
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record run
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          status="$RUNNER_TEMP/status"
          git worktree add --detach "$status" origin/main
          mkdir -p "$status/validation"
          printf '# EpochRunner v0.7.1 completion run\n\n- Run ID: `%s`\n- Trigger SHA: `%s`\n- Stage: `shared-balance-linux`\n- Result: `running`\n' "$RUN_ID" "$SHA" > "$status/validation/v0.7.1-run.md"
          git -C "$status" add validation/v0.7.1-run.md
          git -C "$status" commit -m 'Record shared-balance validation run'
          git -C "$status" push origin HEAD:main
          git worktree remove --force "$status"

      - name: Materialize source
        run: |
          python3 tools/apply_training_quality_v071.py apply
          python3 tools/refine_training_quality_v071.py
          python3 tools/fix_balance_diagnostic_v071.py
          git diff --check

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Build
        run: |
          cmake -S . -B build/linux-v071 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DEPOCHRUNNER_BUILD_APP=OFF \
            -DEPOCHRUNNER_BUILD_TESTS=ON
          cmake --build build/linux-v071 --parallel 2

      - name: Test
        run: ctest --test-dir build/linux-v071 --output-on-failure -V --timeout 900

# diagnostic-literal repair trigger
# neutral-target damping trigger
